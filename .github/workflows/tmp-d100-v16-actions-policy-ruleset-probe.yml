name: tmp-d100-v16-actions-policy-ruleset-probe

on:
  push:
    branches:
      - ci/d100-v16-main-security-green-observer-23360cbe
    paths:
      - '.github/workflows/tmp-d100-v16-actions-policy-ruleset-probe.yml'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe workflow execution protection rulesets and audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          : >/tmp/result.txt
          probe() {
            local label="$1" endpoint="$2"
            local response rc compact
            response="$(gh api "$endpoint" 2>&1)"; rc=$?
            compact="$(printf '%s' "$response" | tr '\n' ' ' | head -c 12000)"
            printf '%s_rc=%s\n%s_response=%s\n' "$label" "$rc" "$label" "$compact" >>/tmp/result.txt
          }
          probe repo_rulesets "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true"
          probe org_rulesets "orgs/${GITHUB_REPOSITORY_OWNER}/rulesets"
          probe repo_rules_for_main "repos/${GITHUB_REPOSITORY}/rules/branches/main"
          probe org_audit "orgs/${GITHUB_REPOSITORY_OWNER}/audit-log?phrase=action:workflows.actions_policy_violation+repo:${GITHUB_REPOSITORY}&per_page=20"
          body="$(head -c 45000 /tmp/result.txt)stage=actions_policy_ruleset_probe"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN D-100 V16 ACTIONS POLICY RULESET PROBE' -f "body=${body}" >/dev/null
          exit 0
