name: Cloud PoC TRUYN Domain Edge

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-poc-domain-edge.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_RG: truyn
      AZURE_RELAY_APP: truyn-relay
      AFD_PROFILE: truyn-frontdoor
      AFD_ENDPOINT: truyn-edge-1334540181
      AFD_ORIGIN_GROUP: relay-origin-group
      AFD_ORIGIN: truyn-relay-origin
      AFD_ROUTE: relay-route
      AFD_CUSTOM_DOMAIN: relay-truyn-org
      TRUYN_HOST: relay.truyn.org
      CF_ZONE_NAME: truyn.org
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKENS || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_DNS_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CLOUDFLARE_DNS_TOKEN }}
      CF_ZONE_ID_CONFIGURED: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
      CF_ACCOUNT_ID_CONFIGURED: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Front Door CLI
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name cdn --upgrade --yes >/dev/null

      - name: Resolve Container Apps relay origin
        shell: bash
        run: |
          set -euo pipefail
          relay_fqdn="$(az containerapp show -g "$AZURE_RG" -n "$AZURE_RELAY_APP" --query properties.configuration.ingress.fqdn -o tsv)"
          [[ -n "$relay_fqdn" ]] || { echo 'RELAY_ORIGIN_FQDN=missing'; exit 1; }
          curl -fsS "https://${relay_fqdn}/health" | jq -e '.ok == true and .protocol == "TRUYN/1"' >/dev/null
          echo "RELAY_ORIGIN_FQDN=$relay_fqdn" >> "$GITHUB_ENV"
          echo 'RELAY_ORIGIN_HEALTH=success'

      - name: Ensure Front Door profile and endpoint
        shell: bash
        run: |
          set -euo pipefail
          if ! az afd profile show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" >/dev/null 2>&1; then
            az afd profile create -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --sku Standard_AzureFrontDoor >/dev/null
          fi
          if ! az afd endpoint show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --endpoint-name "$AFD_ENDPOINT" >/dev/null 2>&1; then
            az afd endpoint create -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --endpoint-name "$AFD_ENDPOINT" --enabled-state Enabled >/dev/null
          fi
          afd_host="$(az afd endpoint show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --endpoint-name "$AFD_ENDPOINT" --query hostName -o tsv)"
          [[ -n "$afd_host" ]] || { echo 'AFD_ENDPOINT_HOST=missing'; exit 1; }
          echo "AFD_ENDPOINT_HOST=$afd_host" >> "$GITHUB_ENV"
          echo "AFD_ENDPOINT_HOST=$afd_host"

      - name: Ensure relay origin group, origin, and default route
        shell: bash
        run: |
          set -euo pipefail
          if ! az afd origin-group show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --origin-group-name "$AFD_ORIGIN_GROUP" >/dev/null 2>&1; then
            az afd origin-group create \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --origin-group-name "$AFD_ORIGIN_GROUP" \
              --probe-request-type GET \
              --probe-protocol Https \
              --probe-interval-in-seconds 60 \
              --probe-path /health \
              --sample-size 4 \
              --successful-samples-required 3 \
              --additional-latency-in-milliseconds 50 >/dev/null
          fi

          if az afd origin show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --origin-group-name "$AFD_ORIGIN_GROUP" --origin-name "$AFD_ORIGIN" >/dev/null 2>&1; then
            az afd origin update \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --origin-group-name "$AFD_ORIGIN_GROUP" \
              --origin-name "$AFD_ORIGIN" \
              --host-name "$RELAY_ORIGIN_FQDN" \
              --origin-host-header "$RELAY_ORIGIN_FQDN" \
              --http-port 80 \
              --https-port 443 \
              --enabled-state Enabled \
              --enforce-certificate-name-check true >/dev/null
          else
            az afd origin create \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --origin-group-name "$AFD_ORIGIN_GROUP" \
              --origin-name "$AFD_ORIGIN" \
              --host-name "$RELAY_ORIGIN_FQDN" \
              --origin-host-header "$RELAY_ORIGIN_FQDN" \
              --http-port 80 \
              --https-port 443 \
              --priority 1 \
              --weight 1000 \
              --enabled-state Enabled \
              --enforce-certificate-name-check true >/dev/null
          fi

          if ! az afd route show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --endpoint-name "$AFD_ENDPOINT" --route-name "$AFD_ROUTE" >/dev/null 2>&1; then
            az afd route create \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --endpoint-name "$AFD_ENDPOINT" \
              --route-name "$AFD_ROUTE" \
              --origin-group "$AFD_ORIGIN_GROUP" \
              --patterns-to-match '/*' \
              --supported-protocols Http Https \
              --https-redirect Enabled \
              --forwarding-protocol HttpsOnly \
              --link-to-default-domain Enabled >/dev/null
          fi

          status=''
          for attempt in $(seq 1 60); do
            status="$(curl -sS -o afd-health.json -w '%{http_code}' "https://${AFD_ENDPOINT_HOST}/health" || true)"
            if [[ "$status" == '200' ]] && jq -e '.ok == true and .protocol == "TRUYN/1"' afd-health.json >/dev/null 2>&1; then
              echo "AFD_DEFAULT_ENDPOINT_HEALTH=success attempt=${attempt}"
              exit 0
            fi
            echo "AFD_DEFAULT_ENDPOINT_PROPAGATING attempt=${attempt} http=${status}"
            sleep 5
          done
          echo 'AFD_DEFAULT_ENDPOINT_HEALTH=timeout'
          exit 1

      - name: Ensure Front Door custom domain
        shell: bash
        run: |
          set -euo pipefail
          if ! az afd custom-domain show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --custom-domain-name "$AFD_CUSTOM_DOMAIN" >/dev/null 2>&1; then
            az afd custom-domain create \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --custom-domain-name "$AFD_CUSTOM_DOMAIN" \
              --host-name "$TRUYN_HOST" \
              --certificate-type ManagedCertificate \
              --minimum-tls-version TLS12 >/dev/null
          fi
          validation_token="$(az afd custom-domain show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --custom-domain-name "$AFD_CUSTOM_DOMAIN" --query validationProperties.validationToken -o tsv)"
          validation_state="$(az afd custom-domain show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --custom-domain-name "$AFD_CUSTOM_DOMAIN" --query domainValidationState -o tsv)"
          [[ -n "$validation_token" || "$validation_state" == 'Approved' ]] || { echo 'AFD_VALIDATION_TOKEN=missing'; exit 1; }
          echo "AFD_VALIDATION_TOKEN=$validation_token" >> "$GITHUB_ENV"
          echo "AFD_VALIDATION_STATE_INITIAL=$validation_state"
          echo "AFD_DNS_TXT_NAME=_dnsauth.${TRUYN_HOST}"
          echo "AFD_DNS_TXT_VALUE=${validation_token}"
          echo "AFD_DNS_CNAME_NAME=${TRUYN_HOST}"
          echo "AFD_DNS_CNAME_VALUE=${AFD_ENDPOINT_HOST}"

      - name: Upsert Cloudflare validation and relay DNS when GitHub credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_API_TOKEN" ]]; then
            echo 'CLOUDFLARE_DNS_MODE=external'
            echo 'Cloudflare GitHub API token is not available to this repository; DNS must be supplied through the connected Cloudflare control plane.'
            exit 0
          fi

          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          zone_id="$CF_ZONE_ID_CONFIGURED"
          if [[ -z "$zone_id" ]]; then
            zone_id="$(curl -fsS "${auth[@]}" "${api}/zones?name=${CF_ZONE_NAME}&status=active" | jq -r '.result[0].id // empty')"
          fi
          [[ -n "$zone_id" ]] || { echo 'CLOUDFLARE_ZONE_ID=unresolved'; exit 1; }

          upsert_record() {
            local type="$1" name="$2" content="$3" proxied="$4"
            local existing payload record_id
            existing="$(curl -fsS "${auth[@]}" "${api}/zones/${zone_id}/dns_records?type=${type}&name=${name}")"
            record_id="$(jq -r '.result[0].id // empty' <<<"$existing")"
            payload="$(jq -nc --arg type "$type" --arg name "$name" --arg content "$content" --argjson proxied "$proxied" '{type:$type,name:$name,content:$content,ttl:60,proxied:$proxied}')"
            if [[ -n "$record_id" ]]; then
              curl -fsS -X PUT "${auth[@]}" "${api}/zones/${zone_id}/dns_records/${record_id}" --data "$payload" | jq -e '.success == true' >/dev/null
            else
              curl -fsS -X POST "${auth[@]}" "${api}/zones/${zone_id}/dns_records" --data "$payload" | jq -e '.success == true' >/dev/null
            fi
          }

          if [[ -n "$AFD_VALIDATION_TOKEN" ]]; then
            upsert_record TXT "_dnsauth.${TRUYN_HOST}" "$AFD_VALIDATION_TOKEN" false
          fi
          upsert_record CNAME "$TRUYN_HOST" "$AFD_ENDPOINT_HOST" false
          echo "CLOUDFLARE_ACCOUNT_ID_PRESENT=$([[ -n "$CF_ACCOUNT_ID_CONFIGURED" ]] && echo true || echo false)"
          echo 'CLOUDFLARE_DNS=success'

      - name: Wait for domain validation and associate route
        shell: bash
        run: |
          set -euo pipefail
          state=''
          for attempt in $(seq 1 60); do
            state="$(az afd custom-domain show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --custom-domain-name "$AFD_CUSTOM_DOMAIN" --query domainValidationState -o tsv)"
            echo "AFD_DOMAIN_VALIDATION_STATE=${state} attempt=${attempt}"
            [[ "$state" == 'Approved' ]] && break
            sleep 10
          done
          [[ "$state" == 'Approved' ]] || { echo 'AFD_DOMAIN_VALIDATION=timeout'; exit 1; }

          az afd route update \
            -g "$AZURE_RG" \
            --profile-name "$AFD_PROFILE" \
            --endpoint-name "$AFD_ENDPOINT" \
            --route-name "$AFD_ROUTE" \
            --custom-domains "$AFD_CUSTOM_DOMAIN" \
            --link-to-default-domain Enabled >/dev/null

          for attempt in $(seq 1 60); do
            if curl -fsS "https://${TRUYN_HOST}/health" | jq -e '.ok == true and .protocol == "TRUYN/1"' >/dev/null; then
              echo "TRUYN_PUBLIC_RELAY=https://${TRUYN_HOST}"
              echo 'TRUYN_PUBLIC_DOMAIN_HEALTH=success'
              exit 0
            fi
            sleep 10
          done
          echo 'TRUYN_PUBLIC_DOMAIN_HEALTH=timeout'
          exit 1
