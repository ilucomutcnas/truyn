name: Provider Identity Proof Once

on:
  push:
    paths:
      - .github/workflows/provider-identity-proof-once.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture active provider identities
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            research="$(curl -fsS 'https://relay.truyn.org/v1/offers?capability=research' | jq -r '[.offers[]? | select(.payload.metadata.fastPath == true)] | first | .from // empty')"
            review="$(curl -fsS 'https://relay.truyn.org/v1/offers?capability=review' | jq -r '[.offers[]? | select(.payload.metadata.fastPath == true)] | first | .from // empty')"
            if [[ "$research" == truyn:node:* && "$review" == truyn:node:* ]]; then
              echo "TRUYN_RESEARCH_NODE_ID=$research"
              echo "TRUYN_REVIEW_NODE_ID=$review"
              exit 0
            fi
            sleep 2
          done
          echo 'TRUYN_PROVIDER_IDENTITIES=missing'
          exit 1
