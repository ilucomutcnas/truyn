name: Ephemeral Qwen3 Reranker 0.6B Hard Pairs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-qwen3-reranker-hard.yml']

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QWEN_MODEL: Qwen/Qwen3-Reranker-0.6B
      QWEN_REVISION: 5340c0261aa49a842d1bff01db91ce407bda87a2
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      GH_TOKEN: ${{ github.token }}
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract immutable hard-pair text and frozen canonical queries
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/benchmarks/semantic-retrieval-v2.js?ref=${SEMANTIC_V2_SOURCE_SHA}" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/semantic-retrieval-v2.js
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const src=fs.readFileSync('/tmp/semantic-retrieval-v2.js','utf8'),a=src.indexOf('const domains = ['),b=src.indexOf('const fullContext =');
          if(a<0||b<0)throw new Error('corpus markers');
          const ctx={};vm.createContext(ctx);vm.runInContext('const corpusSize=600,retrievalCaseCount=360;'+src.slice(a,b)+';globalThis.__data={records,retrievalCases};',ctx);
          const {records,retrievalCases}=ctx.__data;
          const canonical={
            5:'Domain: ship route control. Required operational action: operators must confirm permission validity. Condition: utilization has crossed the protective limit and saturation controls are engaged.',
            241:'Domain: greenhouse gas record management. Required operational action: recover the malfunctioning system. Condition: the main facility is offline at the remote continuity center.',
            269:'Domain: store stock control. Required operational action: preserve audit proof. Condition: outward-facing launch after users can already see it.'
          };
          const specs=[{caseIndex:5,wrongId:'semantic-record-305'},{caseIndex:241,wrongId:'semantic-record-437'},{caseIndex:269,wrongId:'semantic-record-553'}];
          const cases=specs.map(spec=>{const item=retrievalCases.find(x=>x.caseIndex===spec.caseIndex),target=records.find(r=>r.id===item.id),wrong=records.find(r=>r.id===spec.wrongId);return {caseIndex:item.caseIndex,queryLanguage:item.queryLanguage,category:item.category,originalQuery:item.question,canonicalQuery:canonical[item.caseIndex],targetText:target.text,wrongText:wrong.text};});
          fs.writeFileSync('/tmp/qwen-hard-input.json',JSON.stringify({sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,cases},null,2));
          NODE

      - name: Install CPU-only pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir 'transformers==4.55.2' 'safetensors==0.6.2'

      - name: Score hard pairs with official Qwen yes/no reranker formulation
        shell: bash
        run: |
          cat > /tmp/qwen_hard.py <<'PY'
          import json, os, time, platform
          import torch
          from transformers import AutoTokenizer, AutoModelForCausalLM

          with open('/tmp/qwen-hard-input.json','r',encoding='utf-8') as f: data=json.load(f)
          model_name=os.environ['QWEN_MODEL']; revision=os.environ['QWEN_REVISION']
          instruction=(
              'Given the retrieval query, judge whether the authoritative document satisfies every material semantic constraint. '
              'The subject or domain, the required operational action, and the state/condition/scope must all match. '
              'If the document conflicts with any one material constraint, including the required action even when domain and condition match, judge it not relevant.'
          )
          load_started=time.perf_counter()
          tok=AutoTokenizer.from_pretrained(model_name,revision=revision,padding_side='left')
          model=AutoModelForCausalLM.from_pretrained(model_name,revision=revision,use_safetensors=True,torch_dtype=torch.float32)
          model.eval()
          load_ms=(time.perf_counter()-load_started)*1000
          false_id=tok.convert_tokens_to_ids('no'); true_id=tok.convert_tokens_to_ids('yes')
          prefix='<|im_start|>system\nJudge whether the Document meets the requirements based on the Query and the Instruct provided. Note that the answer can only be "yes" or "no".<|im_end|>\n<|im_start|>user\n'
          suffix='<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n'
          prefix_ids=tok.encode(prefix,add_special_tokens=False); suffix_ids=tok.encode(suffix,add_special_tokens=False)

          def score_pairs(pairs):
              formatted=[f'<Instruct>: {instruction}\n<Query>: {q}\n<Document>: {d}' for q,d in pairs]
              out=tok(formatted,padding=False,truncation='longest_first',return_attention_mask=False,max_length=1024-len(prefix_ids)-len(suffix_ids))
              out['input_ids']=[prefix_ids+x+suffix_ids for x in out['input_ids']]
              batch=tok.pad(out,padding=True,return_tensors='pt',max_length=1024)
              with torch.no_grad(): logits=model(**batch).logits[:,-1,:]
              pair=torch.stack([logits[:,false_id],logits[:,true_id]],dim=1)
              return torch.softmax(pair,dim=1)[:,1].float().cpu().tolist()

          rows=[]; total_score_ms=0.0
          for item in data['cases']:
              for form in ('original','canonical'):
                  query=item['originalQuery'] if form=='original' else item['canonicalQuery']
                  started=time.perf_counter(); scores=score_pairs([(query,item['wrongText']),(query,item['targetText'])]); elapsed=(time.perf_counter()-started)*1000; total_score_ms+=elapsed
                  wrong_score,target_score=float(scores[0]),float(scores[1])
                  rows.append({'caseIndex':item['caseIndex'],'queryLanguage':item['queryLanguage'],'category':item['category'],'queryForm':form,'targetScore':target_score,'wrongScore':wrong_score,'marginTargetMinusWrong':target_score-wrong_score,'selectedExpected':target_score>wrong_score,'pairScoreLatencyMs':round(elapsed,3)})
          original=[r for r in rows if r['queryForm']=='original']; canonical=[r for r in rows if r['queryForm']=='canonical']
          report={
              'benchmark':'TRUYN Semantic v2 Qwen3-Reranker-0.6B instruction-aware hard-pair diagnostic',
              'generatedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'sourceSha':data['sourceSha'],'model':model_name,'modelRevision':revision,'license':'Apache-2.0','instruction':instruction,
              'runtime':{'python':platform.python_version(),'torch':torch.__version__,'device':'cpu','modelLoadMs':round(load_ms,3),'totalScoringMs':round(total_score_ms,3)},
              'modelVisibleInput':'generic instruction + query text + passage text only; no TRUYN block ids or answer codes are supplied separately',
              'cases':rows,
              'originalQuery':{'correct':sum(r['selectedExpected'] for r in original),'total':len(original),'passed':all(r['selectedExpected'] for r in original)},
              'canonicalQuery':{'correct':sum(r['selectedExpected'] for r in canonical),'total':len(canonical),'passed':all(r['selectedExpected'] for r in canonical)},
              'hardSetPassed':all(r['selectedExpected'] for r in original),
              'eitherProductionPathPassed':all(r['selectedExpected'] for r in original) or all(r['selectedExpected'] for r in canonical)
          }
          with open('qwen3-reranker-hard.json','w',encoding='utf-8') as f: json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps({'runtime':report['runtime'],'originalQuery':report['originalQuery'],'canonicalQuery':report['canonicalQuery'],'eitherProductionPathPassed':report['eitherProductionPathPassed']},ensure_ascii=False,indent=2))
          if not report['eitherProductionPathPassed']: raise SystemExit(2)
          PY
          python /tmp/qwen_hard.py

      - name: Upload diagnostic evidence
        if: ${{ always() && hashFiles('qwen3-reranker-hard.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-qwen3-reranker-hard-${{ github.run_id }}
          path: qwen3-reranker-hard.json
          if-no-files-found: error
          retention-days: 30
