name: Temporary Full Suite Debug

on:
  push:
    branches: [network/productionization-gate]
    paths:
      - '.github/workflows/tmp-durable-debug.yml'

permissions:
  contents: read

jobs:
  suite-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run full suite with exact failure annotation
        shell: bash
        run: |
          set +e
          npm test > /tmp/suite.log 2>&1
          rc=$?
          cat /tmp/suite.log
          if [[ "$rc" != 0 ]]; then
            grep -n -B 18 -A 45 'not ok' /tmp/suite.log > /tmp/failures.log || tail -n 180 /tmp/suite.log > /tmp/failures.log
            detail="$(cat /tmp/failures.log | tail -n 220 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=TRUYN Exact Full Suite Failure::$detail"
            exit "$rc"
          fi
          echo 'TRUYN_FULL_SUITE=PASS'
