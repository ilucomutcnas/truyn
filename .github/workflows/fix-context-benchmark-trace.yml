name: Fix and rerun context economic benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-context-benchmark-trace.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix-rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch benchmark trace call
        run: python scripts/fix-context-benchmark-trace.py
      - name: Verify benchmark harness
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          node --check benchmarks/context-ref-delta-ab.js
          rm -rf node_modules package-lock.json
          git diff --check
      - name: Commit tested fix and clean helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/context-ref-delta-ab.js
          git rm scripts/fix-context-benchmark-trace.py .github/workflows/fix-context-benchmark-trace.yml
          git diff --cached --check
          git commit -m 'Fix context benchmark relay trace lookup'
          git push origin HEAD:main
      - name: Dispatch unchanged economic benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-poc-context-efficiency-ab.yml --repo inn-media/truyn --ref main
