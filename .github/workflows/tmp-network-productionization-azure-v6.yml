name: Temporary Network Productionization Azure v6
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-network-productionization-azure-v6.yml']
permissions:
  contents: read
  id-token: write
jobs:
  azure-multihost:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TEST_COMMIT: 7f953cd764db0f3816a18d7bbffdaf7ae16eb3ad
      LOCATION: eastus2
      VM_SIZE: Standard_B1ms
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Four-host public QUIC productionization gate
        shell: bash
        run: |
          set -Eeuo pipefail
          STAGE=init
          trap 'rc=$?; echo "::error title=TRUYN Azure Gate Failure::stage=$STAGE exit=$rc line=$LINENO"; exit $rc' ERR
          retry(){ local attempts=0; until "$@"; do attempts=$((attempts+1)); [[ $attempts -lt 4 ]] || return 1; sleep $((attempts*3)); done; }
          STAGE=providers
          for ns in Microsoft.Network Microsoft.Compute; do state="$(az provider show --namespace "$ns" --query registrationState -o tsv --only-show-errors)"; echo "TRUYN_AZURE_PROVIDER namespace=$ns state=$state"; [[ "$state" == Registered ]]; done
          RG="$(az group list --query "[?contains(name, 'truyn')].name | [0]" -o tsv)"; [[ -n "$RG" ]]; echo "::add-mask::$RG"
          PREFIX="truyn-net-${GITHUB_RUN_ID}"; NSG="${PREFIX}-nsg"; VNET="${PREFIX}-vnet"; SUBNET="${PREFIX}-subnet"
          VMS=(); IPS=(); NODEIDS=(); RECORDS=(); gate_ok=0
          NSG_API="$(az provider show --namespace Microsoft.Network --query "resourceTypes[?resourceType=='networkSecurityGroups'].apiVersions[0]" -o tsv --only-show-errors)"
          NSG_URI="https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID_VALUE}/resourceGroups/${RG}/providers/Microsoft.Network/networkSecurityGroups/${NSG}?api-version=${NSG_API}"
          cleanup(){
            set +e; STAGE=cleanup
            for vm in "${VMS[@]:-}"; do [[ -z "$vm" ]] || az vm delete -g "$RG" -n "$vm" --yes --force-deletion --only-show-errors >/dev/null 2>&1 || true; done
            ids="$(az network public-ip list -g "$RG" --query "[?starts_with(name, '$PREFIX')].id" -o tsv 2>/dev/null || true)"; [[ -z "$ids" ]] || az resource delete --ids $ids --only-show-errors >/dev/null 2>&1 || true
            ids="$(az network nic list -g "$RG" --query "[?starts_with(name, '$PREFIX')].id" -o tsv 2>/dev/null || true)"; [[ -z "$ids" ]] || az resource delete --ids $ids --only-show-errors >/dev/null 2>&1 || true
            ids="$(az disk list -g "$RG" --query "[?starts_with(name, '$PREFIX')].id" -o tsv 2>/dev/null || true)"; [[ -z "$ids" ]] || az resource delete --ids $ids --only-show-errors >/dev/null 2>&1 || true
            az network vnet delete -g "$RG" -n "$VNET" --only-show-errors >/dev/null 2>&1 || true
            az rest --method delete --uri "$NSG_URI" --only-show-errors >/dev/null 2>&1 || true
            [[ "$gate_ok" == 1 ]] && echo 'TRUYN_AZURE_MULTIHOST_CLEANUP=PASS ephemeral_resources_removed=true' || echo 'TRUYN_AZURE_MULTIHOST_CLEANUP=EXECUTED_AFTER_FAILURE'
          }
          trap cleanup EXIT

          STAGE=nsg-rest
          printf '%s' '{"location":"eastus2","properties":{"securityRules":[{"name":"allow-truyn-quic","properties":{"protocol":"Udp","sourcePortRange":"*","destinationPortRange":"4433","sourceAddressPrefix":"*","destinationAddressPrefix":"*","access":"Allow","priority":100,"direction":"Inbound"}}]}}' >/tmp/nsg.json
          retry az rest --method put --uri "$NSG_URI" --headers 'Content-Type=application/json' --body @/tmp/nsg.json --only-show-errors >/dev/null
          state=''; for attempt in $(seq 1 30); do retry az rest --method get --uri "$NSG_URI" --only-show-errors >/tmp/nsg-state.json; state="$(jq -r '.properties.provisioningState // empty' /tmp/nsg-state.json)"; [[ "$state" == Succeeded ]] && break; [[ "$state" == Failed ]] && exit 14; sleep 2; done; [[ "$state" == Succeeded ]]
          echo 'TRUYN_AZURE_STAGE nsg=PASS udpPort=4433'

          STAGE=network
          retry az network vnet create -g "$RG" -n "$VNET" -l "$LOCATION" --address-prefixes 10.247.0.0/16 --subnet-name "$SUBNET" --subnet-prefixes 10.247.1.0/24 --only-show-errors >/dev/null
          STAGE=vm-provision
          for i in 0 1 2 3; do
            vm="${PREFIX}-${i}"; pip="${PREFIX}-${i}-pip"; nic="${PREFIX}-${i}-nic"; VMS+=("$vm"); echo "::add-mask::$vm"; echo "::add-mask::$pip"; echo "::add-mask::$nic"
            retry az network public-ip create -g "$RG" -n "$pip" -l "$LOCATION" --sku Standard --allocation-method Static --only-show-errors >/dev/null
            retry az network nic create -g "$RG" -n "$nic" -l "$LOCATION" --vnet-name "$VNET" --subnet "$SUBNET" --network-security-group "$NSG" --public-ip-address "$pip" --only-show-errors >/dev/null
            retry az vm create -g "$RG" -n "$vm" -l "$LOCATION" --image Ubuntu2204 --size "$VM_SIZE" --admin-username truynadmin --generate-ssh-keys --nics "$nic" --os-disk-delete-option Delete --tags "truyn-ephemeral-run=${GITHUB_RUN_ID}" --no-wait --only-show-errors >/dev/null
          done
          for i in 0 1 2 3; do
            vm="${VMS[$i]}"; retry az vm wait -g "$RG" -n "$vm" --created --interval 5 --timeout 600 --only-show-errors
            pip="${PREFIX}-${i}-pip"; ip="$(az network public-ip show -g "$RG" -n "$pip" --query ipAddress -o tsv)"; [[ -n "$ip" ]]; IPS+=("$ip"); echo "::add-mask::$ip"; echo "TRUYN_AZURE_STAGE vm=$i provisioned=true"
          done

          remote_raw(){ retry az vm run-command invoke -g "$RG" -n "$1" --command-id RunShellScript --scripts "$2" --query 'value[0].message' -o tsv --only-show-errors; }
          call_json(){
            local vm="$1" method="$2" path="$3" payload="${4:-}" encoded='' script out result
            [[ -z "$payload" ]] || encoded="$(printf '%s' "$payload" | base64 -w0)"
            if [[ -n "$encoded" ]]; then script="set -euo pipefail; R=\$(printf '%s' '$encoded' | base64 -d | curl -fsS --max-time 150 -X '$method' -H 'content-type: application/json' --data-binary @- 'http://127.0.0.1:8788$path'); printf 'TRUYN_RESULT=%s\\n' \"\$R\""; else script="set -euo pipefail; R=\$(curl -fsS --max-time 150 -X '$method' 'http://127.0.0.1:8788$path'); printf 'TRUYN_RESULT=%s\\n' \"\$R\""; fi
            out="$(remote_raw "$vm" "$script")"
            result="$(printf '%s\n' "$out" | sed -n 's/.*TRUYN_RESULT=//p' | tail -1 | tr -d '\r')"
            if [[ -z "$result" ]]; then echo "TRUYN_CALL_JSON_PARSE_FAIL method=$method path=$path raw=$(printf '%q' "$out")" >&2; return 1; fi
            printf '%s' "$result"
          }

          STAGE=node-install
          for i in 0 1 2 3; do
            vm="${VMS[$i]}"; ip="${IPS[$i]}"
            setup=$(cat <<SCRIPT
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq; apt-get install -y -qq git curl jq openssl ca-certificates >/dev/null
          major=0; command -v node >/dev/null && major=\$(node -p 'parseInt(process.versions.node)' 2>/dev/null || echo 0)
          if [[ "\$major" -lt 22 ]]; then curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null; apt-get install -y -qq nodejs >/dev/null; fi
          id -u truyn >/dev/null 2>&1 || useradd --system --home /var/lib/truyn-testnet --shell /usr/sbin/nologin truyn
          rm -rf /opt/truyn; git clone -q https://github.com/inn-media/truyn.git /opt/truyn; cd /opt/truyn; git checkout -q '$TEST_COMMIT'; npm install --ignore-scripts --no-audit --no-fund >/dev/null
          install -d -m 0700 -o truyn -g truyn /var/lib/truyn-testnet /etc/truyn-testnet
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /etc/truyn-testnet/key.pem -out /etc/truyn-testnet/cert.pem -subj '/CN=${ip}' -days 1 -addext 'subjectAltName=IP:${ip}' >/dev/null 2>&1
          chown truyn:truyn /etc/truyn-testnet/key.pem /etc/truyn-testnet/cert.pem; chmod 0600 /etc/truyn-testnet/key.pem
          cat >/etc/systemd/system/truyn-testnet.service <<UNIT
          [Unit]
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=truyn
          Group=truyn
          WorkingDirectory=/opt/truyn
          Environment=TRUYN_TESTNET_DATA_DIR=/var/lib/truyn-testnet
          Environment=TRUYN_TLS_KEY_PATH=/etc/truyn-testnet/key.pem
          Environment=TRUYN_TLS_CERT_PATH=/etc/truyn-testnet/cert.pem
          Environment=TRUYN_ADVERTISE_HOST=${ip}
          Environment=TRUYN_QUIC_HOST=0.0.0.0
          Environment=TRUYN_QUIC_PORT=4433
          Environment=TRUYN_CONTROL_HOST=127.0.0.1
          Environment=TRUYN_CONTROL_PORT=8788
          Environment=TRUYN_DHT_REPLICATION_FACTOR=3
          Environment=TRUYN_DHT_WRITE_QUORUM=3
          Environment=TRUYN_DHT_RPC_TIMEOUT_MS=5000
          Environment=TRUYN_TESTNET_FAULT_CONTROL=1
          ExecStart=/usr/bin/node /opt/truyn/network/testnet/node-service.js
          Restart=on-failure
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload; systemctl enable --now truyn-testnet.service >/dev/null
          for n in \$(seq 1 60); do curl -fsS --max-time 2 http://127.0.0.1:8788/status >/dev/null && exit 0; sleep 2; done
          journalctl -u truyn-testnet.service -n 100 --no-pager || true; exit 21
          SCRIPT
          )
            remote_raw "$vm" "$setup" >/dev/null; echo "TRUYN_AZURE_STAGE node=$i service=ready"
          done

          STAGE=bootstrap-records
          for i in 0 1 2 3; do rec="$(call_json "${VMS[$i]}" GET /record)"; RECORDS+=("$rec"); nid="$(jq -r '.record.nodeId' <<<"$rec")"; [[ "$nid" == truyn:node:* ]]; NODEIDS+=("$nid"); echo "::add-mask::$nid"; echo "TRUYN_AZURE_STAGE record=$i PASS"; done
          ALL_RECORDS="$(printf '%s\n' "${RECORDS[@]}" | jq -s '{records: map(.record)}')"
          STAGE=bootstrap-post
          for i in 0 1 2 3; do boot="$(call_json "${VMS[$i]}" POST /bootstrap "$ALL_RECORDS")"; jq -e '.results | length >= 3' <<<"$boot" >/dev/null; echo "TRUYN_AZURE_STAGE bootstrap=$i PASS"; done

          STAGE=direct-quic
          direct_payload="$(jq -nc --arg id "${NODEIDS[2]}" '{nodeId:$id,input:{proof:"azure-four-host-direct"}}')"; t0="$(date +%s%3N)"; direct="$(call_json "${VMS[0]}" POST /need "$direct_payload")"; direct_ms=$(( $(date +%s%3N) - t0 ))
          [[ "$(jq -r '.transport' <<<"$direct")" == quic-direct && "$(jq -r '.result.transport' <<<"$direct")" == quic ]]; echo "TRUYN_AZURE_STAGE direct_quic=PASS latencyMs=$direct_ms relayCalls=0"

          STAGE=partition-heal
          partition_payload="$(jq -nc --arg id "${NODEIDS[2]}" '{nodeIds:[$id]}')"; call_json "${VMS[0]}" POST /faults/partition "$partition_payload" >/dev/null
          partition_failed=0; call_json "${VMS[0]}" POST /need "$direct_payload" >/dev/null 2>&1 || partition_failed=1; [[ "$partition_failed" == 1 ]]
          call_json "${VMS[0]}" POST /faults/heal "$partition_payload" >/dev/null; healed="$(call_json "${VMS[0]}" POST /need "$direct_payload")"; [[ "$(jq -r '.transport' <<<"$healed")" == quic-direct ]]; echo 'TRUYN_AZURE_STAGE partition_heal=PASS'

          STAGE=replication
          replicated="$(call_json "${VMS[0]}" POST /replicate '{"namespace":"productionization","key":"azure-four-host","value":{"proof":"durable"},"replicationFactor":3,"minAcks":3,"ttlMs":900000}')"; [[ "$(jq -r '.result.acknowledgements' <<<"$replicated")" == 3 ]]
          record_id="$(jq -r '.record.recordId' <<<"$replicated")"; echo "::add-mask::$record_id"; found="$(call_json "${VMS[2]}" GET '/find?namespace=productionization&key=azure-four-host&fanout=4')"; jq -e --arg rid "$record_id" '.records | any(.recordId == $rid)' <<<"$found" >/dev/null; echo 'TRUYN_AZURE_STAGE replication=PASS acks=3 remoteRead=true'

          STAGE=holder-failure-repair
          holder="$(jq -r --arg self "${NODEIDS[0]}" '.result.storedAt[] | select(. != $self)' <<<"$replicated" | head -1)"; failed_index=''; for i in 1 2 3; do [[ "${NODEIDS[$i]}" == "$holder" ]] && failed_index="$i"; done; [[ -n "$failed_index" ]]; failed_vm="${VMS[$failed_index]}"
          before_seq="$(printf '%s\n' "${RECORDS[@]}" | jq -r --arg nid "$holder" 'select(.record.nodeId == $nid) | .record.sequence')"; remote_raw "$failed_vm" 'set -e; systemctl stop truyn-testnet.service' >/dev/null
          t1="$(date +%s%3N)"; repaired="$(call_json "${VMS[0]}" POST /repair '{"namespace":"productionization","key":"azure-four-host","replicationFactor":3,"minAcks":3}')"; repair_ms=$(( $(date +%s%3N) - t1 ))
          [[ "$(jq -r '.repairs[0].acknowledgements' <<<"$repaired")" == 3 ]]; jq -e --arg dead "$holder" '.repairs[0].storedAt | index($dead) == null' <<<"$repaired" >/dev/null; (( repair_ms < 30000 )); echo "TRUYN_AZURE_STAGE repair=PASS latencyMs=$repair_ms"

          STAGE=restart-continuity
          remote_raw "$failed_vm" 'set -e; systemctl start truyn-testnet.service; for n in $(seq 1 60); do curl -fsS --max-time 2 http://127.0.0.1:8788/status >/dev/null && exit 0; sleep 2; done; exit 1' >/dev/null
          restarted="$(call_json "$failed_vm" GET /record)"; [[ "$(jq -r '.record.nodeId' <<<"$restarted")" == "$holder" ]]; after_seq="$(jq -r '.record.sequence' <<<"$restarted")"; (( after_seq > before_seq ))
          pong="$(call_json "${VMS[3]}" POST /ping "$(jq -nc --arg id "$holder" '{nodeId:$id}')")"; [[ "$(jq -r '.pong' <<<"$pong")" == true ]]

          STAGE=complete; gate_ok=1
          result="$(jq -nc --arg gate PASS --arg region "$LOCATION" --arg size "$VM_SIZE" --arg sha "$TEST_COMMIT" --argjson hosts 4 --argjson directMs "$direct_ms" --argjson repairMs "$repair_ms" '{gate:$gate,hosts:$hosts,region:$region,vmSize:$size,testCommit:$sha,transport:"real-public-udp-quic",relayCalls:0,directNeedMs:$directMs,partitionBlocked:true,healRecovered:true,replicationAcks:3,remoteRead:true,holderFailureRepairMs:$repairMs,restartIdentityStable:true,sequenceAdvanced:true}')"
          echo "TRUYN_AZURE_MULTIHOST=$result"; echo "::notice title=TRUYN Azure Four-Host Gate PASS::$result"
