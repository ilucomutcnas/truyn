name: Ephemeral Semantic v2 Projection Fusion Diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-projection-diagnostic.yml']

permissions:
  contents: read
  id-token: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-projection-${{ github.run_id }}
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Load immutable corpus and proxy
        shell: bash
        run: |
          set -euo pipefail
          load_file(){ mkdir -p "$(dirname "$1")"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1?ref=$2" | jq -r '.content' | tr -d '\n' | base64 -d > "$1"; }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with: { project_id: '${{ env.GCP_PROJECT_ID_VALUE }}' }
      - name: Prepare runtime proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"; image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-projection:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null && docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok==true' >/dev/null && break; [[ "$attempt" -lt 30 ]] || exit 1; sleep 2; done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"; echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"; echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"
      - name: Evaluate all fusion strategies on four hard cases
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'); const s=fs.readFileSync('benchmarks/semantic-retrieval-v2.js','utf8'); const a=s.indexOf('const domains = ['); const b=s.indexOf('const fullContext ='); if(a<0||b<0) throw new Error('corpus markers'); const corpus=s.slice(a,b);
          fs.writeFileSync('semantic-v2-projection-diagnostic.mjs', `
          import { writeFile } from 'node:fs/promises';
          import { createSemanticContextRouterV2 } from './core/context/semantic-router-v2.js';
          import { createProviderSemanticProjector } from './core/context/provider-semantic-projector.js';
          import { createVertexGeminiProvider } from './adapters/providers/vertex-gemini.js';
          import { createVertexEmbeddingClient } from './adapters/providers/vertex-embedding.js';
          const corpusSize=600, retrievalCaseCount=360; ${corpus}
          const provider=createVertexGeminiProvider({projectId:process.env.GCP_PROJECT_ID,location:'global',model:'gemini-2.5-flash',endpoint:process.env.VERTEX_API_ENDPOINT,accessTokenProvider:async()=>process.env.GCP_ACCESS_TOKEN,capabilities:['reasoning.general'],requestTimeoutMs:120000});
          const projector=createProviderSemanticProjector({provider,providerOptions:{thinkingBudget:0,temperature:0,maxOutputTokens:256,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{variants:{type:'OBJECT',properties:{en:{type:'STRING'},zh:{type:'STRING'},tr:{type:'STRING'}},required:['en','zh','tr']}},required:['variants']}},repairAttempts:1});
          const embedder=createVertexEmbeddingClient({projectId:process.env.GCP_PROJECT_ID,location:'us-central1',model:'gemini-embedding-001',endpoint:process.env.VERTEX_API_ENDPOINT,accessTokenProvider:async()=>process.env.GCP_ACCESS_TOKEN,batchSize:5,outputDimensionality:768});
          const router=createSemanticContextRouterV2({embedder,queryProjector:projector,candidateK:64,fusionStrategy:'consensus',diagnosticFusion:true}); const context=router.putContext(blocks);
          const hard=[5,112,241,269], rows=[]; for(const caseIndex of hard){const item=retrievalCases.find(x=>x.caseIndex===caseIndex); const r=await router.retrieve(context.cid,item.question,{topK:1}); const topBy=r.retrieval.fusionDiagnostics.topByStrategy; rows.push({caseIndex,expectedId:item.id,selectedId:r.blocks[0].id,byStrategy:Object.fromEntries(Object.entries(topBy).map(([k,v])=>[k,v[0]?.id||null]))});}
          const strategies=Object.keys(rows[0].byStrategy); const summary=Object.fromEntries(strategies.map(k=>[k,{correct:rows.filter(r=>r.byStrategy[k]===r.expectedId).length,total:rows.length}])); const report={benchmark:'TRUYN Semantic v2 multilingual projection fusion diagnostic',generatedAt:new Date().toISOString(),rows,summary,projectorStats:projector.stats(),embeddingStats:embedder.stats()}; await writeFile('semantic-v2-projection-diagnostic.json',JSON.stringify(report,null,2)); console.log(JSON.stringify(report,null,2));
          `);
          NODE
          node --check semantic-v2-projection-diagnostic.mjs && node semantic-v2-projection-diagnostic.mjs
      - name: Upload evidence
        if: ${{ always() && hashFiles('semantic-v2-projection-diagnostic.json') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: 'truyn-semantic-v2-projection-diagnostic-${{ github.run_id }}', path: semantic-v2-projection-diagnostic.json, retention-days: 30 }
      - name: Cleanup proxy
        if: always()
        shell: bash
        run: gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
