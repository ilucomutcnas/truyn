name: Apply bounded security hardening

on:
  push:
    branches:
      - security/harden-defaults-body-limit

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PATCH_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/harden-defaults-body-limit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded patch
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/apply-security-hardening.mjs
          node /tmp/apply-security-hardening.mjs
          rm -f .github/workflows/security-hardening-apply.yml
      - name: Run full regression suite
        run: npm test
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden relay and provider security boundaries"
          git push origin HEAD:security/harden-defaults-body-limit
