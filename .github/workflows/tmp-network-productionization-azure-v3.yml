name: Temporary Network Productionization Azure v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-network-productionization-azure-v3.yml'

permissions:
  contents: read
  id-token: write

jobs:
  azure-multihost:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TEST_COMMIT: c17d929f0be62af277385d56fc7cfd92cd6f197d
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Run four-host QUIC durability gate in live-capacity region
        shell: bash
        run: |
          set -Eeuo pipefail
          for ns in Microsoft.Network Microsoft.Compute; do
            state="$(az provider show --namespace "$ns" --query registrationState -o tsv --only-show-errors)"
            echo "TRUYN_AZURE_PROVIDER namespace=$ns state=$state"
            [[ "$state" == Registered ]] || { echo "TRUYN_AZURE_MULTIHOST=BLOCKED provider=$ns state=$state"; exit 9; }
          done

          RG="$(az group list --query "[?contains(name, 'truyn')].name | [0]" -o tsv)"
          [[ -n "$RG" ]] || { echo 'TRUYN_AZURE_MULTIHOST=FAIL reason=resource_group_not_found'; exit 10; }
          RG_LOCATION="$(az group show -g "$RG" --query location -o tsv)"
          echo "::add-mask::$RG"; echo "::add-mask::$RG_LOCATION"

          CANDIDATE_REGIONS=("$RG_LOCATION" eastus2 eastus centralus southcentralus westus2 westus3 northeurope westeurope uksouth swedencentral)
          CANDIDATE_SIZES=(Standard_B1ms Standard_A1_v2 Standard_D1_v2 Standard_B2s Standard_D2s_v5 Standard_D2as_v5)
          LOCATION=''; VM_SIZE=''; VM_VCPUS=0; VM_FAMILY=''
          declare -A seen_regions=()
          for region in "${CANDIDATE_REGIONS[@]}"; do
            [[ -n "$region" ]] || continue
            [[ -z "${seen_regions[$region]:-}" ]] || continue
            seen_regions[$region]=1
            usage="$(az vm list-usage -l "$region" -o json --only-show-errors 2>/dev/null || echo '[]')"
            total_available="$(jq -r '[.[] | select(.name.value == "cores")][0] | if . == null then -1 else (.limit - .currentValue) end' <<<"$usage")"
            for size in "${CANDIDATE_SIZES[@]}"; do
              sku="$(az vm list-skus -l "$region" --resource-type virtualMachines --size "$size" --all -o json --only-show-errors 2>/dev/null | jq -c '[.[] | select((.restrictions | length) == 0)][0] // empty')"
              [[ -n "$sku" ]] || continue
              family="$(jq -r '.family // empty' <<<"$sku")"
              vcpus="$(jq -r '[.capabilities[]? | select(.name == "vCPUs") | .value][0] // "0"' <<<"$sku")"
              [[ "$vcpus" =~ ^[0-9]+$ ]] || continue
              need=$((vcpus * 4))
              family_available="$(jq -r --arg family "$family" '[.[] | select(.name.value == $family)][0] | if . == null then -1 else (.limit - .currentValue) end' <<<"$usage")"
              total_ok=1; family_ok=1
              [[ "$total_available" == -1 || "$total_available" -ge "$need" ]] || total_ok=0
              [[ "$family_available" == -1 || "$family_available" -ge "$need" ]] || family_ok=0
              if [[ "$total_ok" == 1 && "$family_ok" == 1 ]]; then
                LOCATION="$region"; VM_SIZE="$size"; VM_VCPUS="$vcpus"; VM_FAMILY="$family"; break 2
              fi
            done
          done
          [[ -n "$LOCATION" && -n "$VM_SIZE" ]] || { echo 'TRUYN_AZURE_MULTIHOST=FAIL reason=no_region_with_sku_and_quota'; exit 11; }
          echo "::add-mask::$LOCATION"
          echo "TRUYN_AZURE_SELECTION size=$VM_SIZE vcpus=$VM_VCPUS family=$VM_FAMILY hosts=4"

          PREFIX="truyn-net-${GITHUB_RUN_ID}"
          VMS=(); IPS=(); NODEIDS=(); RECORDS=()
          NSG="${PREFIX}-nsg"; VNET="${PREFIX}-vnet"; SUBNET="${PREFIX}-subnet"; gate_ok=0
          cleanup(){
            set +e
            for vm in "${VMS[@]:-}"; do [[ -z "$vm" ]] || az vm delete -g "$RG" -n "$vm" --yes --force-deletion --only-show-errors >/dev/null 2>&1 || true; done
            ids="$(az network public-ip list -g "$RG" --query "[?starts_with(name, '$PREFIX')].id" -o tsv 2>/dev/null || true)"; [[ -z "$ids" ]] || az resource delete --ids $ids >/dev/null 2>&1 || true
            ids="$(az network nic list -g "$RG" --query "[?starts_with(name, '$PREFIX')].id" -o tsv 2>/dev/null || true)"; [[ -z "$ids" ]] || az resource delete --ids $ids >/dev/null 2>&1 || true
            ids="$(az disk list -g "$RG" --query "[?starts_with(name, '$PREFIX')].id" -o tsv 2>/dev/null || true)"; [[ -z "$ids" ]] || az resource delete --ids $ids >/dev/null 2>&1 || true
            az network vnet delete -g "$RG" -n "$VNET" --only-show-errors >/dev/null 2>&1 || true
            az network nsg delete -g "$RG" -n "$NSG" --only-show-errors >/dev/null 2>&1 || true
            [[ "$gate_ok" == 1 ]] && echo 'TRUYN_AZURE_MULTIHOST_CLEANUP=PASS ephemeral_resources_removed=true' || echo 'TRUYN_AZURE_MULTIHOST_CLEANUP=EXECUTED gate_failed=true'
          }
          trap cleanup EXIT

          az network nsg create -g "$RG" -n "$NSG" -l "$LOCATION" --only-show-errors >/dev/null
          az network nsg rule create -g "$RG" --nsg-name "$NSG" -n allow-truyn-quic --priority 100 --access Allow --direction Inbound --protocol Udp --source-address-prefixes Internet --source-port-ranges '*' --destination-address-prefixes '*' --destination-port-ranges 4433 --only-show-errors >/dev/null
          az network vnet create -g "$RG" -n "$VNET" -l "$LOCATION" --address-prefixes 10.243.0.0/16 --subnet-name "$SUBNET" --subnet-prefixes 10.243.1.0/24 --only-show-errors >/dev/null

          for i in 0 1 2 3; do
            vm="${PREFIX}-${i}"; pip="${PREFIX}-${i}-pip"; nic="${PREFIX}-${i}-nic"; VMS+=("$vm")
            echo "::add-mask::$vm"; echo "::add-mask::$pip"; echo "::add-mask::$nic"
            az network public-ip create -g "$RG" -n "$pip" -l "$LOCATION" --sku Standard --allocation-method Static --only-show-errors >/dev/null
            az network nic create -g "$RG" -n "$nic" -l "$LOCATION" --vnet-name "$VNET" --subnet "$SUBNET" --network-security-group "$NSG" --public-ip-address "$pip" --only-show-errors >/dev/null
            err="$(mktemp)"
            if ! az vm create -g "$RG" -n "$vm" -l "$LOCATION" --image Ubuntu2204 --size "$VM_SIZE" --admin-username truynadmin --generate-ssh-keys --nics "$nic" --os-disk-delete-option Delete --tags "truyn-ephemeral-run=${GITHUB_RUN_ID}" --only-show-errors >/dev/null 2>"$err"; then
              echo "TRUYN_AZURE_VM_CREATE_FAIL index=$i size=$VM_SIZE"
              tail -n 12 "$err" | sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}/[redacted-id]/g'
              exit 12
            fi
            ip="$(az network public-ip show -g "$RG" -n "$pip" --query ipAddress -o tsv)"
            [[ -n "$ip" ]] || { echo 'TRUYN_AZURE_MULTIHOST=FAIL reason=public_ip_missing'; exit 13; }
            IPS+=("$ip"); echo "::add-mask::$ip"
          done

          remote_raw(){ az vm run-command invoke -g "$RG" -n "$1" --command-id RunShellScript --scripts "$2" --query 'value[0].message' -o tsv --only-show-errors; }
          call_json(){
            local vm="$1" method="$2" path="$3" payload="${4:-}" encoded='' script out result
            [[ -z "$payload" ]] || encoded="$(printf '%s' "$payload" | base64 -w0)"
            if [[ -n "$encoded" ]]; then script="set -euo pipefail; R=\$(printf '%s' '$encoded' | base64 -d | curl -fsS --max-time 150 -X '$method' -H 'content-type: application/json' --data-binary @- 'http://127.0.0.1:8788$path'); printf 'TRUYN_RESULT=%s\\n' \"\$R\""; else script="set -euo pipefail; R=\$(curl -fsS --max-time 150 -X '$method' 'http://127.0.0.1:8788$path'); printf 'TRUYN_RESULT=%s\\n' \"\$R\""; fi
            out="$(remote_raw "$vm" "$script")"; result="$(printf '%s\n' "$out" | sed -n 's/^TRUYN_RESULT=//p' | tail -1)"; [[ -n "$result" ]] || return 1; printf '%s' "$result"
          }

          for i in 0 1 2 3; do
            vm="${VMS[$i]}"; ip="${IPS[$i]}"
            setup=$(cat <<SCRIPT
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq git curl jq openssl ca-certificates >/dev/null
          major=0; command -v node >/dev/null && major=\$(node -p 'parseInt(process.versions.node)' 2>/dev/null || echo 0)
          if [[ "\$major" -lt 22 ]]; then curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null; apt-get install -y -qq nodejs >/dev/null; fi
          id -u truyn >/dev/null 2>&1 || useradd --system --home /var/lib/truyn-testnet --shell /usr/sbin/nologin truyn
          rm -rf /opt/truyn; git clone -q https://github.com/inn-media/truyn.git /opt/truyn; cd /opt/truyn; git checkout -q '${TEST_COMMIT}'
          npm install --ignore-scripts --no-audit --no-fund >/dev/null
          install -d -m 0700 -o truyn -g truyn /var/lib/truyn-testnet /etc/truyn-testnet
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /etc/truyn-testnet/key.pem -out /etc/truyn-testnet/cert.pem -subj '/CN=${ip}' -days 1 -addext 'subjectAltName=IP:${ip}' >/dev/null 2>&1
          chown truyn:truyn /etc/truyn-testnet/key.pem /etc/truyn-testnet/cert.pem; chmod 0600 /etc/truyn-testnet/key.pem
          cat >/etc/systemd/system/truyn-testnet.service <<UNIT
          [Unit]
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=truyn
          Group=truyn
          WorkingDirectory=/opt/truyn
          Environment=TRUYN_TESTNET_DATA_DIR=/var/lib/truyn-testnet
          Environment=TRUYN_TLS_KEY_PATH=/etc/truyn-testnet/key.pem
          Environment=TRUYN_TLS_CERT_PATH=/etc/truyn-testnet/cert.pem
          Environment=TRUYN_ADVERTISE_HOST=${ip}
          Environment=TRUYN_QUIC_HOST=0.0.0.0
          Environment=TRUYN_QUIC_PORT=4433
          Environment=TRUYN_CONTROL_HOST=127.0.0.1
          Environment=TRUYN_CONTROL_PORT=8788
          Environment=TRUYN_DHT_REPLICATION_FACTOR=3
          Environment=TRUYN_DHT_WRITE_QUORUM=3
          Environment=TRUYN_DHT_RPC_TIMEOUT_MS=5000
          Environment=TRUYN_TESTNET_FAULT_CONTROL=1
          ExecStart=/usr/bin/node /opt/truyn/network/testnet/node-service.js
          Restart=on-failure
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload; systemctl enable --now truyn-testnet.service >/dev/null
          for n in \$(seq 1 60); do curl -fsS --max-time 2 http://127.0.0.1:8788/status >/dev/null && exit 0; sleep 2; done
          journalctl -u truyn-testnet.service -n 80 --no-pager || true; exit 21
          SCRIPT
          )
            remote_raw "$vm" "$setup" >/dev/null
          done

          for i in 0 1 2 3; do rec="$(call_json "${VMS[$i]}" GET /record)"; RECORDS+=("$rec"); nid="$(jq -r '.record.nodeId' <<<"$rec")"; [[ "$nid" == truyn:node:* ]] || exit 20; NODEIDS+=("$nid"); echo "::add-mask::$nid"; done
          ALL_RECORDS="$(printf '%s\n' "${RECORDS[@]}" | jq -s '{records: map(.record)}')"
          for i in 0 1 2 3; do call_json "${VMS[$i]}" POST /bootstrap "$ALL_RECORDS" >/dev/null; done

          direct_payload="$(jq -nc --arg id "${NODEIDS[2]}" '{nodeId:$id,input:{proof:"azure-four-host-direct"}}')"
          t0="$(date +%s%3N)"; direct="$(call_json "${VMS[0]}" POST /need "$direct_payload")"; direct_ms=$(( $(date +%s%3N) - t0 ))
          [[ "$(jq -r '.transport' <<<"$direct")" == quic-direct && "$(jq -r '.result.transport' <<<"$direct")" == quic ]] || { echo 'TRUYN_AZURE_MULTIHOST=FAIL reason=direct_quic_failed'; exit 30; }

          partition_payload="$(jq -nc --arg id "${NODEIDS[2]}" '{nodeIds:[$id]}')"
          call_json "${VMS[0]}" POST /faults/partition "$partition_payload" >/dev/null
          partition_failed=0; call_json "${VMS[0]}" POST /need "$direct_payload" >/dev/null 2>&1 || partition_failed=1
          [[ "$partition_failed" == 1 ]] || { echo 'TRUYN_AZURE_MULTIHOST=FAIL reason=partition_did_not_block_direct'; exit 31; }
          call_json "${VMS[0]}" POST /faults/heal "$partition_payload" >/dev/null
          healed="$(call_json "${VMS[0]}" POST /need "$direct_payload")"; [[ "$(jq -r '.transport' <<<"$healed")" == quic-direct ]] || exit 32

          replicated="$(call_json "${VMS[0]}" POST /replicate '{"namespace":"productionization","key":"azure-four-host","value":{"proof":"durable"},"replicationFactor":3,"minAcks":3,"ttlMs":900000}')"
          [[ "$(jq -r '.result.acknowledgements' <<<"$replicated")" == 3 ]] || { echo 'TRUYN_AZURE_MULTIHOST=FAIL reason=replication_quorum'; exit 33; }
          record_id="$(jq -r '.record.recordId' <<<"$replicated")"; echo "::add-mask::$record_id"
          found="$(call_json "${VMS[2]}" GET '/find?namespace=productionization&key=azure-four-host&fanout=4')"; jq -e --arg rid "$record_id" '.records | any(.recordId == $rid)' <<<"$found" >/dev/null || exit 34

          holder="$(jq -r --arg self "${NODEIDS[0]}" '.result.storedAt[] | select(. != $self)' <<<"$replicated" | head -1)"; failed_index=''
          for i in 1 2 3; do [[ "${NODEIDS[$i]}" == "$holder" ]] && failed_index="$i"; done
          [[ -n "$failed_index" ]] || exit 35; failed_vm="${VMS[$failed_index]}"
          before_seq="$(printf '%s\n' "${RECORDS[@]}" | jq -r --arg nid "$holder" 'select(.record.nodeId == $nid) | .record.sequence')"
          remote_raw "$failed_vm" 'set -e; systemctl stop truyn-testnet.service' >/dev/null
          t1="$(date +%s%3N)"; repaired="$(call_json "${VMS[0]}" POST /repair '{"namespace":"productionization","key":"azure-four-host","replicationFactor":3,"minAcks":3}')"; repair_ms=$(( $(date +%s%3N) - t1 ))
          [[ "$(jq -r '.repairs[0].acknowledgements' <<<"$repaired")" == 3 ]] || exit 36
          jq -e --arg dead "$holder" '.repairs[0].storedAt | index($dead) == null' <<<"$repaired" >/dev/null || exit 37
          (( repair_ms < 30000 )) || exit 38
          remote_raw "$failed_vm" 'set -e; systemctl start truyn-testnet.service; for n in $(seq 1 60); do curl -fsS --max-time 2 http://127.0.0.1:8788/status >/dev/null && exit 0; sleep 2; done; exit 1' >/dev/null
          restarted="$(call_json "$failed_vm" GET /record)"; [[ "$(jq -r '.record.nodeId' <<<"$restarted")" == "$holder" ]] || exit 39
          after_seq="$(jq -r '.record.sequence' <<<"$restarted")"; (( after_seq > before_seq )) || exit 40
          ping_payload="$(jq -nc --arg id "$holder" '{nodeId:$id}')"; pong="$(call_json "${VMS[3]}" POST /ping "$ping_payload")"; [[ "$(jq -r '.pong' <<<"$pong")" == true ]] || exit 41

          gate_ok=1
          jq -nc --arg gate PASS --arg size "$VM_SIZE" --argjson hosts 4 --argjson directMs "$direct_ms" --argjson repairMs "$repair_ms" '{gate:$gate,hosts:$hosts,vmSize:$size,transport:"real-public-udp-quic",relayCalls:0,directNeedMs:$directMs,partitionBlocked:true,healRecovered:true,replicationAcks:3,holderFailureRepairMs:$repairMs,restartIdentityStable:true,sequenceAdvanced:true}' | sed 's/^/TRUYN_AZURE_MULTIHOST=/'
