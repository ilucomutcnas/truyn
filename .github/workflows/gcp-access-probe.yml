name: GCP Access Probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gcp-access-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER_VALUE: ${{ vars.GCP_PROJECT_NUMBER || secrets.GCP_PROJECT_NUMBER }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_CONFIGURED: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT || vars.GCP_DEPLOYER_SA || secrets.GCP_DEPLOYER_SA }}
      GCP_RUNTIME_SA_CONFIGURED: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT || secrets.GCP_RUNTIME_SERVICE_ACCOUNT || vars.GCP_RUNTIME_SA || secrets.GCP_RUNTIME_SA }}
      GCP_REGION_CONFIGURED: ${{ vars.GCP_REGION || secrets.GCP_REGION }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in GCP_PROJECT_ID_VALUE GCP_PROJECT_NUMBER_VALUE GCP_WIF_PROVIDER_VALUE GCP_REGION_CONFIGURED; do
            if [[ -z "${!key:-}" ]]; then
              echo "MISSING_${key}=true"
              exit 1
            fi
          done

          region="$(printf '%s' "$GCP_REGION_CONFIGURED" | grep -oE '[a-z]+-[a-z0-9]+[0-9]' | head -n1 || true)"
          if [[ -z "$region" ]]; then
            echo "GCP_REGION_FORMAT=invalid"
            exit 1
          fi

          deployer_sa="${GCP_DEPLOYER_SA_CONFIGURED:-truyn-github-deployer@${GCP_PROJECT_ID_VALUE}.iam.gserviceaccount.com}"
          runtime_sa="${GCP_RUNTIME_SA_CONFIGURED:-truyn-gemini-runtime@${GCP_PROJECT_ID_VALUE}.iam.gserviceaccount.com}"
          echo "GCP_REGION_VALUE=${region}" >> "$GITHUB_ENV"
          echo "GCP_DEPLOYER_SA_VALUE=${deployer_sa}" >> "$GITHUB_ENV"
          echo "GCP_RUNTIME_SA_VALUE=${runtime_sa}" >> "$GITHUB_ENV"
          echo "GCP_CONFIG_PRESENT=ok"

      - id: auth
        name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Verify project and deployment access
        shell: bash
        run: |
          set -euo pipefail
          project="$GCP_PROJECT_ID_VALUE"
          region="$GCP_REGION_VALUE"
          runtime_sa="$GCP_RUNTIME_SA_VALUE"

          gcloud auth list --filter=status:ACTIVE --format='value(account)' >/dev/null
          echo "GCP_AUTH=ok"

          gcloud projects describe "$project" --format='value(projectId)' >/dev/null
          echo "PROJECT_READ=ok"

          token="$(gcloud auth print-access-token)"

          curl -fsS -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${project}/locations/${region}/services?pageSize=1" >/dev/null
          echo "CLOUD_RUN_READ=ok"

          curl -fsS -H "Authorization: Bearer ${token}" \
            "https://artifactregistry.googleapis.com/v1/projects/${project}/locations/${region}/repositories?pageSize=1" >/dev/null
          echo "ARTIFACT_REGISTRY_READ=ok"

          gcloud iam service-accounts describe "$runtime_sa" --project="$project" --format='value(email)' >/dev/null
          echo "RUNTIME_SERVICE_ACCOUNT_READ=ok"

          perms_json="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            "https://iam.googleapis.com/v1/projects/-/serviceAccounts/${runtime_sa}:testIamPermissions" \
            -d '{"permissions":["iam.serviceAccounts.actAs","iam.serviceAccounts.get"]}')"
          if jq -e '.permissions | index("iam.serviceAccounts.actAs")' <<<"$perms_json" >/dev/null; then
            echo "RUNTIME_SERVICE_ACCOUNT_ACTAS=ok"
            echo "GCP_ACTAS_OK=true" >> "$GITHUB_ENV"
          else
            echo "RUNTIME_SERVICE_ACCOUNT_ACTAS=missing"
            echo "GCP_ACTAS_OK=false" >> "$GITHUB_ENV"
          fi

          project_perms="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${project}:testIamPermissions" \
            -d '{"permissions":["run.services.create","run.services.update","artifactregistry.repositories.create","artifactregistry.repositories.delete"]}')"

          missing=0
          for permission in run.services.create run.services.update artifactregistry.repositories.create artifactregistry.repositories.delete; do
            if ! jq -e --arg p "$permission" '.permissions | index($p)' <<<"$project_perms" >/dev/null; then
              echo "PROJECT_PERMISSION_${permission}=missing"
              missing=1
            fi
          done
          if [[ "$missing" == "0" ]]; then
            echo "CLOUD_RUN_WRITE_PERMISSION=ok"
            echo "ARTIFACT_REGISTRY_WRITE_PERMISSION=ok"
            echo "GCP_PROJECT_WRITE_OK=true" >> "$GITHUB_ENV"
          else
            echo "GCP_PROJECT_WRITE_OK=false" >> "$GITHUB_ENV"
          fi

      - name: Verify safe create/delete in Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          project="$GCP_PROJECT_ID_VALUE"
          region="$GCP_REGION_VALUE"
          repo="truyn-access-probe-${GITHUB_RUN_ID}"

          cleanup() {
            gcloud artifacts repositories delete "$repo" --project="$project" --location="$region" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud artifacts repositories create "$repo" \
            --project="$project" \
            --location="$region" \
            --repository-format=docker \
            --description='Ephemeral TRUYN access probe' \
            --quiet >/dev/null
          echo "ARTIFACT_REGISTRY_CREATE=ok"

          gcloud artifacts repositories delete "$repo" --project="$project" --location="$region" --quiet >/dev/null
          trap - EXIT
          echo "ARTIFACT_REGISTRY_DELETE=ok"
          echo "GCP_ARTIFACT_WRITE_OK=true" >> "$GITHUB_ENV"

      - name: Final access verdict
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GCP_PROJECT_WRITE_OK:-false}" == "true" ]] || { echo "PROJECT_WRITE_ACCESS=incomplete"; exit 1; }
          [[ "${GCP_ARTIFACT_WRITE_OK:-false}" == "true" ]] || { echo "ARTIFACT_WRITE_ACCESS=incomplete"; exit 1; }
          [[ "${GCP_ACTAS_OK:-false}" == "true" ]] || { echo "RUNTIME_ACTAS_ACCESS=incomplete"; exit 1; }
          echo "GCP_DEPLOYMENT_ACCESS=complete"
