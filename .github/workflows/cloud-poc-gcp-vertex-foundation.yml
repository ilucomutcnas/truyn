name: Cloud PoC GCP Vertex Foundation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-poc-gcp-vertex-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-vertex:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Verify or enable Vertex AI API in the deployment project
        shell: bash
        run: |
          set -euo pipefail
          if gcloud services list --enabled \
            --project="$GCP_PROJECT_ID_VALUE" \
            --filter='config.name:aiplatform.googleapis.com' \
            --format='value(config.name)' | grep -qx 'aiplatform.googleapis.com'; then
            echo 'VERTEX_AI_API=already_enabled'
          else
            echo 'VERTEX_AI_API=not_enabled_attempting_enable'
            gcloud services enable aiplatform.googleapis.com \
              --project="$GCP_PROJECT_ID_VALUE" \
              --quiet
          fi

          enabled="$(gcloud services list --enabled \
            --project="$GCP_PROJECT_ID_VALUE" \
            --filter='config.name:aiplatform.googleapis.com' \
            --format='value(config.name)')"
          [[ "$enabled" == 'aiplatform.googleapis.com' ]] || { echo 'VERTEX_AI_API=not_enabled'; exit 1; }
          echo 'VERTEX_AI_API=enabled'

      - name: Ensure deployer can invoke Vertex AI models
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GCP_DEPLOYER_SA_VALUE" ]] || { echo 'GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL=missing'; exit 1; }

          member="serviceAccount:${GCP_DEPLOYER_SA_VALUE}"
          if gcloud projects get-iam-policy "$GCP_PROJECT_ID_VALUE" \
            --flatten='bindings[].members' \
            --filter="bindings.role:roles/aiplatform.user AND bindings.members:${member}" \
            --format='value(bindings.role)' | grep -qx 'roles/aiplatform.user'; then
            echo 'VERTEX_AI_DEPLOYER_ROLE=already_present'
          else
            echo 'VERTEX_AI_DEPLOYER_ROLE=granting'
            gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID_VALUE" \
              --member="$member" \
              --role='roles/aiplatform.user' \
              --condition=None \
              --quiet >/dev/null
          fi

          role="$(gcloud projects get-iam-policy "$GCP_PROJECT_ID_VALUE" \
            --flatten='bindings[].members' \
            --filter="bindings.role:roles/aiplatform.user AND bindings.members:${member}" \
            --format='value(bindings.role)' | head -n1)"
          [[ "$role" == 'roles/aiplatform.user' ]] || { echo 'VERTEX_AI_DEPLOYER_ROLE=missing'; exit 1; }
          echo 'VERTEX_AI_DEPLOYER_ROLE=ready'
