name: Stale Offer Regression CI

on:
  push:
    branches:
      - fix/stale-offer-routing
    paths:
      - 'network/relay/server.js'
      - 'tests/mvp.test.js'
      - '.github/workflows/stale-offer-regression-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
