name: tmp-truyn-repair-p00

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-truyn-repair-p00.yml'

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - id: assemble
        name: Assemble verified p00
        shell: bash
        run: |
          set -euo pipefail
          cat _tmp_parts/p00a _tmp_parts/p00b _tmp_parts/p00c _tmp_parts/p00d > _tmp_parts/p00
          test "$(sha256sum _tmp_parts/p00 | awk '{print $1}')" = 'a900539e13ce8e2511c52059e426594b1eb4c009bd51486250996062b015c1de'
      - id: write
        name: Commit repaired p00
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _tmp_parts/p00
          git diff --cached --quiet && exit 0
          git commit -m 'ci: repair static release part 00'
          git push origin HEAD:main
      - name: Publish repair status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          WRITE: ${{ steps.write.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          for pair in "assemble:$ASSEMBLE" "write:$WRITE"; do
            context="${pair%%:*}"; outcome="${pair#*:}"
            if [[ "$outcome" == success ]]; then state=success; else state=failure; fi
            gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context="truyn-repair/${context}" >/dev/null
          done
