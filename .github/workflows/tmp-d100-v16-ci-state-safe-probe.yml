name: tmp-d100-v16-ci-state-safe-probe

on:
  push:
    branches:
      - ci/d100-v16-main-security-green-observer-23360cbe
    paths:
      - '.github/workflows/tmp-d100-v16-ci-state-safe-probe.yml'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe CI workflow state fail-open for diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" 2>&1)"
          rc=$?
          compact="$(printf '%s' "$workflow" | tr '\n' ' ' | head -c 3000)"
          body="rc=${rc}\nresponse=${compact}\nstage=ci_workflow_state_safe_probe"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN D-100 V16 CI STATE SAFE PROBE' -f "body=${body}" >/dev/null
          exit 0
