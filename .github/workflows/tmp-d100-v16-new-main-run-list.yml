name: tmp-d100-v16-new-main-run-list

on:
  push:
    branches: [ci/d100-v16-actions-policy-probe-2]
    paths:
      - '.github/workflows/tmp-d100-v16-new-main-run-list.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List CI runs for new exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: '82eba28c25aceb273444da6edb97904cbaea03db'
        shell: bash
        run: |
          set -Eeuo pipefail
          runs="$(gh api --paginate "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" --jq '[.workflow_runs[] | {id,name,head_branch,head_sha,event,status,conclusion,run_attempt,created_at,updated_at}]')"
          body=$(cat <<EOF
          exact_sha=${SHA}
          runs=${runs}
          stage=new_main_run_list
          EOF
          )
          gh api "repos/${REPO}/issues" -f 'title=TRUYN D-100 V16 NEW MAIN RUN LIST' -f "body=${body}" >/dev/null
