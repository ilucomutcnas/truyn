name: tmp-d100-v16-secret-names-probe

on:
  push:
    branches: [ci/d100-v16-actions-policy-probe-2]
    paths:
      - '.github/workflows/tmp-d100-v16-secret-names-probe.yml'

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List repository Actions secret names only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          resp="$(gh api "repos/${REPO}/actions/secrets?per_page=100" --jq '.secrets[].name' 2>&1)"
          rc=$?
          body=$(printf 'rc=%s\nsecret_names=%s\nstage=secret_names_probe\n' "$rc" "$resp")
          gh api "repos/${REPO}/issues" -f 'title=TRUYN D-100 V16 SECRET NAMES PROBE' -f "body=${body}" >/dev/null
