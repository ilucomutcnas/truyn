name: Refresh requester socket and rerun economic benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-context-benchmark-socket.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix-rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch requester socket refresh
        run: python scripts/fix-context-benchmark-socket.py
      - name: Verify unchanged benchmark gates and harness
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          node --check benchmarks/context-ref-delta-ab.js
          grep -F "inputTokenReductionPercentMin: Number(process.env.CONTEXT_GATE_INPUT_REDUCTION_PCT || 80)" benchmarks/context-ref-delta-ab.js
          grep -F "inferenceCostReductionPercentMin: Number(process.env.CONTEXT_GATE_COST_REDUCTION_PCT || 50)" benchmarks/context-ref-delta-ab.js
          grep -F "contextTransferReductionPercentMin: Number(process.env.CONTEXT_GATE_TRANSFER_REDUCTION_PCT || 70)" benchmarks/context-ref-delta-ab.js
          grep -F "qualityPassPercentMin: Number(process.env.CONTEXT_GATE_QUALITY_PCT || 100)" benchmarks/context-ref-delta-ab.js
          rm -rf node_modules package-lock.json
          git diff --check
      - name: Commit tested fix and clean helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/context-ref-delta-ab.js
          git rm scripts/fix-context-benchmark-socket.py .github/workflows/fix-context-benchmark-socket.yml
          git diff --cached --check
          git commit -m 'Refresh requester socket before context benchmark arm'
          git push origin HEAD:main
      - name: Dispatch unchanged economic benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-poc-context-efficiency-ab.yml --repo inn-media/truyn --ref main
