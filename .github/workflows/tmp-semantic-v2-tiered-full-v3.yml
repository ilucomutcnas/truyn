name: Ephemeral Semantic v2 Tiered Verifier Full 360 V3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-tiered-full-v3.yml']

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-tiered3-${{ github.run_id }}
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      CANONICAL_WORKFLOW_SHA: 1aeff7594d966d379ee00d8d5466c53978b9974b
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Load immutable sources and patch canonical runner
        shell: bash
        run: |
          set -euo pipefail
          load_file(){ mkdir -p "$(dirname "$3")"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1?ref=$2" | jq -r '.content' | tr -d '\n' | base64 -d > "$3"; }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA" benchmarks/semantic-retrieval-v2.js
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA" benchmarks/semantic-v2-gcp-proxy.js
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA" benchmarks/Dockerfile.semantic-v2-gcp-proxy
          load_file .github/workflows/tmp-semantic-v2-final-full.yml "$CANONICAL_WORKFLOW_SHA" /tmp/canonical.yml
          python - <<'PY'
          import re
          text=open('/tmp/canonical.yml').read()
          m=re.search(r"cat > semantic-v2-final-full\.mjs <<'NODE'\n(.*?)\n\s*NODE\n", text, re.S)
          if not m: raise SystemExit('canonical runner not found')
          lines=m.group(1).splitlines(); ind=min(len(x)-len(x.lstrip()) for x in lines if x.strip())
          js='\n'.join(x[ind:] for x in lines)+'\n'
          replacement="""const rows=await ml(retrievalCases,4,async(item,qi)=>{const dense52=blocks.map((x,i)=>({id:x.id,text:x.text,score:cos(qv[qi],dv[i])})).sort((x,y)=>y.score-x.score||x.id.localeCompare(y.id)).slice(0,52),dense24=dense52.slice(0,24),p24=dense24.map((c,i)=>({id:`c${i.toString(36)}`,text:c.text})),m24=new Map(p24.map((p,i)=>[p.id,dense24[i].id]));const serialized=JSON.stringify({query:item.question,candidates:p24}),noBlockId=!/semantic-record-\\d+/i.test(serialized)&&!serialized.includes(item.id)&&!serialized.includes('\\"ids\\"');const [a,b]=await Promise.all([cheap(lite,'lite',item.question,p24,'MINIMAL'),cheap(flash,'flash',item.question,p24,'MINIMAL')]);const aId=a?m24.get(a):null,bId=b?m24.get(b):null,agreement=!!aId&&aId===bId,rankA=aId?dense52.findIndex(x=>x.id===aId)+1:null,rankB=bId?dense52.findIndex(x=>x.id===bId)+1:null,consensusRank=agreement?rankA:null;let mode='cheap_confident',selectedId=agreement?aId:null,proId=null,verifierCandidateK=0;if(!agreement||consensusRank>=14||!selectedId){const observed=Math.max(rankA||52,rankB||52);verifierCandidateK=observed<=4?4:observed<=8?8:observed<=16?16:52;mode=`pro_tier_${verifierCandidateK}`;const pv=dense52.slice(0,verifierCandidateK).map((c,i)=>({id:`r${i.toString(36)}`,text:c.text})),mv=new Map(pv.map((p,i)=>[p.id,dense52[i].id]));const pa=await pro64(item.question,pv);proId=pa?mv.get(pa):null;selectedId=proId}const candidateRecall52=dense52.some(x=>x.id===item.id),selectedBlock=blocks.find(x=>x.id===selectedId);done++;if(done%20===0)process.stderr.write(`processed ${done}/360\\n`);return{caseIndex:item.caseIndex,id:item.id,code:item.code,blockLanguage:item.blockLanguage,queryLanguage:item.queryLanguage,category:item.category,question:item.question,dense52Recall:candidateRecall52,denseRank:candidateRecall52?dense52.findIndex(x=>x.id===item.id)+1:null,liteSelectedId:aId,flashSelectedId:bId,cheapAgreement:agreement,consensusDenseRank:consensusRank,verifierCandidateK,mode,proSelectedId:proId,selectedId,correct:selectedId===item.id,provenancePass:!!selectedBlock&&selectedBlock.id===selectedId,noBlockId,minimalContext:true};});"""
          start=js.index('const rows=await ml(retrievalCases,4,async(item,qi)=>{')
          end=js.index('\nconst metric=', start)
          js=js[:start]+replacement+js[end:]
          js=js.replace("rec=rows.filter(r=>r.dense64Recall).length,fallback=rows.filter(r=>r.mode==='pro64_fallback').length", "rec=rows.filter(r=>r.dense52Recall).length,fallback=rows.filter(r=>r.mode.startsWith('pro_tier_')).length")
          js=js.replace("denseCandidateK:64", "denseCandidateK:52")
          js=js.replace("confidenceRule:'accept only identical cheap top1 with dense rank <= 12; otherwise route to Gemini 3.1 Pro HIGH over dense64'", "confidenceRule:'accept identical cheap top1 at dense rank <= 13; otherwise use the smallest verifier tier in 4/8/16/52 that contains both cheap selections'")
          js=js.replace("confidence-gated full 360 proof", "confidence-gated tiered full 360 proof")
          open('semantic-v2-tiered-full.mjs','w').write(js)
          PY
          node --check semantic-v2-tiered-full.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with: { project_id: '${{ env.GCP_PROJECT_ID_VALUE }}' }
      - name: Prepare isolated runtime-identity Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"; image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-tiered3:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null && docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for a in $(seq 1 30); do curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok==true' >/dev/null && break; [[ "$a" -lt 30 ]] || exit 1; sleep 2; done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"; echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"; echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"
      - name: Run tiered 360-case proof
        shell: bash
        run: node semantic-v2-tiered-full.mjs
      - name: Upload full raw evidence
        if: ${{ always() && hashFiles('semantic-v2-final-full.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-tiered-full-v3-${{ github.run_id }}
          path: semantic-v2-final-full.json
          retention-days: 30
      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
