name: Fix benchmark requester socket lifecycle

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-benchmark-requester-socket-lifecycle.yml'

permissions:
  actions: write
  contents: write

jobs:
  fix-test-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply benchmark lifecycle fix
        run: python scripts/fix-benchmark-requester-socket-lifecycle.py
      - name: Verify benchmark and regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --check benchmarks/cross-cloud-ab.js
          npm install --no-audit --no-fund
          npm test
          rm -rf node_modules
          rm -f package-lock.json
          git diff --check
      - name: Commit tested benchmark fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/cross-cloud-ab.js
          git rm scripts/fix-benchmark-requester-socket-lifecycle.py .github/workflows/fix-benchmark-requester-socket-lifecycle.yml
          git diff --cached --check
          git commit -m 'Close requester socket after A/B benchmark'
          git push origin HEAD:main
      - name: Stop stale hanging benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 31892414803 --repo inn-media/truyn || true
      - name: Run corrected requester socket benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-poc-benchmark-ab.yml --repo inn-media/truyn --ref main
