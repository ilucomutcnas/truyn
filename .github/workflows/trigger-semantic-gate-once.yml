name: Trigger Semantic Retrieval Gate Once

on:
  push:
    paths:
      - .github/workflows/trigger-semantic-gate-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch manual semantic retrieval benchmark on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-poc-semantic-retrieval-ab.yml --repo inn-media/truyn --ref main
