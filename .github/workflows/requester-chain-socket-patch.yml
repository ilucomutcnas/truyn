name: Requester WebSocket CHAIN hot-path patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/requester-chain-socket-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply requester socket patch
        run: python scripts/requester-chain-socket-patch.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run complete test suite
        run: npm test

      - name: Verify intended diff only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          rm -f package-lock.json
          git diff --check
          unexpected="$(git status --short | awk '{print $2}' | grep -vE '^(node/client.js|network/relay/server.js|benchmarks/cross-cloud-ab.js|tests/mvp.test.js|scripts/requester-chain-socket-patch.py|.github/workflows/requester-chain-socket-patch.yml)$' || true)"
          [[ -z "$unexpected" ]] || { echo "Unexpected paths: $unexpected"; exit 1; }
          git diff -- node/client.js network/relay/server.js benchmarks/cross-cloud-ab.js tests/mvp.test.js

      - name: Commit tested hot-path change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add node/client.js network/relay/server.js benchmarks/cross-cloud-ab.js tests/mvp.test.js
          git rm scripts/requester-chain-socket-patch.py .github/workflows/requester-chain-socket-patch.yml
          git diff --cached --check
          git commit -m 'Move requester CHAIN hot path to persistent WebSocket'
          git push origin HEAD:main
