name: Ephemeral BGE Reranker v2 M3 Hard Pairs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-bge-reranker-hard.yml']

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BGE_MODEL: BAAI/bge-reranker-v2-m3
      BGE_REVISION: c0abf900d43de6a2652b9acd221bb1b45ab65d6e
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      GH_TOKEN: ${{ github.token }}
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load immutable Semantic v2 corpus source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/benchmarks/semantic-retrieval-v2.js?ref=${SEMANTIC_V2_SOURCE_SHA}" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/semantic-retrieval-v2.js

      - name: Extract immutable hard-pair text only
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const src=fs.readFileSync('/tmp/semantic-retrieval-v2.js','utf8');
          const a=src.indexOf('const domains = ['),b=src.indexOf('const fullContext =');
          if(a<0||b<0)throw new Error('corpus markers');
          const ctx={};vm.createContext(ctx);
          vm.runInContext('const corpusSize=600,retrievalCaseCount=360;'+src.slice(a,b)+';globalThis.__data={records,retrievalCases};',ctx);
          const {records,retrievalCases}=ctx.__data;
          const canonical={
            5:'Domain: ship route control. Required operational action: operators must confirm permission validity. Condition: utilization has crossed the protective limit and saturation controls are engaged.',
            241:'Domain: greenhouse gas record management. Required operational action: recover the malfunctioning system. Condition: the main facility is offline at the remote continuity center.',
            269:'Domain: store stock control. Required operational action: preserve audit proof. Condition: outward-facing launch after users can already see it.'
          };
          const specs=[{caseIndex:5,wrongId:'semantic-record-305'},{caseIndex:241,wrongId:'semantic-record-437'},{caseIndex:269,wrongId:'semantic-record-553'}];
          const cases=specs.map(spec=>{const item=retrievalCases.find(x=>x.caseIndex===spec.caseIndex);const target=records.find(r=>r.id===item.id);const wrong=records.find(r=>r.id===spec.wrongId);return {caseIndex:item.caseIndex,queryLanguage:item.queryLanguage,category:item.category,originalQuery:item.question,canonicalQuery:canonical[item.caseIndex],targetText:target.text,wrongText:wrong.text};});
          fs.writeFileSync('/tmp/bge-hard-input.json',JSON.stringify({sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,cases},null,2));
          NODE

      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'torch==2.8.0' 'transformers==4.55.2' 'safetensors==0.6.2'

      - name: Score target vs previous wrong with pinned multilingual cross-encoder
        shell: bash
        run: |
          cat > /tmp/bge_hard.py <<'PY'
          import json, os, time, platform
          import torch
          from transformers import AutoTokenizer, AutoModelForSequenceClassification

          model_name=os.environ['BGE_MODEL']
          revision=os.environ['BGE_REVISION']
          with open('/tmp/bge-hard-input.json','r',encoding='utf-8') as f:
              data=json.load(f)

          load_started=time.perf_counter()
          tokenizer=AutoTokenizer.from_pretrained(model_name,revision=revision)
          model=AutoModelForSequenceClassification.from_pretrained(model_name,revision=revision,use_safetensors=True)
          model.eval()
          load_ms=round((time.perf_counter()-load_started)*1000,3)

          rows=[]
          total_score_ms=0.0
          with torch.no_grad():
              for item in data['cases']:
                  for query_form in ('original','canonical'):
                      query=item['originalQuery'] if query_form=='original' else item['canonicalQuery']
                      pairs=[[query,item['wrongText']],[query,item['targetText']]]
                      started=time.perf_counter()
                      batch=tokenizer(pairs,padding=True,truncation=True,max_length=512,return_tensors='pt')
                      logits=model(**batch,return_dict=True).logits.view(-1).float().cpu()
                      score_ms=(time.perf_counter()-started)*1000
                      total_score_ms+=score_ms
                      wrong_score=float(logits[0].item())
                      target_score=float(logits[1].item())
                      rows.append({
                          'caseIndex':item['caseIndex'],
                          'queryLanguage':item['queryLanguage'],
                          'category':item['category'],
                          'queryForm':query_form,
                          'targetScore':target_score,
                          'wrongScore':wrong_score,
                          'marginTargetMinusWrong':target_score-wrong_score,
                          'selectedExpected':target_score>wrong_score,
                          'pairScoreLatencyMs':round(score_ms,3)
                      })

          original=[r for r in rows if r['queryForm']=='original']
          canonical=[r for r in rows if r['queryForm']=='canonical']
          report={
              'benchmark':'TRUYN Semantic v2 BAAI/bge-reranker-v2-m3 hard-pair diagnostic',
              'generatedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'sourceSha':data['sourceSha'],
              'model':model_name,
              'modelRevision':revision,
              'license':'Apache-2.0',
              'runtime':{'python':platform.python_version(),'torch':torch.__version__,'device':'cpu','modelLoadMs':load_ms,'totalScoringMs':round(total_score_ms,3)},
              'modelVisibleInput':'query text + passage text only; TRUYN block ids are not supplied to the model',
              'cases':rows,
              'originalQuery':{'correct':sum(r['selectedExpected'] for r in original),'total':len(original),'passed':all(r['selectedExpected'] for r in original)},
              'canonicalQuery':{'correct':sum(r['selectedExpected'] for r in canonical),'total':len(canonical),'passed':all(r['selectedExpected'] for r in canonical)},
              'eligibleHardSetPassed':all(r['selectedExpected'] for r in original)
          }
          with open('bge-reranker-hard.json','w',encoding='utf-8') as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps({k:report[k] for k in ('model','modelRevision','runtime','originalQuery','canonicalQuery','eligibleHardSetPassed')},ensure_ascii=False,indent=2))
          if not report['eligibleHardSetPassed']:
              raise SystemExit(2)
          PY
          python /tmp/bge_hard.py

      - name: Upload immutable diagnostic evidence
        if: ${{ always() && hashFiles('bge-reranker-hard.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-bge-reranker-v2-m3-hard-${{ github.run_id }}
          path: bge-reranker-hard.json
          if-no-files-found: error
          retention-days: 30
