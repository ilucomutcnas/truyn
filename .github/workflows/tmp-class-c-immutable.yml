name: Temporary Class C Immutable Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-c-immutable.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  class-c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TESTED_COMMIT: d37a80243d49d1997641b215e614437c4b79ff86
      AZURE_LOCATION: eastus2
      AZURE_VM_SIZE: Standard_B1ms
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_REGION_VALUE: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      PEER_TTL_MS: '30000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish run-start marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d "$(jq -nc --arg title 'TRUYN CLASS C IMMUTABLE RUN STARTED' --arg body "run_id=${GITHUB_RUN_ID} event_sha=${GITHUB_SHA} tested_commit=${TESTED_COMMIT}" '{title:$title,body:$body}')" >/dev/null

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL_VALUE }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Materialize immutable security-clean tested commit
        run: |
          set -Eeuo pipefail
          git cat-file -e "${TESTED_COMMIT}^{commit}"
          rm -rf /tmp/truyn-tested
          git worktree add --detach /tmp/truyn-tested "$TESTED_COMMIT"
          cd /tmp/truyn-tested
          bash scripts/assert-security-clean-tested-commit.sh "$TESTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          npm install --ignore-scripts --no-audit --no-fund

      - name: Execute Class C proof
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/truyn-tested
          bash scripts/class-c-final-acceptance.sh 2>&1 | tee /tmp/class-c-final.log

      - name: Normalize evidence
        if: always()
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/class-c-evidence
          cp /tmp/class-c-final.log /tmp/class-c-evidence/class-c-final.log 2>/dev/null || true
          final_json="$(sed -n 's/^TRUYN_CLASS_C=//p' /tmp/class-c-final.log 2>/dev/null | tail -1 || true)"
          cleanup=false
          grep -q 'TRUYN_CLASS_C_CLEANUP=PASS' /tmp/class-c-final.log 2>/dev/null && cleanup=true
          gate=FAIL
          if [[ "$PROOF_OUTCOME" == success ]] && [[ "$cleanup" == true ]] && printf '%s' "$final_json" | jq -e '
            .gate == "PASS" and
            .cloudProviders >= 2 and
            .cloudRegions >= 2 and
            .crossCloudDirectQuic == true and
            .relayCalls == 0 and
            .packetPathPartition == true and
            .packetDropCount > 0 and
            .realAzureNatGateway == true and
            .natSourceObserved == true and
            .privateNatNodePublicIp == false and
            .doubleNatCgnatLikeOutbound == true and
            .relayFallback == true and
            .relayFallbackAuthenticated == true and
            .relayOutageFailClosed == true and
            .relayRecovery == true
          ' >/dev/null 2>&1; then gate=PASS; fi
          jq -nc \
            --arg gate "$gate" \
            --arg proofOutcome "$PROOF_OUTCOME" \
            --arg testedCommit "$TESTED_COMMIT" \
            --arg runId "$GITHUB_RUN_ID" \
            --argjson cleanup "$cleanup" \
            --argjson measured "${final_json:-null}" \
            '{gate:$gate,proofOutcome:$proofOutcome,testedCommit:$testedCommit,runId:$runId,cleanup:$cleanup,measured:$measured}' \
            > /tmp/class-c-evidence/summary.json
          echo "TRUYN_CLASS_C_NORMALIZED_GATE=$gate"

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-c-immutable-${{ github.run_id }}
          path: /tmp/class-c-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Publish completion marker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gate="$(jq -r '.gate // "FAIL"' /tmp/class-c-evidence/summary.json 2>/dev/null || echo FAIL)"
          cleanup="$(jq -r '.cleanup // false' /tmp/class-c-evidence/summary.json 2>/dev/null || echo false)"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d "$(jq -nc --arg title "TRUYN CLASS C IMMUTABLE ${gate}" --arg body "run_id=${GITHUB_RUN_ID} tested_commit=${TESTED_COMMIT} cleanup=${cleanup}" '{title:$title,body:$body}')" >/dev/null
          test "$gate" = PASS
