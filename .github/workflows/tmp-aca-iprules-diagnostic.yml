name: Temporary ACA IP Rules Diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-aca-iprules-diagnostic.yml']

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      PUBLIC_RELAY_URL: https://relay.truyn.org
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Attempt full AFD allowlist and always restore
        shell: bash
        run: |
          set -euo pipefail
          API='2025-01-01'; APP=''; RG=''; APP_ID=''; BACKUP=''; CHANGED=0
          mask(){ [[ -n "${1:-}" ]] && echo "::add-mask::$1"; }
          health(){ local n="${1:-40}" c; for _ in $(seq 1 "$n"); do c="$(curl -sS --max-time 10 -D /tmp/h.headers -o /tmp/h.body -w '%{http_code}' "$PUBLIC_RELAY_URL/health"||true)"; [[ "$c" == 200 ]] && grep -qi '^cf-ray:' /tmp/h.headers && return 0; sleep 3; done; return 1; }
          restore(){ set +e; if [[ "$CHANGED" == 1 && -n "$APP_ID" && -n "$BACKUP" ]]; then p="$(jq -nc --argjson i "$BACKUP" '{properties:{configuration:{ingress:$i}}}')"; token="$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)"; curl -sS -X PATCH -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data "$p" "https://management.azure.com${APP_ID}?api-version=${API}" >/tmp/restore.out; fi; health 80 && echo 'ACA_IPRULE_DIAG_RESTORE=PASS public_health=200' || echo 'ACA_IPRULE_DIAG_RESTORE=FAIL'; }
          trap restore EXIT

          while IFS=$'\t' read -r name rg fqdn; do
            [[ -n "$fqdn" ]] || continue; j="$(az containerapp show -g "$rg" -n "$name" -o json)"; role="$(jq -r '[.properties.template.containers[0].env[]?|select(.name=="TRUYN_ROLE")|.value][0]//empty' <<<"$j")"; [[ "$role" == relay || "$name" == *relay* ]] || continue
            APP="$name"; RG="$rg"; APP_ID="$(jq -r '.id' <<<"$j")"; BACKUP="$(jq '.properties.configuration.ingress' <<<"$j")"; guard="$(jq '[.properties.template.containers[0].env[]?|select(.name|startswith("TRUYN_ORIGIN_GUARD"))]|length' <<<"$j")"; rules0="$(jq '(.properties.configuration.ingress.ipSecurityRestrictions//[])|length' <<<"$j")"; [[ "$guard" == 0 && "$rules0" == 0 ]] || { echo "ACA_IPRULE_DIAG=FAIL dirty_baseline guard=${guard} rules=${rules0}"; exit 10; }; mask "$APP"; mask "$RG"; mask "$APP_ID"; mask "$fqdn"; break
          done < <(az containerapp list --query "[?properties.configuration.ingress.external==\`true\`].[name,resourceGroup,properties.configuration.ingress.fqdn]" -o tsv)
          [[ -n "$APP_ID" ]] || { echo 'ACA_IPRULE_DIAG=FAIL relay_not_found'; exit 11; }
          health 20 || { echo 'ACA_IPRULE_DIAG=FAIL baseline_health'; exit 12; }

          page="$(curl -fsSL 'https://www.microsoft.com/en-us/download/confirmation.aspx?id=56519' || curl -fsSL 'https://www.microsoft.com/en-us/download/details.aspx?id=56519')"
          url="$(printf '%s' "$page"|grep -Eo 'https://download\.microsoft\.com/download/[^"&<> ]+/ServiceTags_Public_[0-9]{8}\.json'|sort -u|tail -n1||true)"; [[ "$url" =~ ^https://download\.microsoft\.com/download/.*/ServiceTags_Public_[0-9]{8}\.json$ ]] || { echo 'ACA_IPRULE_DIAG=FAIL service_tags_url'; exit 13; }; mask "$url"; curl -fsSL "$url" -o /tmp/tags.json
          mapfile -t cidrs < <(jq -r '.values[]?|select(.name=="AzureFrontDoor.Backend")|.properties.addressPrefixes[]?' /tmp/tags.json|grep -E '^[0-9]+(\.[0-9]+){3}/[0-9]+$'|sort -u); count="${#cidrs[@]}"; [[ "$count" -gt 0 ]] || { echo 'ACA_IPRULE_DIAG=FAIL no_ranges'; exit 14; }; for c in "${cidrs[@]}"; do mask "$c"; done
          rules="$(printf '%s\n' "${cidrs[@]}"|jq -Rsc 'split("\n")|map(select(length>0))|to_entries|map({name:("afd-backend-"+((.key+1)|tostring)),description:"AzureFrontDoor.Backend service tag",ipAddressRange:.value,action:"Allow"})')"; ingress="$(jq --argjson r "$rules" '.ipSecurityRestrictions=$r' <<<"$BACKUP")"; patch="$(jq -nc --argjson i "$ingress" '{properties:{configuration:{ingress:$i}}}')"
          token="$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)"; echo "::add-mask::$token"
          code="$(curl -sS -o /tmp/patch-response.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data "$patch" "https://management.azure.com${APP_ID}?api-version=${API}")"
          if [[ "$code" =~ ^2 ]]; then
            CHANGED=1
            echo "ACA_IPRULE_PATCH=ACCEPTED http=${code} rule_count=${count}"
            exit 0
          fi
          err_code="$(jq -r '.error.code // "unknown"' /tmp/patch-response.json 2>/dev/null||echo unknown)"
          msg="$(jq -r '.error.message // ""' /tmp/patch-response.json 2>/dev/null||true)"
          class=unknown
          grep -qi 'maximum\|max.*rule\|limit' <<<"$msg" && class=limit
          grep -qi 'description' <<<"$msg" && class=description
          grep -qi 'name' <<<"$msg" && class=name
          grep -qi 'ipSecurityRestrictions\|IP Security' <<<"$msg" && class=ip_restrictions
          grep -qi 'invalid\|validation' <<<"$msg" && [[ "$class" == unknown ]] && class=validation
          echo "ACA_IPRULE_PATCH=REJECTED http=${code} error_code=${err_code} class=${class} rule_count=${count}"
          safe_hint="$(printf '%s' "$msg" | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+/[CIDR]/g; s#[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}#[ID]#g; s#/subscriptions/[^ /]+#/subscriptions/[REDACTED]#g; s#/resourceGroups/[^ /]+#/resourceGroups/[REDACTED]#g; s#/providers/[^ ]+#/providers/[REDACTED]#g' | cut -c1-400)"
          [[ -n "$safe_hint" ]] && echo "ACA_IPRULE_ERROR_HINT=${safe_hint}"
          exit 20
