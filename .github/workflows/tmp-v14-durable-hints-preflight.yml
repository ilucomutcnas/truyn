name: tmp-v14-durable-hints-preflight

on:
  push:
    branches: [fix/d100-v14-durable-expired-hints]
    paths:
      - '.github/workflows/tmp-v14-durable-hints-preflight.yml'

permissions:
  contents: read
  issues: write

env:
  TESTED_COMMIT: d08c8d122ee938e23c4251e11f23394a027d2aaa

jobs:
  validate-v14-durable-hints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Start marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues -f title='TRUYN D100 V14 DURABLE HINTS PREFLIGHT STARTED' -f body="run=${GITHUB_RUN_ID} workflow_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT}" >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: d08c8d122ee938e23c4251e11f23394a027d2aaa
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full immutable validation
        env:
          TRUYN_LOCAL_DEVELOPMENT: '1'
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          node --test tests/peer-record-expired-recovery-hints.test.js tests/peer-record-renewal-productionization.test.js tests/class-d-v13-harness.test.js tests/class-d-canonical-pin-regression.test.js
          TRUYN_CLASS_D100_PREPARE_ONLY=1 bash scripts/class-d-100-v13-acceptance.sh
          grep -q 'baselineRoutingSuccess: 0.99' benchmarks/scale/class-d.js
          grep -q 'healedRoutingSuccess: 0.99' benchmarks/scale/class-d.js
          grep -q 'recoveryP95Ms: 120_000' benchmarks/scale/class-d.js
          grep -q 'convergenceP95Ms: 120_000' benchmarks/scale/class-d.js
          git diff --check
      - name: Result marker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues -f title="TRUYN D100 V14 DURABLE HINTS PREFLIGHT ${JOB_STATUS^^}" -f body="run=${GITHUB_RUN_ID} tested_sha=${TESTED_COMMIT} status=${JOB_STATUS}" >/dev/null
