name: Durable Provider Identities Implementation

on:
  push:
    branches:
      - durable-provider-identities
    paths:
      - .github/workflows/durable-provider-identities-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: durable-provider-identities
      - name: Apply workflow patch
        run: python3 .github/scripts/apply-durable-provider-identities.py
      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GCP_IDENTITY_SECRET: truyn-gemini-identity-b64' .github/workflows/cloud-poc-gcp-runtime.yml
          grep -q 'TRUYN_IDENTITY_B64=${GCP_IDENTITY_SECRET}:${GCP_IDENTITY_SECRET_VERSION}' .github/workflows/cloud-poc-gcp-runtime.yml
          grep -q 'AZURE_PROVIDER_IDENTITY_SECRET: truyn-provider-identity-b64' .github/workflows/cloud-poc-azure-runtime.yml
          grep -q 'TRUYN_IDENTITY_B64=secretref:$AZURE_PROVIDER_IDENTITY_SECRET' .github/workflows/cloud-poc-azure-runtime.yml
          git diff --check
      - name: Commit clean workflow changes
        shell: bash
        run: |
          rm -f .github/scripts/apply-durable-provider-identities.py
          rm -f .github/workflows/durable-provider-identities-implementation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Persist provider identities across cloud revisions'
          git push origin HEAD:durable-provider-identities
