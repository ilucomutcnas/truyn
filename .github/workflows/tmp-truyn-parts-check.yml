name: tmp-truyn-parts-check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-truyn-parts-check.yml'

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact p00 subpart digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          names=(p00a p00b p00c p00d)
          expected=(
            a6a07558d63cef696148d4252ef9953931038c97ffda0f906ff79051885b8b3c
            7c92529baf19fc52367e3d699aab7001a66c8288810c1b5eff4cb6739dd0e71d
            1561a00fa24979a2081e0d08e8014ccccf53a9441a54db843ff7081bfd1ac4f8
            b4ff773e5e81bd22078aca286d44c13097d85c479cbaead1ccfbfc17ed5729bf
          )
          failed=0
          for i in 0 1 2 3; do
            f="_tmp_parts/${names[$i]}"
            got="$(sha256sum "$f" | awk '{print $1}')"
            if [[ "$got" == "${expected[$i]}" ]]; then state=success; else state=failure; failed=1; fi
            gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context="truyn-subpart/${names[$i]}" >/dev/null
          done
          exit "$failed"
