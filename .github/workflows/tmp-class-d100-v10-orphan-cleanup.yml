name: tmp-class-d100-v10-orphan-cleanup

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  cleanup-v10-orphan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RG: truyn
      PREFIX: truyn-d100-32292069755
    steps:
      - name: Start marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues -f title='TRUYN CLASS D-100 V10 ORPHAN CLEANUP STARTED' -f body="run=${GITHUB_RUN_ID} prefix=${PREFIX} rg=${RG}" >/dev/null

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete V10 orphan resources and prove zero remaining
        id: cleanup
        run: |
          set -Eeuo pipefail
          echo "TRUYN_CLASS_D_100_RECOVERY_CLEANUP prefix=${PREFIX} rg=${RG} stage=inspect"
          az resource list -g "$RG" --query "[?starts_with(name, '${PREFIX}')].[name,type,id]" -o table || true

          for pass in 1 2 3 4 5 6 7 8; do
            mapfile -t ids < <(az resource list -g "$RG" --query "[?starts_with(name, '${PREFIX}')].id" -o tsv --only-show-errors)
            if [[ ${#ids[@]} -eq 0 ]]; then
              break
            fi
            echo "TRUYN_CLASS_D_100_RECOVERY_CLEANUP pass=${pass} found=${#ids[@]}"
            for id in "${ids[@]}"; do
              [[ -n "$id" ]] || continue
              az resource delete --ids "$id" --only-show-errors >/dev/null 2>&1 || true
            done
            sleep 10
          done

          left=$(az resource list -g "$RG" --query "[?starts_with(name, '${PREFIX}')].name" -o tsv --only-show-errors | sed '/^$/d' | wc -l | tr -d ' ')
          echo "remaining=$left" >> "$GITHUB_OUTPUT"
          if [[ "$left" != 0 ]]; then
            echo "TRUYN_CLASS_D_100_RECOVERY_CLEANUP confirmed=false remaining=${left} prefix=${PREFIX}"
            az resource list -g "$RG" --query "[?starts_with(name, '${PREFIX}')].[name,type,id]" -o table || true
            exit 1
          fi
          echo "TRUYN_CLASS_D_100_RECOVERY_CLEANUP confirmed=true remaining=0 prefix=${PREFIX}"

      - name: Terminal marker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.cleanup.outcome }}
          REMAINING: ${{ steps.cleanup.outputs.remaining }}
        run: |
          if [[ "$OUTCOME" == success && "${REMAINING:-missing}" == 0 ]]; then result=PASS; else result=FAIL; fi
          gh api repos/${GITHUB_REPOSITORY}/issues -f title="TRUYN CLASS D-100 V10 ORPHAN CLEANUP ${result}" -f body="run=${GITHUB_RUN_ID} prefix=${PREFIX} result=${result} cleanup_outcome=${OUTCOME:-missing} remaining=${REMAINING:-missing}" >/dev/null
          test "$result" = PASS
