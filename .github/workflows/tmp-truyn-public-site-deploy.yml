name: tmp-truyn-public-site-deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-truyn-public-site-deploy.yml'
      - '_tmp_public_site/**'

concurrency:
  group: tmp-truyn-public-site-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PUBLIC_HOST: truyn.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate static payload
        shell: bash
        run: |
          set -euo pipefail
          test -f _tmp_public_site/index.html
          test -f _tmp_public_site/assets/css/styles.css
          test -f _tmp_public_site/assets/js/app.js
          test -f _tmp_public_site/assets/js/translations.js
          grep -q 'href="/assets/css/styles.css"' _tmp_public_site/index.html
          grep -q 'src="/assets/js/translations.js"' _tmp_public_site/index.html
          grep -q 'src="/assets/js/app.js"' _tmp_public_site/index.html
          grep -q 'G-W5CDTZZ87W' _tmp_public_site/index.html
          grep -q 'GTM-WPGXWKGN' _tmp_public_site/index.html
          node --check _tmp_public_site/assets/js/translations.js
          node --check _tmp_public_site/assets/js/app.js
          echo 'STATIC_PAYLOAD_VALID=TRUE'

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover existing truyn.org edge and static origin
        shell: bash
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt >/dev/null

          declare -a domains=()
          while IFS=$'\t' read -r rg profile; do
            [[ -n "${rg:-}" && -n "${profile:-}" ]] || continue
            while IFS=$'\t' read -r name id; do
              [[ -n "${name:-}" && -n "${id:-}" ]] || continue
              domains+=("$rg|$profile|$name|$id")
            done < <(
              az afd custom-domain list \
                --resource-group "$rg" \
                --profile-name "$profile" \
                --query "[?hostName=='${PUBLIC_HOST}'].[name,id]" \
                --output tsv 2>/dev/null || true
            )
          done < <(
            az resource list \
              --resource-type Microsoft.Cdn/profiles \
              --query '[].[resourceGroup,name]' \
              --output tsv
          )

          test "${#domains[@]}" -eq 1
          IFS='|' read -r fd_rg fd_profile domain_name domain_id <<<"${domains[0]}"
          for value in "$fd_rg" "$fd_profile" "$domain_name" "$domain_id"; do echo "::add-mask::$value"; done

          test "$(az afd custom-domain show \
            --resource-group "$fd_rg" \
            --profile-name "$fd_profile" \
            --custom-domain-name "$domain_name" \
            --query provisioningState -o tsv)" = 'Succeeded'

          declare -a routes=()
          while IFS= read -r endpoint; do
            [[ -n "${endpoint:-}" ]] || continue
            routes_json="$(az afd route list \
              --resource-group "$fd_rg" \
              --profile-name "$fd_profile" \
              --endpoint-name "$endpoint" \
              --output json 2>/dev/null || printf '[]')"
            while IFS=$'\t' read -r route group_id state; do
              [[ -n "${route:-}" && -n "${group_id:-}" ]] || continue
              routes+=("$endpoint|$route|$group_id|$state")
            done < <(jq -r --arg did "$domain_id" '
              .[]
              | select(any(.customDomains[]?; ((.id // "") | ascii_downcase) == ($did | ascii_downcase)))
              | [.name,.originGroup.id,.enabledState]
              | @tsv
            ' <<<"$routes_json")
          done < <(az afd endpoint list \
            --resource-group "$fd_rg" \
            --profile-name "$fd_profile" \
            --query '[].name' -o tsv)

          test "${#routes[@]}" -eq 1
          IFS='|' read -r fd_endpoint fd_route origin_group_id route_state <<<"${routes[0]}"
          origin_group_name="${origin_group_id##*/}"
          for value in "$fd_endpoint" "$fd_route" "$origin_group_id" "$origin_group_name"; do echo "::add-mask::$value"; done
          test "$route_state" = 'Enabled'
          test "$(az afd endpoint show \
            --resource-group "$fd_rg" \
            --profile-name "$fd_profile" \
            --endpoint-name "$fd_endpoint" \
            --query enabledState -o tsv)" = 'Enabled'

          mapfile -t origins < <(az afd origin list \
            --resource-group "$fd_rg" \
            --profile-name "$fd_profile" \
            --origin-group-name "$origin_group_name" \
            --query "[?enabledState=='Enabled' && contains(hostName, '.web.core.windows.net')].hostName" \
            --output tsv)
          test "${#origins[@]}" -eq 1

          origin_host="${origins[0]}"
          storage_account="${origin_host%%.*}"
          echo "::add-mask::$origin_host"
          echo "::add-mask::$storage_account"

          mapfile -t storage_rgs < <(az storage account list \
            --query "[?name=='${storage_account}'].resourceGroup" \
            --output tsv)
          test "${#storage_rgs[@]}" -eq 1
          storage_rg="${storage_rgs[0]}"
          echo "::add-mask::$storage_rg"

          storage_key="$(az storage account keys list \
            --resource-group "$storage_rg" \
            --account-name "$storage_account" \
            --query '[0].value' -o tsv)"
          test -n "$storage_key"
          echo "::add-mask::$storage_key"

          test "$(az storage blob service-properties show \
            --account-name "$storage_account" \
            --account-key "$storage_key" \
            --query 'staticWebsite.enabled' -o tsv | tr '[:upper:]' '[:lower:]')" = 'true'
          test "$(az storage blob service-properties show \
            --account-name "$storage_account" \
            --account-key "$storage_key" \
            --query 'staticWebsite.indexDocument' -o tsv)" = 'index.html'

          declare -p fd_rg fd_profile fd_endpoint storage_account storage_key > /tmp/truyn-edge.env
          chmod 600 /tmp/truyn-edge.env
          echo 'EDGE_DISCOVERY=PASS'

      - name: Upload exact four-file static site to $web
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/truyn-edge.env
          echo "::add-mask::$storage_account"
          echo "::add-mask::$storage_key"

          upload() {
            az storage blob upload \
              --account-name "$storage_account" \
              --account-key "$storage_key" \
              --container-name '$web' \
              --name "$2" \
              --file "$1" \
              --content-type "$3" \
              --content-cache-control "$4" \
              --overwrite true \
              --only-show-errors \
              --output none
          }

          upload _tmp_public_site/index.html index.html 'text/html; charset=utf-8' 'no-cache, max-age=0, must-revalidate'
          upload _tmp_public_site/assets/css/styles.css assets/css/styles.css 'text/css; charset=utf-8' 'public, max-age=3600'
          upload _tmp_public_site/assets/js/app.js assets/js/app.js 'application/javascript; charset=utf-8' 'public, max-age=3600'
          upload _tmp_public_site/assets/js/translations.js assets/js/translations.js 'application/javascript; charset=utf-8' 'public, max-age=3600'

          for blob in index.html assets/css/styles.css assets/js/app.js assets/js/translations.js; do
            test "$(az storage blob exists \
              --account-name "$storage_account" \
              --account-key "$storage_key" \
              --container-name '$web' \
              --name "$blob" \
              --query exists -o tsv)" = 'true'
          done
          echo 'STATIC_UPLOAD=PASS files=4'

      - name: Purge Front Door paths
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/truyn-edge.env
          for value in "$fd_rg" "$fd_profile" "$fd_endpoint"; do echo "::add-mask::$value"; done
          az afd endpoint purge \
            --resource-group "$fd_rg" \
            --profile-name "$fd_profile" \
            --endpoint-name "$fd_endpoint" \
            --content-paths '/' '/index.html' '/assets/css/styles.css' '/assets/js/app.js' '/assets/js/translations.js' \
            --only-show-errors \
            --output none
          echo 'FRONT_DOOR_PURGE=PASS'

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in 1 2 3 4 5 6 7 8; do
            q="deploy=${GITHUB_RUN_ID}-${attempt}"
            if curl -fsSL --max-time 20 "https://${PUBLIC_HOST}/?${q}" -o /tmp/index.html \
              && curl -fsSL --max-time 20 "https://${PUBLIC_HOST}/assets/css/styles.css?${q}" -o /tmp/styles.css \
              && curl -fsSL --max-time 20 "https://${PUBLIC_HOST}/assets/js/app.js?${q}" -o /tmp/app.js \
              && curl -fsSL --max-time 20 "https://${PUBLIC_HOST}/assets/js/translations.js?${q}" -o /tmp/translations.js \
              && grep -q 'TRUYN — Open Intelligence Network' /tmp/index.html \
              && grep -q 'G-W5CDTZZ87W' /tmp/index.html \
              && grep -q 'GTM-WPGXWKGN' /tmp/index.html \
              && grep -q '.truyn-logo' /tmp/styles.css \
              && grep -q 'function applyLang' /tmp/app.js \
              && grep -q 'const T=' /tmp/translations.js; then
              ok=true
              break
            fi
            sleep 5
          done
          test "$ok" = true
          echo 'PRODUCTION_SMOKE=PASS'

  report:
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish non-sensitive deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESULT" == 'success' ]]; then
            state=success
            description='truyn.org production smoke passed'
          else
            state=failure
            description='truyn.org deployment failed'
          fi
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='truyn-public-site-deploy' \
            -f description="$description" >/dev/null

  cleanup:
    if: always()
    needs: [deploy, report]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Remove temporary public-repository payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf _tmp_public_site
          rm -f .github/workflows/tmp-truyn-public-site-deploy.yml
          git add -u -- _tmp_public_site .github/workflows/tmp-truyn-public-site-deploy.yml
          if git diff --cached --quiet; then
            echo 'TEMP_PAYLOAD_ALREADY_CLEAN=TRUE'
            exit 0
          fi
          git commit -m 'ci: remove temporary public-site deployment payload'
          git push origin HEAD:main
          echo 'TEMP_PAYLOAD_CLEANED=TRUE'
