name: Ephemeral Cohere Fast Canonical Query Diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-cohere-fast-canonical.yml']

permissions:
  contents: read
  id-token: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AZURE_RG: truyn
      COHERE_MODEL: Cohere-rerank-v4.0-fast
      COHERE_DEPLOYMENT: Cohere-rerank-v4.0-fast
      COHERE_CAPACITY: 500
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Load immutable Semantic v2 corpus source
        shell: bash
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/benchmarks/semantic-retrieval-v2.js?ref=${SEMANTIC_V2_SOURCE_SHA}" | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/semantic-retrieval-v2.js
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Create temporary Fast deployment at catalog default capacity
        shell: bash
        run: |
          set -euo pipefail
          found=""
          while IFS= read -r account; do
            deps="$(az cognitiveservices account deployment list -g "$AZURE_RG" -n "$account" -o json 2>/dev/null || echo '[]')"
            if jq -e '[.[].name] | any(. == "truyn-grok" or . == "truyn-deepseek" or . == "truyn-llama" or . == "truyn-mistral" or . == "truyn-kimi")' <<<"$deps" >/dev/null; then found="$account"; break; fi
          done < <(az cognitiveservices account list -g "$AZURE_RG" --query '[].name' -o tsv)
          [[ -n "$found" ]] || exit 2
          echo "::add-mask::$found"; echo "FOUNDRY_ACCOUNT=$found" >> "$GITHUB_ENV"
          if az cognitiveservices account deployment show -g "$AZURE_RG" -n "$found" --deployment-name "$COHERE_DEPLOYMENT" >/dev/null 2>&1; then az cognitiveservices account deployment delete -g "$AZURE_RG" -n "$found" --deployment-name "$COHERE_DEPLOYMENT" >/dev/null; sleep 3; fi
          az cognitiveservices account deployment create -g "$AZURE_RG" -n "$found" --deployment-name "$COHERE_DEPLOYMENT" --model-name "$COHERE_MODEL" --model-version 1 --model-format Cohere --sku-name GlobalStandard --sku-capacity "$COHERE_CAPACITY" >/dev/null
          touch /tmp/truyn-created-cohere-fast
          endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$found" --query properties.endpoint -o tsv)"; key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$found" --query key1 -o tsv)"
          host="$(echo "$endpoint" | sed -E 's#https?://([^./]+).*#\1#')"; rank_url="https://${host}.services.ai.azure.com/providers/cohere/v2/rerank"
          echo "::add-mask::$key"; echo "::add-mask::$rank_url"; echo "COHERE_RANK_URL=$rank_url" >> "$GITHUB_ENV"; echo "FOUNDRY_KEY=$key" >> "$GITHUB_ENV"
          sleep 25
      - name: Test canonical operational queries in both candidate orders
        shell: bash
        run: |
          cat > /tmp/cohere-fast-canonical.cjs <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const src=fs.readFileSync('/tmp/semantic-retrieval-v2.js','utf8'),a=src.indexOf('const domains = ['),b=src.indexOf('const fullContext =');
          if(a<0||b<0)throw new Error('corpus markers');
          const ctx={};vm.createContext(ctx);vm.runInContext('const corpusSize=600,retrievalCaseCount=360;'+src.slice(a,b)+';globalThis.__data={records,retrievalCases};',ctx);
          const {records}=ctx.__data;
          const specs=[
            {caseIndex:5,expectedId:'semantic-record-185',wrongId:'semantic-record-305',canonicalQuery:'Domain: ship route control. Required operational action: operators must confirm permission validity. Condition: utilization has crossed the protective limit and saturation controls are engaged.'},
            {caseIndex:241,expectedId:'semantic-record-517',wrongId:'semantic-record-437',canonicalQuery:'Domain: greenhouse gas record management. Required operational action: recover the malfunctioning system. Condition: the main facility is offline at the remote continuity center.'},
            {caseIndex:269,expectedId:'semantic-record-353',wrongId:'semantic-record-553',canonicalQuery:'Domain: store stock control. Required operational action: preserve audit proof. Condition: outward-facing launch after users can already see it.'}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function rank(query,documents){let last;for(let attempt=1;attempt<=5;attempt++){const started=Date.now();const r=await fetch(process.env.COHERE_RANK_URL,{method:'POST',headers:{'content-type':'application/json','api-key':process.env.FOUNDRY_KEY},body:JSON.stringify({model:process.env.COHERE_DEPLOYMENT,query,documents,top_n:documents.length})});const text=await r.text();if(r.ok)return {body:JSON.parse(text),status:r.status,latencyMs:Date.now()-started,attempts:attempt};last={status:r.status,body:text.slice(0,300)};if(r.status!==429)break;await sleep(Math.min(10000,attempt*2000));}throw new Error('Cohere rerank failed: '+JSON.stringify(last));}
          (async()=>{const rows=[];for(const spec of specs){const expected=records.find(r=>r.id===spec.expectedId),wrong=records.find(r=>r.id===spec.wrongId);for(const order of ['wrong-target','target-wrong']){const docs=order==='wrong-target'?[wrong.text,expected.text]:[expected.text,wrong.text];const expectedIndex=order==='wrong-target'?1:0;const out=await rank(spec.canonicalQuery,docs);const ranked=(out.body.results||[]).map(x=>({index:x.index,relevanceScore:x.relevance_score??x.relevanceScore??null}));rows.push({caseIndex:spec.caseIndex,canonicalQuery:spec.canonicalQuery,expectedId:spec.expectedId,previousWrongId:spec.wrongId,order,expectedIndex,selectedIndex:ranked[0]?.index,selectedExpected:ranked[0]?.index===expectedIndex,ranked,httpStatus:out.status,latencyMs:out.latencyMs,attempts:out.attempts});await sleep(1200);}}const report={benchmark:'TRUYN Semantic v2 Cohere-rerank-v4.0-fast canonical-query order-invariance diagnostic',generatedAt:new Date().toISOString(),sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,model:process.env.COHERE_MODEL,deploymentCapacity:Number(process.env.COHERE_CAPACITY),cases:rows,correct:rows.filter(r=>r.selectedExpected).length,total:rows.length,passed:rows.every(r=>r.selectedExpected)};fs.writeFileSync('cohere-fast-canonical.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(!report.passed)process.exitCode=2;})().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          node /tmp/cohere-fast-canonical.cjs
      - name: Upload diagnostic evidence
        if: ${{ always() && hashFiles('cohere-fast-canonical.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-cohere-fast-canonical-${{ github.run_id }}
          path: cohere-fast-canonical.json
          retention-days: 30
      - name: Delete temporary Fast deployment
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f /tmp/truyn-created-cohere-fast && -n "${FOUNDRY_ACCOUNT:-}" ]]; then az cognitiveservices account deployment delete -g "$AZURE_RG" -n "$FOUNDRY_ACCOUNT" --deployment-name "$COHERE_DEPLOYMENT" >/dev/null 2>&1 || true; fi
