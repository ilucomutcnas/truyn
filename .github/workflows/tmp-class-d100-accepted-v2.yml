name: Temporary TRUYN Class D-100 accepted gate v2

on:
  push:
    paths:
      - '.github/workflows/tmp-class-d100-accepted-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: truyn-class-d100-accepted
  cancel-in-progress: false

jobs:
  accepted-d100:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TESTED_COMMIT: 874941860803fd74d40f836669458958cd95ea06
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish immutable run start marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cat >/tmp/start.md <<EOF
          Accepted Class D-100 execution has started.

          - run_id: \`$GITHUB_RUN_ID\`
          - workflow_head: \`$GITHUB_SHA\`
          - pinned_tested_commit: \`$TESTED_COMMIT\`
          - acceptance contract: 100 real processes / 100 identities / 100 QUIC endpoints / >=4 hosts / baseline+healed >=0.99 / recovery+convergence p95 <=120000ms / zero safety violations / churn+partition+Byzantine+Sybil+eclipse+collusion / cleanup confirmed with zero remaining resources.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TRUYN CLASS D-100 ACCEPTED V2 STARTED ${GITHUB_RUN_ID}" --body-file /tmp/start.md

      - name: Immutable security and acceptance preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin "$TESTED_COMMIT"
          rm -rf /tmp/truyn-d100-tested
          git worktree add --detach /tmp/truin-d100-tested "$TESTED_COMMIT"
          cd /tmp/truin-d100-tested
          bash scripts/assert-security-clean-tested-commit.sh HEAD
          npm install --ignore-scripts --no-audit --no-fund
          TRUYN_LOCAL_DEVELOPMENT=1 npm test
          git diff --check
          bash -n scripts/class-d-100-final-acceptance.sh
          bash -n benchmarks/scale/class-d-azure-100-provision.sh
          bash -n benchmarks/scale/class-d-azure-100-campaign.sh
          node --check benchmarks/scale/evaluate-class-d-evidence.js

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute accepted 4-host 100-node campaign
        id: campaign
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          cd /tmp/truin-d100-tested
          export GITHUB_SHA="$TESTED_COMMIT"
          export TRUYN_CLASS_D100_EVIDENCE="$GITHUB_WORKSPACE/class-d-100-evidence.json"
          export TRUYN_CLASS_D100_LOG="$GITHUB_WORKSPACE/class-d-100-accepted.log"
          export TRUYN_CLASS_D100_SUMMARY="$GITHUB_WORKSPACE/class-d-100-summary.json"
          bash scripts/class-d-100-final-acceptance.sh 2>&1 | tee "$GITHUB_WORKSPACE/class-d-100-runner.log"

      - name: Post-cleanup canonical evaluation
        if: always()
        id: evaluate
        shell: bash
        run: |
          set -u
          EVIDENCE="$GITHUB_WORKSPACE/class-d-100-evidence.json"
          EVAL="$GITHUB_WORKSPACE/class-d-100-evaluation.json"
          REPORT="$GITHUB_WORKSPACE/class-d-100-report.md"
          rc=99
          if [[ -f "$EVIDENCE" ]]; then
            set +e
            node /tmp/truin-d100-tested/benchmarks/scale/evaluate-class-d-evidence.js "$EVIDENCE" >"$EVAL" 2>"$GITHUB_WORKSPACE/class-d-100-evaluator.stderr"
            rc=$?
            node /tmp/truin-d100-tested/benchmarks/scale/render-class-d-100-report.js "$EVIDENCE" "$REPORT" >"$GITHUB_WORKSPACE/class-d-100-render.stdout" 2>"$GITHUB_WORKSPACE/class-d-100-render.stderr"
            render_rc=$?
            set -e
          else
            printf '%s\n' '{"ok":false,"error":"class_d_evidence_missing"}' >"$EVAL"
            render_rc=99
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "render_rc=$render_rc" >> "$GITHUB_OUTPUT"
          printf 'campaign_outcome=%s\nevaluator_rc=%s\nrender_rc=%s\n' '${{ steps.campaign.outcome }}' "$rc" "$render_rc" >"$GITHUB_WORKSPACE/class-d-100-terminal.txt"
          exit 0

      - name: Build terminal evidence summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE' > "$GITHUB_WORKSPACE/class-d-100-terminal-summary.md"
          const fs = require('fs');
          const p = process.env.GITHUB_WORKSPACE + '/class-d-100-evaluation.json';
          let e = {ok:false,error:'evaluation_missing'};
          try { e = JSON.parse(fs.readFileSync(p,'utf8')); } catch {}
          const n=e.normalized||{}, m=n.metrics||{}, b=n.baseline||{}, h=n.healed||{}, s=n.safety||{}, f=n.faults||{}, c=n.cleanup||{};
          const yn = v => v === true ? 'PASS' : 'FAIL';
          console.log(`Canonical evaluator passed: **${e.passed === true ? 'PASS' : 'FAIL'}**`);
          if (Array.isArray(e.failed) && e.failed.length) console.log(`Failed checks: \`${e.failed.join(', ')}\``);
          console.log('');
          console.log(`- realNodeCount: **${m.realNodeCount ?? 'missing'}**`);
          console.log(`- distinctIdentityCount: **${m.distinctIdentityCount ?? 'missing'}**`);
          console.log(`- distinctQuicSocketCount: **${m.distinctQuicSocketCount ?? 'missing'}**`);
          console.log(`- hostCount: **${m.hostCount ?? 'missing'}**`);
          console.log(`- baseline.routingSuccessRate: **${b.routingSuccessRate ?? 'missing'}**`);
          console.log(`- healed.routingSuccessRate: **${h.routingSuccessRate ?? 'missing'}**`);
          console.log(`- healed.recoveryP95Ms: **${h.recoveryP95Ms ?? 'missing'}**`);
          console.log(`- healed.convergenceP95Ms: **${h.convergenceP95Ms ?? 'missing'}**`);
          console.log(`- acknowledgedWriteLossCount: **${b.acknowledgedWriteLossCount ?? 'missing'}**`);
          console.log(`- invalidSignedStateAcceptedCount: **${s.invalidSignedStateAcceptedCount ?? 'missing'}**`);
          console.log(`- staleRevokedReceiptAcceptedCount: **${s.staleRevokedReceiptAcceptedCount ?? 'missing'}**`);
          for (const k of ['churn','packetPartition','byzantine','sybil','eclipse','collusion']) console.log(`- ${k}: **${yn(f[k]?.exercised ?? f[k])}**`);
          console.log(`- cleanup.confirmed: **${c.confirmed === true ? 'true' : String(c.confirmed ?? 'missing')}**`);
          console.log(`- cleanup.remainingResources: **${c.remainingResources ?? 'missing'}**`);
          NODE

      - name: Upload immutable D-100 evidence bundle
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: truyn-class-d100-accepted-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            class-d-100-evidence.json
            class-d-100-accepted.log
            class-d-100-runner.log
            class-d-100-summary.json
            class-d-100-evaluation.json
            class-d-100-evaluator.stderr
            class-d-100-report.md
            class-d-100-render.stdout
            class-d-100-render.stderr
            class-d-100-terminal.txt
            class-d-100-terminal-summary.md

      - name: Publish terminal marker
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          status=FAIL
          if [[ '${{ steps.campaign.outcome }}' == 'success' && '${{ steps.evaluate.outputs.rc }}' == '0' ]]; then status=PASS; fi
          {
            echo "run_id=\`$GITHUB_RUN_ID\`"
            echo "pinned_tested_commit=\`$TESTED_COMMIT\`"
            echo "campaign_outcome=\`${{ steps.campaign.outcome }}\`"
            echo "post_cleanup_evaluator_rc=\`${{ steps.evaluate.outputs.rc }}\`"
            echo "artifact_id=\`${{ steps.artifact.outputs.artifact-id }}\`"
            echo "artifact_digest=\`${{ steps.artifact.outputs.artifact-digest }}\`"
            echo
            cat "$GITHUB_WORKSPACE/class-d-100-terminal-summary.md" 2>/dev/null || true
          } >/tmp/terminal.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TRUYN CLASS D-100 ACCEPTED V2 ${status} ${GITHUB_RUN_ID}" --body-file /tmp/terminal.md

      - name: Enforce terminal accepted gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ steps.campaign.outcome }}' == 'success' ]]
          [[ '${{ steps.evaluate.outputs.rc }}' == '0' ]]
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE+'/class-d-100-evaluation.json','utf8'));
          if (e.passed !== true) process.exit(1);
          const n=e.normalized||{},m=n.metrics||{},b=n.baseline||{},h=n.healed||{},s=n.safety||{},f=n.faults||{},c=n.cleanup||{};
          const faults=['churn','packetPartition','byzantine','sybil','eclipse','collusion'];
          if (m.realNodeCount!==100 || m.distinctIdentityCount!==100 || m.distinctQuicSocketCount!==100 || m.hostCount<4) process.exit(1);
          if (b.routingSuccessRate<0.99 || h.routingSuccessRate<0.99 || h.recoveryP95Ms>120000 || h.convergenceP95Ms>120000) process.exit(1);
          if (b.acknowledgedWriteLossCount!==0 || s.invalidSignedStateAcceptedCount!==0 || s.staleRevokedReceiptAcceptedCount!==0) process.exit(1);
          if (!faults.every(k => f[k]?.exercised === true || f[k] === true)) process.exit(1);
          if (c.confirmed!==true || c.remainingResources!==0) process.exit(1);
          NODE
