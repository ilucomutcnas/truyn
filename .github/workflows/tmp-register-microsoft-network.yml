name: Temporary Register Microsoft.Network

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-register-microsoft-network.yml']

permissions:
  contents: read
  id-token: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Register provider and verify Service Tags REST
        shell: bash
        run: |
          set -euo pipefail
          before="$(az provider show --namespace Microsoft.Network --query registrationState -o tsv 2>/dev/null || true)"
          [[ -n "$before" ]] || before=unknown
          echo "MICROSOFT_NETWORK_BEFORE=${before}"

          if [[ "$before" != 'Registered' ]]; then
            set +e
            az provider register --namespace Microsoft.Network >/tmp/register.out 2>/tmp/register.err
            rc=$?
            set -e
            if [[ "$rc" != 0 ]]; then
              kind=other
              grep -Eqi 'AuthorizationFailed|does not have authorization|permission' /tmp/register.err /tmp/register.out && kind=permission
              echo "MICROSOFT_NETWORK_REGISTER=UNAVAILABLE kind=${kind}"
              echo 'SERVICE_TAG_SOURCE_FALLBACK=official_weekly_json'
              exit 0
            fi
          fi

          registered=0; state="$before"
          for _ in $(seq 1 120); do
            state="$(az provider show --namespace Microsoft.Network --query registrationState -o tsv 2>/dev/null || true)"
            [[ "$state" == 'Registered' ]] && { registered=1; break; }
            sleep 5
          done
          if [[ "$registered" != 1 ]]; then
            echo "MICROSOFT_NETWORK_REGISTER=TIMEOUT state=${state}"
            echo 'SERVICE_TAG_SOURCE_FALLBACK=official_weekly_json'
            exit 0
          fi

          echo 'MICROSOFT_NETWORK_REGISTER=PASS state=Registered'
          url="https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID_VALUE}/providers/Microsoft.Network/locations/eastus2/serviceTags?api-version=2025-05-01"
          response="$(az rest --method get --url "$url" -o json)"
          mapfile -t ipv4 < <(jq -r '.values[]? | select(.name=="AzureFrontDoor.Backend") | .properties.addressPrefixes[]?' <<<"$response" | grep -E '^[0-9]+(\.[0-9]+){3}/[0-9]+$' | sort -u)
          count="${#ipv4[@]}"
          [[ "$count" -gt 0 && "$count" -le 300 ]] || { echo "SERVICE_TAG_REST=FAIL afd_ipv4_count=${count}"; exit 20; }
          for cidr in "${ipv4[@]}"; do echo "::add-mask::$cidr"; done
          change="$(jq -r '.changeNumber // "unknown"' <<<"$response")"
          echo "SERVICE_TAG_REST=PASS afd_ipv4_count=${count} change_number=${change}"
