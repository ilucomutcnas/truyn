name: tmp-class-d100-v16-accepted-e15e4609

on:
  push:
    branches: ['ci/d100-v16-accepted-e15e4609']
    paths:
      - '.github/workflows/tmp-class-d100-v16-accepted-e15e4609.yml'

permissions:
  contents: read
  actions: read
  id-token: write
  issues: write

env:
  TESTED_COMMIT: e15e46093a050753b5f00dea5989216b8c29c4c7
  SECURITY_GREEN_RUN: '32516193579'

jobs:
  accepted-d100-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Record accepted run start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="run=${GITHUB_RUN_ID} workflow_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} security_green_run=${SECURITY_GREEN_RUN} stage=accepted_d100_v16_started"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-100 V16 ACCEPTED RUN STARTED' -f "body=${body}" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: e15e46093a050753b5f00dea5989216b8c29c4c7
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact source and security-green prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.head_sha')" = "$TESTED_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.name')" = 'CI'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.event')" = 'push'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.status')" = 'completed'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.conclusion')" = 'success'
          extras="$(find .github/workflows -maxdepth 1 -type f ! -name ci.yml ! -name .gitkeep -printf '%f\n' | sort)"
          test -z "$extras"
          npm install --ignore-scripts --no-audit --no-fund
          TRUYN_CLASS_D100_PREPARE_ONLY=1 bash scripts/class-d-100-final-acceptance.sh | tee class-d-100-v16-prerun.txt
          echo "TRUYN_CLASS_D_100_V16_PINNED_SOURCE=PASS testedCommit=${TESTED_COMMIT}"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute real 4-host 100-node accepted campaign
        id: campaign
        continue-on-error: true
        env:
          TRUYN_TESTED_COMMIT: e15e46093a050753b5f00dea5989216b8c29c4c7
          TRUYN_AZURE_RESOURCE_GROUP: truyn
        shell: bash
        run: |
          set -o pipefail
          bash scripts/class-d-100-final-acceptance.sh 2>&1 | tee class-d-100-run.log

      - name: Canonical post-cleanup evaluation and strict terminal verification
        id: terminal
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f class-d-100-evidence.json ]]; then
            node benchmarks/scale/evaluate-class-d-evidence.js class-d-100-evidence.json >class-d-100-evaluation.json 2>class-d-100-evaluation.stderr
            evaluator_rc=$?
            node benchmarks/scale/verify-class-d-terminal.js class-d-100-evidence.json >class-d-100-terminal.json 2>class-d-100-terminal.stderr
            terminal_rc=$?
          else
            evaluator_rc=99
            terminal_rc=99
            printf '%s\n' '{"ok":false,"error":"class_d_evidence_missing"}' >class-d-100-evaluation.json
            printf '%s\n' '{"ok":false,"error":"class_d_terminal_evidence_missing"}' >class-d-100-terminal.json
          fi
          campaign_outcome='${{ steps.campaign.outcome }}'
          printf 'campaign_outcome=%s\nevaluator_rc=%s\nterminal_rc=%s\ntested_commit=%s\nrun_id=%s\nsecurity_green_run=%s\n' "$campaign_outcome" "$evaluator_rc" "$terminal_rc" "$TESTED_COMMIT" "$GITHUB_RUN_ID" "$SECURITY_GREEN_RUN" >class-d-100-v16-summary.txt
          echo "evaluator_rc=$evaluator_rc" >>"$GITHUB_OUTPUT"
          echo "terminal_rc=$terminal_rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-class-d100-v16-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            class-d-100-v16-prerun.txt
            class-d-100-run.log
            class-d-100-evidence.json
            class-d-100-evaluation.json
            class-d-100-evaluation.stderr
            class-d-100-terminal.json
            class-d-100-terminal.stderr
            class-d-100-v16-summary.txt

      - name: Record terminal marker
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL_RC: ${{ steps.terminal.outputs.terminal_rc }}
          EVALUATOR_RC: ${{ steps.terminal.outputs.evaluator_rc }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        shell: bash
        run: |
          if [[ "$CAMPAIGN_OUTCOME" == success && "$TERMINAL_RC" == 0 && "$EVALUATOR_RC" == 0 ]]; then result=PASS; else result=FAIL; fi
          body="run=${GITHUB_RUN_ID} workflow_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} result=${result} campaign_outcome=${CAMPAIGN_OUTCOME:-missing} evaluator_rc=${EVALUATOR_RC:-missing} terminal_rc=${TERMINAL_RC:-missing} artifact_name=truyn-class-d100-v16-${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f "title=TRUYN CLASS D-100 V16 ACCEPTED ${result}" -f "body=${body}" >/dev/null

      - name: Strict accepted gate
        if: always()
        env:
          TERMINAL_RC: ${{ steps.terminal.outputs.terminal_rc }}
          EVALUATOR_RC: ${{ steps.terminal.outputs.evaluator_rc }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$CAMPAIGN_OUTCOME" = success
          test "$EVALUATOR_RC" = 0
          test "$TERMINAL_RC" = 0
          node benchmarks/scale/verify-class-d-terminal.js class-d-100-evidence.json
