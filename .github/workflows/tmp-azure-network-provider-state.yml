name: Temporary Azure Network Provider State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-azure-network-provider-state.yml'

permissions:
  contents: read
  id-token: write

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Read provider states
        shell: bash
        run: |
          set -euo pipefail
          for ns in Microsoft.Compute Microsoft.ComputeLimit Microsoft.ComputeSchedule Microsoft.Network Microsoft.ContainerInstance; do
            state="$(az provider show --namespace "$ns" --query registrationState -o tsv 2>/dev/null || echo Unavailable)"
            echo "TRUYN_AZURE_PROVIDER namespace=$ns state=$state"
          done
