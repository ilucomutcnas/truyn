name: Temporary D-100 immutable preflight diagnostic

on:
  push:
    paths:
      - '.github/workflows/tmp-d100-preflight-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: truyn-d100-preflight-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TESTED_COMMIT: 2cd3668a1fde5a6d536b0fa33be4773ee4b58ff9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce immutable preflight and publish exact blocker
        shell: bash
        run: |
          set -u
          git fetch origin "$TESTED_COMMIT"
          rm -rf /tmp/truyn-d100-tested
          git worktree add --detach /tmp/truyn-d100-tested "$TESTED_COMMIT"
          cd /tmp/truyn-d100-tested

          first_stage=""
          first_code=0
          first_log=""

          run_stage() {
            local name="$1"; shift
            local logfile="/tmp/d100-${name}.log"
            set +e
            "$@" >"$logfile" 2>&1
            local rc=$?
            set -e
            printf '%s=%s\n' "$name" "$rc"
            if [[ $rc -ne 0 && -z "$first_stage" ]]; then
              first_stage="$name"
              first_code=$rc
              first_log="$logfile"
            fi
          }

          set -e
          run_stage security node scripts/check-security-green.js
          run_stage npm-test npm test
          run_stage wrapper-syntax bash -n scripts/class-d-100-final-acceptance.sh
          run_stage provision-syntax bash -n benchmarks/scale/class-d-azure-100-provision.sh
          run_stage campaign-syntax bash -n benchmarks/scale/class-d-azure-100-campaign.sh
          run_stage evaluator-syntax node --check benchmarks/scale/evaluate-class-d-evidence.js

          {
            echo "Pinned immutable source: \`$TESTED_COMMIT\`"
            echo
            if [[ -z "$first_stage" ]]; then
              echo "Result: **PASS** — exact accepted preflight reproduced successfully."
            else
              echo "Result: **FAIL**"
              echo "First failing stage: **$first_stage**"
              echo "Exit code: **$first_code**"
              echo
              echo '```text'
              grep -E -i 'not ok|AssertionError|ERR_ASSERTION|FAIL|error|actual|expected' "$first_log" | tail -n 80 || true
              echo '--- tail ---'
              tail -n 100 "$first_log" || true
              echo '```'
            fi
          } >/tmp/d100-preflight-diagnostic.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "TRUYN D100 PREFLIGHT DIAGNOSTIC ${GITHUB_RUN_ID}" \
            --body-file /tmp/d100-preflight-diagnostic.md

          [[ -z "$first_stage" ]]
        env:
          GH_TOKEN: ${{ github.token }}
