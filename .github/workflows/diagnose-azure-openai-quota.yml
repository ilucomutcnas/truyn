name: Diagnose Azure OpenAI quota

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-azure-openai-quota.yml'

permissions:
  contents: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      AZURE_RG: truyn
      AZURE_LOCATION: eastus
      AZURE_OPENAI_NAME: truyn-openai-1334540181
      AZURE_OPENAI_DEPLOYMENT: truyn-gpt-4-1-mini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Print deployment and relevant quota
        run: |
          set -euo pipefail
          echo '=== DEPLOYMENT ==='
          az cognitiveservices account deployment show \
            -g "$AZURE_RG" -n "$AZURE_OPENAI_NAME" \
            --deployment-name "$AZURE_OPENAI_DEPLOYMENT" \
            --query '{deployment:name,model:properties.model.name,version:properties.model.version,sku:sku.name,capacity:sku.capacity,state:properties.provisioningState}' -o json
          echo '=== QUOTA MATCHES ==='
          az cognitiveservices usage list -l "$AZURE_LOCATION" -o json | jq '[.[] | {name:.name.value,localizedName:.name.localizedValue,currentValue,limit,unit} | select(((.name // "") + " " + (.localizedName // "")) | test("gpt|openai|standard";"i"))]'
      - name: Remove one-shot diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-azure-openai-quota.yml
          git commit -m 'Remove Azure quota diagnostic'
          git push origin HEAD:main
