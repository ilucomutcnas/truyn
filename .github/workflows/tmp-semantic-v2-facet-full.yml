name: Ephemeral Semantic v2 Full Facet Ranking

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-facet-full.yml']

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-facet-full-${{ github.run_id }}
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Load immutable benchmark and proxy sources
        shell: bash
        run: |
          set -euo pipefail
          load_file(){ mkdir -p "$(dirname "$1")"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1?ref=$2" | jq -r '.content' | tr -d '\n' | base64 -d > "$1"; }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with: { project_id: '${{ env.GCP_PROJECT_ID_VALUE }}' }
      - name: Prepare isolated runtime-identity Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"; registry="${GCP_PROXY_REGION}-docker.pkg.dev"; image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-facet-full:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet; docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null; docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"; for a in $(seq 1 30); do curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok==true' >/dev/null && break; [[ "$a" -lt 30 ]] || exit 1; sleep 2; done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"; echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"; echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"
      - name: Evaluate 360-case evidence-backed facet ranking
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'); const s=fs.readFileSync('benchmarks/semantic-retrieval-v2.js','utf8'); const a=s.indexOf('const domains = ['); const b=s.indexOf('const fullContext ='); if(a<0||b<0) throw new Error('immutable corpus markers not found'); const corpus=s.slice(a,b);
          fs.writeFileSync('semantic-v2-facet-full.mjs', `
          import { writeFile } from 'node:fs/promises';
          import { createVertexGeminiProvider } from './adapters/providers/vertex-gemini.js';
          import { createVertexEmbeddingClient } from './adapters/providers/vertex-embedding.js';
          const corpusSize=600,retrievalCaseCount=360; ${corpus}
          const provider=createVertexGeminiProvider({projectId:process.env.GCP_PROJECT_ID,location:'global',model:'gemini-2.5-flash',endpoint:process.env.VERTEX_API_ENDPOINT,accessTokenProvider:async()=>process.env.GCP_ACCESS_TOKEN,capabilities:['reasoning.general'],requestTimeoutMs:120000});
          const embedder=createVertexEmbeddingClient({projectId:process.env.GCP_PROJECT_ID,location:'us-central1',model:'gemini-embedding-001',endpoint:process.env.VERTEX_API_ENDPOINT,accessTokenProvider:async()=>process.env.GCP_ACCESS_TOKEN,batchSize:1,outputDimensionality:768,maxRetries:8});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function mapLimit(items,limit,fn){const out=new Array(items.length);let next=0;async function worker(){for(;;){const i=next++;if(i>=items.length)return;out[i]=await fn(items[i],i);}}await Promise.all(Array.from({length:Math.min(limit,items.length)},worker));return out;}
          const norm=v=>Math.sqrt(v.reduce((s,x)=>s+x*x,0)); const cosine=(x,y)=>{let d=0;for(let i=0;i<Math.min(x.length,y.length);i++)d+=x[i]*y[i];const z=norm(x)*norm(y);return z>0?d/z:0;}; const mean=x=>x.reduce((a,b)=>a+b,0)/x.length;
          process.stderr.write('facet-full indexing 600 blocks\\n');
          const docVectors=(await mapLimit(blocks,8,async b=>(await embedder.embedMany([b.text],{taskType:'RETRIEVAL_DOCUMENT'}))[0]));
          const task=['Extract the three real-world semantic constraints required to retrieve the correct authoritative passage.','Return DOMAIN, OPERATIONAL_ACTION, OPERATIONAL_ACTION_EVIDENCE, and CONDITION.','DOMAIN is the real-world subject/process/resource.','OPERATIONAL_ACTION is what an operator, team, service, or system must actually do in the described world. It can appear grammatically inside a when/if clause; that does not make it a condition.','OPERATIONAL_ACTION_EVIDENCE must copy a short exact span from the ORIGINAL query, in its original language, that expresses that real-world action.','Evidence such as which rule, rule token, governing token, applies, identify, choose, find, return, or translations/equivalents of those meta retrieval acts is forbidden.','If the query contains wording equivalent to operators must X, team must X, team needs to X, X is required, gerektiğinde X, or similar, X is the operational action and its source phrase is the evidence.','CONDITION is everything material about state, threshold, time, location, visibility, approval, primary/recovery mode, exception, or scope AFTER removing the domain and operational action. Do not duplicate the operational action in CONDITION.','Translate DOMAIN, OPERATIONAL_ACTION, and CONDITION into concise English, but keep OPERATIONAL_ACTION_EVIDENCE verbatim from the source query.','Do not answer the retrieval question and do not invent an unstated action.'].join(' ');
          let projectorInput=0,projectorOutput=0,invalidEvidence=0;
          async function project(item){for(let attempt=0;attempt<2;attempt++){const ex=await provider.execute({capability:'reasoning.general',input:{task:task+(attempt?' Previous extraction failed exact source-evidence validation. Copy OPERATIONAL_ACTION_EVIDENCE exactly from the original query and re-evaluate semantic roles.':''),context:item.question},policy:{providerOptions:{thinkingBudget:0,temperature:0,maxOutputTokens:220,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{domain:{type:'STRING'},operationalAction:{type:'STRING'},operationalActionEvidence:{type:'STRING'},condition:{type:'STRING'}},required:['domain','operationalAction','operationalActionEvidence','condition']}}}});const u=ex.metadata?.usage||{};projectorInput+=u.promptTokenCount||0;projectorOutput+=u.candidatesTokenCount||0;const f=JSON.parse(ex.output);if(item.question.includes(f.operationalActionEvidence))return f;if(attempt===1){invalidEvidence++;return f;}}}
          process.stderr.write('facet-full projecting 360 queries\\n');
          const facets=await mapLimit(retrievalCases,4,project);
          process.stderr.write('facet-full embedding query facets\\n');
          const queryVectors=await mapLimit(facets,4,async f=>Promise.all([f.domain,f.operationalAction,f.condition].map(async text=>(await embedder.embedMany([text],{taskType:'RETRIEVAL_QUERY'}))[0])));
          const strategies=['minCos','meanCos','harmonicCos','worstRank','meanRank','rrf','borda','coverage']; const correct=Object.fromEntries(strategies.map(k=>[k,0])); const byCategory={},byLanguage={}; const rows=[];
          for(let qi=0;qi<retrievalCases.length;qi++){const item=retrievalCases[qi],qv=queryVectors[qi];const records=blocks.map((b,i)=>({id:b.id,s:qv.map(q=>cosine(q,docVectors[i]))}));const rankMaps=qv.map((_,fi)=>{const ordered=[...records].sort((x,y)=>y.s[fi]-x.s[fi]||x.id.localeCompare(y.id));return new Map(ordered.map((r,i)=>[r.id,i+1]));});const scored=records.map(r=>{const ranks=rankMaps.map(m=>m.get(r.id));const percentiles=ranks.map(rank=>1-((rank-1)/(blocks.length-1)));const h=r.s.length/r.s.reduce((sum,v)=>sum+1/Math.max(1e-6,v),0);const meanP=mean(percentiles),minP=Math.min(...percentiles);return{id:r.id,minCos:Math.min(...r.s),meanCos:mean(r.s),harmonicCos:h,worstRank:-Math.max(...ranks),meanRank:-mean(ranks),rrf:ranks.reduce((sum,rank)=>sum+1/(60+rank),0),borda:meanP,coverage:(0.75*minP)+(0.25*meanP)};});const selected={};for(const k of strategies){const best=[...scored].sort((x,y)=>y[k]-x[k]||x.id.localeCompare(y.id))[0].id;selected[k]=best;if(best===item.id)correct[k]++;}rows.push({caseIndex:item.caseIndex,category:item.category,queryLanguage:item.queryLanguage,expectedId:item.id,selected,facets:facets[qi]});if((qi+1)%60===0)process.stderr.write('facet-full '+(qi+1)+'/360\\n');}
          for(const k of strategies){byCategory[k]={};byLanguage[k]={};for(const cat of [...new Set(rows.map(r=>r.category))]){const g=rows.filter(r=>r.category===cat);byCategory[k][cat]={cases:g.length,correct:g.filter(r=>r.selected[k]===r.expectedId).length,accuracyPercent:Number((100*g.filter(r=>r.selected[k]===r.expectedId).length/g.length).toFixed(3))};}for(const lang of [...new Set(rows.map(r=>r.queryLanguage))]){const g=rows.filter(r=>r.queryLanguage===lang);byLanguage[k][lang]={cases:g.length,correct:g.filter(r=>r.selected[k]===r.expectedId).length,accuracyPercent:Number((100*g.filter(r=>r.selected[k]===r.expectedId).length/g.length).toFixed(3))};}}
          const summary=Object.fromEntries(strategies.map(k=>[k,{correct:correct[k],cases:rows.length,accuracyPercent:Number((100*correct[k]/rows.length).toFixed(3)),minCategoryAccuracyPercent:Math.min(...Object.values(byCategory[k]).map(x=>x.accuracyPercent)),minLanguageAccuracyPercent:Math.min(...Object.values(byLanguage[k]).map(x=>x.accuracyPercent))}]));
          const report={benchmark:'TRUYN Semantic v2 full evidence-backed facet ranking exploration',generatedAt:new Date().toISOString(),sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,corpusBlocks:blocks.length,cases:rows.length,callerKnowledge:'natural-language question only; facet compiler sees no corpus, ids or passages',projector:{model:'gemini-2.5-flash',thinkingBudget:0,inputTokens:projectorInput,outputTokens:projectorOutput,invalidEvidence},embedding:embedder.stats(),summary,byCategory,byLanguage,rows};await writeFile('semantic-v2-facet-full.json',JSON.stringify(report,null,2));console.log(JSON.stringify({benchmark:report.benchmark,projector:report.projector,embedding:report.embedding,summary:report.summary},null,2));
          `);
          NODE
          node --check semantic-v2-facet-full.mjs
          node semantic-v2-facet-full.mjs
      - name: Upload exploration evidence
        if: ${{ always() && hashFiles('semantic-v2-facet-full.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-facet-full-${{ github.run_id }}
          path: semantic-v2-facet-full.json
          retention-days: 30
      - name: Cleanup proxy
        if: always()
        shell: bash
        run: gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
