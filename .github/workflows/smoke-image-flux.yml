name: TRUYN Azure FLUX Image Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-image-flux.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  flux-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_RG: truyn
      AZURE_LOCATION: eastus2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: mkdir -p smoke-artifacts/image-flux

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Azure-direct FLUX if available
        shell: bash
        run: |
          set -uo pipefail
          suffix="$(printf '%s' '${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}' | sha256sum | cut -c1-12)"
          account="truynai${suffix}"
          deployment="truyn-flux-1-1-pro"
          if ! az cognitiveservices account show -g "$AZURE_RG" -n "$account" >/dev/null 2>&1; then
            az cognitiveservices account create -g "$AZURE_RG" -n "$account" -l "$AZURE_LOCATION" --kind AIServices --sku S0 --custom-domain "$account" --yes >/dev/null
          fi
          key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$account" --query key1 -o tsv)"
          echo "::add-mask::$key"
          echo "AZURE_FLUX_API_KEY=$key" >> "$GITHUB_ENV"
          echo "AZURE_FLUX_ENDPOINT=https://${account}.services.ai.azure.com" >> "$GITHUB_ENV"
          echo "AZURE_FLUX_DEPLOYMENT=$deployment" >> "$GITHUB_ENV"

          az cognitiveservices account list-models -g "$AZURE_RG" -n "$account" -o json > /tmp/flux-models.json
          entry="$(jq -c '[.[] | select(((.name // .model.name // "") | ascii_downcase) == "flux-1.1-pro")][0] // empty' /tmp/flux-models.json)"
          if [[ -z "$entry" ]]; then
            jq -n '{ok:false,modality:"image",provider:"azure-flux",status:"blocked_access",stage:"catalog"}' > smoke-artifacts/image-flux/flux.json
            exit 0
          fi
          model="$(jq -r '.name // .model.name' <<<"$entry")"
          version="$(jq -r '.version // .model.version // empty' <<<"$entry")"
          format="$(jq -r '.format // .model.format // "BlackForestLabs"' <<<"$entry")"
          sku="$(jq -r '[.skus[]?.name | select(.=="GlobalStandard" or .=="Standard")][0] // "GlobalStandard"' <<<"$entry")"
          if ! az cognitiveservices account deployment show -g "$AZURE_RG" -n "$account" --deployment-name "$deployment" >/dev/null 2>&1; then
            args=(cognitiveservices account deployment create -g "$AZURE_RG" -n "$account" --deployment-name "$deployment" --model-name "$model" --model-format "$format" --sku-name "$sku" --sku-capacity 1)
            [[ -n "$version" ]] && args+=(--model-version "$version")
            if ! az "${args[@]}" >/tmp/flux-deploy.out 2>/tmp/flux-deploy.err; then
              jq -n --arg model "$model" '{ok:false,modality:"image",provider:"azure-flux",model:$model,status:"blocked_access",stage:"deployment"}' > smoke-artifacts/image-flux/flux.json
              exit 0
            fi
          fi
          echo 'AZURE_FLUX_READY=true' >> "$GITHUB_ENV"

      - name: Smoke FLUX image only
        if: env.AZURE_FLUX_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_PROVIDER=azure-flux SMOKE_OUTPUT_DIR=smoke-artifacts/image-flux AZURE_FLUX_ENDPOINT="$AZURE_FLUX_ENDPOINT" AZURE_FLUX_DEPLOYMENT="$AZURE_FLUX_DEPLOYMENT" AZURE_FLUX_API_KEY="$AZURE_FLUX_API_KEY" node scripts/smoke/image-provider.js | tee smoke-artifacts/image-flux/flux.json

      - name: Upload FLUX image-only evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truyn-flux-image-smoke-${{ github.run_id }}
          path: smoke-artifacts/image-flux
          if-no-files-found: error
          retention-days: 30
