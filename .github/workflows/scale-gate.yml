name: TRUYN Adversarial Scale Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/network-adversarial-scale-100
    paths:
      - '.github/workflows/scale-gate.yml'
      - 'network/testnet/**'
      - 'network/transport/quic-kademlia.js'
      - 'simulations/network-failure/**'
      - 'simulations/nodes-100/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  scale-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRUYN_SCALE_NODE_COUNT: '100'
      TRUYN_SCALE_SEED: '1414681945'
      TRUYN_SCALE_HOST_COUNT: '1'
      TRUYN_SCALE_FAILURE_DOMAIN_TYPE: 'github-hosted-runner-single-host'
      TRUYN_SCALE_CLOUD: 'github-actions'
      TRUYN_SCALE_REPORT: 'artifacts/scale100-report.json'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run 100-node adversarial QUIC/Kademlia gate
        run: npm run testnet:scale100
      - name: Print compact scale summary
        if: always()
        shell: bash
        run: |
          if [[ ! -f artifacts/scale100-report.json ]]; then
            echo 'TRUYN_SCALE_SUMMARY report_missing=true'
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/scale100-report.json', 'utf8'));
          const summary = {
            passed: report.passed,
            nodeCount: report.nodeCount,
            live: report.finalNetwork?.live,
            libp2pIds: report.finalNetwork?.uniqueLibp2pPeerIds,
            truynIds: report.finalNetwork?.uniqueTruynNodeIds,
            hostCount: report.execution?.hostCount,
            failureDomainType: report.execution?.failureDomainType,
            baselineFirstAttemptRouting: report.baseline?.firstAttemptRoutingSuccessRatio,
            baselineRouting: report.baseline?.routingSuccessRatio,
            baselineIntegrity: report.baseline?.endToEndIntegritySuccessRatio,
            routingLatencyMs: report.baseline?.routingLatencyMs,
            probeLatencyMs: report.baseline?.probeLatencyMs,
            partition: report.partition,
            churn: report.churn ? {
              stoppedNodes: report.churn.stoppedNodes,
              duringChurnRouting: report.churn.duringChurn?.routingSuccessRatio,
              recoveredNodes: report.churn.recoveredNodes,
              peerIdentityRotations: report.churn.peerIdentityRotations,
              recoveryMs: report.churn.recoveryMs
            } : null,
            eclipse: report.eclipse,
            sybilPressure: report.sybilPressure,
            byzantineCollusion: report.byzantineCollusion ? {
              attackerCount: report.byzantineCollusion.attackerCount,
              providerResponses: report.byzantineCollusion.providerResponses,
              maliciousResponsesObserved: report.byzantineCollusion.maliciousResponsesObserved,
              maliciousAccepted: report.byzantineCollusion.maliciousAccepted,
              honestAccepted: report.byzantineCollusion.honestAccepted,
              attackExercised: report.byzantineCollusion.attackExercised,
              integrityPreserved: report.byzantineCollusion.integrityPreserved
            } : null,
            telemetry: report.finalNetwork?.telemetry,
            durationMs: report.durationMs,
            gates: report.gates,
            claims: report.claims
          };
          console.log(`TRUYN_SCALE_SUMMARY ${JSON.stringify(summary)}`);
          NODE
      - name: Upload raw scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-scale100-raw-${{ github.run_id }}
          path: artifacts/scale100-report.json
          if-no-files-found: warn
          retention-days: 90
