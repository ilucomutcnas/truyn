name: tmp-d100-canonical-fix

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  canonical-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical protected patch
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('benchmarks/scale/class-d-azure-100-provision.sh')
          s = p.read_text()
          for bad, good in (('truqyn','truyn'), ('truinyn','truyn'), ('truin-d100','truyn-d100')):
              s = s.replace(bad, good)
          s = s.replace('GITHUB_SHA', 'TRUYN_TESTED_COMMIT')
          checkout = "git checkout -q '${TRUYN_TESTED_COMMIT}'"
          if checkout not in s: raise SystemExit('guest checkout line missing')
          if 'git rev-parse HEAD' not in s:
              s = s.replace(checkout, checkout + "\ntest \"\\$(git rev-parse HEAD)\" = '${TRUYN_TESTED_COMMIT}'", 1)
          if 'echo TESTED_COMMIT=' not in s:
              s = s.replace('echo READY=25', 'echo TESTED_COMMIT=${TRUYN_TESTED_COMMIT}\necho READY=25', 1)
          outer = '[[ "$(marker "$out" READY)" == 25 ]]'
          if 'marker "$out" TESTED_COMMIT' not in s:
              s = s.replace(outer, '[[ "$(marker "$out" TESTED_COMMIT)" == "$TRUYN_TESTED_COMMIT" ]]\n  ' + outer, 1)
          s = s.replace('stage=preflight status=PASS commit=${TRUYN_TESTED_COMMIT}', 'stage=preflight status=PASS testedCommit=${TRUYN_TESTED_COMMIT}')
          for bad in ('truqyn','truinyn','truin-d100','GITHUB_SHA'):
              if bad in s: raise SystemExit('forbidden provision token: ' + bad)
          p.write_text(s)

          p = Path('benchmarks/scale/class-d-azure-100-campaign.sh')
          p.write_text(p.read_text().replace('GITHUB_SHA', 'TRUYN_TESTED_COMMIT'))

          p = Path('scripts/class-d-100-final-acceptance.sh')
          w = p.read_text()
          if 'TRUYN_TESTED_COMMIT is required for accepted D-100' not in w:
              w = w.replace('set -Eeuo pipefail\n', 'set -Eeuo pipefail\n\nif [[ "${TRUYN_CLASS_D100_PREPARE_ONLY:-0}" != 1 ]]; then\n  : "${TRUYN_TESTED_COMMIT:?TRUYN_TESTED_COMMIT is required for accepted D-100}"\nfi\n', 1)
          p.write_text(w)
          PY
          cat > tests/class-d-canonical-pin-regression.test.js <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';
          const provision = readFileSync(new URL('../benchmarks/scale/class-d-azure-100-provision.sh', import.meta.url), 'utf8');
          const campaign = readFileSync(new URL('../benchmarks/scale/class-d-azure-100-campaign.sh', import.meta.url), 'utf8');
          const wrapper = readFileSync(new URL('../scripts/class-d-100-final-acceptance.sh', import.meta.url), 'utf8');
          test('D-100 canonical paths and tested SHA propagation are fail-closed', () => {
            for (const bad of ['truqyn','truinyn','truin-d100','GITHUB_SHA']) assert.equal(provision.includes(bad), false, bad);
            assert.equal(campaign.includes('GITHUB_SHA'), false);
            assert.match(provision, /TRUYN_TESTED_COMMIT/);
            assert.match(provision, /git rev-parse HEAD/);
            assert.match(provision, /TESTED_COMMIT=\$\{TRUYN_TESTED_COMMIT\}/);
            assert.match(provision, /marker "\$out" TESTED_COMMIT/);
            assert.match(wrapper, /TRUYN_TESTED_COMMIT is required for accepted D-100/);
          });
          JS
          bash -n benchmarks/scale/class-d-azure-100-provision.sh
          bash -n benchmarks/scale/class-d-azure-100-campaign.sh
          bash -n scripts/class-d-100-final-acceptance.sh
          TRUYN_CLASS_D100_PREPARE_ONLY=1 bash scripts/class-d-100-final-acceptance.sh
          node --test tests/class-d-canonical-pin-regression.test.js
          git diff --check
      - name: Commit patch including workflow removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-d100-canonical-fix.yml
          git add benchmarks/scale/class-d-azure-100-provision.sh benchmarks/scale/class-d-azure-100-campaign.sh scripts/class-d-100-final-acceptance.sh tests/class-d-canonical-pin-regression.test.js
          git commit -m 'fix: canonicalize D-100 guest paths and immutable tested commit'
          git push origin HEAD:refs/heads/d100-canonical-fix-v2-20260819
          sha="$(git rev-parse HEAD)"
          gh api repos/${GITHUB_REPOSITORY}/issues -f title='TRUYN D100 CANONICAL V2 PATCH PUSHED' -f body="run=${GITHUB_RUN_ID} branch=d100-canonical-fix-v2-20260819 patch_sha=${sha}" >/dev/null
