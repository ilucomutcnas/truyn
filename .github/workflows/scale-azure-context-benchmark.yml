name: Scale Azure context benchmark capacity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scale-azure-context-benchmark.yml'

permissions:
  contents: write
  id-token: write

jobs:
  scale:
    runs-on: ubuntu-latest
    env:
      AZURE_RG: truyn
      AZURE_OPENAI_NAME: truyn-openai-1334540181
      AZURE_OPENAI_DEPLOYMENT: truyn-gpt-4-1-mini
      AZURE_OPENAI_MODEL: gpt-4.1-mini
      AZURE_OPENAI_MODEL_VERSION: '2025-04-14'
      AZURE_OPENAI_CAPACITY: '100'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Scale existing GPT deployment
        shell: bash
        run: |
          set -euo pipefail
          before="$(az cognitiveservices account deployment show -g "$AZURE_RG" -n "$AZURE_OPENAI_NAME" --deployment-name "$AZURE_OPENAI_DEPLOYMENT" --query sku.capacity -o tsv)"
          echo "AZURE_CONTEXT_CAPACITY_BEFORE=$before"
          az cognitiveservices account deployment create \
            -g "$AZURE_RG" \
            -n "$AZURE_OPENAI_NAME" \
            --deployment-name "$AZURE_OPENAI_DEPLOYMENT" \
            --model-name "$AZURE_OPENAI_MODEL" \
            --model-version "$AZURE_OPENAI_MODEL_VERSION" \
            --model-format OpenAI \
            --sku-name Standard \
            --sku-capacity "$AZURE_OPENAI_CAPACITY" \
            >/dev/null
          for attempt in $(seq 1 60); do
            capacity="$(az cognitiveservices account deployment show -g "$AZURE_RG" -n "$AZURE_OPENAI_NAME" --deployment-name "$AZURE_OPENAI_DEPLOYMENT" --query sku.capacity -o tsv)"
            state="$(az cognitiveservices account deployment show -g "$AZURE_RG" -n "$AZURE_OPENAI_NAME" --deployment-name "$AZURE_OPENAI_DEPLOYMENT" --query properties.provisioningState -o tsv)"
            echo "AZURE_CONTEXT_CAPACITY=$capacity STATE=$state"
            if [[ "$capacity" == "$AZURE_OPENAI_CAPACITY" && "$state" == "Succeeded" ]]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Remove one-shot scaler
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/scale-azure-context-benchmark.yml
          git commit -m 'Remove Azure context capacity scaler'
          git push origin HEAD:main
