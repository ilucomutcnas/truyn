name: Temporary Live Origin Security Proof

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-live-origin-proof.yml']

permissions:
  contents: read
  id-token: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_REGION_VALUE: ${{ vars.GCP_REGION || 'us-east4' }}
      PUBLIC_RELAY_URL: https://relay.truyn.org
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - name: Discover live relay origin without logging topology
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rows < <(az containerapp list --query "[?properties.configuration.ingress.external==\`true\`].[name,resourceGroup,properties.configuration.ingress.fqdn]" -o tsv)
          found=0
          for row in "${rows[@]}"; do
            name="$(awk '{print $1}' <<<"$row")"
            rg="$(awk '{print $2}' <<<"$row")"
            fqdn="$(awk '{print $3}' <<<"$row")"
            [[ -n "$fqdn" ]] || continue
            env_json="$(az containerapp show -g "$rg" -n "$name" --query 'properties.template.containers[0].env' -o json)"
            role="$(jq -r '[.[]? | select(.name=="TRUYN_ROLE") | .value][0] // empty' <<<"$env_json")"
            if [[ "$role" != 'relay' && "$name" != *relay* ]]; then continue; fi
            found=1
            origin="https://${fqdn}"
            app_id="$(az containerapp show -g "$rg" -n "$name" --query id -o tsv)"
            echo "::add-mask::$name"
            echo "::add-mask::$rg"
            echo "::add-mask::$fqdn"
            echo "::add-mask::$origin"
            echo "::add-mask::$app_id"
            printf 'AZURE_RELAY_APP=%s\nAZURE_RELAY_RG=%s\nAZURE_RELAY_ORIGIN=%s\nAZURE_RELAY_ID=%s\n' "$name" "$rg" "$origin" "$app_id" >> "$GITHUB_ENV"
            break
          done
          [[ "$found" == 1 ]] || { echo 'AZURE_ORIGIN_DISCOVERY=FAIL'; exit 20; }
          echo 'AZURE_ORIGIN_DISCOVERY=PASS'

      - name: Confirm public relay is actually Cloudflare proxied
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 15 -D edge-before.headers -o edge-before.json -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
          [[ "$code" == '200' ]] || { echo "CLOUDFLARE_PATH_PROOF=FAIL health=${code}"; exit 21; }
          grep -qi '^cf-ray:' edge-before.headers || { echo 'CLOUDFLARE_PATH_PROOF=FAIL cf_ray_missing'; exit 22; }
          echo 'CLOUDFLARE_PATH_PROOF=PASS'

      - name: Restrict Azure relay origin to Cloudflare network
        id: azure_restrict
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          app="$(az containerapp show -g "$AZURE_RELAY_RG" -n "$AZURE_RELAY_APP" -o json)"
          ingress="$(jq '.properties.configuration.ingress' <<<"$app")"
          jq -e '((.ipSecurityRestrictions // []) | length) == 0' <<<"$ingress" >/dev/null || {
            echo 'AZURE_CLOUDFLARE_ALLOWLIST=FAIL existing_ip_rules_present'
            exit 30
          }
          printf '%s' "$ingress" > ingress-backup.json

          ranges="$(curl -fsS https://www.cloudflare.com/ips-v4 | sed '/^[[:space:]]*$/d')"
          count="$(wc -l <<<"$ranges" | tr -d ' ')"
          [[ "$count" -ge 10 ]] || { echo 'AZURE_CLOUDFLARE_ALLOWLIST=FAIL cloudflare_ranges_unavailable'; exit 31; }
          rules="$(awk '{printf "%s%s", sep, $0; sep="\n"}' <<<"$ranges" | jq -Rsc 'split("\n") | map(select(length>0)) | to_entries | map({name:("cloudflare-" + ((.key+1)|tostring)),description:"Cloudflare origin network",ipAddressRange:.value,action:"Allow"})')"
          updated_ingress="$(jq --argjson rules "$rules" '.ipSecurityRestrictions=$rules' <<<"$ingress")"
          body="$(jq -nc --argjson ingress "$updated_ingress" '{properties:{configuration:{ingress:$ingress}}}')"
          az rest --method patch --url "https://management.azure.com${AZURE_RELAY_ID}?api-version=2025-01-01" --headers 'Content-Type=application/json' --body "$body" >/dev/null

          edge_ok=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS --max-time 10 -D edge-after.headers -o edge-after.json -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
            if [[ "$code" == '200' ]] && grep -qi '^cf-ray:' edge-after.headers; then edge_ok=1; break; fi
            sleep 3
          done
          if [[ "$edge_ok" != 1 ]]; then
            backup="$(cat ingress-backup.json)"
            rollback="$(jq -nc --argjson ingress "$backup" '{properties:{configuration:{ingress:$ingress}}}')"
            az rest --method patch --url "https://management.azure.com${AZURE_RELAY_ID}?api-version=2025-01-01" --headers 'Content-Type=application/json' --body "$rollback" >/dev/null || true
            echo 'AZURE_CLOUDFLARE_ALLOWLIST=FAIL public_path_failed_rolled_back'
            exit 32
          fi
          echo "AZURE_CLOUDFLARE_ALLOWLIST=PASS ranges=${count}"

      - name: Prove Azure direct origin is stopped before inner relay
        id: azure_proof
        if: ${{ steps.azure_restrict.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          direct_health="$(curl -sS --max-time 15 -o direct-health.body -w '%{http_code}' "${AZURE_RELAY_ORIGIN}/health" || true)"
          direct_register="$(curl -sS --max-time 15 -o direct-register.body -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${AZURE_RELAY_ORIGIN}/v1/register" || true)"
          direct_ws="$(curl -sS --http1.1 --max-time 10 -o /dev/null -w '%{http_code}' -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: dHJ1eW4tb3JpZ2luLXByb29m' "${AZURE_RELAY_ORIGIN}/v1/fast/socket" || true)"
          [[ "$direct_health" == '403' ]] || { echo "AZURE_DIRECT_ORIGIN_PROOF=FAIL health=${direct_health}"; exit 40; }
          [[ "$direct_register" == '403' ]] || { echo "AZURE_DIRECT_ORIGIN_PROOF=FAIL register=${direct_register}"; exit 41; }
          [[ "$direct_ws" == '403' ]] || { echo "AZURE_DIRECT_ORIGIN_PROOF=FAIL websocket=${direct_ws}"; exit 42; }

          edge_register="$(curl -sS --max-time 15 -o edge-register.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${PUBLIC_RELAY_URL}/v1/register" || true)"
          [[ "$edge_register" != '000' ]] || { echo 'AZURE_DIRECT_ORIGIN_PROOF=FAIL edge_unreachable'; exit 43; }
          jq -e 'type == "object"' edge-register.json >/dev/null 2>&1 || { echo "AZURE_DIRECT_ORIGIN_PROOF=FAIL edge_not_inner_json http=${edge_register}"; exit 44; }
          echo 'AZURE_DIRECT_HEALTH=403 platform_ingress_denied'
          echo 'AZURE_DIRECT_REGISTER=403 platform_ingress_denied'
          echo 'AZURE_DIRECT_WEBSOCKET=403 platform_ingress_denied'
          echo 'AZURE_EDGE_DATA_PLANE_REACHES_INNER_RELAY=true'
          echo 'AZURE_DIRECT_ORIGIN_PROOF=PASS zero_inner_relay_access'

      - name: Authenticate Google Cloud with WIF
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        if: ${{ steps.gcp_auth.outcome == 'success' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Prove GCP exposes no direct relay execution origin
        id: gcp_proof
        if: ${{ steps.gcp_auth.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          services="$(gcloud run services list --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_REGION_VALUE" --format=json)"
          relay_count=0
          provider_checked=0
          mapfile -t names < <(jq -r '.[].metadata.name' <<<"$services")
          for name in "${names[@]}"; do
            desc="$(gcloud run services describe "$name" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_REGION_VALUE" --format=json)"
            url="$(jq -r '.status.url // empty' <<<"$desc")"
            [[ -n "$url" ]] || continue
            echo "::add-mask::$url"
            role="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="TRUYN_ROLE") | .value][0] // empty' <<<"$desc")"
            provider="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="TRUYN_PROVIDER") | .value][0] // empty' <<<"$desc")"
            if [[ "$role" == 'relay' ]]; then
              relay_count=$((relay_count+1))
              code="$(curl -sS --max-time 15 -o gcp-relay.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${url}/v1/register" || true)"
              [[ ! "$code" =~ ^2 ]] || { echo "GCP_DIRECT_ORIGIN_PROOF=FAIL relay_http=${code}"; exit 51; }
            elif [[ "$role" == 'provider' || -n "$provider" ]]; then
              provider_checked=1
              code="$(curl -sS --max-time 15 -o gcp-provider.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${url}/v1/register" || true)"
              [[ ! "$code" =~ ^2 ]] || { echo 'GCP_DIRECT_ORIGIN_PROOF=FAIL provider_exposes_relay_registration'; exit 52; }
            fi
          done
          if [[ "$relay_count" -eq 0 ]]; then
            [[ "$provider_checked" -eq 1 ]] || { echo 'GCP_DIRECT_ORIGIN_PROOF=FAIL no_truyn_runtime_found'; exit 53; }
            echo 'GCP_RELAY_ORIGIN_PRESENT=false'
            echo 'GCP_PROVIDER_DIRECT_RELAY_API=DENIED_OR_ABSENT'
          else
            echo "GCP_RELAY_ORIGINS_NON2XX=$relay_count"
          fi
          echo 'GCP_DIRECT_ORIGIN_PROOF=PASS zero_relay_execution_path'

      - name: Final live invariant
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.azure_restrict.outcome }}' == 'success' ]] || { echo 'LIVE_ORIGIN_SECURITY_PROOF=FAIL azure_cloudflare_allowlist'; exit 60; }
          [[ '${{ steps.azure_proof.outcome }}' == 'success' ]] || { echo 'LIVE_ORIGIN_SECURITY_PROOF=FAIL azure'; exit 61; }
          [[ '${{ steps.gcp_auth.outcome }}' == 'success' ]] || { echo 'LIVE_ORIGIN_SECURITY_PROOF=FAIL gcp_auth'; exit 62; }
          [[ '${{ steps.gcp_proof.outcome }}' == 'success' ]] || { echo 'LIVE_ORIGIN_SECURITY_PROOF=FAIL gcp'; exit 63; }
          echo 'LIVE_ORIGIN_SECURITY_PROOF=PASS'
          echo 'DIRECT_AZURE_ORIGIN_OUTSIDE_CLOUDFLARE=ZERO_INNER_RELAY_ACCESS'
          echo 'DIRECT_GCP_ORIGIN=ZERO_RELAY_EXECUTION_PATH'
