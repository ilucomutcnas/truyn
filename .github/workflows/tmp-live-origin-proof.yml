name: Temporary Relay Recovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-live-origin-proof.yml']

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      PUBLIC_RELAY_URL: https://relay.truyn.org
    steps:
      - name: Authenticate Azure with main-only OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - name: Discover relay and remove failed IP restriction experiment
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS=$'\t' read -r name rg fqdn; do
            [[ -n "$fqdn" ]] || continue
            role="$(az containerapp show -g "$rg" -n "$name" --query 'properties.template.containers[0].env[?name==`TRUYN_ROLE`].value | [0]' -o tsv)"
            if [[ "$role" != 'relay' && "$name" != *relay* ]]; then continue; fi
            found=1
            echo "::add-mask::$name"
            echo "::add-mask::$rg"
            echo "::add-mask::$fqdn"
            rules="$(az containerapp ingress access-restriction list -g "$rg" -n "$name" -o json)"
            mapfile -t remove_names < <(jq -r '.[] | .name // empty | select(startswith("cloudflare-") or . == "truyn-bootstrap-all")' <<<"$rules")
            for rule in "${remove_names[@]}"; do
              az containerapp ingress access-restriction remove -g "$rg" -n "$name" --rule-name "$rule" -o none || true
            done
            remaining="$(az containerapp ingress access-restriction list -g "$rg" -n "$name" -o json)"
            experiment_left="$(jq '[.[] | (.name // "") | select(startswith("cloudflare-") or . == "truyn-bootstrap-all")] | length' <<<"$remaining")"
            [[ "$experiment_left" == 0 ]] || { echo 'AZURE_RECOVERY=FAIL experiment_rules_remain'; exit 21; }
            break
          done < <(az containerapp list --query "[?properties.configuration.ingress.external==\`true\`].[name,resourceGroup,properties.configuration.ingress.fqdn]" -o tsv)
          [[ "$found" == 1 ]] || { echo 'AZURE_RECOVERY=FAIL relay_not_found'; exit 20; }
          echo 'AZURE_RECOVERY=PASS failed_ip_allowlist_removed'

      - name: Verify public relay is healthy through Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          last='000'
          for attempt in $(seq 1 30); do
            last="$(curl -sS --max-time 10 -D edge.headers -o edge.body -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
            if [[ "$last" == '200' ]] && grep -qi '^cf-ray:' edge.headers; then ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == 1 ]] || { echo "RELAY_RECOVERY=FAIL public_health=${last}"; exit 30; }
          echo 'RELAY_RECOVERY=PASS public_health=200 cloudflare_path=true'
