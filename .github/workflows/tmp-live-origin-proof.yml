name: Temporary Live Origin Security Proof

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-live-origin-proof.yml']

permissions:
  contents: read
  id-token: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_REGION_VALUE: ${{ vars.GCP_REGION || 'us-east4' }}
      CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKENS }}
      CLOUDFLARE_ZONE_ID_VALUE: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      PUBLIC_RELAY_URL: https://relay.truyn.org
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - name: Discover relay origin without logging topology
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rows < <(az containerapp list --query "[?properties.configuration.ingress.external==\`true\`].[name,resourceGroup,properties.configuration.ingress.fqdn]" -o tsv)
          found=0
          for row in "${rows[@]}"; do
            name="$(awk '{print $1}' <<<"$row")"
            rg="$(awk '{print $2}' <<<"$row")"
            fqdn="$(awk '{print $3}' <<<"$row")"
            [[ -n "$fqdn" ]] || continue
            env_json="$(az containerapp show -g "$rg" -n "$name" --query 'properties.template.containers[0].env' -o json)"
            role="$(jq -r '[.[]? | select(.name=="TRUYN_ROLE") | .value][0] // empty' <<<"$env_json")"
            if [[ "$role" != "relay" && "$name" != *relay* ]]; then continue; fi
            found=1
            origin="https://${fqdn}"
            echo "::add-mask::$name"
            echo "::add-mask::$rg"
            echo "::add-mask::$fqdn"
            echo "::add-mask::$origin"
            printf 'AZURE_RELAY_APP=%s\nAZURE_RELAY_RG=%s\nAZURE_RELAY_ORIGIN=%s\n' "$name" "$rg" "$origin" >> "$GITHUB_ENV"
            break
          done
          [[ "$found" == "1" ]] || { echo 'ORIGIN_DISCOVERY=FAIL'; exit 20; }
          echo 'ORIGIN_DISCOVERY=PASS'

      - name: Configure Cloudflare edge proof transform
        id: cf_edge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN_VALUE:-}" && -n "${CLOUDFLARE_ZONE_ID_VALUE:-}" ]] || { echo 'CLOUDFLARE_TRANSFORM=FAIL missing_bindings'; exit 30; }
          guard_token="$(openssl rand -hex 32)"
          echo "::add-mask::$guard_token"
          echo "TRUYN_LIVE_ORIGIN_TOKEN=$guard_token" >> "$GITHUB_ENV"

          base="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID_VALUE}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN_VALUE}" -H 'Content-Type: application/json')
          errors_only() { jq -c '[.errors[]? | {code,message}]' 2>/dev/null || true; }

          list="$(curl -sS "${auth[@]}" "${base}/rulesets")"
          if ! jq -e '.success == true' <<<"$list" >/dev/null; then
            echo "CLOUDFLARE_TRANSFORM=FAIL list_rulesets $(errors_only <<<"$list")"
            exit 31
          fi
          ruleset_id="$(jq -r '.result[]? | select(.kind=="zone" and .phase=="http_request_late_transform") | .id' <<<"$list" | head -1)"

          rule="$(jq -nc --arg value "$guard_token" '{ref:"truyn_origin_guard_header",description:"TRUYN edge-to-origin proof",expression:"(http.host eq \"relay.truyn.org\")",action:"rewrite",action_parameters:{headers:{"x-truyn-origin-token":{operation:"set",value:$value}}}}')"

          if [[ -z "$ruleset_id" ]]; then
            create_body="$(jq -nc --argjson rule "$rule" '{name:"TRUYN late request transforms",description:"TRUYN edge security transforms",kind:"zone",phase:"http_request_late_transform",rules:[$rule]}')"
            created="$(curl -sS -X POST "${auth[@]}" --data "$create_body" "${base}/rulesets")"
            if ! jq -e '.success == true' <<<"$created" >/dev/null; then
              echo "CLOUDFLARE_TRANSFORM=FAIL create_ruleset $(errors_only <<<"$created")"
              exit 32
            fi
            ruleset_id="$(jq -r '.result.id' <<<"$created")"
          else
            details="$(curl -sS "${auth[@]}" "${base}/rulesets/${ruleset_id}")"
            if ! jq -e '.success == true' <<<"$details" >/dev/null; then
              echo "CLOUDFLARE_TRANSFORM=FAIL read_ruleset $(errors_only <<<"$details")"
              exit 33
            fi
            rule_id="$(jq -r '.result.rules[]? | select(.ref=="truyn_origin_guard_header") | .id' <<<"$details" | head -1)"
            if [[ -n "$rule_id" ]]; then
              changed="$(curl -sS -X PATCH "${auth[@]}" --data "$rule" "${base}/rulesets/${ruleset_id}/rules/${rule_id}")"
            else
              changed="$(curl -sS -X POST "${auth[@]}" --data "$rule" "${base}/rulesets/${ruleset_id}/rules")"
            fi
            if ! jq -e '.success == true' <<<"$changed" >/dev/null; then
              echo "CLOUDFLARE_TRANSFORM=FAIL write_rule $(errors_only <<<"$changed")"
              exit 34
            fi
          fi

          code="$(curl -sS --max-time 15 -o edge-pre.json -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
          [[ "$code" == '200' ]] || { echo "CLOUDFLARE_TRANSFORM=FAIL public_health=${code}"; exit 35; }
          echo 'CLOUDFLARE_TRANSFORM=PASS'

      - name: Enable Azure origin guard on live relay
        id: azure_guard
        if: ${{ steps.cf_edge.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          az containerapp secret set -g "$AZURE_RELAY_RG" -n "$AZURE_RELAY_APP" --secrets "truyn-origin-guard-token=${TRUYN_LIVE_ORIGIN_TOKEN}" -o none
          az containerapp update -g "$AZURE_RELAY_RG" -n "$AZURE_RELAY_APP" \
            --set-env-vars TRUYN_ORIGIN_GUARD=1 TRUYN_ORIGIN_GUARD_TOKEN=secretref:truyn-origin-guard-token \
            -o none
          echo 'AZURE_ORIGIN_GUARD_CONFIG=UPDATED'

      - name: Live Azure direct-origin proof
        id: azure_proof
        if: ${{ steps.cf_edge.outcome == 'success' && steps.azure_guard.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          direct_code='000'
          direct_error=''
          for attempt in $(seq 1 30); do
            direct_code="$(curl -sS --max-time 10 -o azure-direct.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${AZURE_RELAY_ORIGIN}/v1/register" || true)"
            direct_error="$(jq -r '.error // empty' azure-direct.json 2>/dev/null || true)"
            if [[ "$direct_code" == '403' && "$direct_error" == 'origin_guard_denied' ]]; then break; fi
            sleep 3
          done
          [[ "$direct_code" == '403' && "$direct_error" == 'origin_guard_denied' ]] || { echo "AZURE_ORIGIN_PROOF=FAIL runtime_guard_not_enforcing http=${direct_code}"; exit 41; }

          ws_code="$(curl -sS --http1.1 --max-time 10 -o /dev/null -w '%{http_code}' -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: dHJ1eW4tb3JpZ2luLXByb29m' "${AZURE_RELAY_ORIGIN}/v1/fast/socket" || true)"
          [[ "$ws_code" == '403' ]] || { echo "AZURE_ORIGIN_PROOF=FAIL websocket=${ws_code}"; exit 42; }

          edge_code="$(curl -sS --max-time 15 -o edge.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${PUBLIC_RELAY_URL}/v1/register" || true)"
          edge_error="$(jq -r '.error // empty' edge.json 2>/dev/null || true)"
          [[ ! ( "$edge_code" == '403' && "$edge_error" == 'origin_guard_denied' ) ]] || { echo 'AZURE_ORIGIN_PROOF=FAIL edge_cannot_cross_guard'; exit 43; }
          echo 'AZURE_DIRECT_HTTP=403 origin_guard_denied'
          echo 'AZURE_DIRECT_WEBSOCKET=403'
          echo 'AZURE_EDGE_REACHES_INNER_RELAY=true'
          echo 'AZURE_ORIGIN_PROOF=PASS'

      - name: Authenticate Google Cloud with WIF
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        if: ${{ steps.gcp_auth.outcome == 'success' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Live GCP direct-origin proof
        id: gcp_proof
        if: ${{ steps.gcp_auth.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          services="$(gcloud run services list --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_REGION_VALUE" --format=json)"
          relay_count=0
          provider_checked=0
          mapfile -t names < <(jq -r '.[].metadata.name' <<<"$services")
          for name in "${names[@]}"; do
            desc="$(gcloud run services describe "$name" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_REGION_VALUE" --format=json)"
            url="$(jq -r '.status.url // empty' <<<"$desc")"
            [[ -n "$url" ]] || continue
            echo "::add-mask::$url"
            role="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="TRUYN_ROLE") | .value][0] // empty' <<<"$desc")"
            provider="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="TRUYN_PROVIDER") | .value][0] // empty' <<<"$desc")"
            if [[ "$role" == 'relay' ]]; then
              relay_count=$((relay_count+1))
              code="$(curl -sS --max-time 15 -o gcp-relay.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${url}/v1/register" || true)"
              err="$(jq -r '.error // empty' gcp-relay.json 2>/dev/null || true)"
              [[ "$code" == '403' && "$err" == 'origin_guard_denied' ]] || { echo "GCP_ORIGIN_PROOF=FAIL relay_http=${code}"; exit 51; }
            elif [[ "$role" == 'provider' || -n "$provider" ]]; then
              provider_checked=1
              code="$(curl -sS --max-time 15 -o gcp-provider.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${url}/v1/register" || true)"
              [[ ! "$code" =~ ^2 ]] || { echo 'GCP_ORIGIN_PROOF=FAIL provider_exposes_relay_registration'; exit 52; }
            fi
          done
          if [[ "$relay_count" -eq 0 ]]; then
            [[ "$provider_checked" -eq 1 ]] || { echo 'GCP_ORIGIN_PROOF=FAIL no_truyn_runtime_found'; exit 53; }
            echo 'GCP_RELAY_ORIGIN_PRESENT=false'
            echo 'GCP_PROVIDER_DIRECT_RELAY_API=DENIED_OR_ABSENT'
            echo 'GCP_ORIGIN_PROOF=PASS no_relay_ingress'
          else
            echo "GCP_RELAY_ORIGINS_CHECKED=$relay_count"
            echo 'GCP_ORIGIN_PROOF=PASS'
          fi

      - name: Final live invariant
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.cf_edge.outcome }}' == 'success' ]] || { echo 'LIVE_ORIGIN_SECURITY_PROOF=FAIL cloudflare'; exit 60; }
          [[ '${{ steps.azure_guard.outcome }}' == 'success' ]] || { echo 'LIVE_ORIGIN_SECURITY_PROOF=FAIL azure_guard'; exit 61; }
          [[ '${{ steps.azure_proof.outcome }}' == 'success' ]] || { echo 'LIVE_ORIGIN_SECURITY_PROOF=FAIL azure'; exit 62; }
          [[ '${{ steps.gcp_auth.outcome }}' == 'success' ]] || { echo 'LIVE_ORIGIN_SECURITY_PROOF=FAIL gcp_auth'; exit 63; }
          [[ '${{ steps.gcp_proof.outcome }}' == 'success' ]] || { echo 'LIVE_ORIGIN_SECURITY_PROOF=FAIL gcp'; exit 64; }
          echo 'LIVE_ORIGIN_SECURITY_PROOF=PASS'
          echo 'DIRECT_ORIGIN_WITHOUT_EDGE_PROOF=ZERO_INNER_RELAY_ACCESS'
