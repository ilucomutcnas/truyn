name: Cloud PoC Bind relay.truyn.org

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-poc-domain-bind.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_RG: truyn
      AFD_PROFILE: truyn-frontdoor
      AFD_ENDPOINT: truyn-edge-1334540181
      AFD_ROUTE: relay-route
      AFD_CUSTOM_DOMAIN: relay-truyn-org
      TRUYN_HOST: relay.truyn.org
      CF_ZONE_NAME: truyn.org
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKENS }}
      CF_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Front Door CLI
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name cdn --upgrade --yes >/dev/null

      - name: Resolve Front Door endpoint
        shell: bash
        run: |
          set -euo pipefail
          afd_host="$(az afd endpoint show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --endpoint-name "$AFD_ENDPOINT" --query hostName -o tsv)"
          [[ -n "$afd_host" ]] || { echo 'AFD_ENDPOINT_HOST=missing'; exit 1; }
          az afd route show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --endpoint-name "$AFD_ENDPOINT" --route-name "$AFD_ROUTE" >/dev/null
          echo "AFD_ENDPOINT_HOST=$afd_host" >> "$GITHUB_ENV"
          echo "AFD_ENDPOINT_HOST=$afd_host"

      - name: Ensure Front Door custom domain and get validation token
        shell: bash
        run: |
          set -euo pipefail
          if ! az afd custom-domain show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --custom-domain-name "$AFD_CUSTOM_DOMAIN" >/dev/null 2>&1; then
            az afd custom-domain create \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --custom-domain-name "$AFD_CUSTOM_DOMAIN" \
              --host-name "$TRUYN_HOST" \
              --certificate-type ManagedCertificate \
              --minimum-tls-version TLS12 >/dev/null
          fi
          token="$(az afd custom-domain show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --custom-domain-name "$AFD_CUSTOM_DOMAIN" --query validationProperties.validationToken -o tsv)"
          state="$(az afd custom-domain show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --custom-domain-name "$AFD_CUSTOM_DOMAIN" --query domainValidationState -o tsv)"
          [[ -n "$token" || "$state" == 'Approved' ]] || { echo 'AFD_VALIDATION_TOKEN=missing'; exit 1; }
          echo "AFD_VALIDATION_TOKEN=$token" >> "$GITHUB_ENV"
          echo "AFD_VALIDATION_STATE_INITIAL=$state"

      - name: Upsert Cloudflare DNS
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CF_API_TOKEN" ]] || { echo 'CLOUDFLARE_API_TOKENS=missing'; exit 1; }
          [[ -n "$CF_ZONE_ID" ]] || { echo 'CLOUDFLARE_ZONE_ID=missing'; exit 1; }
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')

          verify="$(curl -fsS "${auth[@]}" "${api}/user/tokens/verify")"
          jq -e '.success == true and .result.status == "active"' <<<"$verify" >/dev/null
          echo 'CLOUDFLARE_TOKEN_VERIFY=success'

          upsert_record() {
            local type="$1" name="$2" content="$3" proxied="$4"
            local existing record_id payload
            existing="$(curl -fsS "${auth[@]}" "${api}/zones/${CF_ZONE_ID}/dns_records?type=${type}&name=${name}")"
            jq -e '.success == true' <<<"$existing" >/dev/null
            record_id="$(jq -r '.result[0].id // empty' <<<"$existing")"
            payload="$(jq -nc --arg type "$type" --arg name "$name" --arg content "$content" --argjson proxied "$proxied" '{type:$type,name:$name,content:$content,ttl:60,proxied:$proxied}')"
            if [[ -n "$record_id" ]]; then
              curl -fsS -X PUT "${auth[@]}" "${api}/zones/${CF_ZONE_ID}/dns_records/${record_id}" --data "$payload" | jq -e '.success == true' >/dev/null
            else
              curl -fsS -X POST "${auth[@]}" "${api}/zones/${CF_ZONE_ID}/dns_records" --data "$payload" | jq -e '.success == true' >/dev/null
            fi
          }

          if [[ -n "$AFD_VALIDATION_TOKEN" ]]; then
            upsert_record TXT "_dnsauth.${TRUYN_HOST}" "$AFD_VALIDATION_TOKEN" false
          fi
          upsert_record CNAME "$TRUYN_HOST" "$AFD_ENDPOINT_HOST" false
          echo "CLOUDFLARE_ACCOUNT_ID_PRESENT=$([[ -n "$CF_ACCOUNT_ID" ]] && echo true || echo false)"
          echo 'CLOUDFLARE_DNS=success'

      - name: Wait for Azure domain approval
        shell: bash
        run: |
          set -euo pipefail
          state=''
          for attempt in $(seq 1 90); do
            state="$(az afd custom-domain show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --custom-domain-name "$AFD_CUSTOM_DOMAIN" --query domainValidationState -o tsv)"
            echo "AFD_DOMAIN_VALIDATION_STATE=${state} attempt=${attempt}"
            [[ "$state" == 'Approved' ]] && exit 0
            sleep 10
          done
          echo 'AFD_DOMAIN_VALIDATION=timeout'
          exit 1

      - name: Associate custom domain with relay route
        shell: bash
        run: |
          set -euo pipefail
          az afd route update \
            -g "$AZURE_RG" \
            --profile-name "$AFD_PROFILE" \
            --endpoint-name "$AFD_ENDPOINT" \
            --route-name "$AFD_ROUTE" \
            --custom-domains "$AFD_CUSTOM_DOMAIN" \
            --link-to-default-domain Enabled >/dev/null
          echo 'AFD_ROUTE_DOMAIN_ASSOCIATION=success'

      - name: Prove canonical TRUYN relay domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            status="$(curl -sS -o relay-health.json -w '%{http_code}' "https://${TRUYN_HOST}/health" || true)"
            if [[ "$status" == '200' ]] && jq -e '.ok == true and .protocol == "TRUYN/1"' relay-health.json >/dev/null 2>&1; then
              echo "TRUYN_PUBLIC_RELAY=https://${TRUYN_HOST}"
              echo 'TRUYN_PUBLIC_DOMAIN_HEALTH=success'
              jq . relay-health.json
              exit 0
            fi
            echo "TRUYN_PUBLIC_DOMAIN_PROPAGATING attempt=${attempt} http=${status}"
            sleep 10
          done
          echo 'TRUYN_PUBLIC_DOMAIN_HEALTH=timeout'
          exit 1
