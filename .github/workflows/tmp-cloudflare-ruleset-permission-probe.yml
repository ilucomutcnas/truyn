name: Temporary Cloudflare DNS Proxy Permission Probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-cloudflare-ruleset-permission-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKENS }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Probe relay DNS record and safe same-value write permission
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CF_TOKEN:-}" && -n "${CF_ZONE_ID:-}" ]] || { echo 'CF_DNS_PROBE=FAIL missing_binding'; exit 1; }
          base="https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records"
          response="$(curl -sS -G -H "Authorization: Bearer ${CF_TOKEN}" --data-urlencode 'name=relay.truyn.org' "$base")"
          if ! jq -e '.success == true' <<<"$response" >/dev/null 2>&1; then
            code="$(jq -r '.errors[0].code // "unknown"' <<<"$response" 2>/dev/null || echo unknown)"
            echo "CF_DNS_READ=DENIED code=${code}"
            exit 2
          fi
          count="$(jq '.result | length' <<<"$response")"
          [[ "$count" == 1 ]] || { echo "CF_DNS_PROBE=FAIL record_count=${count}"; exit 3; }
          id="$(jq -r '.result[0].id' <<<"$response")"
          type="$(jq -r '.result[0].type' <<<"$response")"
          proxied="$(jq -r '.result[0].proxied // false' <<<"$response")"
          proxiable="$(jq -r '.result[0].proxiable // false' <<<"$response")"
          content="$(jq -r '.result[0].content' <<<"$response")"
          ttl="$(jq -r '.result[0].ttl' <<<"$response")"
          echo "CF_DNS_READ=OK type=${type} proxiable=${proxiable} proxied=${proxied}"
          [[ "$proxiable" == true ]] || { echo 'CF_DNS_PROBE=FAIL record_not_proxiable'; exit 4; }
          echo "::add-mask::$id"
          echo "::add-mask::$content"
          body="$(jq -nc --arg type "$type" --arg content "$content" --argjson ttl "$ttl" --argjson proxied "$proxied" '{type:$type,name:"relay.truyn.org",content:$content,ttl:$ttl,proxied:$proxied}')"
          write="$(curl -sS -X PATCH -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "$body" "${base}/${id}")"
          if ! jq -e '.success == true' <<<"$write" >/dev/null 2>&1; then
            code="$(jq -r '.errors[0].code // "unknown"' <<<"$write" 2>/dev/null || echo unknown)"
            echo "CF_DNS_WRITE=DENIED code=${code}"
            exit 5
          fi
          echo 'CF_DNS_WRITE=OK'
          echo 'CF_DNS_PROBE=PASS'
