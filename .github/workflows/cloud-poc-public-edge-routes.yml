name: Cloud PoC Preprovision TRUYN public edge routes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-poc-public-edge-routes.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preprovision-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AZURE_RG: truyn
      AFD_PROFILE: truyn-frontdoor
      AFD_ENDPOINT: truyn-edge-1334540181
      AFD_ORIGIN_GROUP: relay-origin-group
      RELAY_ROUTE: relay-route
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Front Door CLI
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name cdn --upgrade --yes >/dev/null

      - name: Resolve origin group and approved domains
        shell: bash
        run: |
          set -euo pipefail
          origin_group_id="$(az afd origin-group show \
            -g "$AZURE_RG" \
            --profile-name "$AFD_PROFILE" \
            --origin-group-name "$AFD_ORIGIN_GROUP" \
            --query id -o tsv)"
          [[ -n "$origin_group_id" ]] || { echo 'AFD_ORIGIN_GROUP_ID=missing'; exit 1; }
          echo "AFD_ORIGIN_GROUP_ID=$origin_group_id" >> "$GITHUB_ENV"

          domains=(relay-truyn-org api-truyn-org discovery-truyn-org gateway-truyn-org mcp-truyn-org trust-truyn-org status-truyn-org)
          for domain in "${domains[@]}"; do
            state="$(az afd custom-domain show \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --custom-domain-name "$domain" \
              --query domainValidationState -o tsv)"
            [[ "$state" == 'Approved' ]] || { echo "AFD_DOMAIN_NOT_APPROVED=${domain}:${state}"; exit 1; }
          done
          echo 'AFD_ROUTE_PRECONDITIONS=success'

      - name: Keep canonical relay route relay-only
        shell: bash
        run: |
          set -euo pipefail
          relay_id="$(az afd custom-domain show \
            -g "$AZURE_RG" \
            --profile-name "$AFD_PROFILE" \
            --custom-domain-name relay-truyn-org \
            --query id -o tsv)"
          formatted="$(jq -nc --arg id "$relay_id" '[{id:$id}]')"
          az afd route update \
            -g "$AZURE_RG" \
            --profile-name "$AFD_PROFILE" \
            --endpoint-name "$AFD_ENDPOINT" \
            --route-name "$RELAY_ROUTE" \
            --formatted-custom-domains "$formatted" \
            --origin-group "$AFD_ORIGIN_GROUP_ID" \
            --patterns-to-match '["/*"]' \
            --supported-protocols '["Http","Https"]' \
            --https-redirect Enabled \
            --forwarding-protocol HttpsOnly \
            --link-to-default-domain Enabled \
            --enabled-state Enabled >/dev/null
          echo 'AFD_RELAY_ROUTE=relay-only'

      - name: Preprovision dedicated hostname routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(api-route discovery-route gateway-route mcp-route trust-route status-route)
          domains=(api-truyn-org discovery-truyn-org gateway-truyn-org mcp-truyn-org trust-truyn-org status-truyn-org)

          for i in "${!routes[@]}"; do
            route="${routes[$i]}"
            domain="${domains[$i]}"
            domain_id="$(az afd custom-domain show \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --custom-domain-name "$domain" \
              --query id -o tsv)"
            formatted="$(jq -nc --arg id "$domain_id" '[{id:$id}]')"

            if az afd route show \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --endpoint-name "$AFD_ENDPOINT" \
              --route-name "$route" >/dev/null 2>&1; then
              az afd route update \
                -g "$AZURE_RG" \
                --profile-name "$AFD_PROFILE" \
                --endpoint-name "$AFD_ENDPOINT" \
                --route-name "$route" \
                --formatted-custom-domains "$formatted" \
                --origin-group "$AFD_ORIGIN_GROUP_ID" \
                --patterns-to-match '["/*"]' \
                --supported-protocols '["Http","Https"]' \
                --https-redirect Enabled \
                --forwarding-protocol HttpsOnly \
                --link-to-default-domain Disabled \
                --enabled-state Enabled >/dev/null
            else
              az afd route create \
                -g "$AZURE_RG" \
                --profile-name "$AFD_PROFILE" \
                --endpoint-name "$AFD_ENDPOINT" \
                --route-name "$route" \
                --formatted-custom-domains "$formatted" \
                --origin-group "$AFD_ORIGIN_GROUP_ID" \
                --patterns-to-match '["/*"]' \
                --supported-protocols '["Http","Https"]' \
                --https-redirect Enabled \
                --forwarding-protocol HttpsOnly \
                --link-to-default-domain Disabled \
                --enabled-state Enabled >/dev/null
            fi
            echo "AFD_PREPROVISIONED_ROUTE=${route}:${domain}"
          done

      - name: Verify route ownership
        shell: bash
        run: |
          set -euo pipefail
          pairs=(
            'relay-route:relay-truyn-org'
            'api-route:api-truyn-org'
            'discovery-route:discovery-truyn-org'
            'gateway-route:gateway-truyn-org'
            'mcp-route:mcp-truyn-org'
            'trust-route:trust-truyn-org'
            'status-route:status-truyn-org'
          )

          for pair in "${pairs[@]}"; do
            route="${pair%%:*}"
            domain="${pair##*:}"
            route_json="$(az afd route show \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --endpoint-name "$AFD_ENDPOINT" \
              --route-name "$route" -o json)"
            jq -e --arg domain "/customdomains/${domain}" \
              '(.enabledState == "Enabled") and (.customDomains | length == 1) and ((.customDomains[0].id | ascii_downcase) | endswith($domain))' \
              <<<"$route_json" >/dev/null
            echo "AFD_ROUTE_VERIFIED=${route}:${domain}"
          done
          echo 'AFD_PUBLIC_EDGE_ROUTES=preprovisioned'
