name: tmp-d100-v16-main-security-green-observer

on:
  push:
    branches:
      - ci/d100-v16-main-security-green-observer-23360cbe
    paths:
      - '.github/workflows/tmp-d100-v16-main-security-green-observer.yml'

permissions:
  contents: read
  actions: read
  issues: write

env:
  TARGET_SHA: 23360cbe86e725f79ef0c6772a51f70825b92aef
  TARGET_RUN: '32558383377'

jobs:
  diagnose-main-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture policy and run diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          : >/tmp/result.txt
          probe() {
            local label="$1" endpoint="$2"
            local response rc compact
            response="$(gh api "$endpoint" 2>&1)"; rc=$?
            compact="$(printf '%s' "$response" | tr '\n' ' ' | head -c 3500)"
            printf '%s_rc=%s\n%s_response=%s\n' "$label" "$rc" "$label" "$compact" >>/tmp/result.txt
          }
          probe repo_actions "repos/${GITHUB_REPOSITORY}/actions/permissions"
          probe repo_selected "repos/${GITHUB_REPOSITORY}/actions/permissions/selected-actions"
          probe repo_workflow_perm "repos/${GITHUB_REPOSITORY}/actions/permissions/workflow"
          probe org_actions "orgs/${GITHUB_REPOSITORY_OWNER}/actions/permissions"
          probe org_selected "orgs/${GITHUB_REPOSITORY_OWNER}/actions/permissions/selected-actions"
          probe org_workflow_perm "orgs/${GITHUB_REPOSITORY_OWNER}/actions/permissions/workflow"
          probe target_run "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}"
          probe target_jobs "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}/jobs"
          body="observer_run_id=${GITHUB_RUN_ID}\ntarget_sha=${TARGET_SHA}\n$(cat /tmp/result.txt)stage=main_ci_startup_policy_diagnostic"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN D-100 V16 MAIN CI STARTUP POLICY DIAGNOSTIC' -f "body=${body}" >/dev/null
          exit 0
