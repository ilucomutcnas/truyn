name: Temporary Class C Final V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-c-final-v2.yml'

permissions:
  contents: write
  id-token: write
  issues: write

jobs:
  class-c-final:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TESTED_SHA: b1fe4a0f83573d92e81e4a7366f08cf72118b692
      AZURE_LOCATION: eastus2
      AZURE_VM_SIZE: Standard_B1ms
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_REGION_VALUE: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      PEER_TTL_MS: '30000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Restore main security-green before cloud execution
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git reset --hard origin/main
          git rm -f .github/workflows/tmp-class-c-final-v2.yml
          git config user.name truyn-ops-bot
          git config user.email actions@users.noreply.github.com
          git commit -m 'security: remove triggered Class C final v2 runner'
          git push origin HEAD:main
          git fetch origin main
          bash scripts/assert-security-clean-tested-commit.sh origin/main
          echo "TRUYN_MAIN_SECURITY_GREEN=PASS sha=$(git rev-parse origin/main)"

      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          body="run_id=${GITHUB_RUN_ID} trigger_sha=${GITHUB_SHA} tested_sha=${TESTED_SHA} phase=class-c"
          response="$(curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" -d "$(jq -nc --arg title 'TRUYN CLASS C FINAL 2026-08-18' --arg body "$body" '{title:$title,body:$body}')")"
          echo "CLASS_C_ISSUE=$(printf '%s' "$response" | jq -r .number)" >> "$GITHUB_ENV"

      - name: Materialize immutable tested commit
        run: |
          set -Eeuo pipefail
          git cat-file -e "${TESTED_SHA}^{commit}"
          rm -rf /tmp/truyn-tested
          git worktree add --detach /tmp/truyn-tested "$TESTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tested-commit security and regression preflight
        run: |
          set -Eeuo pipefail
          cd /tmp/truyn-tested
          npm install --ignore-scripts --no-audit --no-fund
          TRUYN_LOCAL_DEVELOPMENT=1 npm test
          bash scripts/assert-security-clean-tested-commit.sh "$TESTED_SHA"
          git diff --check

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL_VALUE }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute heterogeneous WAN reachability gate
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/truyn-tested
          bash scripts/class-c-final-acceptance.sh 2>&1 | tee /tmp/class-c-final.log

      - name: Build sanitized durable evidence
        id: evidence
        if: always()
        shell: bash
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -Eeuo pipefail
          touch /tmp/class-c-final.log
          final_json="$(sed -n 's/^TRUYN_CLASS_C=//p' /tmp/class-c-final.log 2>/dev/null | tail -1 || true)"
          cleanup=false
          grep -q 'TRUYN_CLASS_C_CLEANUP=PASS' /tmp/class-c-final.log 2>/dev/null && cleanup=true
          gate=FAIL
          if [[ "$PROOF_OUTCOME" == success ]] && [[ "$cleanup" == true ]] && printf '%s' "$final_json" | jq -e '
            .gate == "PASS" and
            .cloudProviders >= 2 and
            .cloudRegions >= 2 and
            .crossCloudDirectQuic == true and
            .relayCalls == 0 and
            .packetPathPartition == true and
            .packetDropCount > 0 and
            .realAzureNatGateway == true and
            .natSourceObserved == true and
            .privateNatNodePublicIp == false and
            .doubleNatCgnatLikeOutbound == true and
            .relayFallback == true and
            .relayFallbackAuthenticated == true and
            .relayOutageFailClosed == true and
            .relayRecovery == true
          ' >/dev/null 2>&1; then gate=PASS; fi
          val(){ printf '%s' "$final_json" | jq -r "$1 // \"not-recorded\"" 2>/dev/null || printf not-recorded; }
          failure_stage="$(sed -n 's/^TRUYN_CLASS_C=FAIL stage=\([^ ]*\).*/\1/p' /tmp/class-c-final.log 2>/dev/null | tail -1 | tr -cd 'A-Za-z0-9_.:-' | cut -c1-96)"
          direct_error="$(sed -n 's/^TRUYN_CLASS_C_DIRECT_ERROR=//p' /tmp/class-c-final.log 2>/dev/null | tail -1 | tr -cd 'A-Za-z0-9_.:-' | cut -c1-128)"
          cat >/tmp/NETWORK_CLASS_C_HETEROGENEOUS_WAN_2026-08-18.md <<EOF
          # TRUYN Class C Heterogeneous WAN / Reachability Gate — 2026-08-18

          **Result:** **${gate}**

          ## Evidence identity

          - GitHub Actions run: https://github.com/inn-media/truqyn/actions/runs/${GITHUB_RUN_ID}
          - tested security-clean commit: ${TESTED_SHA}
          - proof execution outcome: ${PROOF_OUTCOME}
          - ephemeral cloud cleanup PASS marker: ${cleanup}
          - sanitized failure stage: ${failure_stage:-none}
          - sanitized direct-path diagnostic: ${direct_error:-none}

          ## Real measured gates

          | Gate | Result |
          |---|---:|
          | independent real node runtimes (base topology) | $(val '.realNodeRuntimes') |
          | cloud providers | $(val '.cloudProviders') |
          | cloud regions / failure domains | $(val '.cloudRegions') |
          | cross-cloud direct QUIC | $(val '.crossCloudDirectQuic') |
          | relay calls on direct cross-cloud proof | $(val '.relayCalls') |
          | real packet-path UDP partition | $(val '.packetPathPartition') |
          | kernel-observed dropped packets | $(val '.packetDropCount') |
          | packet heal latency, ms | $(val '.packetHealMs') |
          | real Azure NAT Gateway | $(val '.realAzureNatGateway') |
          | NAT source observed | $(val '.natSourceObserved') |
          | NAT-hidden node has public IP | $(val '.privateNatNodePublicIp') |
          | two-layer kernel NAT / CGNAT-like outbound path | $(val '.doubleNatCgnatLikeOutbound') |
          | authenticated signed-envelope relay fallback | $(val '.relayFallbackAuthenticated') |
          | relay fallback latency, ms | $(val '.relayFallbackMs') |
          | relay outage fails closed | $(val '.relayOutageFailClosed') |
          | relay recovered | $(val '.relayRecovery') |
          | guest-side relay recovery, ms | $(val '.relayRecoveryMs') |
          | carrier-field CGNAT validated | $(val '.carrierCgnatFieldValidated') |

          ## Acceptance boundary

          A PASS closes the bounded **Class C heterogeneous WAN/reachability engineering gate**: multi-provider WAN, direct QUIC, real packet-path loss/heal, real cloud NAT, a two-layer kernel NAT/CGNAT-like path, signed relay fallback, relay outage and recovery are all exercised with cleanup. The double-NAT path is deliberately described as **CGNAT-like**; this report does not claim a live mobile/ISP carrier CGNAT field test.

          A FAIL is retained as evidence and does not promote maturity.

          ## Security

          The temporary privileged runner removed itself from main before cloud authentication and infrastructure execution. Credentials, cloud account identifiers, live resource names, node identities and IP addresses are intentionally omitted. Benchmark evidence follows redact-not-delete policy.
          EOF
          sed -i 's#github.com/inn-media/truqyn/#github.com/inn-media/truyn/#g' /tmp/NETWORK_CLASS_C_HETEROGENEOUS_WAN_2026-08-18.md
          echo "gate=${gate}" >> "$GITHUB_OUTPUT"

      - name: Publish evidence on clean main
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git reset --hard origin/main
          test ! -e .github/workflows/tmp-class-c-final-v2.yml
          bash scripts/assert-security-clean-tested-commit.sh HEAD
          cp /tmp/NETWORK_CLASS_C_HETEROGENEOUS_WAN_2026-08-18.md docs/benchmarks/NETWORK_CLASS_C_HETEROGENEOUS_WAN_2026-08-18.md
          git add docs/benchmarks/NETWORK_CLASS_C_HETEROGENEOUS_WAN_2026-08-18.md
          git config user.name truyn-evidence-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "evidence: preserve Class C ${{ steps.evidence.outputs.gate }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish final run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ steps.evidence.outputs.gate }}
        run: |
          set -Eeuo pipefail
          body="run_id=${GITHUB_RUN_ID} tested_sha=${TESTED_SHA} gate=${GATE:-FAIL} evidence=docs/benchmarks/NETWORK_CLASS_C_HETEROGENEOUS_WAN_2026-08-18.md"
          curl -fsSL -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${CLASS_C_ISSUE}" -d "$(jq -nc --arg body "$body" '{body:$body,state:"closed"}')" >/dev/null

      - name: Enforce acceptance
        if: always()
        run: test '${{ steps.evidence.outputs.gate }}' = PASS
