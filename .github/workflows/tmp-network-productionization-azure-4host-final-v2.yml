name: Temporary Azure Four-Host Network Productionization Final v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-network-productionization-azure-4host-final-v2.yml']
permissions:
  contents: read
  id-token: write
jobs:
  four-host:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TEST_COMMIT: fd6f52e2e9ad1d08ba9cbe2f4a3b2d196b494afa
      LOCATION: eastus2
      VM_SIZE: Standard_B1ms
      TEST_PEER_TTL_MS: '1800000'
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Materialize corrected proof script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/tmp-network-productionization-azure-4host-final.yml').read_text()
          marker = '        run: |\n'
          if marker not in source:
              raise SystemExit('proof run block not found')
          block = source.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if not line:
                  lines.append('')
              elif line.startswith('          '):
                  lines.append(line[10:])
              else:
                  raise SystemExit(f'unexpected proof indentation: {line[:40]!r}')
          script = '\n'.join(lines) + '\n'
          replacements = [
              ("printf 'S=%s\\\\nMS=%s\\\\nB=%s\\\\n'", "printf 'TRUYN_STATUS=%s\\\\nTRUYN_MS=%s\\\\nTRUYN_BODY=%s\\\\n'"),
              ("sed -n 's/.*S=//p'", "sed -n 's/.*TRUYN_STATUS=//p'"),
              ("sed -n 's/.*MS=//p'", "sed -n 's/.*TRUYN_MS=//p'"),
              ("sed -n 's/.*B=//p'", "sed -n 's/.*TRUYN_BODY=//p'"),
          ]
          for old, new in replacements:
              if old not in script:
                  raise SystemExit(f'expected parser token missing: {old}')
              script = script.replace(old, new)
          Path('/tmp/truyn-azure-4host-final-v2.sh').write_text(script)
          PY
          bash -n /tmp/truyn-azure-4host-final-v2.sh
          echo 'TRUYN_4HOST_V2_SCRIPT=READY markerCollisionFixed=true'
      - name: Four-host Class B QUIC DHT failure-repair gate
        shell: bash
        run: bash /tmp/truyn-azure-4host-final-v2.sh