name: Cloud PoC Code CI

on:
  push:
    branches:
      - deploy/azure-gcp-poc
    paths:
      - 'adapters/providers/**'
      - 'runtime/**'
      - 'tests/cloud-providers.test.js'
      - 'Dockerfile'
      - '.github/workflows/cloud-poc-code-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - name: Build runtime image
        run: docker build -t truyn-cloud-poc:${GITHUB_SHA} .
