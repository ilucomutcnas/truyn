name: Cloud PoC Code CI

on:
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'network/**'
      - 'node/**'
      - 'adapters/**'
      - 'runtime/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloud-poc-code-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'core/**'
      - 'network/**'
      - 'node/**'
      - 'adapters/**'
      - 'runtime/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloud-poc-code-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build runtime image
        run: docker build -t truyn-cloud-poc:${GITHUB_SHA} .
