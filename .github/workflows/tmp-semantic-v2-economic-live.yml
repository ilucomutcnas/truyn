name: Ephemeral Semantic v2 Economic Seven-Actor Proof

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-economic-live.yml']

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AZURE_RG: truyn
      FOUNDRY_BENCH_CAPACITY: '100'
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_PROXY_SERVICE: truyn-semanticv2-live-${{ github.run_id }}
      GCP_AR_REPO: truyn-semanticv2-${{ github.run_id }}
      GEMINI_MODEL: gemini-2.5-flash
      LITE_RERANKER_MODEL: gemini-3.1-flash-lite
      FLASH_RERANKER_MODEL: gemini-3-flash-preview
      PRO_VERIFIER_MODEL: gemini-3.1-pro-preview
      GOOGLE_CLOUD_LOCATION: global
      VERTEX_EMBEDDING_LOCATION: us-central1
      VERTEX_EMBEDDING_MODEL: gemini-embedding-001
      VERTEX_EMBEDDING_DIMENSIONS: '768'
      SEMANTIC_V2_CORPUS_BLOCKS: '600'
      SEMANTIC_V2_RETRIEVAL_CASES: '360'
      SEMANTIC_V2_LIVE_CASES: '6'
      SEMANTIC_V2_PACING_MS: '30000'
      SEMANTIC_V2_RATE_LIMIT_RETRIES: '8'
      SEMANTIC_V2_OUTPUT: semantic-retrieval-v2-economic-live.json
      SEMANTIC_V2_RETRIEVAL_PROOF: semantic-v2-economic-final.json
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      RETRIEVAL_PROOF_RUN_ID: '31951123535'
      RETRIEVAL_PROOF_ARTIFACT_ID: '9264730019'
      RETRIEVAL_PROOF_ZIP_SHA256: c317ea8630970d6f459904e4164046e36ab15455227d16643affaccb0f079c0e
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load immutable benchmark sources
        shell: bash
        run: |
          set -euo pipefail
          load_file() {
            path="$1"; ref="$2"
            mkdir -p "$(dirname "$path")"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
          }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"

      - name: Verify immutable economic 360-case proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RETRIEVAL_PROOF_ARTIFACT_ID}/zip" \
            -o retrieval-proof.zip
          printf '%s  %s\n' "$RETRIEVAL_PROOF_ZIP_SHA256" retrieval-proof.zip | sha256sum -c -
          unzip -p retrieval-proof.zip semantic-v2-economic-final.json > "$SEMANTIC_V2_RETRIEVAL_PROOF"
          jq -e '
            .sourceSha == "6f2ddf743e83ad1704a831a7058a93ad668c6a69"
            and .semanticGate.passed == true
            and .semanticGate.accuracyPercent >= 99
            and .semanticGate.denseRecallPercent == 100
            and .semanticGate.provenancePercent == 100
            and .semanticGate.noBlockIdPercent == 100
            and .semanticGate.minimalContextPercent == 100
            and ([.semanticGate.perCategory[].accuracyPercent] | all(. >= 99))
            and ([.semanticGate.perLanguage[].accuracyPercent] | all(. >= 99))
            and .semanticRoutingCostUsdPerQuery < 0.004
            and (.rows | length) == 360
          ' "$SEMANTIC_V2_RETRIEVAL_PROOF" >/dev/null

      - name: Patch immutable benchmark for economic confidence routing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'benchmarks/semantic-retrieval-v2.js';
          let source = fs.readFileSync(path, 'utf8');
          function replaceOnce(label, from, to) {
            if (!source.includes(from)) throw new Error(`patch marker not found: ${label}`);
            source = source.replace(from, to);
          }
          function replaceRange(label, start, end, replacement) {
            const a = source.indexOf(start);
            const b = source.indexOf(end, a + start.length);
            if (a < 0 || b < 0) throw new Error(`patch range not found: ${label}`);
            source = source.slice(0, a) + replacement + source.slice(b);
          }
          replaceOnce('fs import', "import { writeFile } from 'node:fs/promises';", "import { readFile, writeFile } from 'node:fs/promises';");
          replaceOnce('confidence import', "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';", "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';\nimport { createConfidenceGatedSemanticReranker } from '../core/context/confidence-gated-semantic-reranker.js';");
          replaceOnce('proof env', "const geminiLocation = process.env.GOOGLE_CLOUD_LOCATION || 'global';", "const geminiLocation = process.env.GOOGLE_CLOUD_LOCATION || 'global';\nconst retrievalProofPath = process.env.SEMANTIC_V2_RETRIEVAL_PROOF;\nconst retrievalProofArtifactId = process.env.RETRIEVAL_PROOF_ARTIFACT_ID;\nconst retrievalProofRunId = process.env.RETRIEVAL_PROOF_RUN_ID;\nconst retrievalProofZipSha256 = process.env.RETRIEVAL_PROOF_ZIP_SHA256;");
          replaceOnce('proof required', '  GCP_ACCESS_TOKEN: proxyToken', '  GCP_ACCESS_TOKEN: proxyToken,\n  SEMANTIC_V2_RETRIEVAL_PROOF: retrievalProofPath');
          replaceOnce('dense gate', '  retrievalAccuracyPercentMin: 99,', '  retrievalAccuracyPercentMin: 99,\n  denseCandidateRecallPercentMin: 99,');
          replaceOnce('routing rates', "const comparableRates = {\n  gpt: { input: 0.44, output: 1.76 },\n  gemini: { input: 0.30, output: 2.50 }\n};", "const comparableRates = {\n  gpt: { input: 0.44, output: 1.76 },\n  gemini: { input: 0.30, output: 2.50 }\n};\nconst semanticRoutingRates = {\n  lite:{ input:0.25, output:1.50 },\n  flash:{ input:0.50, output:3.00 },\n  verifier:{ input:2.00, output:12.00 }\n};");
          replaceOnce(
            'semantic router construction',
            '  const semanticRouter = createSemanticContextRouterV2({ embedder });',
            `  const makeProvider = (model) => createVertexGeminiProvider({
              projectId:gcpProjectId,
              location:geminiLocation,
              model,
              endpoint:proxyEndpoint,
              accessTokenProvider:async () => proxyToken,
              capabilities:['reasoning.general'],
              requestTimeoutMs:180000
            });
            const retryProvider = (provider) => ({
              name:provider.name,
              async execute(request) {
                let lastError;
                for (let attempt = 0; attempt <= 3; attempt += 1) {
                  try { return await provider.execute(request); }
                  catch (error) {
                    lastError = error;
                    const transient = /Vertex AI HTTP (408|429|5\\d\\d)|network request failed|timed out|upstream request timeout/i.test(error?.message || '');
                    if (!transient || attempt === 3) throw error;
                    await sleep(1000 * (2 ** attempt));
                  }
                }
                throw lastError;
              }
            });
            const schema = { type:'OBJECT', properties:{ id:{ type:'STRING' } }, required:['id'] };
            const semanticReranker = createConfidenceGatedSemanticReranker({
              liteProvider:retryProvider(makeProvider(process.env.LITE_RERANKER_MODEL)),
              flashProvider:retryProvider(makeProvider(process.env.FLASH_RERANKER_MODEL)),
              verifierProvider:retryProvider(makeProvider(process.env.PRO_VERIFIER_MODEL)),
              cheapCandidateK:24,
              confidenceDenseRankMax:15,
              maxCandidates:64,
              liteProviderOptions:{ thinkingLevel:'MINIMAL', temperature:0, maxOutputTokens:512, responseMimeType:'application/json', responseSchema:schema },
              flashProviderOptions:{ thinkingLevel:'MINIMAL', temperature:0, maxOutputTokens:512, responseMimeType:'application/json', responseSchema:schema },
              verifierProviderOptions:{ temperature:0, maxOutputTokens:1024, responseMimeType:'application/json', responseSchema:schema },
              repairAttempts:1
            });
            const semanticRouter = createSemanticContextRouterV2({ embedder, reranker:semanticReranker, candidateK:64 });`
          );
          replaceRange(
            'reuse economic retrieval proof',
            '  // Force a single document-index build before concurrent query evaluation.',
            "  const byCategory = metricsBy(retrievalResults, 'category');",
            `  const retrievalProof = JSON.parse(await readFile(retrievalProofPath, 'utf8'));
            const retrievalResults = retrievalProof.rows;
            if (!Array.isArray(retrievalResults) || retrievalResults.length !== retrievalCaseCount) throw new Error('retrieval proof case count mismatch');
            const retrievalAccuracy = retrievalProof.semanticGate.accuracyPercent;
            const provenancePercent = retrievalProof.semanticGate.provenancePercent;
            const noBlockIdPercent = retrievalProof.semanticGate.noBlockIdPercent;
            const lexicalV1Accuracy = null;
            const denseCandidateRecallPercent = retrievalProof.semanticGate.denseRecallPercent;
            `
          );
          replaceOnce('retrieval proof gate', '  const retrievalOnlyPassed = retrievalAccuracy >= gate.retrievalAccuracyPercentMin\n    && provenancePercent >= gate.provenancePassPercentMin', '  const retrievalOnlyPassed = retrievalAccuracy >= gate.retrievalAccuracyPercentMin\n    && denseCandidateRecallPercent >= gate.denseCandidateRecallPercentMin\n    && provenancePercent >= gate.provenancePassPercentMin');
          replaceOnce('retrieval report proof', '      accuracyPercent:retrievalAccuracy,\n      provenancePercent,', '      accuracyPercent:retrievalAccuracy,\n      denseCandidateRecallPercent,\n      provenancePercent,\n      proofRunId:retrievalProofRunId,\n      proofArtifactId:retrievalProofArtifactId,\n      proofZipSha256:retrievalProofZipSha256,');
          replaceOnce('methodology economic', "      topK:1,\n      blockIdsInRequesterQueries:false,", "      topK:1,\n      denseCandidateK:64,\n      cheapCandidateK:24,\n      confidenceDenseRankMax:15,\n      semanticRouting:'Gemini 3.1 Flash-Lite MINIMAL + Gemini 3 Flash MINIMAL agreement; fail closed to Gemini 3.1 Pro',\n      retrievalProofReuse:'full 360-case economic proof is SHA-256 verified; live cases independently rerun through the same router',\n      blockIdsInRequesterQueries:false,");
          replaceOnce('no block id instrumentation', "        payloadNoBlockId = payloadNoBlockId && !serializedInput.includes(item.id) && !serializedInput.includes(item.code) && !serializedInput.includes('\"ids\"');", "        payloadNoBlockId = payloadNoBlockId && !/semantic-record-\\d+/i.test(serializedInput) && !serializedInput.includes(item.id) && !serializedInput.includes('\"ids\"');");
          replaceOnce('routing baseline', '    const liveResults = [];', `    const routingStatsBeforeLive = structuredClone(semanticRouter.stats().rerankerStats || {});
            const liveResults = [];`);
          replaceOnce('routing delta', '    const allTruynActorMetrics = liveResults.flatMap((run) => Object.entries(run.truyn.actorMetrics).map(([alias,metric]) => ({ alias, ...metric })));', `    const routingStatsAfterLive = semanticRouter.stats().rerankerStats || {};
            const laneDelta = (name) => {
              const before = routingStatsBeforeLive?.[name] || {};
              const after = routingStatsAfterLive?.[name] || {};
              return {
                requests:(after.requests || 0) - (before.requests || 0),
                inputTokens:(after.inputTokens || 0) - (before.inputTokens || 0),
                outputTokens:(after.outputTokens || 0) - (before.outputTokens || 0),
                totalTokens:(after.totalTokens || 0) - (before.totalTokens || 0),
                requestBodyBytes:(after.requestBodyBytes || 0) - (before.requestBodyBytes || 0),
                providerLatencyMs:(after.providerLatencyMs || 0) - (before.providerLatencyMs || 0)
              };
            };
            const liveRouting = { lite:laneDelta('lite'), flash:laneDelta('flash'), verifier:laneDelta('verifier') };
            liveRouting.inputTokens = liveRouting.lite.inputTokens + liveRouting.flash.inputTokens + liveRouting.verifier.inputTokens;
            liveRouting.outputTokens = liveRouting.lite.outputTokens + liveRouting.flash.outputTokens + liveRouting.verifier.outputTokens;
            liveRouting.totalTokens = liveRouting.lite.totalTokens + liveRouting.flash.totalTokens + liveRouting.verifier.totalTokens;
            liveRouting.requestBodyBytes = liveRouting.lite.requestBodyBytes + liveRouting.flash.requestBodyBytes + liveRouting.verifier.requestBodyBytes;
            liveRouting.requests = liveRouting.lite.requests + liveRouting.flash.requests + liveRouting.verifier.requests;
            liveRouting.costUsd = Object.entries(semanticRoutingRates).reduce((total, [name, rate]) => total + (((liveRouting[name].inputTokens || 0) * rate.input) + ((liveRouting[name].outputTokens || 0) * rate.output)) / 1_000_000, 0);
            const allTruynActorMetrics = liveResults.flatMap((run) => Object.entries(run.truyn.actorMetrics).map(([alias,metric]) => ({ alias, ...metric })));`);
          replaceOnce('honest accounting', '    const directInputTokens = sum(liveResults, (run) => run.direct.inputTokens);\n    const truynInputTokens = sum(liveResults, (run) => run.truyn.inputTokens);\n    const directCost = sum(liveResults, (run) => run.direct.comparablePairCostUsd);\n    const truynCost = sum(liveResults, (run) => run.truyn.comparablePairCostUsd);', `    const directInputTokens = sum(liveResults, (run) => run.direct.inputTokens);
            const truynActorInputTokens = sum(liveResults, (run) => run.truyn.inputTokens);
            const truynInputTokens = truynActorInputTokens + liveRouting.inputTokens;
            const directCost = sum(liveResults, (run) => run.direct.comparablePairCostUsd);
            const truynActorCost = sum(liveResults, (run) => run.truyn.comparablePairCostUsd);
            const truynCost = truynActorCost + liveRouting.costUsd;
            const directProviderRequestBodyBytes = sum(liveResults, (run) => run.direct.providerRequestBodyBytes);
            const truynActorProviderRequestBodyBytes = sum(liveResults, (run) => run.truyn.providerRequestBodyBytes);
            const truynProviderRequestBodyBytes = truynActorProviderRequestBodyBytes + liveRouting.requestBodyBytes;`);
          replaceOnce('dense final check', '      retrievalAccuracy:retrievalAccuracy >= gate.retrievalAccuracyPercentMin,\n      perLanguageAccuracy:', '      retrievalAccuracy:retrievalAccuracy >= gate.retrievalAccuracyPercentMin,\n      denseCandidateRecall:denseCandidateRecallPercent >= gate.denseCandidateRecallPercentMin,\n      perLanguageAccuracy:');
          replaceOnce('live token report', '        directInputTokens,\n        truynInputTokens,\n        inputTokenReductionPercent,', `        directInputTokens,
            truynActorInputTokens,
            semanticRoutingInputTokens:liveRouting.inputTokens,
            semanticRoutingOutputTokens:liveRouting.outputTokens,
            semanticRoutingRequests:liveRouting.requests,
            semanticRouting:liveRouting,
            truynInputTokens,
            inputTokenReductionPercent,`);
          replaceOnce('live cost report', '        directComparablePairCostUsd:round(directCost, 9),\n        truynComparablePairCostUsd:round(truynCost, 9),', `        directComparablePairCostUsd:round(directCost, 9),
            truynActorComparablePairCostUsd:round(truynActorCost, 9),
            semanticRoutingCostUsd:round(liveRouting.costUsd, 9),
            truynComparablePairCostUsd:round(truynCost, 9),`);
          replaceOnce('provider body report', '        directProviderRequestBodyBytes:sum(liveResults, (run) => run.direct.providerRequestBodyBytes),\n        truynProviderRequestBodyBytes:sum(liveResults, (run) => run.truyn.providerRequestBodyBytes),\n        providerRequestBodyReductionPercent:reductionPercent(\n          sum(liveResults, (run) => run.direct.providerRequestBodyBytes),\n          sum(liveResults, (run) => run.truyn.providerRequestBodyBytes)\n        ),', `        directProviderRequestBodyBytes,
            truynActorProviderRequestBodyBytes,
            semanticRoutingProviderRequestBodyBytes:liveRouting.requestBodyBytes,
            truynProviderRequestBodyBytes,
            providerRequestBodyReductionPercent:reductionPercent(directProviderRequestBodyBytes, truynProviderRequestBodyBytes),`);
          replaceOnce('cost methodology', '        usdPerMillionTokens:comparableRates', '        usdPerMillionTokens:comparableRates,\n        semanticRoutingUsdPerMillionTokens:semanticRoutingRates,\n        semanticRoutingCostIncludedInTruynArm:true');
          fs.writeFileSync(path, source);
          NODE
          node --check benchmarks/semantic-retrieval-v2.js

      - name: Validate code before cloud spend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -name '*.test.js' ! -name 'public-repository.test.js' -print | sort)
          node --test "${tests[@]}"
          git diff --check -- core adapters node tests

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover Azure actors and raise temporary throughput
        shell: bash
        run: |
          set -euo pipefail
          gpt_account=''; gpt_dep=''; foundry_account=''; grok=''; deepseek=''; llama=''; mistral=''; kimi=''
          while IFS= read -r account; do
            deps="$(az cognitiveservices account deployment list -g "$AZURE_RG" -n "$account" -o json 2>/dev/null || echo '[]')"
            if [[ -z "$gpt_account" ]]; then
              candidate="$(jq -r '.[] | select(((.properties.model.name // "") | test("^gpt-4\\.1-mini$|^gpt-4o-mini$|^gpt-5.*mini$";"i")) and ((.properties.model.name // "") | test("image|sora";"i") | not)) | .name' <<<"$deps" | head -n1)"
              if [[ -n "$candidate" ]]; then gpt_account="$account"; gpt_dep="$candidate"; fi
            fi
            a="$(jq -r '.[] | select((.properties.model.name // "") | test("grok";"i")) | .name' <<<"$deps" | head -n1)"
            b="$(jq -r '.[] | select((.properties.model.name // "") | test("deepseek";"i")) | .name' <<<"$deps" | head -n1)"
            c="$(jq -r '.[] | select((.properties.model.name // "") | test("llama";"i")) | .name' <<<"$deps" | head -n1)"
            d="$(jq -r '.[] | select((.properties.model.name // "") | test("mistral";"i")) | .name' <<<"$deps" | head -n1)"
            e="$(jq -r '.[] | select((.properties.model.name // "") | test("kimi";"i")) | .name' <<<"$deps" | head -n1)"
            if [[ -n "$a" && -n "$b" && -n "$c" && -n "$d" && -n "$e" ]]; then foundry_account="$account"; grok="$a"; deepseek="$b"; llama="$c"; mistral="$d"; kimi="$e"; fi
          done < <(az cognitiveservices account list -g "$AZURE_RG" --query '[].name' -o tsv)
          [[ -n "$gpt_account" && -n "$gpt_dep" && -n "$foundry_account" && -n "$grok" && -n "$deepseek" && -n "$llama" && -n "$mistral" && -n "$kimi" ]]
          for value in "$gpt_account" "$gpt_dep" "$foundry_account" "$grok" "$deepseek" "$llama" "$mistral" "$kimi"; do echo "::add-mask::$value"; done
          gpt_endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$gpt_account" --query properties.endpoint -o tsv)"
          gpt_key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$gpt_account" --query key1 -o tsv)"; echo "::add-mask::$gpt_key"
          echo "AZURE_OPENAI_ENDPOINT=$gpt_endpoint" >> "$GITHUB_ENV"; echo "AZURE_OPENAI_API_KEY=$gpt_key" >> "$GITHUB_ENV"; echo "AZURE_OPENAI_DEPLOYMENT=$gpt_dep" >> "$GITHUB_ENV"
          endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$foundry_account" --query properties.endpoint -o tsv)"
          key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$foundry_account" --query key1 -o tsv)"; echo "::add-mask::$key"
          echo "FOUNDRY_ACCOUNT=$foundry_account" >> "$GITHUB_ENV"; echo "AZURE_FOUNDRY_ENDPOINT=$endpoint" >> "$GITHUB_ENV"; echo "AZURE_FOUNDRY_API_KEY=$key" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_GROK=$grok" >> "$GITHUB_ENV"; echo "AZURE_FOUNDRY_DEEPSEEK=$deepseek" >> "$GITHUB_ENV"; echo "AZURE_FOUNDRY_LLAMA=$llama" >> "$GITHUB_ENV"; echo "AZURE_FOUNDRY_MISTRAL=$mistral" >> "$GITHUB_ENV"; echo "AZURE_FOUNDRY_KIMI=$kimi" >> "$GITHUB_ENV"
          resize() {
            dep="$1"; cap="$2"
            data="$(az cognitiveservices account deployment show -g "$AZURE_RG" -n "$foundry_account" --deployment-name "$dep" -o json)"
            model="$(jq -r '.properties.model.name' <<<"$data")"; format="$(jq -r '.properties.model.format' <<<"$data")"; version="$(jq -r '.properties.model.version // empty' <<<"$data")"; sku="$(jq -r '.sku.name' <<<"$data")"
            args=(cognitiveservices account deployment create -g "$AZURE_RG" -n "$foundry_account" --deployment-name "$dep" --model-name "$model" --model-format "$format" --sku-name "$sku" --sku-capacity "$cap")
            [[ -n "$version" ]] && args+=(--model-version "$version")
            az "${args[@]}" >/dev/null
          }
          for dep in "$grok" "$deepseek" "$llama" "$mistral" "$kimi"; do resize "$dep" "$FOUNDRY_BENCH_CAPACITY"; done

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Prepare isolated Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"
          gcloud artifacts repositories create "$GCP_AR_REPO" --project="$GCP_PROJECT_ID_VALUE" --repository-format=docker --location="$GCP_PROXY_REGION" --quiet >/dev/null
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"; image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-live:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null && docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=4 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do if curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok == true' >/dev/null; then break; fi; [[ "$attempt" -lt 30 ]] || exit 1; sleep 2; done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"; echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"; echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"

      - name: Run full multilingual seven-actor Semantic Retrieval Gate v2
        run: node benchmarks/semantic-retrieval-v2.js

      - name: Print gate summary
        if: ${{ always() && hashFiles('semantic-retrieval-v2-economic-live.json') != '' }}
        run: jq '{benchmark,status,corpus,retrieval,actors,live,semanticRouterStats,embedding,semanticGate,comparableCostMethodology,methodology}' semantic-retrieval-v2-economic-live.json

      - name: Upload live evidence
        if: ${{ always() && hashFiles('semantic-retrieval-v2-economic-live.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-retrieval-v2-economic-live-${{ github.run_id }}
          path: semantic-retrieval-v2-economic-live.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce full v2 gate
        if: ${{ hashFiles('semantic-retrieval-v2-economic-live.json') != '' }}
        run: jq -e '.semanticGate.passed == true' semantic-retrieval-v2-economic-live.json >/dev/null

      - name: Delete isolated GCP benchmark resources
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
          gcloud artifacts repositories delete "$GCP_AR_REPO" --project="$GCP_PROJECT_ID_VALUE" --location="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true

      - name: Restore Foundry smoke capacity
        if: always()
        shell: bash
        run: |
          set +e
          account="${FOUNDRY_ACCOUNT:-}"; [[ -n "$account" ]] || exit 0
          resize_back() {
            dep="$1"; [[ -n "$dep" ]] || return 0
            data="$(az cognitiveservices account deployment show -g "$AZURE_RG" -n "$account" --deployment-name "$dep" -o json 2>/dev/null)" || return 0
            model="$(jq -r '.properties.model.name' <<<"$data")"; format="$(jq -r '.properties.model.format' <<<"$data")"; version="$(jq -r '.properties.model.version // empty' <<<"$data")"; sku="$(jq -r '.sku.name' <<<"$data")"
            args=(cognitiveservices account deployment create -g "$AZURE_RG" -n "$account" --deployment-name "$dep" --model-name "$model" --model-format "$format" --sku-name "$sku" --sku-capacity 1)
            [[ -n "$version" ]] && args+=(--model-version "$version")
            az "${args[@]}" >/dev/null 2>&1 || true
          }
          for dep in "${AZURE_FOUNDRY_GROK:-}" "${AZURE_FOUNDRY_DEEPSEEK:-}" "${AZURE_FOUNDRY_LLAMA:-}" "${AZURE_FOUNDRY_MISTRAL:-}" "${AZURE_FOUNDRY_KIMI:-}"; do resize_back "$dep"; done
