name: Ephemeral Semantic v2 Adaptive Full 360

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-adaptive-full.yml']

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-adaptive-${{ github.run_id }}
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Load immutable sources
        shell: bash
        run: |
          set -euo pipefail
          load_file(){ mkdir -p "$(dirname "$1")"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1?ref=$2" | jq -r '.content' | tr -d '\n' | base64 -d > "$1"; }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with: { project_id: '${{ env.GCP_PROJECT_ID_VALUE }}' }
      - name: Prepare isolated runtime-identity Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"; image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-adaptive:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null && docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for a in $(seq 1 30); do curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok==true' >/dev/null && break; [[ "$a" -lt 30 ]] || exit 1; sleep 2; done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"; echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"; echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"
      - name: Run 360-case adaptive semantic retrieval proof
        shell: bash
        run: |
          cat > semantic-v2-adaptive-full.mjs <<'NODE'
          import fs from 'node:fs';import vm from 'node:vm';import crypto from 'node:crypto';
          import {createVertexGeminiProvider} from './adapters/providers/vertex-gemini.js';import {createVertexEmbeddingClient} from './adapters/providers/vertex-embedding.js';
          const src=fs.readFileSync('benchmarks/semantic-retrieval-v2.js','utf8'),a=src.indexOf('const domains = ['),b=src.indexOf('const fullContext =');if(a<0||b<0)throw new Error('immutable corpus markers');const box={};vm.createContext(box);vm.runInContext('const corpusSize=600,retrievalCaseCount=360;'+src.slice(a,b)+';globalThis.__d={blocks,retrievalCases};',box);const {blocks,retrievalCases}=box.__d;
          const token=async()=>process.env.GCP_ACCESS_TOKEN,endpoint=process.env.VERTEX_API_ENDPOINT,projectId=process.env.GCP_PROJECT_ID;
          const lite=createVertexGeminiProvider({projectId,location:'global',model:'gemini-3.1-flash-lite',endpoint,accessTokenProvider:token,capabilities:['reasoning.general'],requestTimeoutMs:180000});
          const minimal=createVertexGeminiProvider({projectId,location:'global',model:'gemini-3-flash-preview',endpoint,accessTokenProvider:token,capabilities:['reasoning.general'],requestTimeoutMs:180000});
          const low=createVertexGeminiProvider({projectId,location:'global',model:'gemini-3-flash-preview',endpoint,accessTokenProvider:token,capabilities:['reasoning.general'],requestTimeoutMs:180000});
          const pro=createVertexGeminiProvider({projectId,location:'global',model:'gemini-3.1-pro-preview',endpoint,accessTokenProvider:token,capabilities:['reasoning.general'],requestTimeoutMs:180000});
          const emb=createVertexEmbeddingClient({projectId,location:'us-central1',model:'gemini-embedding-001',endpoint,accessTokenProvider:token,batchSize:1,outputDimensionality:768,maxRetries:10});
          const norm=v=>Math.sqrt(v.reduce((s,x)=>s+x*x,0)),cos=(x,y)=>{let d=0;for(let i=0;i<x.length;i++)d+=x[i]*y[i];const z=norm(x)*norm(y);return z?d/z:0;};async function ml(items,n,fn){const out=new Array(items.length);let next=0;async function w(){for(;;){const i=next++;if(i>=items.length)return;out[i]=await fn(items[i],i);}}await Promise.all(Array.from({length:Math.min(n,items.length)},w));return out;}
          const empty=()=>({requests:0,repairs:0,input:0,visibleOutput:0,thoughts:0,total:0,requestBytes:0,latencyMs:0}),usage={lite:empty(),minimal:empty(),low:empty(),pro:empty()};function take(e){const u=e.metadata?.usage||{};return{input:u.promptTokenCount||0,visibleOutput:u.candidatesTokenCount||0,thoughts:u.thoughtsTokenCount||0,total:u.totalTokenCount||0,requestBytes:e.metadata?.providerRequestBodyBytes||0,latencyMs:e.metadata?.providerLatencyMs||0}}function add(k,u){usage[k].requests++;for(const f of ['input','visibleOutput','thoughts','total','requestBytes','latencyMs'])usage[k][f]+=u[f]||0}
          const instruction='Choose the passage matching the complete operational meaning of the query. Every material constraint matters: real-world domain, controlled action, and condition/state. A near-duplicate that conflicts on one material constraint is wrong. Ignore ANSWER_CODE as a retrieval signal.';
          function parse(text){try{return JSON.parse(String(text).trim())}catch{return null}}
          async function pickOne(provider,key,question,payload,thinkingLevel,maxOutputTokens=512){for(let attempt=1;attempt<=2;attempt++){const e=await provider.execute({capability:'reasoning.general',input:{task:instruction+` Return JSON only: {"id":"..."} using exactly one supplied local label.${attempt>1?' Previous output was invalid; obey the contract exactly.':''}`,context:JSON.stringify({query:question,candidates:payload})},policy:{providerOptions:{thinkingLevel,temperature:0,maxOutputTokens:attempt===1?maxOutputTokens:1024,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{id:{type:'STRING'}},required:['id']}}}});const u=take(e);add(key,u);const p=parse(e.output),allowed=new Set(payload.map(x=>x.id));if(allowed.has(p?.id))return p.id;usage[key].repairs++;}return null}
          async function shortlist(question,payload){for(let attempt=1;attempt<=2;attempt++){const e=await low.execute({capability:'reasoning.general',input:{task:instruction+` Return JSON only: {"ids":[...]}. Return exactly 3 distinct supplied local labels best-first.${attempt>1?' Previous output was invalid; obey the contract exactly.':''}`,context:JSON.stringify({query:question,candidates:payload})},policy:{providerOptions:{thinkingLevel:'LOW',temperature:0,maxOutputTokens:attempt===1?1024:1536,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{ids:{type:'ARRAY',items:{type:'STRING'}}},required:['ids']}}}});const u=take(e);add('low',u);const p=parse(e.output),allowed=new Set(payload.map(x=>x.id)),ids=Array.isArray(p?.ids)?[...new Set(p.ids.filter(x=>allowed.has(x)))].slice(0,3):[];if(ids.length===3)return ids;usage.low.repairs++;}return[]}
          async function finalPro(question,payload){for(let attempt=1;attempt<=2;attempt++){const e=await pro.execute({capability:'reasoning.general',input:{task:instruction+` Choose exactly one. Return JSON only: {"id":"..."} using one supplied local label.${attempt>1?' Previous output was invalid; obey the contract exactly.':''}`,context:JSON.stringify({query:question,candidates:payload})},policy:{providerOptions:{temperature:0,maxOutputTokens:attempt===1?1024:1536,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{id:{type:'STRING'}},required:['id']}}}});const u=take(e);add('pro',u);const p=parse(e.output),allowed=new Set(payload.map(x=>x.id));if(allowed.has(p?.id))return p.id;usage.pro.repairs++;}return null}
          process.stderr.write('Embedding 600 authoritative blocks...\n');const dv=await ml(blocks,8,async x=>(await emb.embedMany([x.text],{taskType:'RETRIEVAL_DOCUMENT'}))[0]);process.stderr.write('Embedding 360 natural-language queries...\n');const qv=await ml(retrievalCases,8,async x=>(await emb.embedMany([x.question],{taskType:'RETRIEVAL_QUERY'}))[0]);
          const dense24=retrievalCases.map((item,qi)=>blocks.map((x,i)=>({id:x.id,text:x.text,score:cos(qv[qi],dv[i])})).sort((x,y)=>y.score-x.score||x.id.localeCompare(y.id)).slice(0,24));
          let done=0;const rows=await ml(retrievalCases,4,async(item,qi)=>{const dense=dense24[qi],payload=dense.map((c,i)=>({id:`c${i.toString(36)}`,text:c.text})),real=new Map(payload.map((p,i)=>[p.id,dense[i].id]));const serialized=JSON.stringify({query:item.question,candidates:payload});const noBlockId=!/semantic-record-\d+/i.test(serialized)&&!serialized.includes(item.id)&&!serialized.includes('"ids"');const [a,b]=await Promise.all([pickOne(lite,'lite',item.question,payload,'MINIMAL'),pickOne(minimal,'minimal',item.question,payload,'MINIMAL')]);let selectedAlias=null,mode='cheap_agreement',lowIds=[],proAlias=null;if(a&&b&&a===b){selectedAlias=a}else{mode='disagreement_fallback';lowIds=await shortlist(item.question,payload);if(lowIds.length===3){const shortPayload=lowIds.map(id=>payload.find(x=>x.id===id));proAlias=await finalPro(item.question,shortPayload);selectedAlias=proAlias}}const selectedId=selectedAlias?real.get(selectedAlias):null,candidateRecall=dense.some(x=>x.id===item.id),selectedBlock=blocks.find(x=>x.id===selectedId),provenancePass=!!selectedBlock&&selectedBlock.id===selectedId;done++;if(done%20===0)process.stderr.write(`processed ${done}/360\n`);return{caseIndex:item.caseIndex,id:item.id,code:item.code,blockLanguage:item.blockLanguage,queryLanguage:item.queryLanguage,category:item.category,question:item.question,denseCandidateRecall:candidateRecall,denseRank:candidateRecall?dense.findIndex(x=>x.id===item.id)+1:null,liteSelectedId:a?real.get(a):null,minimalSelectedId:b?real.get(b):null,mode,lowShortlistIds:lowIds.map(id=>real.get(id)),proSelectedId:proAlias?real.get(proAlias):null,selectedId,correct:selectedId===item.id,provenancePass,noBlockId,minimalContext:true};});
          const summarize=(field)=>Object.fromEntries([...new Set(rows.map(r=>r[field]))].sort().map(v=>{const rs=rows.filter(r=>r[field]===v),c=rs.filter(r=>r.correct).length;return[v,{correct:c,total:rs.length,accuracyPercent:Number((100*c/rs.length).toFixed(3))}]}));const correct=rows.filter(r=>r.correct).length,denseRecall=rows.filter(r=>r.denseCandidateRecall).length,disagreements=rows.filter(r=>r.mode==='disagreement_fallback').length,prov=rows.filter(r=>r.provenancePass).length,nob=rows.filter(r=>r.noBlockId).length,minc=rows.filter(r=>r.minimalContext).length;
          const rates={lite:{input:0.25,output:1.5},minimal:{input:0.5,output:3},low:{input:0.5,output:3},pro:{input:2,output:12}};const costs={};let routingCost=0;for(const k of Object.keys(rates)){const u=usage[k],cost=u.input/1e6*rates[k].input+(u.visibleOutput+u.thoughts)/1e6*rates[k].output;costs[k]=Number(cost.toFixed(9));routingCost+=cost}const semanticGate={accuracyPercent:Number((100*correct/rows.length).toFixed(3)),denseRecallPercent:Number((100*denseRecall/rows.length).toFixed(3)),perLanguage:summarize('queryLanguage'),perCategory:summarize('category'),provenancePercent:Number((100*prov/rows.length).toFixed(3)),noBlockIdPercent:Number((100*nob/rows.length).toFixed(3)),minimalContextPercent:Number((100*minc/rows.length).toFixed(3)),fallbackCount:disagreements,fallbackPercent:Number((100*disagreements/rows.length).toFixed(3)),passed:correct/rows.length>=0.99&&Object.values(summarize('queryLanguage')).every(x=>x.accuracyPercent>=99)&&Object.values(summarize('category')).every(x=>x.accuracyPercent>=99)&&prov===rows.length&&nob===rows.length&&minc===rows.length};
          const report={benchmark:'TRUYN Semantic Retrieval Gate v2 adaptive full 360 retrieval proof',generatedAt:new Date().toISOString(),sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,corpus:{blocks:blocks.length,cases:rows.length},methodology:{candidateK:24,cheapJudges:['gemini-3.1-flash-lite MINIMAL','gemini-3-flash-preview MINIMAL'],agreement:'accept only identical cheap top1',fallback:'on disagreement only: gemini-3-flash-preview LOW top3 -> gemini-3.1-pro-preview HIGH top1',providerPrivacy:'external judges receive question plus request-local aliases and passage text; never TRUYN block IDs or expected labels'},embedding:emb.stats(),usage,ratesUsdPerMillionTokens:rates,costsUsd:costs,semanticRoutingCostUsd:Number(routingCost.toFixed(9)),semanticRoutingCostUsdPerQuery:Number((routingCost/rows.length).toFixed(9)),semanticGate,rows};fs.writeFileSync('semantic-v2-adaptive-full.json',JSON.stringify(report,null,2));console.log(JSON.stringify({semanticGate,usage,costsUsd:costs,semanticRoutingCostUsd:report.semanticRoutingCostUsd,semanticRoutingCostUsdPerQuery:report.semanticRoutingCostUsdPerQuery},null,2));if(!semanticGate.passed)process.exitCode=2;
          NODE
          node semantic-v2-adaptive-full.mjs
      - name: Upload full raw evidence
        if: ${{ always() && hashFiles('semantic-v2-adaptive-full.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-adaptive-full-${{ github.run_id }}
          path: semantic-v2-adaptive-full.json
          retention-days: 30
      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
