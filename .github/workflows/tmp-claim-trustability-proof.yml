name: Claim Trustability v1 Proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trustability-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run claim Trustability resistance benchmark
        env:
          TRUSTABILITY_CASES_PER_SCENARIO: '100'
          TRUSTABILITY_OUTPUT: claim-trustability-v1.json
        run: node benchmarks/claim-trustability-v1.js
      - name: Hash evidence
        run: sha256sum claim-trustability-v1.json | tee claim-trustability-v1.sha256
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: truyn-claim-trustability-v1-${{ github.run_id }}
          path: |
            claim-trustability-v1.json
            claim-trustability-v1.sha256
          if-no-files-found: error
          retention-days: 30
