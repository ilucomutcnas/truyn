name: Cloud PoC Vertex Claude Private Service

on:
  push:
    branches:
      - main
    paths:
      - 'runtime/vertex-claude-probe-service.js'
      - '.github/workflows/cloud-poc-vertex-claude-private-service.yml'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_SERVICE: truyn-claude-private-probe
      CLAUDE_VERTEX_MODEL: claude-sonnet-4-6
      CLAUDE_VERTEX_LOCATION: global
      CLAUDE_PUBLISHER_MODEL: publishers/anthropic/models/claude-sonnet-4-6
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate deployer through WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Enable required Google APIs
        shell: bash
        run: |
          set -euo pipefail
          gcloud services enable \
            aiplatform.googleapis.com \
            cloudcommerceconsumerprocurement.googleapis.com \
            --project="$GCP_PROJECT_ID_VALUE" \
            --quiet
          echo 'CLAUDE_REQUIRED_APIS=enabled'

      - name: Grant least privileges for partner-model bootstrap and runtime
        shell: bash
        run: |
          set -euo pipefail
          gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID_VALUE" \
            --member="serviceAccount:${GCP_DEPLOYER_SA_VALUE}" \
            --role='roles/consumerprocurement.entitlementManager' \
            --condition=None \
            --quiet >/dev/null
          gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID_VALUE" \
            --member="serviceAccount:${GCP_RUNTIME_SA_VALUE}" \
            --role='roles/aiplatform.user' \
            --condition=None \
            --quiet >/dev/null
          echo 'CLAUDE_BOOTSTRAP_IAM=ready'

      - name: Accept Claude Model Garden EULA and enable model
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"

          eula_code="$(curl -sS -o eula.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            --data "{\"publisherModel\":\"${CLAUDE_PUBLISHER_MODEL}\"}" \
            "https://aiplatform.googleapis.com/v1beta1/projects/${GCP_PROJECT_ID_VALUE}/modelGardenEula:accept")"
          echo "CLAUDE_EULA_HTTP=$eula_code"
          jq '{publisherModel, eulaAcceptanceState, error}' eula.json 2>/dev/null || cat eula.json
          if [[ "$eula_code" -lt 200 || "$eula_code" -ge 300 ]]; then
            exit 1
          fi

          enable_code="$(curl -sS -o enable.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "https://aiplatform.googleapis.com/v1beta1/projects/${GCP_PROJECT_ID_VALUE}/${CLAUDE_PUBLISHER_MODEL}:enableModel")"
          echo "CLAUDE_ENABLE_HTTP=$enable_code"
          jq '{publisherEndpoint, enablementState, error}' enable.json 2>/dev/null || cat enable.json
          if [[ "$enable_code" -lt 200 || "$enable_code" -ge 300 ]]; then
            exit 1
          fi
          state="$(jq -r '.enablementState // empty' enable.json)"
          [[ "$state" == 'ENABLEMENT_STATE_SUCCEEDED' ]] || { echo "CLAUDE_ENABLE_STATE=${state:-missing}"; exit 1; }
          echo 'CLAUDE_MODEL_GARDEN_ACCESS=enabled'

      - name: Build and push private probe image
        shell: bash
        run: |
          set -euo pipefail
          registry="${GCP_RUNTIME_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/truyn-claude-private-probe:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -t "$image" .
          docker push "$image"
          echo "CLAUDE_PROBE_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy authenticated probe under runtime identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID_VALUE" \
            --region="$GCP_RUNTIME_REGION" \
            --image="$CLAUDE_PROBE_IMAGE" \
            --service-account="$GCP_RUNTIME_SA_VALUE" \
            --command=node \
            --args=runtime/vertex-claude-probe-service.js \
            --set-env-vars="GCP_PROJECT_ID=${GCP_PROJECT_ID_VALUE},CLAUDE_VERTEX_MODEL=${CLAUDE_VERTEX_MODEL},CLAUDE_VERTEX_LOCATION=${CLAUDE_VERTEX_LOCATION}" \
            --port=8080 \
            --min=0 \
            --max=1 \
            --no-allow-unauthenticated \
            --quiet
          gcloud run services add-iam-policy-binding "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID_VALUE" \
            --region="$GCP_RUNTIME_REGION" \
            --member="serviceAccount:${GCP_DEPLOYER_SA_VALUE}" \
            --role='roles/run.invoker' \
            --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID_VALUE" \
            --region="$GCP_RUNTIME_REGION" \
            --format='value(status.url)')"
          [[ -n "$url" ]] || { echo 'CLAUDE_PROBE_URL=missing'; exit 1; }
          echo "CLAUDE_PROBE_URL=$url" >> "$GITHUB_ENV"
          echo 'CLAUDE_PRIVATE_SERVICE_DEPLOY=success'

      - name: Mint short-lived Cloud Run identity token
        id: invoke_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          token_format: id_token
          id_token_audience: ${{ env.CLAUDE_PROBE_URL }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Invoke authenticated runtime probe
        shell: bash
        env:
          CLAUDE_PROBE_ID_TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          [[ -n "${CLAUDE_PROBE_ID_TOKEN:-}" ]] || { echo 'CLAUDE_PROBE_ID_TOKEN=missing'; exit 1; }
          http_code="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLAUDE_PROBE_ID_TOKEN}" \
            "${CLAUDE_PROBE_URL}/probe")"
          echo "CLAUDE_PRIVATE_PROBE_HTTP=$http_code"
          jq . response.json
          if [[ "$http_code" != '200' ]]; then
            exit 1
          fi
          jq -e '.ok == true and .marker == "TRUYN_VERTEX_CLAUDE_OK" and .publicRelayExposure == false' response.json >/dev/null
          echo 'VERTEX_CLAUDE_PRIVATE_PROOF=success'
          echo 'VERTEX_CLAUDE_IDENTITY=runtime-service-account'
          echo 'VERTEX_CLAUDE_PUBLIC_RELAY_EXPOSURE=false'

      - name: Remove private probe service
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID_VALUE" \
            --region="$GCP_RUNTIME_REGION" \
            --quiet >/dev/null 2>&1 || true
          echo 'VERTEX_CLAUDE_PRIVATE_SERVICE_CLEANUP=done'
