name: tmp-class-d100-v17-main-pinned

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d100-v17-main-pinned.yml'

permissions:
  contents: read
  actions: read
  id-token: write
  issues: write

concurrency:
  group: class-d100-v17-single-shot
  cancel-in-progress: false

env:
  TESTED_COMMIT: ea1753ab6eb12f2c7361740d98f3d08a067bd7c5
  SECURITY_GREEN_RUN: '32582970511'
  IMMUTABLE_PREFLIGHT_RUN: '32583171432'
  IMMUTABLE_PREFLIGHT_WORKFLOW_SHA: 0207f6b6bb96155beadec917658efa8667470aff
  IMMUTABLE_PREFLIGHT_ARTIFACT_ID: '9478337894'
  IMMUTABLE_PREFLIGHT_ARTIFACT: truyn-class-d100-v17-preflight-32583171432
  IMMUTABLE_PREFLIGHT_DIGEST: 'sha256:5617cbbd535726e4008cde823ad45107ecc5e7263b2f41bf4ad96abefe8edcd8'

jobs:
  accepted-d100-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Enforce one-shot launch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          test "$(jq '.files | length' <<<"$commit_json")" = '1'
          test "$(jq -r '.files[0].filename' <<<"$commit_json")" = '.github/workflows/tmp-class-d100-v17-main-pinned.yml'
          test "$(jq -r '.files[0].status' <<<"$commit_json")" = 'added'

      - name: Record accepted run start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body="run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} workflow_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} security_green_run=${SECURITY_GREEN_RUN} immutable_preflight_run=${IMMUTABLE_PREFLIGHT_RUN} immutable_preflight_artifact_id=${IMMUTABLE_PREFLIGHT_ARTIFACT_ID} immutable_preflight_digest=${IMMUTABLE_PREFLIGHT_DIGEST} stage=accepted_d100_v17_started"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-100 V17 MAIN-PINNED RUN STARTED' -f "body=${body}" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ea1753ab6eb12f2c7361740d98f3d08a067bd7c5
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact immutable prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          TRUYN_LOCAL_DEVELOPMENT: '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.head_branch')" = 'main'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.head_sha')" = "$TESTED_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.name')" = 'CI'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.event')" = 'push'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.status')" = 'completed'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_GREEN_RUN}" --jq '.conclusion')" = 'success'

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMMUTABLE_PREFLIGHT_RUN}" --jq '.head_sha')" = "$IMMUTABLE_PREFLIGHT_WORKFLOW_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMMUTABLE_PREFLIGHT_RUN}" --jq '.event')" = 'push'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMMUTABLE_PREFLIGHT_RUN}" --jq '.status')" = 'completed'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMMUTABLE_PREFLIGHT_RUN}" --jq '.conclusion')" = 'success'

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMMUTABLE_PREFLIGHT_RUN}/artifacts")"
          test "$(jq -r --arg id "$IMMUTABLE_PREFLIGHT_ARTIFACT_ID" '.artifacts[] | select((.id|tostring)==$id) | .name' <<<"$artifact_json")" = "$IMMUTABLE_PREFLIGHT_ARTIFACT"
          test "$(jq -r --arg id "$IMMUTABLE_PREFLIGHT_ARTIFACT_ID" '.artifacts[] | select((.id|tostring)==$id) | .digest' <<<"$artifact_json")" = "$IMMUTABLE_PREFLIGHT_DIGEST"

          extras="$(find .github/workflows -maxdepth 1 -type f ! -name ci.yml ! -name .gitkeep -printf '%f\n' | sort)"
          test -z "$extras"

          npm install --ignore-scripts --no-audit --no-fund
          npm test
          git diff --check

          for f in \
            scripts/class-d-100-accepted-entrypoint.sh \
            scripts/class-d-100-final-acceptance.sh \
            scripts/class-d-100-v10-acceptance.sh \
            scripts/class-d-100-v11-acceptance.sh \
            scripts/class-d-100-v12-acceptance.sh \
            scripts/class-d-100-v13-acceptance.sh \
            scripts/lib/class-d-run-command.sh \
            benchmarks/scale/class-d-azure-100-provision.sh \
            benchmarks/scale/class-d-azure-100-campaign.sh; do
            bash -n "$f"
          done

          TRUYN_CLASS_D100_PREPARE_ONLY=1 bash scripts/class-d-100-accepted-entrypoint.sh | tee class-d-100-v17-prerun.txt
          node --check benchmarks/scale/evaluate-class-d-evidence.js
          node --check benchmarks/scale/verify-class-d-terminal.js

          grep -q 'baselineRoutingSuccess: 0.99' benchmarks/scale/class-d.js
          grep -q 'healedRoutingSuccess: 0.99' benchmarks/scale/class-d.js
          grep -q 'recoveryP95Ms: 120_000' benchmarks/scale/class-d.js
          grep -q 'convergenceP95Ms: 120_000' benchmarks/scale/class-d.js
          grep -q 'acknowledgedWriteLossMax: 0' benchmarks/scale/class-d.js
          grep -q 'invalidSignedStateAcceptedMax: 0' benchmarks/scale/class-d.js
          grep -q 'staleRevokedReceiptAcceptedMax: 0' benchmarks/scale/class-d.js
          grep -q 'minimumHostCount: 4' benchmarks/scale/class-d.js
          grep -q 'nodeCount: 100' benchmarks/scale/class-d.js
          grep -q 'class-d-100-v13-acceptance.sh' scripts/class-d-100-accepted-entrypoint.sh

          {
            printf 'tested_commit=%s\n' "$TESTED_COMMIT"
            printf 'launcher_commit=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'security_green_run=%s\n' "$SECURITY_GREEN_RUN"
            printf 'immutable_preflight_run=%s\n' "$IMMUTABLE_PREFLIGHT_RUN"
            printf 'immutable_preflight_workflow_sha=%s\n' "$IMMUTABLE_PREFLIGHT_WORKFLOW_SHA"
            printf 'immutable_preflight_artifact_id=%s\n' "$IMMUTABLE_PREFLIGHT_ARTIFACT_ID"
            printf 'immutable_preflight_artifact=%s\n' "$IMMUTABLE_PREFLIGHT_ARTIFACT"
            printf 'immutable_preflight_digest=%s\n' "$IMMUTABLE_PREFLIGHT_DIGEST"
            printf 'accepted_entrypoint=V13->V12->V11->V10->final\n'
            printf 'application_retry_added=false\n'
          } > class-d-100-v17-input-tuple.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute one real 4-host 100-node accepted campaign
        id: campaign
        continue-on-error: true
        env:
          TRUYN_TESTED_COMMIT: ea1753ab6eb12f2c7361740d98f3d08a067bd7c5
          TRUYN_AZURE_RESOURCE_GROUP: truyn
        shell: bash
        run: |
          set -o pipefail
          bash scripts/class-d-100-accepted-entrypoint.sh 2>&1 | tee class-d-100-run.log

      - name: Canonical post-cleanup evaluation and strict terminal verification
        id: terminal
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f class-d-100-evidence.json ]]; then
            node benchmarks/scale/evaluate-class-d-evidence.js class-d-100-evidence.json >class-d-100-evaluation.json 2>class-d-100-evaluation.stderr
            evaluator_rc=$?
            node benchmarks/scale/verify-class-d-terminal.js class-d-100-evidence.json >class-d-100-terminal.json 2>class-d-100-terminal.stderr
            terminal_rc=$?
          else
            evaluator_rc=99
            terminal_rc=99
            printf '%s\n' '{"ok":false,"error":"class_d_evidence_missing"}' >class-d-100-evaluation.json
            printf '%s\n' '{"ok":false,"error":"class_d_terminal_evidence_missing"}' >class-d-100-terminal.json
          fi
          campaign_outcome='${{ steps.campaign.outcome }}'
          printf 'campaign_outcome=%s\nevaluator_rc=%s\nterminal_rc=%s\ntested_commit=%s\nworkflow_sha=%s\nrun_id=%s\nsecurity_green_run=%s\nimmutable_preflight_run=%s\nimmutable_preflight_artifact_id=%s\nimmutable_preflight_digest=%s\n' \
            "$campaign_outcome" "$evaluator_rc" "$terminal_rc" "$TESTED_COMMIT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SECURITY_GREEN_RUN" "$IMMUTABLE_PREFLIGHT_RUN" "$IMMUTABLE_PREFLIGHT_ARTIFACT_ID" "$IMMUTABLE_PREFLIGHT_DIGEST" \
            >class-d-100-v17-summary.txt
          echo "evaluator_rc=$evaluator_rc" >>"$GITHUB_OUTPUT"
          echo "terminal_rc=$terminal_rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-class-d100-v17-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            class-d-100-v17-input-tuple.txt
            class-d-100-v17-prerun.txt
            class-d-100-run.log
            class-d-100-evidence.json
            class-d-100-evaluation.json
            class-d-100-evaluation.stderr
            class-d-100-terminal.json
            class-d-100-terminal.stderr
            class-d-100-v17-summary.txt

      - name: Record terminal marker
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL_RC: ${{ steps.terminal.outputs.terminal_rc }}
          EVALUATOR_RC: ${{ steps.terminal.outputs.evaluator_rc }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        shell: bash
        run: |
          if [[ "$CAMPAIGN_OUTCOME" == success && "$TERMINAL_RC" == 0 && "$EVALUATOR_RC" == 0 ]]; then result=PASS; else result=FAIL; fi
          body="run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} workflow_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} security_green_run=${SECURITY_GREEN_RUN} immutable_preflight_run=${IMMUTABLE_PREFLIGHT_RUN} immutable_preflight_artifact_id=${IMMUTABLE_PREFLIGHT_ARTIFACT_ID} immutable_preflight_digest=${IMMUTABLE_PREFLIGHT_DIGEST} result=${result} campaign_outcome=${CAMPAIGN_OUTCOME:-missing} evaluator_rc=${EVALUATOR_RC:-missing} terminal_rc=${TERMINAL_RC:-missing} artifact_name=truyn-class-d100-v17-${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f "title=TRUYN CLASS D-100 V17 MAIN-PINNED ${result}" -f "body=${body}" >/dev/null

      - name: Strict accepted gate
        if: always()
        env:
          TERMINAL_RC: ${{ steps.terminal.outputs.terminal_rc }}
          EVALUATOR_RC: ${{ steps.terminal.outputs.evaluator_rc }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$CAMPAIGN_OUTCOME" = success
          test "$EVALUATOR_RC" = 0
          test "$TERMINAL_RC" = 0
          node benchmarks/scale/verify-class-d-terminal.js class-d-100-evidence.json
