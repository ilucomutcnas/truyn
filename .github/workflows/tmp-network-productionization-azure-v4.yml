name: Temporary Network Productionization Azure v4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-network-productionization-azure-v4.yml']
permissions:
  contents: read
  id-token: write
jobs:
  azure-multihost:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TEST_COMMIT: 8cdadc3243803a53e45ec07f61ad6c5d0ad703f4
      LOCATION: eastus2
      VM_SIZE: Standard_B1ms
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Four-host public QUIC gate
        shell: bash
        run: |
          set -Eeuo pipefail
          for ns in Microsoft.Network Microsoft.Compute; do
            state="$(az provider show --namespace "$ns" --query registrationState -o tsv --only-show-errors)"
            echo "TRUYN_AZURE_PROVIDER namespace=$ns state=$state"
            [[ "$state" == Registered ]] || exit 9
          done
          RG="$(az group list --query "[?contains(name, 'truyn')].name | [0]" -o tsv)"
          [[ -n "$RG" ]] || exit 10
          echo "::add-mask::$RG"
          PREFIX="truyn-net-${GITHUB_RUN_ID}"; NSG="${PREFIX}-nsg"; VNET="${PREFIX}-vnet"; SUBNET="${PREFIX}-subnet"
          VMS=(); IPS=(); NODEIDS=(); RECORDS=(); gate_ok=0
          cleanup(){
            set +e
            for vm in "${VMS[@]:-}"; do [[ -z "$vm" ]] || az vm delete -g "$RG" -n "$vm" --yes --force-deletion --only-show-errors >/dev/null 2>&1 || true; done
            for kind in public-ip nic; do
              if [[ "$kind" == public-ip ]]; then ids="$(az network public-ip list -g "$RG" --query "[?starts_with(name, '$PREFIX')].id" -o tsv 2>/dev/null || true)"; else ids="$(az network nic list -g "$RG" --query "[?starts_with(name, '$PREFIX')].id" -o tsv 2>/dev/null || true)"; fi
              [[ -z "$ids" ]] || az resource delete --ids $ids --only-show-errors >/dev/null 2>&1 || true
            done
            ids="$(az disk list -g "$RG" --query "[?starts_with(name, '$PREFIX')].id" -o tsv 2>/dev/null || true)"; [[ -z "$ids" ]] || az resource delete --ids $ids --only-show-errors >/dev/null 2>&1 || true
            az network vnet delete -g "$RG" -n "$VNET" --only-show-errors >/dev/null 2>&1 || true
            az network nsg delete -g "$RG" -n "$NSG" --only-show-errors >/dev/null 2>&1 || true
            if [[ "$gate_ok" == 1 ]]; then echo 'TRUYN_AZURE_MULTIHOST_CLEANUP=PASS'; else echo 'TRUYN_AZURE_MULTIHOST_CLEANUP=EXECUTED_AFTER_FAILURE'; fi
          }
          trap cleanup EXIT
          az network nsg create -g "$RG" -n "$NSG" -l "$LOCATION" --only-show-errors >/dev/null
          az network nsg rule create -g "$RG" --nsg-name "$NSG" -n allow-quic --priority 100 --access Allow --direction Inbound --protocol Udp --source-address-prefixes Internet --source-port-ranges '*' --destination-address-prefixes '*' --destination-port-ranges 4433 --only-show-errors >/dev/null
          az network vnet create -g "$RG" -n "$VNET" -l "$LOCATION" --address-prefixes 10.244.0.0/16 --subnet-name "$SUBNET" --subnet-prefixes 10.244.1.0/24 --only-show-errors >/dev/null
          for i in 0 1 2 3; do
            vm="${PREFIX}-${i}"; pip="${PREFIX}-${i}-pip"; nic="${PREFIX}-${i}-nic"; VMS+=("$vm")
            echo "::add-mask::$vm"; echo "::add-mask::$pip"; echo "::add-mask::$nic"
            az network public-ip create -g "$RG" -n "$pip" -l "$LOCATION" --sku Standard --allocation-method Static --only-show-errors >/dev/null
            az network nic create -g "$RG" -n "$nic" -l "$LOCATION" --vnet-name "$VNET" --subnet "$SUBNET" --network-security-group "$NSG" --public-ip-address "$pip" --only-show-errors >/dev/null
            az vm create -g "$RG" -n "$vm" -l "$LOCATION" --image Ubuntu2204 --size "$VM_SIZE" --admin-username truynadmin --generate-ssh-keys --nics "$nic" --os-disk-delete-option Delete --tags "truyn-ephemeral-run=${GITHUB_RUN_ID}" --only-show-errors >/dev/null
            ip="$(az network public-ip show -g "$RG" -n "$pip" --query ipAddress -o tsv)"; IPS+=("$ip"); echo "::add-mask::$ip"
          done
          remote(){ az vm run-command invoke -g "$RG" -n "$1" --command-id RunShellScript --scripts "$2" --query 'value[0].message' -o tsv --only-show-errors; }
          call(){
            local vm="$1" method="$2" path="$3" payload="${4:-}" enc='' out result script
            [[ -z "$payload" ]] || enc="$(printf '%s' "$payload" | base64 -w0)"
            if [[ -n "$enc" ]]; then script="set -euo pipefail; R=\$(printf '%s' '$enc'|base64 -d|curl -fsS --max-time 120 -X '$method' -H 'content-type: application/json' --data-binary @- 'http://127.0.0.1:8788$path'); printf 'TRUYN_RESULT=%s\\n' \"\$R\""; else script="set -euo pipefail; R=\$(curl -fsS --max-time 120 -X '$method' 'http://127.0.0.1:8788$path'); printf 'TRUYN_RESULT=%s\\n' \"\$R\""; fi
            out="$(remote "$vm" "$script")"; result="$(printf '%s\n' "$out"|sed -n 's/^TRUYN_RESULT=//p'|tail -1)"; [[ -n "$result" ]] || return 1; printf '%s' "$result"
          }
          for i in 0 1 2 3; do
            vm="${VMS[$i]}"; ip="${IPS[$i]}"
            setup=$(cat <<SCRIPT
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq; apt-get install -y -qq git curl jq openssl ca-certificates >/dev/null
          major=0; command -v node >/dev/null && major=\$(node -p 'parseInt(process.versions.node)' 2>/dev/null || echo 0)
          if [[ "\$major" -lt 22 ]]; then curl -fsSL https://deb.nodesource.com/setup_22.x|bash - >/dev/null; apt-get install -y -qq nodejs >/dev/null; fi
          id -u truyn >/dev/null 2>&1 || useradd --system --home /var/lib/truyn-testnet --shell /usr/sbin/nologin truyn
          rm -rf /opt/truyn; git clone -q https://github.com/inn-media/truyn.git /opt/truyn; cd /opt/truyn; git checkout -q '$TEST_COMMIT'; npm install --ignore-scripts --no-audit --no-fund >/dev/null
          install -d -m 0700 -o truyn -g truyn /var/lib/truyn-testnet /etc/truyn-testnet
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /etc/truyn-testnet/key.pem -out /etc/truyn-testnet/cert.pem -subj '/CN=${ip}' -days 1 -addext 'subjectAltName=IP:${ip}' >/dev/null 2>&1
          chown truyn:truyn /etc/truyn-testnet/*; chmod 0600 /etc/truyn-testnet/key.pem
          cat >/etc/systemd/system/truyn-testnet.service <<UNIT
          [Unit]
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=truyn
          Group=truyn
          WorkingDirectory=/opt/truyn
          Environment=TRUYN_TESTNET_DATA_DIR=/var/lib/truyn-testnet
          Environment=TRUYN_TLS_KEY_PATH=/etc/truyn-testnet/key.pem
          Environment=TRUYN_TLS_CERT_PATH=/etc/truyn-testnet/cert.pem
          Environment=TRUYN_ADVERTISE_HOST=${ip}
          Environment=TRUYN_QUIC_HOST=0.0.0.0
          Environment=TRUYN_QUIC_PORT=4433
          Environment=TRUYN_CONTROL_HOST=127.0.0.1
          Environment=TRUYN_CONTROL_PORT=8788
          Environment=TRUYN_DHT_REPLICATION_FACTOR=3
          Environment=TRUYN_DHT_WRITE_QUORUM=3
          Environment=TRUYN_DHT_RPC_TIMEOUT_MS=5000
          Environment=TRUYN_TESTNET_FAULT_CONTROL=1
          ExecStart=/usr/bin/node /opt/truyn/network/testnet/node-service.js
          Restart=on-failure
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload; systemctl enable --now truyn-testnet.service >/dev/null
          for n in \$(seq 1 60); do curl -fsS --max-time 2 http://127.0.0.1:8788/status >/dev/null && exit 0; sleep 2; done
          journalctl -u truyn-testnet.service -n 80 --no-pager; exit 21
          SCRIPT
          )
            remote "$vm" "$setup" >/dev/null
          done
          for i in 0 1 2 3; do rec="$(call "${VMS[$i]}" GET /record)"; RECORDS+=("$rec"); nid="$(jq -r '.record.nodeId'<<<"$rec")"; NODEIDS+=("$nid"); echo "::add-mask::$nid"; done
          ALL="$(printf '%s\n' "${RECORDS[@]}"|jq -s '{records:map(.record)}')"; for i in 0 1 2 3; do call "${VMS[$i]}" POST /bootstrap "$ALL" >/dev/null; done
          payload="$(jq -nc --arg id "${NODEIDS[2]}" '{nodeId:$id,input:{proof:"azure-public-quic"}}')"
          t0="$(date +%s%3N)"; direct="$(call "${VMS[0]}" POST /need "$payload")"; direct_ms=$(( $(date +%s%3N)-t0 ))
          [[ "$(jq -r '.transport'<<<"$direct")" == quic-direct && "$(jq -r '.result.transport'<<<"$direct")" == quic ]] || exit 30
          fault="$(jq -nc --arg id "${NODEIDS[2]}" '{nodeIds:[$id]}')"; call "${VMS[0]}" POST /faults/partition "$fault" >/dev/null
          blocked=0; call "${VMS[0]}" POST /need "$payload" >/dev/null 2>&1 || blocked=1; [[ "$blocked" == 1 ]] || exit 31
          call "${VMS[0]}" POST /faults/heal "$fault" >/dev/null; healed="$(call "${VMS[0]}" POST /need "$payload")"; [[ "$(jq -r '.transport'<<<"$healed")" == quic-direct ]] || exit 32
          replicated="$(call "${VMS[0]}" POST /replicate '{"namespace":"productionization","key":"azure-four-host","value":{"proof":"durable"},"replicationFactor":3,"minAcks":3,"ttlMs":900000}')"; [[ "$(jq -r '.result.acknowledgements'<<<"$replicated")" == 3 ]] || exit 33
          rid="$(jq -r '.record.recordId'<<<"$replicated")"; found="$(call "${VMS[2]}" GET '/find?namespace=productionization&key=azure-four-host&fanout=4')"; jq -e --arg rid "$rid" '.records|any(.recordId==$rid)'<<<"$found" >/dev/null || exit 34
          holder="$(jq -r --arg self "${NODEIDS[0]}" '.result.storedAt[]|select(.!=$self)'<<<"$replicated"|head -1)"; idx=''; for i in 1 2 3; do [[ "${NODEIDS[$i]}" == "$holder" ]] && idx="$i"; done; [[ -n "$idx" ]] || exit 35
          failed="${VMS[$idx]}"; before="$(printf '%s\n' "${RECORDS[@]}"|jq -r --arg n "$holder" 'select(.record.nodeId==$n)|.record.sequence')"; remote "$failed" 'systemctl stop truyn-testnet.service' >/dev/null
          t1="$(date +%s%3N)"; repaired="$(call "${VMS[0]}" POST /repair '{"namespace":"productionization","key":"azure-four-host","replicationFactor":3,"minAcks":3}')"; repair_ms=$(( $(date +%s%3N)-t1 ))
          [[ "$(jq -r '.repairs[0].acknowledgements'<<<"$repaired")" == 3 ]] || exit 36; jq -e --arg dead "$holder" '.repairs[0].storedAt|index($dead)==null'<<<"$repaired" >/dev/null || exit 37; (( repair_ms < 30000 )) || exit 38
          remote "$failed" 'systemctl start truyn-testnet.service; for n in $(seq 1 60); do curl -fsS --max-time 2 http://127.0.0.1:8788/status >/dev/null && exit 0; sleep 2; done; exit 1' >/dev/null
          restarted="$(call "$failed" GET /record)"; [[ "$(jq -r '.record.nodeId'<<<"$restarted")" == "$holder" ]] || exit 39; after="$(jq -r '.record.sequence'<<<"$restarted")"; (( after > before )) || exit 40
          pong="$(call "${VMS[3]}" POST /ping "$(jq -nc --arg id "$holder" '{nodeId:$id}')")"; [[ "$(jq -r '.pong'<<<"$pong")" == true ]] || exit 41
          gate_ok=1
          result="$(jq -nc --arg gate PASS --arg region "$LOCATION" --arg size "$VM_SIZE" --argjson hosts 4 --argjson direct "$direct_ms" --argjson repair "$repair_ms" '{gate:$gate,hosts:$hosts,region:$region,vmSize:$size,transport:"real-public-udp-quic",relayCalls:0,directNeedMs:$direct,partitionBlocked:true,healRecovered:true,replicationAcks:3,holderFailureRepairMs:$repair,restartIdentityStable:true,sequenceAdvanced:true}')"
          echo "TRUYN_AZURE_MULTIHOST=$result"
          echo "::notice title=TRUYN Azure Four-Host Gate::$result"
