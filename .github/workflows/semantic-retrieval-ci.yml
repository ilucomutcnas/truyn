name: Semantic Retrieval CI

on:
  pull_request:
    paths:
      - core/context/**
      - network/relay/**
      - node/**
      - tests/retrieval.test.js
      - benchmarks/semantic-retrieval-ab.js
      - .github/workflows/cloud-poc-semantic-retrieval-ab.yml
      - .github/workflows/semantic-retrieval-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check benchmarks/semantic-retrieval-ab.js
      - run: git diff --check
