name: Azure TRUYN RG Access Recheck

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/azure-truyn-rg-access-recheck.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target resource group access
        shell: bash
        run: |
          set -euo pipefail
          target_rg="truyn"
          rg_id="$(az group show --name "$target_rg" --query id -o tsv)"
          echo "TARGET_RG_READ=ok"
          echo "TARGET_RG_RESOURCE_COUNT=$(az resource list --resource-group "$target_rg" --query 'length(@)' -o tsv)"
          az role assignment list --scope "$rg_id" --query 'length(@)' -o tsv >/dev/null
          echo "TARGET_RG_RBAC_READ=ok"

      - name: Verify create delete and RBAC in truyn
        shell: bash
        run: |
          set -euo pipefail
          target_rg="truyn"
          probe_identity="truyn-access-recheck-${GITHUB_RUN_ID}"
          cleanup() { az identity delete --resource-group "$target_rg" --name "$probe_identity" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          az identity create --resource-group "$target_rg" --name "$probe_identity" >/dev/null
          echo "RESOURCE_CREATE_IN_TRUYN=ok"

          principal_id="$(az identity show --resource-group "$target_rg" --name "$probe_identity" --query principalId -o tsv)"
          rg_id="$(az group show --name "$target_rg" --query id -o tsv)"

          az role assignment create \
            --assignee-object-id "$principal_id" \
            --assignee-principal-type ServicePrincipal \
            --role Reader \
            --scope "$rg_id" \
            >/dev/null
          echo "RBAC_CREATE_IN_TRUYN=ok"

          az role assignment delete \
            --assignee-object-id "$principal_id" \
            --role Reader \
            --scope "$rg_id" \
            >/dev/null
          echo "RBAC_DELETE_IN_TRUYN=ok"

          az identity delete --resource-group "$target_rg" --name "$probe_identity" >/dev/null
          trap - EXIT
          echo "RESOURCE_DELETE_IN_TRUYN=ok"
