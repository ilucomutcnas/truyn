name: Semantic Cost Control Implementation

on:
  push:
    branches:
      - semantic-gate-cost-control
    paths:
      - .github/workflows/semantic-cost-control-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-gate-cost-control
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 .github/scripts/apply_semantic_cost_control.py
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check benchmarks/semantic-retrieval-ab.js
      - name: Commit tested patch
        shell: bash
        run: |
          rm -f .github/workflows/semantic-cost-control-implementation.yml
          rm -f .github/scripts/apply_semantic_cost_control.py
          rm -rf node_modules package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Control Gemini thinking for semantic cost gate'
          git push origin HEAD:semantic-gate-cost-control
