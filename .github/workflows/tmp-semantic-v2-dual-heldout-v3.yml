name: Ephemeral Semantic v2 Dual Compiler Heldout V3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-dual-heldout-v3.yml']

permissions:
  contents: read
  id-token: write

jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-heldout3-${{ github.run_id }}
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      CANONICAL_HELDOUT_SHA: 4eaeb1b3237070702d4432f9597bc5dd91a4d9cf
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Load immutable benchmark, proxy, and canonical runner
        shell: bash
        run: |
          set -euo pipefail
          load_file(){ mkdir -p "$(dirname "$1")"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1?ref=$2" | jq -r '.content' | tr -d '\n' | base64 -d > "$3"; }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA" benchmarks/semantic-retrieval-v2.js
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA" benchmarks/semantic-v2-gcp-proxy.js
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA" benchmarks/Dockerfile.semantic-v2-gcp-proxy
          load_file .github/workflows/tmp-semantic-v2-dual-heldout.yml "$CANONICAL_HELDOUT_SHA" /tmp/canonical.yml
          python - <<'PY'
          import re
          text=open('/tmp/canonical.yml').read()
          m=re.search(r"cat > semantic-v2-dual-heldout\.mjs <<'NODE'\n(.*?)\n\s*NODE\n", text, re.S)
          if not m: raise SystemExit('canonical runner heredoc not found')
          js=m.group(1)
          # Strip YAML indentation from the embedded runner.
          lines=js.splitlines(); ind=min(len(x)-len(x.lstrip()) for x in lines if x.strip())
          js='\n'.join(x[ind:] for x in lines)+'\n'
          old="""const cells=[];
          for(const category of ['synonym_only','cross_language','adversarial_near_duplicate']){
            for(const queryLanguage of ['en','zh','tr']) cells.push({category,queryLanguage});
          }
          const selected=[];
          for(const cell of cells){
            const matches=retrievalCases.filter(x=>!knownHard.has(x.caseIndex)&&x.category===cell.category&&x.queryLanguage===cell.queryLanguage).slice(0,4);
            if(matches.length!==4) throw new Error(`held-out cell ${cell.category}:${cell.queryLanguage} has ${matches.length}/4`);
            selected.push(...matches);
          }
          if(selected.length!==36||selected.some(x=>knownHard.has(x.caseIndex))) throw new Error('held-out selection invariant failed');"""
          new="""const bucketMap=new Map();
          for(const item of retrievalCases){
            if(knownHard.has(item.caseIndex)) continue;
            const key=`${item.category}:${item.queryLanguage}`;
            if(!bucketMap.has(key)) bucketMap.set(key,[]);
            bucketMap.get(key).push(item);
          }
          const bucketKeys=[...bucketMap.keys()].sort();
          const cells=bucketKeys.map(key=>{const [category,queryLanguage]=key.split(':');return {category,queryLanguage};});
          const selected=[]; const cursors=new Map();
          for(const key of bucketKeys){const arr=bucketMap.get(key),n=Math.min(4,arr.length);selected.push(...arr.slice(0,n));cursors.set(key,n);}
          while(selected.length<36){let moved=false;for(const key of bucketKeys){const i=cursors.get(key),arr=bucketMap.get(key);if(i<arr.length&&selected.length<36){selected.push(arr[i]);cursors.set(key,i+1);moved=true;}}if(!moved)break;}
          if(selected.length!==36||selected.some(x=>knownHard.has(x.caseIndex))) throw new Error(`held-out selection invariant failed ${selected.length}/36`);"""
          if old not in js: raise SystemExit('canonical selection block not found')
          js=js.replace(old,new)
          js=js.replace("selection:'first four immutable cases per category × queryLanguage cell after excluding known diagnostic hard cases 5,112,241,269'","selection:'deterministic stratified sample across existing category × queryLanguage cells after excluding known diagnostic hard cases 5,112,241,269'")
          js=js.replace("cells:9,casesPerCell:4,","cells:cells.length,casesPerCell:'up to 4 then deterministic round-robin fill',")
          open('semantic-v2-dual-heldout.mjs','w').write(js)
          PY
          node --check semantic-v2-dual-heldout.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with: { project_id: '${{ env.GCP_PROJECT_ID_VALUE }}' }
      - name: Prepare isolated runtime-identity Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"; image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-heldout3:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null && docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for a in $(seq 1 30); do curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok==true' >/dev/null && break; [[ "$a" -lt 30 ]] || exit 1; sleep 2; done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"; echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"; echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"
      - name: Run corrected canonical held-out screening
        shell: bash
        run: node semantic-v2-dual-heldout.mjs
      - name: Upload held-out evidence
        if: ${{ always() && hashFiles('semantic-v2-dual-heldout.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-dual-heldout-v3-${{ github.run_id }}
          path: semantic-v2-dual-heldout.json
          retention-days: 30
      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
