name: Temporary Network Productionization ACI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-network-productionization-aci.yml'

permissions:
  contents: read
  id-token: write

jobs:
  aci-multihost:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_COMMIT: b69560744569fa4dcbf7a95f183f44b049376c82
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Run public UDP QUIC four-node gate
        shell: bash
        run: |
          set -Eeuo pipefail
          PREFIX="truyn-aci-${GITHUB_RUN_ID}"
          GROUPS=()
          RG=''; LOCATION=''; gate_ok=0
          mask(){ [[ -n "${1:-}" ]] && echo "::add-mask::$1"; }
          cleanup(){
            set +e
            for group in "${GROUPS[@]:-}"; do
              [[ -z "$group" || -z "$RG" ]] || az container delete -g "$RG" -n "$group" --yes --only-show-errors >/dev/null 2>&1 || true
            done
            [[ "$gate_ok" == 1 ]] && echo 'TRUYN_ACI_CLEANUP=PASS groups_removed=true' || echo 'TRUYN_ACI_CLEANUP=EXECUTED gate_failed=true'
          }
          trap cleanup EXIT

          while IFS=$'\t' read -r name rg; do
            [[ -n "$name" && -n "$rg" ]] || continue
            role="$(az containerapp show -g "$rg" -n "$name" --query "properties.template.containers[0].env[?name=='TRUYN_ROLE'].value | [0]" -o tsv 2>/dev/null || true)"
            if [[ "$role" == relay || "$name" == *relay* ]]; then RG="$rg"; break; fi
          done < <(az containerapp list --query '[].[name,resourceGroup]' -o tsv 2>/dev/null || true)
          [[ -n "$RG" ]] || RG="$(az group list --query "[?contains(name, 'truyn')].name | [0]" -o tsv)"
          [[ -n "$RG" ]] || { echo 'TRUYN_ACI_GATE=FAIL reason=resource_group_not_found'; exit 10; }
          LOCATION="$(az group show -g "$RG" --query location -o tsv)"
          mask "$RG"; mask "$LOCATION"

          git checkout -q "$TEST_COMMIT"
          npm install --ignore-scripts --no-audit --no-fund >/dev/null
          node --input-type=module <<'NODE' >/tmp/operator.json
          import { createIdentity } from './core/identity/index.js';
          process.stdout.write(JSON.stringify(createIdentity()));
          NODE
          OPERATOR_NODE_ID="$(jq -r '.nodeId' /tmp/operator.json)"
          [[ "$OPERATOR_NODE_ID" == truyn:node:* ]] || { echo 'TRUYN_ACI_GATE=FAIL reason=operator_identity'; exit 11; }
          mask "$OPERATOR_NODE_ID"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/operator-key.pem -out /tmp/operator-cert.pem -subj '/CN=truyn-operator' -days 1 >/dev/null 2>&1

          for i in 0 1 2 3; do
            GROUP="${PREFIX}-${i}"
            LABEL="${PREFIX}-${i}"
            FQDN="${LABEL}.${LOCATION}.azurecontainer.io"
            GROUPS+=("$GROUP")
            mask "$GROUP"; mask "$LABEL"; mask "$FQDN"
            cat >"/tmp/aci-${i}.yaml" <<YAML
          apiVersion: '2021-10-01'
          location: ${LOCATION}
          name: ${GROUP}
          properties:
            containers:
            - name: node
              properties:
                image: node:22-bookworm
                command:
                - bash
                - -lc
                - >-
                  set -Eeuo pipefail;
                  apt-get update -qq;
                  apt-get install -y -qq git openssl ca-certificates >/dev/null;
                  git clone -q https://github.com/inn-media/truyn.git /app;
                  cd /app;
                  git checkout -q ${TEST_COMMIT};
                  npm install --ignore-scripts --no-audit --no-fund >/dev/null;
                  mkdir -p /data /tls;
                  openssl req -x509 -newkey rsa:2048 -nodes -keyout /tls/key.pem -out /tls/cert.pem -subj '/CN=${FQDN}' -days 1 >/dev/null 2>&1;
                  exec node network/testnet/node-service.js
                ports:
                - port: 4433
                  protocol: UDP
                environmentVariables:
                - name: TRUYN_TESTNET_DATA_DIR
                  value: /data
                - name: TRUYN_TLS_KEY_PATH
                  value: /tls/key.pem
                - name: TRUYN_TLS_CERT_PATH
                  value: /tls/cert.pem
                - name: TRUYN_ADVERTISE_HOST
                  value: ${FQDN}
                - name: TRUYN_QUIC_HOST
                  value: 0.0.0.0
                - name: TRUYN_QUIC_PORT
                  value: '4433'
                - name: TRUYN_CONTROL_HOST
                  value: 127.0.0.1
                - name: TRUYN_CONTROL_PORT
                  value: '8788'
                - name: TRUYN_DHT_REPLICATION_FACTOR
                  value: '3'
                - name: TRUYN_DHT_WRITE_QUORUM
                  value: '3'
                - name: TRUYN_DHT_RPC_TIMEOUT_MS
                  value: '2500'
                - name: TRUYN_TESTNET_OPERATOR_NODE_IDS
                  value: ${OPERATOR_NODE_ID}
                resources:
                  requests:
                    cpu: 1
                    memoryInGB: 1.5
            osType: Linux
            restartPolicy: Never
            ipAddress:
              type: Public
              dnsNameLabel: ${LABEL}
              ports:
              - protocol: UDP
                port: 4433
          tags:
            truyn-purpose: ephemeral-network-productionization
            truyn-run: '${GITHUB_RUN_ID}'
          type: Microsoft.ContainerInstance/containerGroups
          YAML
            if ! az container create -g "$RG" -f "/tmp/aci-${i}.yaml" --only-show-errors >/dev/null; then
              echo 'TRUYN_ACI_GATE=FAIL reason=container_group_create'; exit 20
            fi
          done

          : >/tmp/records.ndjson
          for i in 0 1 2 3; do
            GROUP="${GROUPS[$i]}"
            record=''
            for attempt in $(seq 1 90); do
              state="$(az container show -g "$RG" -n "$GROUP" --query instanceView.state -o tsv 2>/dev/null || true)"
              logs="$(az container logs -g "$RG" -n "$GROUP" --container-name node 2>/dev/null || true)"
              record="$(printf '%s\n' "$logs" | grep -E '^\{"ok":true,"nodeId":"truyn:node:' | tail -1 || true)"
              if [[ -n "$record" ]]; then break; fi
              if [[ "$state" == Terminated || "$state" == Failed ]]; then
                echo 'TRUYN_ACI_GATE=FAIL reason=node_terminated_before_ready'; exit 21
              fi
              sleep 4
            done
            [[ -n "$record" ]] || { echo 'TRUYN_ACI_GATE=FAIL reason=node_ready_timeout'; exit 22; }
            jq -c '.peerRecord' <<<"$record" >>/tmp/records.ndjson
            nid="$(jq -r '.nodeId' <<<"$record")"; mask "$nid"
          done
          jq -s '.' /tmp/records.ndjson >/tmp/records.json
          [[ "$(jq length /tmp/records.json)" == 4 ]] || { echo 'TRUYN_ACI_GATE=FAIL reason=record_count'; exit 23; }

          cat >"$GITHUB_WORKSPACE/aci-operator.mjs" <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { TestnetNetworkOperator } from './network/testnet/operator.js';
          const identity = JSON.parse(await readFile('/tmp/operator.json', 'utf8'));
          const tls = { key: await readFile('/tmp/operator-key.pem', 'utf8'), cert: await readFile('/tmp/operator-cert.pem', 'utf8') };
          const records = JSON.parse(await readFile('/tmp/records.json', 'utf8'));
          const operator = new TestnetNetworkOperator({ identity, tls, dhtRpcTimeoutMs: 4000 });
          const startedAt = Date.now();
          try {
            await operator.start(records);
            for (const record of records) {
              const boot = await operator.bootstrapRemote(record.nodeId, records);
              if ((boot.results || []).filter((r) => r.accepted).length < 3) throw new Error('remote_bootstrap_incomplete');
            }
            const status = [];
            for (const record of records) status.push(await operator.status(record.nodeId));
            if (status.some((s) => s.peerCount < 3)) throw new Error('peer_mesh_incomplete');

            const directStarted = Date.now();
            const direct = await operator.directNeed(records[0].nodeId, records[2].nodeId, { proof: 'aci-public-quic' });
            const directMs = Date.now() - directStarted;
            if (direct.transport !== 'quic-direct' || direct.result?.transport !== 'quic') throw new Error('remote_direct_quic_failed');

            const replicated = await operator.replicate(records[0].nodeId, {
              namespace: 'productionization', key: 'aci-four-node', value: { proof: 'public-udp-quic' },
              replicationFactor: 3, minAcks: 3, ttlMs: 600000
            });
            if (replicated.result?.acknowledgements !== 3) throw new Error('remote_replication_quorum');
            const found = await operator.find(records[3].nodeId, { namespace: 'productionization', key: 'aci-four-node', fanout: 4 });
            if (!found.records?.some((r) => r.recordId === replicated.record.recordId)) throw new Error('remote_replica_read_failed');

            await operator.command(records[0].nodeId, 'partition', { nodeIds: [records[2].nodeId] });
            let partitionRejected = false;
            try { await operator.directNeed(records[0].nodeId, records[2].nodeId, { proof: 'must-fail-partition' }); }
            catch (error) { partitionRejected = String(error?.message || error).includes('TRUYN_NETWORK_PARTITION'); }
            if (!partitionRejected) throw new Error('partition_did_not_fail_closed');
            await operator.command(records[0].nodeId, 'heal', { nodeIds: [records[2].nodeId] });
            const healed = await operator.directNeed(records[0].nodeId, records[2].nodeId, { proof: 'healed' });
            if (healed.transport !== 'quic-direct') throw new Error('healed_direct_failed');

            process.stdout.write(`TRUYN_ACI_GATE=${JSON.stringify({
              gate: 'PASS', nodes: 4, distinctPublicEndpoints: new Set(records.map(r => r.endpoints[0])).size,
              transport: 'public-udp-quic', relayCalls: 0, directNeedMs: directMs,
              replicationAcks: 3, remoteReplicaRead: true, partitionFailClosed: true,
              healingRestoredDirect: true, elapsedMs: Date.now() - startedAt
            })}\n`);
          } finally { await operator.close().catch(() => {}); }
          NODE
          node "$GITHUB_WORKSPACE/aci-operator.mjs"
          gate_ok=1
