name: Temporary Semantic Retrieval Gate v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2.yml']

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AZURE_RG: truyn
      AZURE_GPT_ACCOUNT: truyn-openai-1334540181
      AZURE_GPT_DEPLOYMENT: truyn-gpt-4-1-mini
      FOUNDRY_BENCH_CAPACITY: '100'
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-${{ github.run_id }}
      GEMINI_MODEL: gemini-2.5-flash
      GOOGLE_CLOUD_LOCATION: global
      VERTEX_EMBEDDING_LOCATION: us-central1
      VERTEX_EMBEDDING_MODEL: gemini-embedding-001
      VERTEX_EMBEDDING_DIMENSIONS: '768'
      SEMANTIC_V2_CORPUS_BLOCKS: '600'
      SEMANTIC_V2_RETRIEVAL_CASES: '360'
      SEMANTIC_V2_LIVE_CASES: '6'
      SEMANTIC_V2_PACING_MS: '30000'
      SEMANTIC_V2_RATE_LIMIT_RETRIES: '8'
      SEMANTIC_V2_OUTPUT: semantic-retrieval-v2.json
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      SEMANTIC_V2_ATTEMPT: '6'
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load immutable operational benchmark sources into runner only
        shell: bash
        run: |
          set -euo pipefail
          load_file() {
            path="$1"; ref="$2"
            mkdir -p "$(dirname "$path")"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
          }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"
          test -s benchmarks/semantic-retrieval-v2.js
          test -s benchmarks/semantic-v2-gcp-proxy.js

      - name: Upgrade ephemeral benchmark to dense shortlist plus semantic reranker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'benchmarks/semantic-retrieval-v2.js';
          let source = fs.readFileSync(path, 'utf8');
          function replaceOnce(label, from, to) {
            if (!source.includes(from)) throw new Error(`patch marker not found: ${label}`);
            source = source.replace(from, to);
          }

          replaceOnce(
            'reranker import',
            "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';",
            "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';\nimport { createProviderSemanticReranker } from '../core/context/provider-semantic-reranker.js';"
          );
          replaceOnce(
            'dense recall gate',
            '  retrievalAccuracyPercentMin: 99,',
            '  retrievalAccuracyPercentMin: 99,\n  denseCandidateRecallPercentMin: 99,'
          );
          replaceOnce(
            'router construction',
            '  const semanticRouter = createSemanticContextRouterV2({ embedder });',
            `  const rerankerProvider = createVertexGeminiProvider({
              projectId:gcpProjectId,
              location:geminiLocation,
              model:geminiModel,
              endpoint:proxyEndpoint,
              accessTokenProvider:async () => proxyToken,
              capabilities:['reasoning.general']
            });
            const semanticReranker = createProviderSemanticReranker({
              provider:rerankerProvider,
              name:'gemini-semantic-reranker-64-8-1',
              providerOptions:{ thinkingBudget:0 },
              shortlistSize:8
            });
            const semanticRouter = createSemanticContextRouterV2({
              embedder,
              reranker:semanticReranker,
              candidateK:64
            });`
          );
          replaceOnce(
            'retrieval diagnostics',
            '        semanticScore:top?.semanticScore ?? null,\n        lexicalV1SelectedId:lexicalSelectedId,',
            `        semanticScore:top?.semanticScore ?? null,
            denseCandidateRecall:(retrieved.retrieval?.denseCandidates || []).some((candidate) => candidate.id === item.id),
            denseRank:(retrieved.retrieval?.denseCandidates || []).find((candidate) => candidate.id === item.id)?.rank || null,
            rerankerUsage:retrieved.retrieval?.rerankerMetadata?.usage || { input:0, output:0, total:0 },
            rerankerProviderRequestBodyBytes:retrieved.retrieval?.rerankerMetadata?.providerRequestBodyBytes || 0,
            rerankerProviderLatencyMs:retrieved.retrieval?.rerankerMetadata?.providerLatencyMs || null,
            lexicalV1SelectedId:lexicalSelectedId,`
          );
          replaceOnce(
            'dense recall aggregate',
            "  const lexicalV1Accuracy = percent(retrievalResults.filter((item) => item.lexicalV1Correct).length, retrievalResults.length);",
            `  const lexicalV1Accuracy = percent(retrievalResults.filter((item) => item.lexicalV1Correct).length, retrievalResults.length);
            const denseCandidateRecallPercent = percent(retrievalResults.filter((item) => item.denseCandidateRecall).length, retrievalResults.length);`
          );
          replaceOnce(
            'retrieval-only gate',
            '  const retrievalOnlyPassed = retrievalAccuracy >= gate.retrievalAccuracyPercentMin\n    && provenancePercent >= gate.provenancePassPercentMin',
            '  const retrievalOnlyPassed = retrievalAccuracy >= gate.retrievalAccuracyPercentMin\n    && denseCandidateRecallPercent >= gate.denseCandidateRecallPercentMin\n    && provenancePercent >= gate.provenancePassPercentMin'
          );
          replaceOnce(
            'retrieval report dense recall',
            '      accuracyPercent:retrievalAccuracy,\n      provenancePercent,',
            '      accuracyPercent:retrievalAccuracy,\n      denseCandidateRecallPercent,\n      provenancePercent,'
          );
          replaceOnce(
            'router stats report',
            '    embedding:embedder.stats(),\n    methodology:{',
            `    embedding:embedder.stats(),
            semanticRouterStats:semanticRouter.stats(),
            methodology:{`
          );
          replaceOnce(
            'methodology reranker',
            "      topK:1,\n      blockIdsInRequesterQueries:false,",
            "      topK:1,\n      denseCandidateK:64,\n      semanticShortlistK:8,\n      semanticReranker:'Gemini hierarchical 64 -> 8 -> 1; only final verified block is materialized to actors',\n      blockIdsInRequesterQueries:false,"
          );
          replaceOnce(
            'live retrieval metric map',
            '    while (liveCases.length < liveCaseCount) liveCases.push(retrievalCases[liveCases.length]);',
            `    while (liveCases.length < liveCaseCount) liveCases.push(retrievalCases[liveCases.length]);
            const retrievalMetricByCase = new Map(retrievalResults.map((item) => [item.caseIndex, item]));`
          );
          replaceOnce(
            'live reranker metric',
            '      const minimalContextPass = Object.values(actorMetrics).every((metric) =>\n        metric.contextResolution?.contextRefs === 1\n        && metric.contextResolution?.retrievalQueries === 1\n        && metric.contextResolution?.provenanceVerifiedRefs === 1\n        && metric.contextResolution?.selectedBlocks === 1\n      );\n      return {',
            `      const minimalContextPass = Object.values(actorMetrics).every((metric) =>
                metric.contextResolution?.contextRefs === 1
                && metric.contextResolution?.retrievalQueries === 1
                && metric.contextResolution?.provenanceVerifiedRefs === 1
                && metric.contextResolution?.selectedBlocks === 1
              );
              const retrievalMetric = retrievalMetricByCase.get(item.caseIndex);
              return {`
          );
          replaceOnce(
            'live reranker fields',
            '        payloadNoBlockId,\n        inputTokens:sum(Object.values(actorMetrics), (metric) => metric.usage.input),',
            `        payloadNoBlockId,
            retrievalRerankerUsage:retrievalMetric?.rerankerUsage || { input:0, output:0, total:0 },
            retrievalRerankerProviderRequestBodyBytes:retrievalMetric?.rerankerProviderRequestBodyBytes || 0,
            inputTokens:sum(Object.values(actorMetrics), (metric) => metric.usage.input),`
          );
          replaceOnce(
            'honest token cost accounting',
            '    const directInputTokens = sum(liveResults, (run) => run.direct.inputTokens);\n    const truynInputTokens = sum(liveResults, (run) => run.truyn.inputTokens);\n    const directCost = sum(liveResults, (run) => run.direct.comparablePairCostUsd);\n    const truynCost = sum(liveResults, (run) => run.truyn.comparablePairCostUsd);',
            `    const directInputTokens = sum(liveResults, (run) => run.direct.inputTokens);
            const truynActorInputTokens = sum(liveResults, (run) => run.truyn.inputTokens);
            const retrievalRerankerInputTokens = sum(liveResults, (run) => run.truyn.retrievalRerankerUsage?.input || 0);
            const retrievalRerankerOutputTokens = sum(liveResults, (run) => run.truyn.retrievalRerankerUsage?.output || 0);
            const truynInputTokens = truynActorInputTokens + retrievalRerankerInputTokens;
            const directCost = sum(liveResults, (run) => run.direct.comparablePairCostUsd);
            const truynActorCost = sum(liveResults, (run) => run.truyn.comparablePairCostUsd);
            const retrievalRerankerCost = ((retrievalRerankerInputTokens * comparableRates.gemini.input) + (retrievalRerankerOutputTokens * comparableRates.gemini.output)) / 1_000_000;
            const truynCost = truynActorCost + retrievalRerankerCost;
            const directProviderRequestBodyBytes = sum(liveResults, (run) => run.direct.providerRequestBodyBytes);
            const truynActorProviderRequestBodyBytes = sum(liveResults, (run) => run.truyn.providerRequestBodyBytes);
            const retrievalRerankerProviderRequestBodyBytes = sum(liveResults, (run) => run.truyn.retrievalRerankerProviderRequestBodyBytes || 0);
            const truynProviderRequestBodyBytes = truynActorProviderRequestBodyBytes + retrievalRerankerProviderRequestBodyBytes;`
          );
          replaceOnce(
            'final dense recall check',
            '      retrievalAccuracy:retrievalAccuracy >= gate.retrievalAccuracyPercentMin,\n      perLanguageAccuracy:',
            '      retrievalAccuracy:retrievalAccuracy >= gate.retrievalAccuracyPercentMin,\n      denseCandidateRecall:denseCandidateRecallPercent >= gate.denseCandidateRecallPercentMin,\n      perLanguageAccuracy:'
          );
          replaceOnce(
            'live report accounting',
            '        directInputTokens,\n        truynInputTokens,\n        inputTokenReductionPercent,',
            `        directInputTokens,
            truynActorInputTokens,
            retrievalRerankerInputTokens,
            retrievalRerankerOutputTokens,
            truynInputTokens,
            inputTokenReductionPercent,`
          );
          replaceOnce(
            'live report cost breakdown',
            '        directComparablePairCostUsd:round(directCost, 9),\n        truynComparablePairCostUsd:round(truynCost, 9),',
            `        directComparablePairCostUsd:round(directCost, 9),
            truynActorComparablePairCostUsd:round(truynActorCost, 9),
            retrievalRerankerComparableCostUsd:round(retrievalRerankerCost, 9),
            truynComparablePairCostUsd:round(truynCost, 9),`
          );
          replaceOnce(
            'provider body accounting',
            '        directProviderRequestBodyBytes:sum(liveResults, (run) => run.direct.providerRequestBodyBytes),\n        truynProviderRequestBodyBytes:sum(liveResults, (run) => run.truyn.providerRequestBodyBytes),\n        providerRequestBodyReductionPercent:reductionPercent(\n          sum(liveResults, (run) => run.direct.providerRequestBodyBytes),\n          sum(liveResults, (run) => run.truyn.providerRequestBodyBytes)\n        ),',
            `        directProviderRequestBodyBytes,
            truynActorProviderRequestBodyBytes,
            retrievalRerankerProviderRequestBodyBytes,
            truynProviderRequestBodyBytes,
            providerRequestBodyReductionPercent:reductionPercent(directProviderRequestBodyBytes, truynProviderRequestBodyBytes),`
          );

          fs.writeFileSync(path, source);
          NODE
          node --check benchmarks/semantic-retrieval-v2.js

      - name: Validate code before cloud spend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -name '*.test.js' ! -name 'public-repository.test.js' -print | sort)
          node --test "${tests[@]}"
          git diff --check -- core adapters node tests

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Azure actors and temporary benchmark throughput
        shell: bash
        run: |
          set -euo pipefail
          gpt_endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$AZURE_GPT_ACCOUNT" --query properties.endpoint -o tsv)"
          gpt_key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$AZURE_GPT_ACCOUNT" --query key1 -o tsv)"
          [[ -n "$gpt_endpoint" && -n "$gpt_key" ]]
          echo "::add-mask::$gpt_key"
          echo "AZURE_OPENAI_ENDPOINT=$gpt_endpoint" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_API_KEY=$gpt_key" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_DEPLOYMENT=$AZURE_GPT_DEPLOYMENT" >> "$GITHUB_ENV"

          suffix="$(printf '%s' '${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}' | sha256sum | cut -c1-12)"
          account="truynai${suffix}"
          echo "FOUNDRY_ACCOUNT=$account" >> "$GITHUB_ENV"
          endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$account" --query properties.endpoint -o tsv)"
          key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$account" --query key1 -o tsv)"
          [[ -n "$endpoint" && -n "$key" ]]
          echo "::add-mask::$key"
          echo "AZURE_FOUNDRY_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_API_KEY=$key" >> "$GITHUB_ENV"

          resize() {
            dep="$1"; cap="$2"
            data="$(az cognitiveservices account deployment show -g "$AZURE_RG" -n "$account" --deployment-name "$dep" -o json)"
            model="$(jq -r '.properties.model.name' <<<"$data")"
            format="$(jq -r '.properties.model.format' <<<"$data")"
            version="$(jq -r '.properties.model.version // empty' <<<"$data")"
            sku="$(jq -r '.sku.name' <<<"$data")"
            args=(cognitiveservices account deployment create -g "$AZURE_RG" -n "$account" --deployment-name "$dep" --model-name "$model" --model-format "$format" --sku-name "$sku" --sku-capacity "$cap")
            [[ -n "$version" ]] && args+=(--model-version "$version")
            az "${args[@]}" >/dev/null
          }
          for dep in truyn-grok truyn-deepseek truyn-llama truyn-mistral truyn-kimi; do resize "$dep" "$FOUNDRY_BENCH_CAPACITY"; done
          echo "AZURE_FOUNDRY_GROK=truyn-grok" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_DEEPSEEK=truyn-deepseek" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_LLAMA=truyn-llama" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_MISTRAL=truyn-mistral" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_KIMI=truyn-kimi" >> "$GITHUB_ENV"

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Prepare isolated Vertex inference and embedding proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" .
          docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" \
            --project="$GCP_PROJECT_ID_VALUE" \
            --region="$GCP_PROXY_REGION" \
            --image="$image" \
            --service-account="$GCP_RUNTIME_SA_VALUE" \
            --port=8080 --min=0 --max=4 --cpu=1 --memory=512Mi \
            --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" \
            --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok == true' >/dev/null; then break; fi
            [[ "$attempt" -lt 30 ]] || exit 1
            sleep 2
          done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"
          echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"

      - name: Preflight multilingual embedding model
        shell: bash
        run: |
          set -euo pipefail
          path="/v1/projects/${GCP_PROJECT_ID}/locations/${VERTEX_EMBEDDING_LOCATION}/publishers/google/models/${VERTEX_EMBEDDING_MODEL}:predict"
          body='{"instances":[{"task_type":"RETRIEVAL_QUERY","content":"multilingual semantic retrieval preflight"}],"parameters":{"autoTruncate":true,"outputDimensionality":768}}'
          curl -fsS -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$body" "${VERTEX_API_ENDPOINT}${path}" | jq -e '.predictions[0].embeddings.values | length > 0' >/dev/null

      - name: Run multilingual seven-actor Semantic Retrieval Gate v2
        run: node benchmarks/semantic-retrieval-v2.js

      - name: Print gate summary
        if: ${{ always() && hashFiles('semantic-retrieval-v2.json') != '' }}
        run: jq '{benchmark,status,corpus,retrieval,semanticRouterStats,actors,live,embedding,semanticGate,methodology}' semantic-retrieval-v2.json

      - name: Upload evidence
        if: ${{ always() && hashFiles('semantic-retrieval-v2.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-retrieval-v2-${{ github.run_id }}
          path: semantic-retrieval-v2.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce v2 gate
        if: ${{ hashFiles('semantic-retrieval-v2.json') != '' }}
        run: jq -e '.semanticGate.passed == true' semantic-retrieval-v2.json >/dev/null

      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true

      - name: Restore Foundry smoke capacity
        if: always()
        shell: bash
        run: |
          set +e
          account="${FOUNDRY_ACCOUNT:-}"
          [[ -n "$account" ]] || exit 0
          resize_back() {
            dep="$1"
            data="$(az cognitiveservices account deployment show -g "$AZURE_RG" -n "$account" --deployment-name "$dep" -o json 2>/dev/null)" || return 0
            model="$(jq -r '.properties.model.name' <<<"$data")"
            format="$(jq -r '.properties.model.format' <<<"$data")"
            version="$(jq -r '.properties.model.version // empty' <<<"$data")"
            sku="$(jq -r '.sku.name' <<<"$data")"
            args=(cognitiveservices account deployment create -g "$AZURE_RG" -n "$account" --deployment-name "$dep" --model-name "$model" --model-format "$format" --sku-name "$sku" --sku-capacity 1)
            [[ -n "$version" ]] && args+=(--model-version "$version")
            az "${args[@]}" >/dev/null 2>&1 || true
          }
          for dep in truyn-grok truyn-deepseek truyn-llama truyn-mistral truyn-kimi; do resize_back "$dep"; done