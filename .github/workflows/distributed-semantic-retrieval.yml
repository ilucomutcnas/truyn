name: Distributed Semantic Retrieval Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributed-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run distributed semantic retrieval benchmark
        env:
          DISTRIBUTED_RETRIEVAL_BLOCKS: '600'
          DISTRIBUTED_RETRIEVAL_PARTITIONS: '4'
          DISTRIBUTED_RETRIEVAL_QUERIES: '48'
          DISTRIBUTED_RETRIEVAL_CANDIDATE_K: '2'
        run: node benchmarks/distributed-semantic-retrieval.js
      - name: Hash evidence
        run: sha256sum distributed-semantic-retrieval.json | tee distributed-semantic-retrieval.sha256
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: truyn-distributed-semantic-retrieval-${{ github.run_id }}
          path: |
            distributed-semantic-retrieval.json
            distributed-semantic-retrieval.sha256
          if-no-files-found: error
          retention-days: 30
