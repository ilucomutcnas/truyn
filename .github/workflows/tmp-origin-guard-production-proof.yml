name: Temporary Live Relay Diagnosis

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-origin-guard-production-proof.yml']

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKENS }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_RELAY_URL: https://relay.truyn.org
    steps:
      - name: Authenticate Azure with main-only OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - name: Diagnose Cloudflare and Azure without mutation
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CF_TOKEN:-}" && -n "${CF_ZONE_ID:-}" && -n "${CF_ACCOUNT_ID:-}" ]] || { echo 'DIAG=FAIL missing_cloudflare_binding'; exit 10; }

          found=0
          while IFS=$'\t' read -r name rg fqdn; do
            [[ -n "$fqdn" ]] || continue
            role="$(az containerapp show -g "$rg" -n "$name" --query 'properties.template.containers[0].env[?name==`TRUYN_ROLE`].value | [0]' -o tsv)"
            if [[ "$role" != 'relay' && "$name" != *relay* ]]; then continue; fi
            found=1
            for value in "$name" "$rg" "$fqdn"; do echo "::add-mask::$value"; done
            app="$(az containerapp show -g "$rg" -n "$name" -o json)"
            external="$(jq -r '.properties.configuration.ingress.external // false' <<<"$app")"
            target_port="$(jq -r '.properties.configuration.ingress.targetPort // 0' <<<"$app")"
            latest_rev="$(jq -r '.properties.latestRevisionName // empty' <<<"$app")"
            guard_vars="$(jq '[.properties.template.containers[0].env[]? | select(.name=="TRUYN_ORIGIN_GUARD" or .name=="TRUYN_ORIGIN_GUARD_TOKEN")] | length' <<<"$app")"
            ip_rules="$(jq '(.properties.configuration.ingress.ipSecurityRestrictions // []) | length' <<<"$app")"
            direct_health="$(curl -sS --max-time 12 -o /tmp/direct.body -w '%{http_code}' "https://${fqdn}/health" || true)"
            echo "AZURE_RELAY_STATE=external:${external} target_port:${target_port} guard_vars:${guard_vars} ip_rules:${ip_rules} direct_health:${direct_health}"
            if [[ -n "$latest_rev" ]]; then
              echo "::add-mask::$latest_rev"
              revision="$(az containerapp revision show -g "$rg" -n "$name" --revision "$latest_rev" -o json 2>/dev/null || echo '{}')"
              provisioning="$(jq -r '.properties.provisioningState // "unknown"' <<<"$revision")"
              running="$(jq -r '.properties.runningState // "unknown"' <<<"$revision")"
              echo "AZURE_REVISION_STATE=provisioning:${provisioning} running:${running}"
            fi
            break
          done < <(az containerapp list --query "[?properties.configuration.ingress.external==\`true\`].[name,resourceGroup,properties.configuration.ingress.fqdn]" -o tsv)
          [[ "$found" == 1 ]] || { echo 'DIAG=FAIL relay_not_found'; exit 11; }

          dns="$(curl -sS -G -H "Authorization: Bearer ${CF_TOKEN}" --data-urlencode 'name=relay.truyn.org' "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records")"
          jq -e '.success == true' <<<"$dns" >/dev/null || { echo 'CF_DNS=FAIL'; exit 20; }
          count="$(jq '.result | length' <<<"$dns")"
          [[ "$count" == 1 ]] || { echo "CF_DNS=FAIL count=${count}"; exit 21; }
          type="$(jq -r '.result[0].type' <<<"$dns")"
          proxied="$(jq -r '.result[0].proxied // false' <<<"$dns")"
          proxiable="$(jq -r '.result[0].proxiable // false' <<<"$dns")"
          echo "CF_DNS=PASS type:${type} proxied:${proxied} proxiable:${proxiable}"

          routes="$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/workers/routes")"
          if jq -e '.success == true' <<<"$routes" >/dev/null 2>&1; then
            exact="$(jq '[.result[]? | select(.pattern=="relay.truyn.org/*" or .pattern=="https://relay.truyn.org/*")] | length' <<<"$routes")"
            echo "CF_WORKER_ROUTES=PASS relay_exact_routes:${exact}"
          else
            code="$(jq -r '.errors[0].code // "unknown"' <<<"$routes" 2>/dev/null || echo unknown)"
            echo "CF_WORKER_ROUTES=FAIL code:${code}"
          fi

          scripts="$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts")"
          if jq -e '.success == true' <<<"$scripts" >/dev/null 2>&1; then
            echo 'CF_WORKERS=PASS list_allowed=true'
          else
            code="$(jq -r '.errors[0].code // "unknown"' <<<"$scripts" 2>/dev/null || echo unknown)"
            echo "CF_WORKERS=FAIL code:${code}"
          fi

          public_code="$(curl -sS --max-time 15 -D /tmp/public.headers -o /tmp/public.body -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
          cf_ray=false
          grep -qi '^cf-ray:' /tmp/public.headers 2>/dev/null && cf_ray=true
          server_header="$(awk 'BEGIN{IGNORECASE=1} /^server:/{gsub("\r",""); print $2; exit}' /tmp/public.headers 2>/dev/null || true)"
          [[ -n "$server_header" ]] || server_header=none
          echo "PUBLIC_RELAY=health:${public_code} cf_ray:${cf_ray} server:${server_header}"
          echo 'DIAG=PASS read_only=true'
