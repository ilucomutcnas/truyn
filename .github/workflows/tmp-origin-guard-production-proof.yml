name: Temporary Production Origin Guard Proof

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-origin-guard-production-proof.yml']

permissions:
  contents: read
  id-token: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKENS }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_RELAY_URL: https://relay.truyn.org
    steps:
      - name: Checkout bounded runtime source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate Azure with main-only OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - name: Install Container Apps CLI extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null

      - name: Apply edge proof and prove zero direct data-plane access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CF_TOKEN:-}" && -n "${CF_ZONE_ID:-}" && -n "${CF_ACCOUNT_ID:-}" ]] || { echo 'ORIGIN_PROOF=FAIL missing_cloudflare_binding'; exit 10; }

          WORKER_NAME="truyn-relay-origin-guard-${GITHUB_RUN_ID}"
          AZURE_SECRET_NAME='truyn-origin-edge-token'
          ROUTE_CREATED=0
          WORKER_CREATED=0
          AZURE_SECRET_SET=0
          AZURE_GUARD_SET=0
          SUCCESS=0
          AZURE_RELAY_APP=''
          AZURE_RELAY_RG=''
          AZURE_RELAY_FQDN=''

          cleanup() {
            set +e
            rm -f /tmp/origin-token /tmp/worker.mjs /tmp/*.headers /tmp/*.body /tmp/*.json
            if [[ "$SUCCESS" == 1 ]]; then
              echo 'ORIGIN_PROOF_CLEANUP=PASS production_guard_retained=true'
              return
            fi
            echo 'ORIGIN_PROOF_ROLLBACK=START'
            if [[ "$AZURE_GUARD_SET" == 1 && -n "$AZURE_RELAY_APP" ]]; then
              az containerapp update -g "$AZURE_RELAY_RG" -n "$AZURE_RELAY_APP" \
                --remove-env-vars TRUYN_ORIGIN_GUARD TRUYN_ORIGIN_GUARD_TOKEN --only-show-errors >/dev/null 2>&1 || true
            fi
            if [[ "$AZURE_SECRET_SET" == 1 && -n "$AZURE_RELAY_APP" ]]; then
              az containerapp secret remove -g "$AZURE_RELAY_RG" -n "$AZURE_RELAY_APP" \
                --secret-names "$AZURE_SECRET_NAME" --only-show-errors >/dev/null 2>&1 || true
            fi
            if [[ "$ROUTE_CREATED" == 1 && -s /tmp/route-id ]]; then
              route_id="$(cat /tmp/route-id)"
              curl -sS -X DELETE -H "Authorization: Bearer ${CF_TOKEN}" \
                "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/workers/routes/${route_id}" >/dev/null 2>&1 || true
            fi
            if [[ "$WORKER_CREATED" == 1 ]]; then
              curl -sS -X DELETE -H "Authorization: Bearer ${CF_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" >/dev/null 2>&1 || true
            fi
            for attempt in $(seq 1 40); do
              code="$(curl -sS --max-time 8 -D /tmp/rollback.headers -o /tmp/rollback.body -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
              if [[ "$code" == '200' ]] && grep -qi '^cf-ray:' /tmp/rollback.headers; then
                echo 'ORIGIN_PROOF_ROLLBACK=PASS canonical_health=200 cloudflare=true'
                return
              fi
              sleep 3
            done
            echo 'ORIGIN_PROOF_ROLLBACK=FAIL canonical_health_not_restored'
          }
          trap cleanup EXIT

          # Discover the live relay without printing cloud topology.
          found=0
          while IFS=$'\t' read -r name rg fqdn; do
            [[ -n "$fqdn" ]] || continue
            role="$(az containerapp show -g "$rg" -n "$name" --query 'properties.template.containers[0].env[?name==`TRUYN_ROLE`].value | [0]' -o tsv)"
            if [[ "$role" != 'relay' && "$name" != *relay* ]]; then continue; fi
            found=1
            AZURE_RELAY_APP="$name"
            AZURE_RELAY_RG="$rg"
            AZURE_RELAY_FQDN="$fqdn"
            for value in "$name" "$rg" "$fqdn"; do echo "::add-mask::$value"; done
            break
          done < <(az containerapp list --query "[?properties.configuration.ingress.external==\`true\`].[name,resourceGroup,properties.configuration.ingress.fqdn]" -o tsv)
          [[ "$found" == 1 ]] || { echo 'ORIGIN_PROOF=FAIL relay_not_found'; exit 11; }

          # Refuse to overwrite an already-configured guard or secret. This keeps the one-shot change bounded.
          env_json="$(az containerapp show -g "$AZURE_RELAY_RG" -n "$AZURE_RELAY_APP" --query 'properties.template.containers[0].env' -o json)"
          existing_guard_vars="$(jq '[.[]? | select(.name=="TRUYN_ORIGIN_GUARD" or .name=="TRUYN_ORIGIN_GUARD_TOKEN")] | length' <<<"$env_json")"
          [[ "$existing_guard_vars" == 0 ]] || { echo 'ORIGIN_PROOF=FAIL preexisting_guard_configuration'; exit 12; }
          existing_secret="$(az containerapp secret list -g "$AZURE_RELAY_RG" -n "$AZURE_RELAY_APP" -o json | jq --arg n "$AZURE_SECRET_NAME" '[.[]? | select(.name==$n)] | length')"
          [[ "$existing_secret" == 0 ]] || { echo 'ORIGIN_PROOF=FAIL preexisting_guard_secret'; exit 13; }

          # Verify the newly-expanded Cloudflare token before changing production.
          scripts="$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts")"
          jq -e '.success == true' <<<"$scripts" >/dev/null || { echo 'CLOUDFLARE_WORKERS_PERMISSION=FAIL'; exit 20; }
          routes="$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/workers/routes")"
          jq -e '.success == true' <<<"$routes" >/dev/null || { echo 'CLOUDFLARE_ROUTES_PERMISSION=FAIL'; exit 21; }
          exact_routes="$(jq '[.result[]? | select(.pattern=="relay.truyn.org/*" or .pattern=="https://relay.truyn.org/*")] | length' <<<"$routes")"
          [[ "$exact_routes" == 0 ]] || { echo 'ORIGIN_PROOF=FAIL existing_relay_worker_route'; exit 22; }
          echo 'CLOUDFLARE_EDGE_PERMISSIONS=PASS workers_write_and_routes_write=true'

          # Capture the existing public behavior before inserting a Worker.
          baseline_health="$(curl -sS --max-time 10 -D /tmp/base-health.headers -o /tmp/base-health.body -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
          [[ "$baseline_health" == '200' ]] && grep -qi '^cf-ray:' /tmp/base-health.headers || { echo 'ORIGIN_PROOF=FAIL baseline_health'; exit 30; }
          baseline_register="$(curl -sS --max-time 10 -D /tmp/base-register.headers -o /tmp/base-register.body -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${PUBLIC_RELAY_URL}/v1/register" || true)"
          jq -e 'type=="object"' /tmp/base-register.body >/dev/null 2>&1 || { echo 'ORIGIN_PROOF=FAIL baseline_register_not_json'; exit 31; }
          baseline_error="$(jq -r '.error // ""' /tmp/base-register.body)"
          [[ "$baseline_error" != 'origin_guard_denied' ]] || { echo 'ORIGIN_PROOF=FAIL baseline_already_guarded'; exit 32; }
          baseline_ws="$(curl -sS --http1.1 --max-time 10 -o /tmp/base-ws.body -w '%{http_code}' \
            -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' \
            -H 'Sec-WebSocket-Key: dHJ1eW4tYmFzZWxpbmUtd3M=' "${PUBLIC_RELAY_URL}/v1/fast/socket?nodeId=origin-proof" || true)"
          [[ "$baseline_ws" != '000' && ! "$baseline_ws" =~ ^5 ]] || { echo "ORIGIN_PROOF=FAIL baseline_ws=${baseline_ws}"; exit 33; }
          printf '%s' "$baseline_register" > /tmp/baseline-register-code
          printf '%s' "$baseline_error" > /tmp/baseline-register-error
          printf '%s' "$baseline_ws" > /tmp/baseline-ws-code
          echo 'PUBLIC_BASELINE=PASS health=200 relay_json=true websocket_reachable=true'

          # Generate the edge proof only in runner memory and mask it before use.
          ORIGIN_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$ORIGIN_TOKEN"
          printf '%s' "$ORIGIN_TOKEN" > /tmp/origin-token
          chmod 600 /tmp/origin-token
          ORIGIN_URL="https://${AZURE_RELAY_FQDN}"
          echo "::add-mask::$ORIGIN_URL"

          # Deploy the repository's audited Worker logic as a self-contained ES module.
          sed "s|import { ORIGIN_GUARD_HEADER } from './origin-guard-contract.js';|const ORIGIN_GUARD_HEADER = 'x-truyn-origin-token';|" \
            runtime/cloudflare-origin-proxy.js > /tmp/worker.mjs
          grep -q "headers.delete(ORIGIN_GUARD_HEADER)" /tmp/worker.mjs
          grep -q "headers.set(ORIGIN_GUARD_HEADER, config.token)" /tmp/worker.mjs
          metadata="$(jq -nc --arg token "$ORIGIN_TOKEN" --arg origin "$ORIGIN_URL" '{main_module:"worker.mjs",compatibility_date:"2026-08-16",bindings:[{type:"secret_text",name:"TRUYN_ORIGIN_GUARD_TOKEN",text:$token},{type:"secret_text",name:"TRUYN_ORIGIN_URL",text:$origin}]}')"
          upload="$(curl -sS -X PUT -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "metadata=${metadata};type=application/json" \
            -F 'worker.mjs=@/tmp/worker.mjs;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}")"
          jq -e '.success == true' <<<"$upload" >/dev/null || { echo 'CLOUDFLARE_WORKER_DEPLOY=FAIL'; exit 40; }
          WORKER_CREATED=1

          route_body="$(jq -nc --arg script "$WORKER_NAME" '{pattern:"relay.truyn.org/*",script:$script}')"
          route="$(curl -sS -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' \
            --data "$route_body" "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/workers/routes")"
          jq -e '.success == true and (.result.id | length > 0)' <<<"$route" >/dev/null || { echo 'CLOUDFLARE_WORKER_ROUTE=FAIL'; exit 41; }
          jq -r '.result.id' <<<"$route" > /tmp/route-id
          chmod 600 /tmp/route-id
          ROUTE_CREATED=1

          # The Worker must be transparent before the Azure guard is enabled.
          worker_ready=0
          for attempt in $(seq 1 40); do
            edge_health="$(curl -sS --max-time 8 -D /tmp/worker-health.headers -o /tmp/worker-health.body -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
            edge_register="$(curl -sS --max-time 8 -o /tmp/worker-register.body -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${PUBLIC_RELAY_URL}/v1/register" || true)"
            edge_error="$(jq -r '.error // ""' /tmp/worker-register.body 2>/dev/null || true)"
            if [[ "$edge_health" == '200' && "$edge_register" == "$(cat /tmp/baseline-register-code)" && "$edge_error" == "$(cat /tmp/baseline-register-error)" ]] && grep -qi '^cf-ray:' /tmp/worker-health.headers; then
              worker_ready=1
              break
            fi
            sleep 3
          done
          [[ "$worker_ready" == 1 ]] || { echo 'CLOUDFLARE_WORKER_TRANSPARENCY=FAIL'; exit 42; }
          worker_ws="$(curl -sS --http1.1 --max-time 10 -o /tmp/worker-ws.body -w '%{http_code}' \
            -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' \
            -H 'Sec-WebSocket-Key: dHJ1eW4td29ya2VyLXdzLXByb29m' "${PUBLIC_RELAY_URL}/v1/fast/socket?nodeId=origin-proof" || true)"
          [[ "$worker_ws" == "$(cat /tmp/baseline-ws-code)" ]] || { echo "CLOUDFLARE_WORKER_WEBSOCKET=FAIL baseline=$(cat /tmp/baseline-ws-code) worker=${worker_ws}"; exit 43; }
          echo 'CLOUDFLARE_WORKER=PASS http_transparent=true websocket_transparent=true client_header_overwrite=true'

          # Store the same proof in Azure as a secret and enable the already-shipped runtime guard.
          az containerapp secret set -g "$AZURE_RELAY_RG" -n "$AZURE_RELAY_APP" \
            --secrets "${AZURE_SECRET_NAME}=${ORIGIN_TOKEN}" --only-show-errors >/dev/null
          AZURE_SECRET_SET=1
          az containerapp update -g "$AZURE_RELAY_RG" -n "$AZURE_RELAY_APP" \
            --set-env-vars TRUYN_ORIGIN_GUARD=1 "TRUYN_ORIGIN_GUARD_TOKEN=secretref:${AZURE_SECRET_NAME}" \
            --only-show-errors >/dev/null
          AZURE_GUARD_SET=1

          # Require simultaneous public relay equivalence and direct-origin denial.
          proof_ready=0
          edge_code='000'; direct_code='000'; edge_error=''; direct_error=''
          for attempt in $(seq 1 80); do
            edge_code="$(curl -sS --max-time 8 -D /tmp/edge.headers -o /tmp/edge.body -w '%{http_code}' \
              -X POST -H 'content-type: application/json' --data '{}' "${PUBLIC_RELAY_URL}/v1/register" || true)"
            edge_error="$(jq -r '.error // ""' /tmp/edge.body 2>/dev/null || true)"
            direct_code="$(curl -sS --max-time 8 -o /tmp/direct.body -w '%{http_code}' \
              -X POST -H 'content-type: application/json' --data '{}' "${ORIGIN_URL}/v1/register" || true)"
            direct_error="$(jq -r '.error // ""' /tmp/direct.body 2>/dev/null || true)"
            if [[ "$edge_code" == "$(cat /tmp/baseline-register-code)" && "$edge_error" == "$(cat /tmp/baseline-register-error)" && "$direct_code" == '403' && "$direct_error" == 'origin_guard_denied' ]] && grep -qi '^cf-ray:' /tmp/edge.headers; then
              proof_ready=1
              break
            fi
            sleep 4
          done
          [[ "$proof_ready" == 1 ]] || { echo "ORIGIN_GUARD_CONVERGENCE=FAIL edge=${edge_code}:${edge_error} direct=${direct_code}:${direct_error}"; exit 50; }

          direct_spoof="$(curl -sS --max-time 10 -o /tmp/direct-spoof.body -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -H 'CF-Connecting-IP: 173.245.48.1' -H 'X-Forwarded-For: 173.245.48.1' \
            -H 'x-truyn-origin-token: attacker-controlled' --data '{}' "${ORIGIN_URL}/v1/register" || true)"
          direct_spoof_error="$(jq -r '.error // ""' /tmp/direct-spoof.body 2>/dev/null || true)"
          [[ "$direct_spoof" == '403' && "$direct_spoof_error" == 'origin_guard_denied' ]] || { echo "DIRECT_SPOOF_PROOF=FAIL http=${direct_spoof} error=${direct_spoof_error}"; exit 51; }

          direct_ws="$(curl -sS --http1.1 --max-time 10 -o /tmp/direct-ws.body -w '%{http_code}' \
            -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' \
            -H 'Sec-WebSocket-Key: dHJ1eW4tZGlyZWN0LXdzLXByb29m' "${ORIGIN_URL}/v1/fast/socket?nodeId=origin-proof" || true)"
          [[ "$direct_ws" == '403' ]] || { echo "DIRECT_WEBSOCKET_PROOF=FAIL http=${direct_ws}"; exit 52; }

          edge_spoof="$(curl -sS --max-time 10 -D /tmp/edge-spoof.headers -o /tmp/edge-spoof.body -w '%{http_code}' \
            -X POST -H 'content-type: application/json' -H 'x-truyn-origin-token: attacker-controlled' \
            --data '{}' "${PUBLIC_RELAY_URL}/v1/register" || true)"
          edge_spoof_error="$(jq -r '.error // ""' /tmp/edge-spoof.body 2>/dev/null || true)"
          [[ "$edge_spoof" == "$(cat /tmp/baseline-register-code)" && "$edge_spoof_error" == "$(cat /tmp/baseline-register-error)" ]] || { echo "EDGE_HEADER_OVERWRITE_PROOF=FAIL http=${edge_spoof} error=${edge_spoof_error}"; exit 53; }
          grep -qi '^cf-ray:' /tmp/edge-spoof.headers || { echo 'EDGE_HEADER_OVERWRITE_PROOF=FAIL cf_ray_missing'; exit 54; }

          edge_ws="$(curl -sS --http1.1 --max-time 10 -o /tmp/edge-ws.body -w '%{http_code}' \
            -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' \
            -H 'Sec-WebSocket-Key: dHJ1eW4tZWRnZS13cy1wcm9vZg==' "${PUBLIC_RELAY_URL}/v1/fast/socket?nodeId=origin-proof" || true)"
          [[ "$edge_ws" == "$(cat /tmp/baseline-ws-code)" ]] || { echo "EDGE_WEBSOCKET_PROOF=FAIL baseline=$(cat /tmp/baseline-ws-code) edge=${edge_ws}"; exit 55; }

          # Direct /health intentionally remains a generic guard health response, but never reaches the inner relay.
          direct_health="$(curl -sS --max-time 10 -o /tmp/direct-health.body -w '%{http_code}' "${ORIGIN_URL}/health" || true)"
          direct_health_shape="$(jq -r 'if .ok==true and .protocol=="TRUYN/1" then "guard_health" else "other" end' /tmp/direct-health.body 2>/dev/null || true)"
          [[ "$direct_health" == '200' && "$direct_health_shape" == 'guard_health' ]] || { echo "DIRECT_HEALTH_GUARD=FAIL http=${direct_health}"; exit 56; }

          SUCCESS=1
          echo 'PUBLIC_EDGE_HTTP=PASS baseline_equivalent=true'
          echo 'PUBLIC_EDGE_WEBSOCKET=PASS baseline_equivalent=true'
          echo 'PUBLIC_CLIENT_SUPPLIED_ORIGIN_TOKEN=OVERWRITTEN'
          echo 'DIRECT_AZURE_REGISTER=403 origin_guard_denied'
          echo 'DIRECT_AZURE_WEBSOCKET=403 origin_guard_denied'
          echo 'DIRECT_AZURE_SPOOFED_CLOUDFLARE_HEADERS=403 origin_guard_denied'
          echo 'DIRECT_AZURE_HEALTH=200 guard_only_no_inner_relay'
          echo 'INNER_RELAY_DIRECT_DATA_PLANE_REQUEST_COUNT=0_by_guard_boundary'
          echo 'AZURE_ORIGIN_BYPASS_DATA_PLANE_GATE=PASS'
          echo 'PRODUCTION_ORIGIN_GUARD=ENABLED'
