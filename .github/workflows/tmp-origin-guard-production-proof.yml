name: Temporary Front Door Relay Route Discovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-origin-guard-production-proof.yml']

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      PUBLIC_RELAY_URL: https://relay.truyn.org
    steps:
      - name: Authenticate Azure with main-only OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - name: Discover exact live Front Door route without mutation
        shell: bash
        run: |
          set -euo pipefail
          API='2025-04-15'
          : > /tmp/live-endpoints.tsv

          profiles="$(az resource list --resource-type Microsoft.Cdn/profiles -o json)"
          mapfile -t profile_ids < <(jq -r '.[] | select((.sku.name // "") | test("AzureFrontDoor"; "i")) | .id' <<<"$profiles")
          [[ "${#profile_ids[@]}" -gt 0 ]] || { echo 'AFD_ROUTE_DISCOVERY=FAIL no_afd_profile'; exit 10; }

          for profile_id in "${profile_ids[@]}"; do
            echo "::add-mask::$profile_id"
            endpoints="$(az rest --method get --url "https://management.azure.com${profile_id}/afdEndpoints?api-version=${API}" 2>/dev/null || echo '{}')"
            while IFS=$'\t' read -r endpoint_id endpoint_name endpoint_host enabled; do
              [[ "$enabled" == 'Enabled' && -n "$endpoint_id" && -n "$endpoint_host" ]] || continue
              for value in "$endpoint_id" "$endpoint_name" "$endpoint_host"; do [[ -n "$value" ]] && echo "::add-mask::$value"; done
              code="$(curl -sS --max-time 15 --connect-to "relay.truyn.org:443:${endpoint_host}:443" -o /tmp/afd-live.body -w '%{http_code}' "https://relay.truyn.org/health" || true)"
              if [[ "$code" == '200' ]]; then
                printf '%s\t%s\t%s\t%s\n' "$profile_id" "$endpoint_id" "$endpoint_name" "$endpoint_host" >> /tmp/live-endpoints.tsv
              fi
            done < <(jq -r '.value[]? | [.id, .name, (.properties.hostName // ""), (.properties.enabledState // "")] | @tsv' <<<"$endpoints")
          done

          live_count="$(sort -u /tmp/live-endpoints.tsv | sed '/^$/d' | wc -l | tr -d ' ')"
          [[ "$live_count" == 1 ]] || { echo "AFD_ROUTE_DISCOVERY=FAIL live_endpoint_count=${live_count}"; exit 11; }
          IFS=$'\t' read -r profile_id endpoint_id endpoint_name endpoint_host < <(sort -u /tmp/live-endpoints.tsv)
          echo 'AFD_LIVE_ENDPOINT=PASS unique=true'

          domains="$(az rest --method get --url "https://management.azure.com${profile_id}/customDomains?api-version=${API}" 2>/dev/null || echo '{}')"
          mapfile -t domain_ids < <(jq -r '.value[]? | select((.properties.hostName // "") == "relay.truyn.org") | .id' <<<"$domains")
          [[ "${#domain_ids[@]}" == 1 ]] || { echo "AFD_ROUTE_DISCOVERY=FAIL relay_custom_domain_count=${#domain_ids[@]}"; exit 12; }
          domain_id="${domain_ids[0]}"
          echo "::add-mask::$domain_id"
          echo 'AFD_CUSTOM_DOMAIN=PASS unique=true'

          routes="$(az rest --method get --url "https://management.azure.com${endpoint_id}/routes?api-version=${API}" 2>/dev/null || echo '{}')"
          total_routes="$(jq '.value | length' <<<"$routes" 2>/dev/null || echo 0)"
          [[ "$total_routes" -gt 0 ]] || { echo 'AFD_ROUTE_DISCOVERY=FAIL no_routes'; exit 13; }

          # Select only routes attached to the relay custom domain. Compare IDs case-insensitively because ARM IDs are case-insensitive.
          relay_routes="$(jq --arg domain "${domain_id,,}" '[.value[]? | select([.properties.customDomains[]?.id | ascii_downcase] | index($domain))]' <<<"$routes")"
          route_count="$(jq 'length' <<<"$relay_routes")"
          [[ "$route_count" == 1 ]] || { echo "AFD_ROUTE_DISCOVERY=FAIL relay_route_count=${route_count}"; exit 14; }
          route_id="$(jq -r '.[0].id' <<<"$relay_routes")"
          route_name="$(jq -r '.[0].name' <<<"$relay_routes")"
          enabled_state="$(jq -r '.[0].properties.enabledState // "unknown"' <<<"$relay_routes")"
          origin_group_id="$(jq -r '.[0].properties.originGroup.id // empty' <<<"$relay_routes")"
          ruleset_count="$(jq '.[0].properties.ruleSets // [] | length' <<<"$relay_routes")"
          forwarding_protocol="$(jq -r '.[0].properties.forwardingProtocol // "unknown"' <<<"$relay_routes")"
          https_redirect="$(jq -r '.[0].properties.httpsRedirect // "unknown"' <<<"$relay_routes")"
          for value in "$route_id" "$route_name" "$origin_group_id"; do [[ -n "$value" ]] && echo "::add-mask::$value"; done
          [[ "$enabled_state" == 'Enabled' ]] || { echo "AFD_ROUTE_DISCOVERY=FAIL route_enabled_state=${enabled_state}"; exit 15; }
          [[ -n "$origin_group_id" ]] || { echo 'AFD_ROUTE_DISCOVERY=FAIL origin_group_missing'; exit 16; }

          public_code="$(curl -sS --max-time 15 -D /tmp/public.headers -o /tmp/public.body -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
          [[ "$public_code" == '200' ]] && grep -qi '^cf-ray:' /tmp/public.headers || { echo "AFD_ROUTE_DISCOVERY=FAIL public_health=${public_code}"; exit 17; }

          echo "AFD_RELAY_ROUTE=PASS unique=true enabled=true existing_rule_sets=${ruleset_count} forwarding_protocol=${forwarding_protocol} https_redirect=${https_redirect}"
          echo 'PUBLIC_RELAY=PASS health=200 cf_ray=true'
          echo 'AFD_ROUTE_DISCOVERY=PASS read_only=true'
