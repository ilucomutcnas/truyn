name: Temporary Relay Front Door Recovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-origin-guard-production-proof.yml']

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKENS }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      PUBLIC_RELAY_URL: https://relay.truyn.org
    steps:
      - name: Authenticate Azure with main-only OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - name: Discover live Front Door and restore Cloudflare CNAME
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CF_TOKEN:-}" && -n "${CF_ZONE_ID:-}" ]] || { echo 'AFD_RECOVERY=FAIL missing_cloudflare_binding'; exit 10; }

          # Keep the current DNS record only as an in-run rollback file; never print the origin target.
          dns_base="https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records"
          dns="$(curl -sS -G -H "Authorization: Bearer ${CF_TOKEN}" --data-urlencode 'name=relay.truyn.org' "$dns_base")"
          jq -e '.success == true and (.result | length) == 1' <<<"$dns" >/dev/null || { echo 'AFD_RECOVERY=FAIL dns_lookup'; exit 11; }
          record_id="$(jq -r '.result[0].id' <<<"$dns")"
          echo "::add-mask::$record_id"
          jq '.result[0] | {type,name,content,ttl,proxied}' <<<"$dns" > /tmp/dns-before.json
          old_content="$(jq -r '.content' /tmp/dns-before.json)"
          echo "::add-mask::$old_content"

          profiles="$(az resource list --resource-type Microsoft.Cdn/profiles -o json)"
          mapfile -t profile_ids < <(jq -r '.[] | select((.sku.name // "") | test("AzureFrontDoor"; "i")) | .id' <<<"$profiles")
          [[ "${#profile_ids[@]}" -gt 0 ]] || { echo 'AFD_RECOVERY=FAIL no_afd_profile'; exit 12; }

          : > /tmp/candidates
          for profile_id in "${profile_ids[@]}"; do
            echo "::add-mask::$profile_id"
            endpoints="$(az rest --method get --url "https://management.azure.com${profile_id}/afdEndpoints?api-version=2025-04-15" 2>/dev/null || echo '{}')"
            while IFS= read -r host; do
              [[ -n "$host" ]] || continue
              echo "::add-mask::$host"
              code="$(curl -sS --max-time 15 --connect-to "relay.truyn.org:443:${host}:443" -o /tmp/afd-probe.body -w '%{http_code}' "https://relay.truyn.org/health" || true)"
              if [[ "$code" == '200' ]]; then
                printf '%s\n' "$host" >> /tmp/candidates
              fi
            done < <(jq -r '.value[]? | select(.properties.enabledState=="Enabled") | .properties.hostName // empty' <<<"$endpoints")
          done

          candidate_count="$(sort -u /tmp/candidates | sed '/^$/d' | wc -l | tr -d ' ')"
          [[ "$candidate_count" == 1 ]] || { echo "AFD_RECOVERY=FAIL live_candidate_count=${candidate_count}"; exit 13; }
          target="$(sort -u /tmp/candidates | head -n1)"
          echo "::add-mask::$target"
          echo 'AFD_DISCOVERY=PASS unique_live_endpoint=true'

          body="$(jq -nc --arg target "$target" '{type:"CNAME",name:"relay.truyn.org",content:$target,ttl:1,proxied:true}')"
          changed="$(curl -sS -X PUT -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "$body" "${dns_base}/${record_id}")"
          jq -e '.success == true and .result.type=="CNAME" and .result.proxied==true' <<<"$changed" >/dev/null || { echo 'AFD_RECOVERY=FAIL dns_write'; exit 14; }

          ok=0; last='000'
          for attempt in $(seq 1 60); do
            last="$(curl -sS --max-time 10 -D /tmp/public.headers -o /tmp/public.body -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
            if [[ "$last" == '200' ]] && grep -qi '^cf-ray:' /tmp/public.headers; then ok=1; break; fi
            sleep 3
          done
          if [[ "$ok" != 1 ]]; then
            rollback="$(cat /tmp/dns-before.json)"
            curl -sS -X PUT -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "$rollback" "${dns_base}/${record_id}" >/dev/null || true
            echo "AFD_RECOVERY=FAIL public_health=${last} rolled_back=true"
            exit 15
          fi

          final_dns="$(curl -sS -G -H "Authorization: Bearer ${CF_TOKEN}" --data-urlencode 'name=relay.truyn.org' "$dns_base")"
          jq -e --arg target "$target" '.success==true and (.result|length)==1 and .result[0].type=="CNAME" and .result[0].content==$target and .result[0].proxied==true' <<<"$final_dns" >/dev/null || { echo 'AFD_RECOVERY=FAIL final_dns_mismatch'; exit 16; }
          echo 'CLOUDFLARE_DNS=PASS proxied_cname_to_front_door=true'
          echo 'PUBLIC_RELAY=PASS health=200 cf_ray=true'
          echo 'AFD_RECOVERY=PASS'
