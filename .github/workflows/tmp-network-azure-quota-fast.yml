name: Temporary Network Azure Quota Fast
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-network-azure-quota-fast.yml']
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Find family quota
        shell: bash
        run: |
          set -Eeuo pipefail
          regions=(eastus2 eastus centralus southcentralus westus2 northeurope westeurope uksouth swedencentral)
          families=(standardBSFamily standardAv2Family standardDSv5Family standardDASv5Family)
          for region in "${regions[@]}"; do
            usage="$(az vm list-usage -l "$region" -o json --only-show-errors)"
            total="$(jq -r '[.[]|select(.name.value=="cores")][0] | ((.limit|tonumber)-(.currentValue|tonumber))' <<<"$usage")"
            for family in "${families[@]}"; do
              avail="$(jq -r --arg f "$family" '[.[]|select(.name.value==$f)][0] | if .==null then -1 else ((.limit|tonumber)-(.currentValue|tonumber)) end' <<<"$usage")"
              echo "TRUYN_QUOTA region=$region family=$family available=$avail total=$total"
              if [[ "$avail" -ge 4 && "$total" -ge 4 ]]; then
                case "$family" in
                  standardBSFamily) size=Standard_B1ms ;;
                  standardAv2Family) size=Standard_A1_v2 ;;
                  standardDSv5Family) size=Standard_D2s_v5 ;;
                  standardDASv5Family) size=Standard_D2as_v5 ;;
                esac
                echo "::notice title=TRUYN Azure Capacity Candidate::region=$region size=$size family=$family available=$avail total=$total"
                echo "TRUYN_AZURE_QUOTA=PASS region=$region size=$size family=$family available=$avail total=$total"
                exit 0
              fi
            done
          done
          echo '::error title=TRUYN Azure Quota::No candidate region has >=4 family vCPU quota'
          exit 11
