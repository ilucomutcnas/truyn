name: Ephemeral Semantic v2 Constraint Diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-constraint-diagnostic.yml']

permissions:
  contents: read
  id-token: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GEMINI3_FLASH_MODEL: gemini-3-flash-preview
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load immutable Semantic v2 corpus source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/benchmarks/semantic-retrieval-v2.js?ref=${SEMANTIC_V2_SOURCE_SHA}" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/semantic-retrieval-v2.js
          test -s /tmp/semantic-retrieval-v2.js

      - id: auth
        name: Authenticate GCP diagnostic identity using WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          token_format: access_token

      - name: Run three-case constraint diagnostic
        shell: bash
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('/tmp/semantic-retrieval-v2.js', 'utf8');
          const start = source.indexOf('const domains = [');
          const end = source.indexOf('const fullContext =');
          if (start < 0 || end < 0 || end <= start) throw new Error('immutable corpus extraction markers not found');
          const corpus = source.slice(start, end);
          const script = `
          import { writeFile } from 'node:fs/promises';
          import { createVertexGeminiProvider } from './adapters/providers/vertex-gemini.js';
          import { createProviderSemanticReranker } from './core/context/provider-semantic-reranker.js';
          const corpusSize = 600;
          const retrievalCaseCount = 360;
          ${corpus}
          const cases = [
            { caseIndex:5, wrongId:'semantic-record-305' },
            { caseIndex:241, wrongId:'semantic-record-437' },
            { caseIndex:269, wrongId:'semantic-record-553' }
          ];
          const provider = createVertexGeminiProvider({
            projectId:process.env.GCP_PROJECT_ID_VALUE,
            location:'global',
            model:process.env.GEMINI3_FLASH_MODEL,
            endpoint:'https://aiplatform.googleapis.com',
            accessTokenProvider:async () => process.env.GCP_ACCESS_TOKEN,
            capabilities:['reasoning.general'],
            requestTimeoutMs:120000
          });
          const reranker = createProviderSemanticReranker({
            provider,
            name:'gemini-3-flash-low-constraint-diagnostic',
            providerOptions:{
              thinkingLevel:'LOW',
              temperature:0,
              maxOutputTokens:512,
              responseMimeType:'application/json',
              responseSchema:{ type:'OBJECT', properties:{ id:{type:'STRING'} }, required:['id'] }
            },
            shortlistSize:1,
            repairAttempts:1
          });
          const results = [];
          for (const spec of cases) {
            const item = retrievalCases.find((entry) => entry.caseIndex === spec.caseIndex);
            const expected = records.find((record) => record.id === item.id);
            const wrong = records.find((record) => record.id === spec.wrongId);
            if (!item || !expected || !wrong) throw new Error('diagnostic corpus lookup failed');
            const result = await reranker.rerank(item.question, [
              { id:wrong.id, text:wrong.text },
              { id:expected.id, text:expected.text }
            ]);
            results.push({
              caseIndex:item.caseIndex,
              queryLanguage:item.queryLanguage,
              category:item.category,
              expectedId:expected.id,
              previousWrongId:wrong.id,
              selectedId:result.id,
              pass:result.id === expected.id,
              usage:result.metadata.usage,
              providerCandidateAliases:result.metadata.providerCandidateAliases
            });
          }
          const report = {
            benchmark:'TRUYN Semantic Retrieval Gate v2 targeted constraint diagnostic',
            generatedAt:new Date().toISOString(),
            sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,
            productionRerankerCommit:process.env.GITHUB_SHA,
            model:process.env.GEMINI3_FLASH_MODEL,
            thinkingLevel:'LOW',
            purpose:'Re-evaluate the three prior top-24 verifier mistakes against their actual selected near-duplicate competitor after the generic constraint-complete rubric change.',
            cases:results,
            passed:results.every((item) => item.pass),
            rerankerStats:reranker.stats()
          };
          await writeFile('semantic-v2-constraint-diagnostic.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (!report.passed) process.exitCode = 2;
          `;
          fs.writeFileSync('/tmp/semantic-v2-constraint-diagnostic.mjs', script);
          NODE
          node --check /tmp/semantic-v2-constraint-diagnostic.mjs
          node /tmp/semantic-v2-constraint-diagnostic.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-constraint-diagnostic-${{ github.run_id }}
          path: semantic-v2-constraint-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
