name: Temporary ACI Productionization State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-aci-productionization-state.yml'

permissions:
  contents: read
  id-token: write

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Inspect ephemeral ACI groups
        shell: bash
        run: |
          set -euo pipefail
          for run in 31998974633 31999173792; do
            data="$(az container list --query "[?starts_with(name, 'truyn-aci-${run}-')]" -o json --only-show-errors)"
            count="$(jq 'length' <<<"$data")"
            provisioning="$(jq -c '[.[].provisioningState] | group_by(.) | map({state:.[0],count:length})' <<<"$data")"
            runtime="$(jq -c '[.[].instanceView.state // "unknown"] | group_by(.) | map({state:.[0],count:length})' <<<"$data")"
            echo "TRUYN_ACI_STATE run=$run groups=$count provisioning=$provisioning runtime=$runtime"
          done
