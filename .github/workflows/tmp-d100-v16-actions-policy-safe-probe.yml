name: tmp-d100-v16-actions-policy-safe-probe

on:
  push:
    branches:
      - ci/d100-v16-main-security-green-observer-23360cbe
    paths:
      - '.github/workflows/tmp-d100-v16-actions-policy-safe-probe.yml'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe repository and organization Actions policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          probe() {
            local label="$1" endpoint="$2"
            local response rc compact
            response="$(gh api "$endpoint" 2>&1)"; rc=$?
            compact="$(printf '%s' "$response" | tr '\n' ' ' | head -c 4000)"
            printf '%s_rc=%s\n%s_response=%s\n' "$label" "$rc" "$label" "$compact" >> /tmp/result.txt
          }
          probe repo_actions "repos/${GITHUB_REPOSITORY}/actions/permissions"
          probe repo_selected "repos/${GITHUB_REPOSITORY}/actions/permissions/selected-actions"
          probe repo_workflow_perm "repos/${GITHUB_REPOSITORY}/actions/permissions/workflow"
          probe org_actions "orgs/${GITHUB_REPOSITORY_OWNER}/actions/permissions"
          probe org_selected "orgs/${GITHUB_REPOSITORY_OWNER}/actions/permissions/selected-actions"
          probe org_workflow_perm "orgs/${GITHUB_REPOSITORY_OWNER}/actions/permissions/workflow"
          body="$(cat /tmp/result.txt)stage=actions_policy_safe_probe"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN D-100 V16 ACTIONS POLICY SAFE PROBE' -f "body=${body}" >/dev/null
          exit 0
