# Controlled trigger: relay trace 8x benchmark round 3, 2026-08-15
name: Cloud PoC Cross-Cloud A/B Benchmark

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-poc-benchmark-ab.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRUYN_RELAY: https://relay.truyn.org
      AZURE_RG: truyn
      AZURE_OPENAI_NAME: truyn-openai-1334540181
      AZURE_OPENAI_DEPLOYMENT: truyn-gpt-4-1-mini
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_BENCHMARK_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-benchmark-gemini-direct
      GOOGLE_CLOUD_LOCATION: global
      GEMINI_MODEL: gemini-2.5-flash
      BENCHMARK_WARMUPS: '1'
      BENCHMARK_ITERATIONS: '5'
      BENCHMARK_OUTPUT: cross-cloud-ab.json
      TRUYN_BASELINE_PROTOCOL_BYTES: '4143.4'
      TRUYN_BASELINE_ORCHESTRATION_MS: '1491.2'
      TRUYN_REQUIRED_IMPROVEMENT_FACTOR: '8'
      AZURE_INPUT_USD_PER_M: '0.44'
      AZURE_OUTPUT_USD_PER_M: '1.76'
      AZURE_PRICE_SOURCE: 'Azure Retail Prices API; eastus; gpt 4.1 mini Inp/Outp regnl; 2026-08-15 snapshot'
      GEMINI_INPUT_USD_PER_M: '0.30'
      GEMINI_OUTPUT_USD_PER_M: '2.50'
      GEMINI_PRICE_SOURCE: 'Google Cloud Vertex AI pricing; Gemini 2.5 Flash GA ON_DEMAND; 2026-08-15 snapshot'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install benchmark dependencies
        run: npm install --no-audit --no-fund

      - name: Verify canonical relay domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "${TRUYN_RELAY}/health" | jq -e '.ok == true and .protocol == "TRUYN/1" and .fastPath == true and .chainPath == true' >/dev/null; then
              echo 'TRUYN_CANONICAL_RELAY_HEALTH=success'
              exit 0
            fi
            sleep 5
          done
          echo 'TRUYN_CANONICAL_RELAY_HEALTH=failed'
          exit 1

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare ephemeral direct Azure credentials
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$AZURE_OPENAI_NAME" --query properties.endpoint -o tsv)"
          [[ -n "$endpoint" ]] || { echo 'AZURE_OPENAI_ENDPOINT=missing'; exit 1; }
          echo "AZURE_OPENAI_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          token="$(az account get-access-token --resource https://cognitiveservices.azure.com/ --query accessToken -o tsv)"
          [[ -n "$token" ]] || { echo 'AZURE_OPENAI_ACCESS_TOKEN=missing'; exit 1; }
          echo "::add-mask::$token"
          echo "AZURE_OPENAI_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$AZURE_OPENAI_NAME" --query key1 -o tsv)"
          [[ -n "$key" ]] || { echo 'AZURE_OPENAI_API_KEY=missing'; exit 1; }
          echo "::add-mask::$key"
          echo "AZURE_OPENAI_API_KEY=$key" >> "$GITHUB_ENV"
          echo 'AZURE_DIRECT_CREDENTIALS=ready'

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Prepare ephemeral direct Gemini proxy
        shell: bash
        run: |
          set -euo pipefail
          region="$GCP_BENCHMARK_REGION"
          echo "GCP_REGION_VALUE=$region" >> "$GITHUB_ENV"
          proxy_token="$(openssl rand -hex 32)"
          echo "::add-mask::$proxy_token"
          echo "BENCHMARK_PROXY_TOKEN=$proxy_token" >> "$GITHUB_ENV"
          registry="${region}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID}/${GCP_AR_REPO}/benchmark-ab:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.gemini-proxy -t "$image" .
          docker push "$image"
          echo "GCP_BENCHMARK_IMAGE=$image" >> "$GITHUB_ENV"
          gcloud run deploy "$GCP_PROXY_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$region" \
            --image="$image" \
            --service-account="$GCP_RUNTIME_SA_VALUE" \
            --port=8080 \
            --min=0 \
            --max=1 \
            --cpu=1 \
            --memory=512Mi \
            --set-env-vars="BENCHMARK_PROXY_TOKEN=${proxy_token}" \
            --no-invoker-iam-check \
            --quiet
          proxy_url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID" --region="$region" --format='value(status.url)')"
          [[ -n "$proxy_url" ]] || { echo 'GEMINI_DIRECT_PROXY_URL=missing'; exit 1; }
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${proxy_token}" "${proxy_url}/health" | jq -e '.ok == true' >/dev/null; then
              echo 'GEMINI_DIRECT_PROXY_HEALTH=success'
              break
            fi
            [[ "$attempt" -lt 30 ]] || { echo 'GEMINI_DIRECT_PROXY_HEALTH=failed'; exit 1; }
            sleep 2
          done
          echo "VERTEX_API_ENDPOINT=$proxy_url" >> "$GITHUB_ENV"
          echo "GCP_ACCESS_TOKEN=$proxy_token" >> "$GITHUB_ENV"
          echo "GEMINI_DIRECT_PROXY_URL=$proxy_url" >> "$GITHUB_ENV"
          echo 'GEMINI_DIRECT_PROXY=ready'

      - name: Run paired A/B benchmark
        shell: bash
        run: |
          set -euo pipefail
          node benchmarks/cross-cloud-ab.js
          tmp="$(mktemp)"
          jq --arg proxy "$GEMINI_DIRECT_PROXY_URL" --arg region "$GCP_BENCHMARK_REGION" '
            .methodology.directAzureAuthentication = "Azure OpenAI account key fetched at run time through Azure OIDC management access; no TRUYN relay/envelope involved." |
            .methodology.directGeminiProxy = $proxy |
            .methodology.directGeminiProxyRegion = $region |
            .methodology.directGeminiProxySemantics = "Raw Vertex generateContent request/response preserved; proxy only supplies the same runtime service-account identity used by truyn-gemini."
          ' cross-cloud-ab.json > "$tmp"
          mv "$tmp" cross-cloud-ab.json

      - name: Print benchmark summary
        if: ${{ success() }}
        shell: bash
        run: |
          jq '{benchmark,status,generatedAt,relayUrl,methodology,pricing,optimizationGate,diagnostics,aggregate,claims}' cross-cloud-ab.json

      - name: Upload benchmark evidence
        if: ${{ always() && hashFiles('cross-cloud-ab.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-cross-cloud-ab-${{ github.run_id }}
          path: cross-cloud-ab.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce 8x optimization gate
        if: ${{ hashFiles('cross-cloud-ab.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.optimizationGate.passed == true' cross-cloud-ab.json >/dev/null
          echo 'TRUYN_8X_OPTIMIZATION_GATE=passed'

      - name: Delete ephemeral direct Gemini proxy
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_BENCHMARK_REGION" \
            --quiet >/dev/null 2>&1 || true
          echo 'GEMINI_DIRECT_PROXY_CLEANUP=complete'
