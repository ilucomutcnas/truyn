name: TRUYN Video Providers Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-video-providers.yml'
      - 'scripts/smoke/provision-azure-video.sh'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: truyn-video-provider-smoke
  cancel-in-progress: false

jobs:
  video-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_RG: truyn
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-video-smoke-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: mkdir -p smoke-artifacts/video

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Azure video model if available
        run: bash scripts/smoke/provision-azure-video.sh

      - name: Smoke Azure video only at minimum parameters
        if: env.AZURE_VIDEO_READY == 'true'
        shell: bash
        run: |
          set -uo pipefail
          if SMOKE_PROVIDER=azure-openai-video SMOKE_OUTPUT_DIR=smoke-artifacts/video AZURE_VIDEO_ENDPOINT="$AZURE_VIDEO_ENDPOINT" AZURE_VIDEO_DEPLOYMENT="$AZURE_VIDEO_DEPLOYMENT" AZURE_VIDEO_API_KEY="$AZURE_VIDEO_API_KEY" node scripts/smoke/video-provider.js > smoke-artifacts/video/azure-video.json 2>smoke-artifacts/video/azure-video.err; then
            cat smoke-artifacts/video/azure-video.json
          elif grep -Eqi 'permission|access|quota|resource_exhausted|not available|not found|unsupported subscription' smoke-artifacts/video/azure-video.err; then
            jq -n --arg model "$AZURE_VIDEO_MODEL" '{ok:false,modality:"video",provider:"azure-openai-video",model:$model,status:"blocked_access",stage:"inference"}' > smoke-artifacts/video/azure-video.json
          else
            cat smoke-artifacts/video/azure-video.err >&2
            exit 1
          fi

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Prepare runtime-identity Veo proxy
        env:
          VERTEX_UPSTREAM_ORIGIN: https://us-central1-aiplatform.googleapis.com
        run: bash scripts/smoke/deploy-vertex-smoke-proxy.sh

      - name: Smoke Veo only at minimum parameters
        shell: bash
        run: |
          set -uo pipefail
          if SMOKE_PROVIDER=vertex-veo SMOKE_OUTPUT_DIR=smoke-artifacts/video GCP_PROJECT_ID="$GCP_PROJECT_ID_VALUE" GCP_VIDEO_REGION=us-central1 VEO_MODEL=veo-3.1-fast-generate-001 VERTEX_API_ENDPOINT="$VERTEX_SMOKE_ENDPOINT" GCP_ACCESS_TOKEN="$VERTEX_SMOKE_TOKEN" VEO_POLL_MS=5000 VEO_TIMEOUT_MS=300000 node scripts/smoke/video-provider.js > smoke-artifacts/video/veo.json 2>smoke-artifacts/video/veo.err; then
            cat smoke-artifacts/video/veo.json
          elif grep -Eqi 'permission|access|quota|resource_exhausted|not available|not found|fixed quota' smoke-artifacts/video/veo.err; then
            jq -n '{ok:false,modality:"video",provider:"vertex-veo",model:"veo-3.1-fast-generate-001",status:"blocked_access",stage:"inference"}' > smoke-artifacts/video/veo.json
          else
            cat smoke-artifacts/video/veo.err >&2
            exit 1
          fi

      - name: Upload video-only smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truyn-video-provider-smoke-${{ github.run_id }}
          path: smoke-artifacts/video
          if-no-files-found: error
          retention-days: 30

      - name: Delete ephemeral Veo proxy
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
