name: Ephemeral Semantic v2 Flash LOW Budget Diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-budget-diagnostic.yml']

permissions:
  contents: read
  id-token: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-budget-${{ github.run_id }}
      GEMINI3_FLASH_MODEL: gemini-3-flash-preview
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load immutable corpus and proxy sources
        shell: bash
        run: |
          set -euo pipefail
          load_file() {
            path="$1"; ref="$2"
            mkdir -p "$(dirname "$path")"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
          }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Prepare isolated runtime-identity Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-budget:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null
          docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok == true' >/dev/null; then break; fi
            [[ "$attempt" -lt 30 ]] || exit 1
            sleep 2
          done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"
          echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"

      - name: Test the two remaining prior-error pairs at 768 output tokens
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('benchmarks/semantic-retrieval-v2.js', 'utf8');
          const start = source.indexOf('const domains = [');
          const end = source.indexOf('const fullContext =');
          if (start < 0 || end < 0 || end <= start) throw new Error('immutable corpus extraction markers not found');
          const corpus = source.slice(start, end);
          fs.writeFileSync('semantic-v2-budget-diagnostic.mjs', `
          import { writeFile } from 'node:fs/promises';
          import { createVertexGeminiProvider } from './adapters/providers/vertex-gemini.js';
          import { createProviderSemanticReranker } from './core/context/provider-semantic-reranker.js';
          const corpusSize = 600;
          const retrievalCaseCount = 360;
          ${corpus}
          const specs = [
            { caseIndex:5, wrongId:'semantic-record-305' },
            { caseIndex:241, wrongId:'semantic-record-437' }
          ];
          const provider = createVertexGeminiProvider({
            projectId:process.env.GCP_PROJECT_ID,
            location:'global',
            model:process.env.GEMINI3_FLASH_MODEL,
            endpoint:process.env.VERTEX_API_ENDPOINT,
            accessTokenProvider:async () => process.env.GCP_ACCESS_TOKEN,
            capabilities:['reasoning.general'], requestTimeoutMs:120000
          });
          const reranker = createProviderSemanticReranker({
            provider,
            name:'gemini-3-flash-low-budget-768-diagnostic',
            providerOptions:{ thinkingLevel:'LOW', temperature:0, maxOutputTokens:768,
              responseMimeType:'application/json', responseSchema:{ type:'OBJECT', properties:{ id:{type:'STRING'} }, required:['id'] } },
            shortlistSize:1, repairAttempts:1
          });
          const results = [];
          for (const spec of specs) {
            const item = retrievalCases.find((entry) => entry.caseIndex === spec.caseIndex);
            const expected = records.find((record) => record.id === item.id);
            const wrong = records.find((record) => record.id === spec.wrongId);
            const result = await reranker.rerank(item.question, [
              { id:wrong.id, text:wrong.text }, { id:expected.id, text:expected.text }
            ]);
            results.push({ caseIndex:item.caseIndex, expectedId:expected.id, previousWrongId:wrong.id,
              selectedId:result.id, pass:result.id === expected.id, usage:result.metadata.usage });
          }
          const report = { benchmark:'TRUYN Semantic v2 Flash LOW budget saturation diagnostic',
            generatedAt:new Date().toISOString(), sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,
            model:process.env.GEMINI3_FLASH_MODEL, thinkingLevel:'LOW', maxOutputTokens:768,
            cases:results, passed:results.every((item) => item.pass), rerankerStats:reranker.stats() };
          await writeFile('semantic-v2-budget-diagnostic.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (!report.passed) process.exitCode = 2;
          `);
          NODE
          node --check semantic-v2-budget-diagnostic.mjs
          node semantic-v2-budget-diagnostic.mjs

      - name: Upload diagnostic evidence
        if: ${{ always() && hashFiles('semantic-v2-budget-diagnostic.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-budget-diagnostic-${{ github.run_id }}
          path: semantic-v2-budget-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
