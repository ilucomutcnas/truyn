name: Ephemeral Semantic v2 Local BGE Hard Pairs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-bge-hard.yml']

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      GH_TOKEN: ${{ github.token }}
      RERANK_MODEL: BAAI/bge-reranker-v2-m3
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Load immutable Semantic v2 corpus
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/benchmarks/semantic-retrieval-v2.js?ref=${SEMANTIC_V2_SOURCE_SHA}" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/semantic-retrieval-v2.js
      - name: Build hard-pair fixture from immutable corpus
        shell: bash
        run: |
          cat > /tmp/build-hard.cjs <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const src=fs.readFileSync('/tmp/semantic-retrieval-v2.js','utf8');
          const a=src.indexOf('const domains = ['),b=src.indexOf('const fullContext =');
          if(a<0||b<0) throw new Error('immutable corpus markers missing');
          const ctx={};vm.createContext(ctx);
          vm.runInContext('const corpusSize=600,retrievalCaseCount=360;'+src.slice(a,b)+';globalThis.__data={records,retrievalCases};',ctx);
          const {records,retrievalCases}=ctx.__data;
          const specs=[{caseIndex:5,wrongId:'semantic-record-305'},{caseIndex:241,wrongId:'semantic-record-437'},{caseIndex:269,wrongId:'semantic-record-553'}];
          const rows=specs.map(s=>{const q=retrievalCases.find(x=>x.caseIndex===s.caseIndex),t=records.find(r=>r.id===q.id),w=records.find(r=>r.id===s.wrongId);return {caseIndex:s.caseIndex,question:q.question,expectedId:t.id,wrongId:w.id,targetText:t.text,wrongText:w.text};});
          fs.writeFileSync('/tmp/hard-pairs.json',JSON.stringify(rows,null,2));
          NODE
          node /tmp/build-hard.cjs
      - name: Install local multilingual reranker
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir 'transformers>=4.51,<5' sentencepiece safetensors
      - name: Test semantic accuracy and order invariance
        shell: bash
        run: |
          cat > /tmp/rerank.py <<'PY'
          import json, os, time
          import torch
          from transformers import AutoTokenizer, AutoModelForSequenceClassification
          model_name=os.environ['RERANK_MODEL']
          tok=AutoTokenizer.from_pretrained(model_name)
          model=AutoModelForSequenceClassification.from_pretrained(model_name)
          model.eval()
          rows=json.load(open('/tmp/hard-pairs.json'))
          out=[]
          def score(q, docs):
              batch=tok([[q,d] for d in docs],padding=True,truncation=True,max_length=512,return_tensors='pt')
              with torch.no_grad(): logits=model(**batch,return_dict=True).logits.view(-1).float()
              return logits.tolist()
          started=time.time()
          for row in rows:
              for order in ('wrong-target','target-wrong'):
                  docs=[row['wrongText'],row['targetText']] if order=='wrong-target' else [row['targetText'],row['wrongText']]
                  expected_index=1 if order=='wrong-target' else 0
                  scores=score(row['question'],docs)
                  selected=max(range(len(scores)),key=lambda i:scores[i])
                  out.append({'caseIndex':row['caseIndex'],'order':order,'expectedId':row['expectedId'],'wrongId':row['wrongId'],'scores':scores,'expectedIndex':expected_index,'selectedIndex':selected,'selectedExpected':selected==expected_index})
          report={'benchmark':'TRUYN Semantic v2 local BGE hard-pair diagnostic','generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'sourceSha':os.environ['SEMANTIC_V2_SOURCE_SHA'],'model':model_name,'rows':out,'correct':sum(x['selectedExpected'] for x in out),'total':len(out),'passed':all(x['selectedExpected'] for x in out),'elapsedSeconds':round(time.time()-started,3)}
          json.dump(report,open('semantic-v2-bge-hard.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          raise SystemExit(0 if report['passed'] else 2)
          PY
          python /tmp/rerank.py
      - name: Upload evidence
        if: ${{ always() && hashFiles('semantic-v2-bge-hard.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-bge-hard-${{ github.run_id }}
          path: semantic-v2-bge-hard.json
          retention-days: 30
