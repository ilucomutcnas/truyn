name: Cloud PoC Cross-Cloud Proof

on:
  workflow_run:
    workflows:
      - Cloud PoC Azure Proof
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prove:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRUYN_RELAY: https://relay.truyn.org
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_REGION_CONFIGURED: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_SERVICE: truyn-gemini
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical TRUYN relay
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "${TRUYN_RELAY}/health" | jq -e '.ok == true and .protocol == "TRUYN/1"' >/dev/null; then
              echo "TRUYN_RELAY=${TRUYN_RELAY}"
              echo 'TRUYN_RELAY_HEALTH=success'
              exit 0
            fi
            sleep 5
          done
          echo 'TRUYN_RELAY_HEALTH=failed'
          exit 1

      - name: Normalize GCP region
        shell: bash
        run: |
          set -euo pipefail
          region="$(printf '%s' "$GCP_REGION_CONFIGURED" | grep -oE '[a-z]+-[a-z0-9]+[0-9]' | head -n1 || true)"
          [[ -n "$region" ]] || { echo 'GCP_REGION_FORMAT=invalid'; exit 1; }
          echo "GCP_REGION_VALUE=$region" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Connect Gemini Cloud Run node to canonical relay
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID_VALUE" \
            --region="$GCP_REGION_VALUE" \
            --update-env-vars="TRUYN_RELAY=${TRUYN_RELAY}" \
            --quiet
          revision="$(gcloud run services describe "$GCP_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_REGION_VALUE" --format='value(status.latestReadyRevisionName)')"
          [[ -n "$revision" ]] || { echo 'GCP_GEMINI_REVISION=missing'; exit 1; }
          echo "GCP_GEMINI_REVISION=$revision"
          echo 'GCP_GEMINI_RELAY_LINK=success'

      - name: Execute Azure GPT to GCP Gemini signed TRUYN chain
        shell: bash
        env:
          TRUYN_PROOF_OUTPUT: cross-cloud-proof.json
        run: |
          set -euo pipefail
          node examples/cross-cloud-ai-proof.js

      - name: Print proof summary
        if: ${{ success() }}
        shell: bash
        run: |
          jq '{
            status,
            relayUrl,
            requesterNodeId,
            providersDistinct,
            chainLatencyMs,
            azure: {
              providerNodeId: .azure.providerNodeId,
              signatureVerified: .azure.signatureVerified,
              matchTrustability: .azure.matchTrustability,
              resultTrustability: .azure.resultTrustability,
              endToEndLatencyMs: .azure.endToEndLatencyMs,
              providerLatencyMs: .azure.providerLatencyMs,
              usage: .azure.usage,
              needEnvelopeBytes: .azure.needEnvelopeBytes,
              resultEnvelopeBytes: .azure.resultEnvelopeBytes
            },
            gemini: {
              providerNodeId: .gemini.providerNodeId,
              signatureVerified: .gemini.signatureVerified,
              matchTrustability: .gemini.matchTrustability,
              resultTrustability: .gemini.resultTrustability,
              endToEndLatencyMs: .gemini.endToEndLatencyMs,
              providerLatencyMs: .gemini.providerLatencyMs,
              usage: .gemini.usage,
              needEnvelopeBytes: .gemini.needEnvelopeBytes,
              resultEnvelopeBytes: .gemini.resultEnvelopeBytes
            },
            aggregate,
            claims
          }' cross-cloud-proof.json

      - name: Upload reproducible proof artifact
        if: ${{ always() && hashFiles('cross-cloud-proof.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-cross-cloud-proof-${{ github.run_id }}
          path: cross-cloud-proof.json
          if-no-files-found: error
          retention-days: 30
