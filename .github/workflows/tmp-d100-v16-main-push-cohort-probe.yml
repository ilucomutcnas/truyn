name: tmp-d100-v16-main-push-cohort-probe

on:
  push:
    branches:
      - ci/d100-v16-main-security-green-observer-23360cbe
    paths:
      - '.github/workflows/tmp-d100-v16-main-push-cohort-probe.yml'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record every push run for exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: '23360cbe86e725f79ef0c6772a51f70825b92aef'
        shell: bash
        run: |
          set -Eeuo pipefail
          runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f head_sha="$TARGET_SHA" -f event=push -f per_page=100)"
          cohort="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push") | {id,name,path,head_branch,head_sha,status,conclusion,workflow_id,check_suite_id,created_at,updated_at,run_attempt}] | sort_by(.id)' <<<"$runs")"
          body="tested_sha=${TARGET_SHA}\nruns=${cohort}\nstage=exact_main_push_cohort"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN D-100 V16 EXACT MAIN PUSH COHORT' -f "body=${body}" >/dev/null
