name: Apply context runtime patch

on:
  push:
    branches:
      - perf/context-ref-delta-gate
    paths:
      - 'scripts/apply-context-runtime.py'
      - '.github/workflows/apply-context-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/context-ref-delta-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python scripts/apply-context-runtime.py
      - name: Verify runtime
        run: |
          npm install --no-audit --no-fund
          npm test
          rm -rf node_modules package-lock.json
          git diff --check
      - name: Commit tested runtime patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add node/client.js network/relay/server.js
          git rm scripts/apply-context-runtime.py .github/workflows/apply-context-runtime.yml
          git diff --cached --check
          git commit -m 'Add content-addressed context runtime'
          git push origin HEAD:perf/context-ref-delta-gate
