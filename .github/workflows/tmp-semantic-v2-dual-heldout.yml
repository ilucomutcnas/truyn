name: Ephemeral Semantic v2 Dual Compiler Held-out Matrix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-dual-heldout.yml']

permissions:
  contents: read
  id-token: write

jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-dual-heldout-${{ github.run_id }}
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load immutable benchmark and proxy sources
        shell: bash
        run: |
          set -euo pipefail
          load_file(){ mkdir -p "$(dirname "$1")"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1?ref=$2" | jq -r '.content' | tr -d '\n' | base64 -d > "$1"; }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with: { project_id: '${{ env.GCP_PROJECT_ID_VALUE }}' }

      - name: Prepare isolated runtime-identity Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"; image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-dual-heldout:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null && docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for a in $(seq 1 30); do curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok==true' >/dev/null && break; [[ "$a" -lt 30 ]] || exit 1; sleep 2; done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"; echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"; echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"

      - name: Run held-out 9-cell dual compiler screening
        shell: bash
        run: |
          cat > semantic-v2-dual-heldout.mjs <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import { createVertexGeminiProvider } from './adapters/providers/vertex-gemini.js';
          import { createVertexEmbeddingClient } from './adapters/providers/vertex-embedding.js';

          const source=fs.readFileSync('benchmarks/semantic-retrieval-v2.js','utf8');
          const a=source.indexOf('const domains = ['),b=source.indexOf('const fullContext =');
          if(a<0||b<0) throw new Error('immutable corpus markers not found');
          const sandbox={}; vm.createContext(sandbox);
          vm.runInContext('const corpusSize=600,retrievalCaseCount=360;'+source.slice(a,b)+';globalThis.__data={records,blocks,retrievalCases};',sandbox);
          const {records,blocks,retrievalCases}=sandbox.__data;
          const knownHard=new Set([5,112,241,269]);
          const cells=[];
          for(const category of ['synonym_only','cross_language','adversarial_near_duplicate']){
            for(const queryLanguage of ['en','zh','tr']) cells.push({category,queryLanguage});
          }
          const selected=[];
          for(const cell of cells){
            const matches=retrievalCases.filter(x=>!knownHard.has(x.caseIndex)&&x.category===cell.category&&x.queryLanguage===cell.queryLanguage).slice(0,4);
            if(matches.length!==4) throw new Error(`held-out cell ${cell.category}:${cell.queryLanguage} has ${matches.length}/4`);
            selected.push(...matches);
          }
          if(selected.length!==36||selected.some(x=>knownHard.has(x.caseIndex))) throw new Error('held-out selection invariant failed');

          const provider=createVertexGeminiProvider({
            projectId:process.env.GCP_PROJECT_ID,location:'global',model:'gemini-2.5-flash',endpoint:process.env.VERTEX_API_ENDPOINT,
            accessTokenProvider:async()=>process.env.GCP_ACCESS_TOKEN,capabilities:['reasoning.general'],requestTimeoutMs:120000
          });
          const embedder=createVertexEmbeddingClient({
            projectId:process.env.GCP_PROJECT_ID,location:'us-central1',model:'gemini-embedding-001',endpoint:process.env.VERTEX_API_ENDPOINT,
            accessTokenProvider:async()=>process.env.GCP_ACCESS_TOKEN,batchSize:1,outputDimensionality:768,maxRetries:8
          });
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function mapLimit(items,limit,fn){const out=new Array(items.length);let next=0;async function worker(){for(;;){const i=next++;if(i>=items.length)return;out[i]=await fn(items[i],i);}}await Promise.all(Array.from({length:Math.min(limit,items.length)},worker));return out;}
          const norm=v=>Math.sqrt(v.reduce((s,x)=>s+x*x,0));
          const cos=(x,y)=>{let d=0;for(let i=0;i<Math.min(x.length,y.length);i++)d+=x[i]*y[i];const z=norm(x)*norm(y);return z?d/z:0;};
          const mean=x=>x.reduce((s,v)=>s+v,0)/x.length;
          const harmonic=x=>x.length/x.reduce((s,v)=>s+1/Math.max(1e-6,v),0);
          const usageTotals={queryCompiler:{requests:0,repairs:0,inputTokens:0,outputTokens:0,totalTokens:0},documentCompiler:{requests:0,repairs:0,inputTokens:0,outputTokens:0,totalTokens:0}};
          function addUsage(bucket,metadata){const u=metadata?.usage||{};bucket.requests++;bucket.inputTokens+=u.promptTokenCount||0;bucket.outputTokens+=u.candidatesTokenCount||0;bucket.totalTokens+=u.totalTokenCount||0;}

          process.stderr.write('heldout: dense document index 600\n');
          const denseDocVectors=await mapLimit(blocks,8,async block=>(await embedder.embedMany([block.text],{taskType:'RETRIEVAL_DOCUMENT'}))[0]);
          process.stderr.write('heldout: dense queries 36\n');
          const denseQueryVectors=await mapLimit(selected,4,async item=>(await embedder.embedMany([item.question],{taskType:'RETRIEVAL_QUERY'}))[0]);
          const denseTop24=new Map();
          for(let qi=0;qi<selected.length;qi++){
            const item=selected[qi],qv=denseQueryVectors[qi];
            const ranked=blocks.map((block,i)=>({id:block.id,score:cos(qv,denseDocVectors[i])})).sort((x,y)=>y.score-x.score||x.id.localeCompare(y.id)).slice(0,24);
            denseTop24.set(item.caseIndex,ranked);
          }
          const denseEligible=selected.filter(item=>denseTop24.get(item.caseIndex).some(x=>x.id===item.id));
          if(denseEligible.length!==selected.length) throw new Error(`held-out dense top24 recall ${denseEligible.length}/${selected.length}; screening requires 36/36 eligible`);

          const queryInstruction=[
            'Extract the three real-world semantic constraints required to retrieve the correct authoritative passage.',
            'Return DOMAIN, OPERATIONAL_ACTION, OPERATIONAL_ACTION_EVIDENCE, and CONDITION.',
            'DOMAIN is the real-world subject/process/resource.',
            'OPERATIONAL_ACTION is what an operator, team, service, or system must actually do in the described world. It can appear grammatically inside a when/if clause; that does not make it a condition.',
            'OPERATIONAL_ACTION_EVIDENCE must copy a short exact span from the ORIGINAL query, in its original language, that expresses that real-world action.',
            'Evidence such as which rule, rule token, governing token, applies, identify, choose, find, return, or translations/equivalents of those meta retrieval acts is forbidden.',
            'CONDITION is everything material about state, threshold, time, location, visibility, approval, primary/recovery mode, exception, or scope AFTER removing the domain and operational action. Do not duplicate the operational action in CONDITION.',
            'Translate DOMAIN, OPERATIONAL_ACTION, and CONDITION into concise English, but keep OPERATIONAL_ACTION_EVIDENCE verbatim from the source query.',
            'Do not answer the retrieval question and do not invent an unstated action.'
          ].join(' ');
          async function compileQuery(item){
            for(let attempt=0;attempt<2;attempt++){
              const task=queryInstruction+(attempt?' Previous extraction failed exact source-evidence validation. Re-evaluate semantic roles and copy OPERATIONAL_ACTION_EVIDENCE exactly from the source query.':'');
              const execution=await provider.execute({capability:'reasoning.general',input:{task,context:item.question},policy:{providerOptions:{thinkingBudget:0,temperature:0,maxOutputTokens:220,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{domain:{type:'STRING'},operationalAction:{type:'STRING'},operationalActionEvidence:{type:'STRING'},condition:{type:'STRING'}},required:['domain','operationalAction','operationalActionEvidence','condition']}}}});
              addUsage(usageTotals.queryCompiler,execution.metadata);
              const f=JSON.parse(execution.output);
              if(item.question.includes(f.operationalActionEvidence)) return {domain:f.domain,action:f.operationalAction,condition:f.condition,actionEvidence:f.operationalActionEvidence,repairAttempts:attempt};
              usageTotals.queryCompiler.repairs++;
            }
            throw new Error(`query compiler evidence validation failed for case ${item.caseIndex}`);
          }
          process.stderr.write('heldout: compile 36 queries\n');
          const queryFacets=await mapLimit(selected,4,compileQuery);

          const candidateIds=[...new Set(selected.flatMap(item=>denseTop24.get(item.caseIndex).map(x=>x.id)))].sort();
          const candidateRecords=candidateIds.map(id=>records.find(r=>r.id===id));
          process.stderr.write(`heldout: compile ${candidateRecords.length} unique top24 passages\n`);
          const documentInstruction=[
            'Compile each authoritative passage independently into semantic retrieval facets.',
            'For every supplied local alias return concise English DOMAIN, OPERATIONAL_ACTION, CONDITION, and ACTION_EVIDENCE.',
            'DOMAIN is the real-world subject/process/resource.',
            'OPERATIONAL_ACTION is the controlled real-world activity the rule governs, not the meta act of following a rule or reading an answer code.',
            'ACTION_EVIDENCE must copy a short exact source-language span from that passage expressing the controlled activity.',
            'CONDITION is the state, threshold, time, location, visibility, approval, recovery mode, exception, or scope where the rule applies.',
            'Translate domain/action/condition into concise English. Do not use or infer any answer code, record id, query, neighboring passage, or expected answer.',
            'Process each passage independently and preserve local aliases exactly.'
          ].join(' ');
          const compiledDocs=new Map();
          async function compileDocumentBatch(batch,repair=false){
            const visible=batch.map((record,index)=>({alias:`c${index.toString(36)}`,text:record.text}));
            const task=documentInstruction+(repair?' The previous batch failed contract validation. Be especially strict about exact ACTION_EVIDENCE and preserve every supplied alias exactly once.':'');
            const execution=await provider.execute({capability:'reasoning.general',input:{task,context:JSON.stringify(visible)},policy:{providerOptions:{thinkingBudget:0,temperature:0,maxOutputTokens:2400,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{items:{type:'ARRAY',items:{type:'OBJECT',properties:{alias:{type:'STRING'},domain:{type:'STRING'},action:{type:'STRING'},condition:{type:'STRING'},actionEvidence:{type:'STRING'}},required:['alias','domain','action','condition','actionEvidence']}}},required:['items']}}}});
            addUsage(usageTotals.documentCompiler,execution.metadata);
            const parsed=JSON.parse(execution.output);const byAlias=new Map((parsed.items||[]).map(x=>[x.alias,x]));
            const validated=[];
            for(let i=0;i<batch.length;i++){
              const alias=`c${i.toString(36)}`,item=byAlias.get(alias),record=batch[i];
              if(!item||!record.text.includes(item.actionEvidence)) return null;
              validated.push({record,item});
            }
            return validated;
          }
          const batchSize=12;
          for(let offset=0;offset<candidateRecords.length;offset+=batchSize){
            const batch=candidateRecords.slice(offset,offset+batchSize);
            let compiled=await compileDocumentBatch(batch,false);
            if(!compiled){usageTotals.documentCompiler.repairs++;compiled=await compileDocumentBatch(batch,true);}
            if(!compiled){
              compiled=[];
              for(const record of batch){
                const one=await compileDocumentBatch([record],true);
                if(!one) throw new Error(`document compiler evidence validation failed for candidate ${record.id}`);
                compiled.push(...one);
              }
            }
            for(const {record,item} of compiled) compiledDocs.set(record.id,{domain:item.domain,action:item.action,condition:item.condition,actionEvidence:item.actionEvidence});
            if((offset+batch.length)%60===0||offset+batch.length===candidateRecords.length) process.stderr.write(`heldout: compiled docs ${offset+batch.length}/${candidateRecords.length}\n`);
          }
          if(compiledDocs.size!==candidateRecords.length) throw new Error(`compiled docs ${compiledDocs.size}/${candidateRecords.length}`);

          process.stderr.write('heldout: embed aligned query facets\n');
          const queryFacetVectors=await mapLimit(queryFacets,4,async f=>{
            const texts=[f.domain,f.action,f.condition];
            return await mapLimit(texts,3,async text=>(await embedder.embedMany([text],{taskType:'RETRIEVAL_QUERY'}))[0]);
          });
          process.stderr.write(`heldout: embed ${candidateRecords.length*3} document facets\n`);
          const docFacetVectors=new Map();
          await mapLimit(candidateRecords,8,async record=>{
            const f=compiledDocs.get(record.id),texts=[f.domain,f.action,f.condition];
            const vectors=await mapLimit(texts,3,async text=>(await embedder.embedMany([text],{taskType:'RETRIEVAL_DOCUMENT'}))[0]);
            docFacetVectors.set(record.id,vectors);
          });

          const rows=[];
          const strategies=['minCoverage','meanCoverage','harmonicCoverage'];
          for(let qi=0;qi<selected.length;qi++){
            const item=selected[qi],qv=queryFacetVectors[qi],dense=denseTop24.get(item.caseIndex);
            const scored=dense.map(candidate=>{
              const dv=docFacetVectors.get(candidate.id),facet=qv.map((q,i)=>cos(q,dv[i]));
              return {id:candidate.id,denseScore:candidate.score,facet,minCoverage:Math.min(...facet),meanCoverage:mean(facet),harmonicCoverage:harmonic(facet)};
            });
            const selectedBy={};
            for(const strategy of strategies) selectedBy[strategy]=[...scored].sort((x,y)=>y[strategy]-x[strategy]||y.denseScore-x.denseScore||x.id.localeCompare(y.id))[0].id;
            rows.push({caseIndex:item.caseIndex,category:item.category,queryLanguage:item.queryLanguage,expectedId:item.id,denseExpectedRank:dense.findIndex(x=>x.id===item.id)+1,queryFacets:queryFacets[qi],selectedBy,correctBy:Object.fromEntries(strategies.map(s=>[s,selectedBy[s]===item.id])),topMinCoverage:[...scored].sort((x,y)=>y.minCoverage-x.minCoverage||y.denseScore-x.denseScore).slice(0,3)});
          }
          const byCell={};
          for(const cell of cells){const key=`${cell.category}:${cell.queryLanguage}`,group=rows.filter(r=>r.category===cell.category&&r.queryLanguage===cell.queryLanguage);byCell[key]=Object.fromEntries(strategies.map(s=>[s,{correct:group.filter(r=>r.correctBy[s]).length,total:group.length}]));}
          const summary=Object.fromEntries(strategies.map(s=>[s,{correct:rows.filter(r=>r.correctBy[s]).length,total:rows.length,accuracyPercent:Number((100*rows.filter(r=>r.correctBy[s]).length/rows.length).toFixed(3)),allCellsPerfect:Object.values(byCell).every(cell=>cell[s].correct===cell[s].total),passed:rows.every(r=>r.correctBy[s])}]));
          const report={
            benchmark:'TRUYN Semantic v2 dual semantic compiler held-out 36-case matrix',generatedAt:new Date().toISOString(),sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,
            methodology:{selection:'first four immutable cases per category × queryLanguage cell after excluding known diagnostic hard cases 5,112,241,269',cases:36,cells:9,casesPerCell:4,candidateK:24,knownHardExcluded:[5,112,241,269],expectedIdsNeverVisibleToCompilers:true,documentCompilerSeesQueries:false,queryCompilerSeesDocuments:false},
            dense:{eligible:36,total:36,uniqueCandidates:candidateRecords.length},
            compilerUsage:usageTotals,embedding:embedder.stats(),summary,byCell,rows,
            screeningPassed:Boolean(summary.minCoverage?.passed&&summary.minCoverage?.allCellsPerfect)
          };
          fs.writeFileSync('semantic-v2-dual-heldout.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({dense:report.dense,compilerUsage:report.compilerUsage,embedding:report.embedding,summary:report.summary,screeningPassed:report.screeningPassed},null,2));
          if(!report.screeningPassed) process.exitCode=2;
          NODE
          node --check semantic-v2-dual-heldout.mjs
          node semantic-v2-dual-heldout.mjs

      - name: Upload held-out evidence
        if: ${{ always() && hashFiles('semantic-v2-dual-heldout.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-dual-heldout-${{ github.run_id }}
          path: semantic-v2-dual-heldout.json
          if-no-files-found: error
          retention-days: 30

      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
