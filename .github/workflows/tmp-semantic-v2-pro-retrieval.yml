name: Temporary Semantic v2 Gemini 3.1 Pro Retrieval Proof

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-pro-retrieval.yml']

permissions:
  contents: read
  id-token: write

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-pro-retrieval-${{ github.run_id }}
      PRO_VERIFIER_MODEL: gemini-3.1-pro-preview
      GOOGLE_CLOUD_LOCATION: global
      VERTEX_EMBEDDING_LOCATION: us-central1
      VERTEX_EMBEDDING_MODEL: gemini-embedding-001
      VERTEX_EMBEDDING_DIMENSIONS: '768'
      SEMANTIC_V2_CORPUS_BLOCKS: '600'
      SEMANTIC_V2_RETRIEVAL_CASES: '360'
      SEMANTIC_V2_LIVE_CASES: '6'
      SEMANTIC_V2_OUTPUT: semantic-retrieval-v2-pro.json
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      GH_TOKEN: ${{ github.token }}
      AZURE_OPENAI_ENDPOINT: https://invalid.local
      AZURE_OPENAI_DEPLOYMENT: retrieval-only
      AZURE_OPENAI_API_KEY: retrieval-only
      AZURE_FOUNDRY_ENDPOINT: https://invalid.local
      AZURE_FOUNDRY_API_KEY: retrieval-only
      AZURE_FOUNDRY_GROK: retrieval-only
      AZURE_FOUNDRY_DEEPSEEK: retrieval-only
      AZURE_FOUNDRY_LLAMA: retrieval-only
      AZURE_FOUNDRY_MISTRAL: retrieval-only
      AZURE_FOUNDRY_KIMI: retrieval-only

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load immutable benchmark sources into runner only
        shell: bash
        run: |
          set -euo pipefail
          load_file() {
            path="$1"; ref="$2"
            mkdir -p "$(dirname "$path")"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
          }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"

      - name: Patch benchmark to dense64 plus Gemini 3.1 Pro verifier
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'benchmarks/semantic-retrieval-v2.js';
          let source = fs.readFileSync(path, 'utf8');
          function replaceOnce(label, from, to) {
            if (!source.includes(from)) throw new Error(`patch marker not found: ${label}`);
            source = source.replace(from, to);
          }

          replaceOnce(
            'reranker import',
            "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';",
            "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';\nimport { createProviderSemanticReranker } from '../core/context/provider-semantic-reranker.js';"
          );
          replaceOnce(
            'dense recall gate',
            '  retrievalAccuracyPercentMin: 99,',
            '  retrievalAccuracyPercentMin: 99,\n  denseCandidateRecallPercentMin: 99,'
          );
          replaceOnce(
            'router construction',
            '  const semanticRouter = createSemanticContextRouterV2({ embedder });',
            `  const proProviderBase = createVertexGeminiProvider({
              projectId:gcpProjectId,
              location:geminiLocation,
              model:process.env.PRO_VERIFIER_MODEL,
              endpoint:proxyEndpoint,
              accessTokenProvider:async () => proxyToken,
              capabilities:['reasoning.general'],
              requestTimeoutMs:180000
            });
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const proProvider = {
              name:proProviderBase.name,
              async execute(request) {
                let lastError;
                for (let attempt = 0; attempt <= 3; attempt += 1) {
                  try { return await proProviderBase.execute(request); }
                  catch (error) {
                    lastError = error;
                    const transient = /Vertex AI HTTP (429|5\\d\\d)|network request failed|timed out/i.test(error?.message || '');
                    if (!transient || attempt === 3) throw error;
                    await sleep(1000 * (2 ** attempt));
                  }
                }
                throw lastError;
              }
            };
            const semanticReranker = createProviderSemanticReranker({
              provider:proProvider,
              name:'gemini-3.1-pro-semantic-verifier',
              providerOptions:{
                responseMimeType:'application/json',
                responseSchema:{
                  type:'OBJECT',
                  properties:{ id:{ type:'STRING' } },
                  required:['id']
                }
              },
              shortlistSize:1,
              repairAttempts:1
            });
            const semanticRouter = createSemanticContextRouterV2({
              embedder,
              reranker:semanticReranker,
              candidateK:64
            });`
          );
          replaceOnce('query concurrency', '  const concurrency = 4;', '  const concurrency = 2;');
          replaceOnce(
            'retrieval diagnostics',
            '        semanticScore:top?.semanticScore ?? null,\n        lexicalV1SelectedId:lexicalSelectedId,',
            `        semanticScore:top?.semanticScore ?? null,
            denseCandidateRecall:(retrieved.retrieval?.denseCandidates || []).some((candidate) => candidate.id === item.id),
            denseRank:(retrieved.retrieval?.denseCandidates || []).find((candidate) => candidate.id === item.id)?.rank || null,
            verifierUsage:retrieved.retrieval?.rerankerMetadata?.usage || { input:0, output:0, total:0 },
            verifierProviderRequestBodyBytes:retrieved.retrieval?.rerankerMetadata?.providerRequestBodyBytes || 0,
            verifierProviderLatencyMs:retrieved.retrieval?.rerankerMetadata?.providerLatencyMs || null,
            lexicalV1SelectedId:lexicalSelectedId,`
          );
          replaceOnce(
            'dense recall aggregate',
            "  const lexicalV1Accuracy = percent(retrievalResults.filter((item) => item.lexicalV1Correct).length, retrievalResults.length);",
            `  const lexicalV1Accuracy = percent(retrievalResults.filter((item) => item.lexicalV1Correct).length, retrievalResults.length);
            const denseCandidateRecallPercent = percent(retrievalResults.filter((item) => item.denseCandidateRecall).length, retrievalResults.length);`
          );
          replaceOnce(
            'retrieval-only gate',
            '  const retrievalOnlyPassed = retrievalAccuracy >= gate.retrievalAccuracyPercentMin\n    && provenancePercent >= gate.provenancePassPercentMin',
            '  const retrievalOnlyPassed = retrievalAccuracy >= gate.retrievalAccuracyPercentMin\n    && denseCandidateRecallPercent >= gate.denseCandidateRecallPercentMin\n    && provenancePercent >= gate.provenancePassPercentMin'
          );
          replaceOnce(
            'retrieval report dense recall',
            '      accuracyPercent:retrievalAccuracy,\n      provenancePercent,',
            '      accuracyPercent:retrievalAccuracy,\n      denseCandidateRecallPercent,\n      provenancePercent,'
          );
          replaceOnce(
            'router stats report',
            '    embedding:embedder.stats(),\n    methodology:{',
            `    embedding:embedder.stats(),
            semanticRouterStats:semanticRouter.stats(),
            methodology:{`
          );
          replaceOnce(
            'methodology verifier',
            "      topK:1,\n      blockIdsInRequesterQueries:false,",
            "      topK:1,\n      denseCandidateK:64,\n      verifierModel:'gemini-3.1-pro-preview',\n      verifierMode:'single structured top-1 choice over dense candidates; default model reasoning; no query projection',\n      queryConcurrency:2,\n      blockIdsInRequesterQueries:false,"
          );
          replaceOnce(
            'always stop after retrieval proof',
            '  if (!retrievalOnlyPassed) {',
            `  if (retrievalOnlyPassed) {
              const semanticGate = {
                thresholds:gate,
                checks:{ retrievalOnlyPassed, denseCandidateRecall:denseCandidateRecallPercent >= gate.denseCandidateRecallPercentMin },
                passed:true
              };
              await writeFile(outputPath, JSON.stringify({ ...reportBase, status:'retrieval_only_pass', semanticGate, retrievalResults }, null, 2));
              console.log(JSON.stringify({ ...reportBase, status:'retrieval_only_pass', semanticGate }, null, 2));
              return;
            }

            if (!retrievalOnlyPassed) {`
          );
          fs.writeFileSync(path, source);
          NODE
          node --check benchmarks/semantic-retrieval-v2.js

      - name: Validate code before cloud spend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -name '*.test.js' ! -name 'public-repository.test.js' -print | sort)
          node --test "${tests[@]}"
          git diff --check -- core adapters node tests

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Deploy isolated Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-pro-retrieval:${GITHUB_SHA}"
          echo "PROXY_IMAGE=$image" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" .
          docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" \
            --project="$GCP_PROJECT_ID_VALUE" \
            --region="$GCP_PROXY_REGION" \
            --image="$image" \
            --service-account="$GCP_RUNTIME_SA_VALUE" \
            --port=8080 --min=0 --max=4 --cpu=1 --memory=512Mi \
            --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" \
            --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok == true' >/dev/null; then break; fi
            [[ "$attempt" -lt 30 ]] || exit 6
            sleep 2
          done
          echo "::add-mask::$url"
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"
          echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"

      - name: Preflight embedding and Pro verifier endpoints
        shell: bash
        run: |
          set -euo pipefail
          embed_path="/v1/projects/${GCP_PROJECT_ID}/locations/${VERTEX_EMBEDDING_LOCATION}/publishers/google/models/${VERTEX_EMBEDDING_MODEL}:predict"
          embed_body='{"instances":[{"task_type":"RETRIEVAL_QUERY","content":"semantic retrieval preflight"}],"parameters":{"autoTruncate":true,"outputDimensionality":768}}'
          curl -fsS -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$embed_body" "${VERTEX_API_ENDPOINT}${embed_path}" | jq -e '.predictions[0].embeddings.values | length > 0' >/dev/null
          pro_path="/v1/projects/${GCP_PROJECT_ID}/locations/global/publishers/google/models/${PRO_VERIFIER_MODEL}:generateContent"
          pro_body='{"contents":[{"role":"user","parts":[{"text":"Return JSON only: {\"id\":\"ok\"}"}]}],"generationConfig":{"responseMimeType":"application/json","responseSchema":{"type":"OBJECT","properties":{"id":{"type":"STRING"}},"required":["id"]}}}'
          curl -fsS -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$pro_body" "${VERTEX_API_ENDPOINT}${pro_path}" | jq -e '.candidates[0].content.parts[0].text | fromjson | .id == "ok"' >/dev/null

      - name: Run 360-case retrieval proof
        run: node benchmarks/semantic-retrieval-v2.js

      - name: Print retrieval proof summary
        if: ${{ always() && hashFiles('semantic-retrieval-v2-pro.json') != '' }}
        run: jq '{status,corpus,retrieval,semanticRouterStats,embedding,semanticGate,methodology}' semantic-retrieval-v2-pro.json

      - name: Upload evidence
        if: ${{ always() && hashFiles('semantic-retrieval-v2-pro.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-pro-retrieval-${{ github.run_id }}
          path: semantic-retrieval-v2-pro.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce retrieval gate
        if: ${{ hashFiles('semantic-retrieval-v2-pro.json') != '' }}
        run: jq -e '.semanticGate.passed == true' semantic-retrieval-v2-pro.json >/dev/null

      - name: Cleanup isolated Vertex proxy
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
          if [[ -n "${PROXY_IMAGE:-}" ]]; then
            gcloud artifacts docker images delete "$PROXY_IMAGE" --project="$GCP_PROJECT_ID_VALUE" --quiet >/dev/null 2>&1 || true
          fi
