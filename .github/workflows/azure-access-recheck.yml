name: Azure Access Recheck

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/azure-access-recheck.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure read access
        shell: bash
        run: |
          set -euo pipefail
          az account show >/dev/null
          az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv >/dev/null

          subscription_id="$(az account show --query id -o tsv)"
          resource_groups="$(az group list --query 'length(@)' -o tsv)"
          resources="$(az resource list --query 'length(@)' -o tsv)"
          container_apps="$(az resource list --resource-type Microsoft.App/containerApps --query 'length(@)' -o tsv)"
          cognitive_accounts="$(az resource list --resource-type Microsoft.CognitiveServices/accounts --query 'length(@)' -o tsv)"
          acr_registries="$(az resource list --resource-type Microsoft.ContainerRegistry/registries --query 'length(@)' -o tsv)"

          echo "AZURE_LOGIN=ok"
          echo "ARM_TOKEN=ok"
          echo "SUBSCRIPTION_SCOPE_READ=ok"
          echo "VISIBLE_RESOURCE_GROUPS=${resource_groups}"
          echo "VISIBLE_RESOURCES=${resources}"
          echo "VISIBLE_CONTAINER_APPS=${container_apps}"
          echo "VISIBLE_COGNITIVE_ACCOUNTS=${cognitive_accounts}"
          echo "VISIBLE_ACR_REGISTRIES=${acr_registries}"

          for ns in Microsoft.Resources Microsoft.App Microsoft.CognitiveServices Microsoft.ContainerRegistry Microsoft.ManagedIdentity Microsoft.Authorization Microsoft.OperationalInsights; do
            state="$(az provider show --namespace "$ns" --query registrationState -o tsv 2>/dev/null || echo inaccessible)"
            echo "PROVIDER_${ns//./_}=${state}"
          done

          az role assignment list --scope "/subscriptions/${subscription_id}" --query 'length(@)' -o tsv >/dev/null
          echo "RBAC_READ=ok"

      - name: Verify Azure infrastructure and RBAC write access
        shell: bash
        run: |
          set -euo pipefail
          probe_rg="truyn-access-probe-${GITHUB_RUN_ID}"
          probe_identity="truyn-probe-id-${GITHUB_RUN_ID}"

          cleanup() {
            az group delete --name "$probe_rg" --yes --no-wait >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          az group create --name "$probe_rg" --location eastus --tags purpose=truyn-access-probe ephemeral=true >/dev/null
          echo "RESOURCE_GROUP_CREATE=ok"

          az identity create --resource-group "$probe_rg" --name "$probe_identity" >/dev/null
          echo "MANAGED_IDENTITY_CREATE=ok"

          principal_id="$(az identity show --resource-group "$probe_rg" --name "$probe_identity" --query principalId -o tsv)"
          rg_scope="$(az group show --name "$probe_rg" --query id -o tsv)"

          az role assignment create \
            --assignee-object-id "$principal_id" \
            --assignee-principal-type ServicePrincipal \
            --role Reader \
            --scope "$rg_scope" \
            >/dev/null
          echo "RBAC_ASSIGNMENT_CREATE=ok"

          az role assignment delete \
            --assignee-object-id "$principal_id" \
            --role Reader \
            --scope "$rg_scope" \
            >/dev/null
          echo "RBAC_ASSIGNMENT_DELETE=ok"

          az identity delete --resource-group "$probe_rg" --name "$probe_identity" >/dev/null
          echo "MANAGED_IDENTITY_DELETE=ok"

          az group delete --name "$probe_rg" --yes >/dev/null
          trap - EXIT
          echo "RESOURCE_GROUP_DELETE=ok"
