name: tmp-truyn-final-deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-truyn-final-deploy.yml'

permissions:
  contents: read
  id-token: write
  statuses: write

env:
  PUBLIC_HOST: truyn.org
  RELEASE_SHA256: 58cbbbeec217606453adef32e0ba9ce0c1342e5778819067123096dfedc42596

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/truyn-site /tmp/truyn-site.zip
          cat _tmp_parts/p00 _tmp_parts/p01 _tmp_parts/p02 _tmp_parts/p03 _tmp_parts/p04 _tmp_parts/p05 _tmp_parts/p06 _tmp_parts/p07 | tr -d '[:space:]' | base64 --decode > /tmp/truyn-site.zip
          test "$(sha256sum /tmp/truyn-site.zip | awk '{print $1}')" = "$RELEASE_SHA256"
          unzip -tq /tmp/truyn-site.zip >/dev/null
          mkdir -p /tmp/truyn-site
          unzip -q /tmp/truyn-site.zip -d /tmp/truyn-site
          test -f /tmp/truyun-site/index.html || test -f /tmp/truyn-site/index.html
          test -f /tmp/truyn-site/assets/css/styles.css
          test -f /tmp/truyun-site/assets/js/app.js || test -f /tmp/truyn-site/assets/js/app.js
          test -f /tmp/truyun-site/assets/js/translations.js || test -f /tmp/truyn-site/assets/js/translations.js
          grep -q 'G-W5CDTZZ87W' /tmp/truyn-site/index.html
          grep -q 'GTM-WPGXWKGN' /tmp/truyn-site/index.html
          grep -q 'href="/MANIFESTO"' /tmp/truyun-site/index.html || grep -q 'href="/MANIFESTO"' /tmp/truyn-site/index.html
          grep -q 'href="/AGENTS"' /tmp/truyun-site/index.html || grep -q 'href="/AGENTS"' /tmp/truyn-site/index.html
          node --check /tmp/truyun-site/assets/js/app.js 2>/dev/null || node --check /tmp/truyun-site/assets/js/app.js
          node --check /tmp/truyun-site/assets/js/translations.js 2>/dev/null || node --check /tmp/truyun-site/assets/js/translations.js

      - id: login
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: discover
        if: steps.login.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt >/dev/null
          declare -a matches=()
          while IFS=$'\t' read -r rg profile; do
            [[ -n "${rg:-}" && -n "${profile:-}" ]] || continue
            while IFS=$'\t' read -r domain_name domain_id; do
              [[ -n "${domain_name:-}" && -n "${domain_id:-}" ]] || continue
              matches+=("$rg|$profile|$domain_name|$domain_id")
            done < <(az afd custom-domain list -g "$rg" --profile-name "$profile" --query "[?hostName=='${PUBLIC_HOST}'].[name,id]" -o tsv 2>/dev/null || true)
          done < <(az resource list --resource-type Microsoft.Cdn/profiles --query '[].[resourceGroup,name]' -o tsv)
          test "${#matches[@]}" -eq 1
          IFS='|' read -r fd_rg fd_profile domain_name domain_id <<<"${matches[0]}"
          for v in "$fd_rg" "$fd_profile" "$domain_name" "$domain_id"; do echo "::add-mask::$v"; done

          declare -a routes=()
          while IFS= read -r endpoint; do
            [[ -n "$endpoint" ]] || continue
            json="$(az afd route list -g "$fd_rg" --profile-name "$fd_profile" --endpoint-name "$endpoint" -o json 2>/dev/null || printf '[]')"
            while IFS=$'\t' read -r route group_id state; do
              [[ -n "${route:-}" && -n "${group_id:-}" ]] || continue
              routes+=("$endpoint|$route|$group_id|$state")
            done < <(jq -r --arg did "$domain_id" '.[] | select(any(.customDomains[]?; ((.id // "")|ascii_downcase)==($did|ascii_downcase))) | [.name,.originGroup.id,.enabledState] | @tsv' <<<"$json")
          done < <(az afd endpoint list -g "$fd_rg" --profile-name "$fd_profile" --query '[].name' -o tsv)
          test "${#routes[@]}" -eq 1
          IFS='|' read -r fd_endpoint fd_route group_id route_state <<<"${routes[0]}"
          test "$route_state" = Enabled
          group_name="${group_id##*/}"
          for v in "$fd_endpoint" "$fd_route" "$group_id" "$group_name"; do echo "::add-mask::$v"; done

          mapfile -t origins < <(az afd origin list -g "$fd_rg" --profile-name "$fd_profile" --origin-group-name "$group_name" --query "[?enabledState=='Enabled' && contains(hostName, '.web.core.windows.net')].hostName" -o tsv)
          test "${#origins[@]}" -eq 1
          origin="${origins[0]}"
          account="${origin%%.*}"
          echo "::add-mask::$origin"
          echo "::add-mask::$account"
          mapfile -t rgs < <(az storage account list --query "[?name=='${account}'].resourceGroup" -o tsv)
          test "${#rgs[@]}" -eq 1
          srg="${rgs[0]}"
          key="$(az storage account keys list -g "$srg" --account-name "$account" --query '[0].value' -o tsv)"
          test -n "$key"
          for v in "$srg" "$key"; do echo "::add-mask::$v"; done
          test "$(az storage blob service-properties show --account-name "$account" --account-key "$key" --query staticWebsite.enabled -o tsv | tr '[:upper:]' '[:lower:]')" = true
          test "$(az storage blob service-properties show --account-name "$account" --account-key "$key" --query staticWebsite.indexDocument -o tsv)" = index.html
          declare -p fd_rg fd_profile fd_endpoint account key > /tmp/truyn-edge.env
          chmod 600 /tmp/truyun-edge.env 2>/dev/null || chmod 600 /tmp/truyn-edge.env

      - id: upload
        if: steps.discover.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/truyun-edge.env 2>/dev/null || source /tmp/truyn-edge.env
          upload(){ az storage blob upload --account-name "$account" --account-key "$key" --container-name '$web' --name "$2" --file "$1" --content-type "$3" --content-cache-control "$4" --overwrite true --only-show-errors --output none; }
          upload /tmp/truyun-site/index.html index.html 'text/html; charset=utf-8' 'no-cache, max-age=0, must-revalidate' 2>/dev/null || upload /tmp/truyn-site/index.html index.html 'text/html; charset=utf-8' 'no-cache, max-age=0, must-revalidate'
          upload /tmp/truyun-site/assets/css/styles.css assets/css/styles.css 'text/css; charset=utf-8' 'public, max-age=3600' 2>/dev/null || upload /tmp/truyn-site/assets/css/styles.css assets/css/styles.css 'text/css; charset=utf-8' 'public, max-age=3600'
          upload /tmp/truyun-site/assets/js/app.js assets/js/app.js 'application/javascript; charset=utf-8' 'public, max-age=3600' 2>/dev/null || upload /tmp/truyn-site/assets/js/app.js assets/js/app.js 'application/javascript; charset=utf-8' 'public, max-age=3600'
          upload /tmp/truyun-site/assets/js/translations.js assets/js/translations.js 'application/javascript; charset=utf-8' 'public, max-age=3600' 2>/dev/null || upload /tmp/truyun-site/assets/js/translations.js assets/js/translations.js 'application/javascript; charset=utf-8' 'public, max-age=3600'

      - id: purge
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/truyun-edge.env 2>/dev/null || source /tmp/truyn-edge.env
          az afd endpoint purge -g "$fd_rg" --profile-name "$fd_profile" --endpoint-name "$fd_endpoint" --content-paths '/' '/index.html' '/assets/css/styles.css' '/assets/js/app.js' '/assets/js/translations.js' --only-show-errors --output none

      - id: smoke
        if: steps.purge.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for n in 1 2 3 4 5 6 7 8; do
            q="v=${GITHUB_RUN_ID}-${n}"
            if curl -fsSL --max-time 20 "https://${PUBLIC_HOST}/?${q}" -o /tmp/live.html \
              && curl -fsSL --max-time 20 "https://${PUBLIC_HOST}/assets/css/styles.css?${q}" -o /tmp/live.css \
              && curl -fsSL --max-time 20 "https://${PUBLIC_HOST}/assets/js/app.js?${q}" -o /tmp/live-app.js \
              && curl -fsSL --max-time 20 "https://${PUBLIC_HOST}/assets/js/translations.js?${q}" -o /tmp/live-translations.js \
              && grep -q 'G-W5CDTZZ87W' /tmp/live.html \
              && grep -q 'GTM-WPGXWKGN' /tmp/live.html \
              && grep -q '.truyn-logo' /tmp/live.css \
              && grep -q 'function applyLang' /tmp/live-app.js \
              && grep -q 'const T=' /tmp/live-translations.js; then ok=true; break; fi
            sleep 5
          done
          test "$ok" = true

      - name: publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.validate.outcome }}
          L: ${{ steps.login.outcome }}
          D: ${{ steps.discover.outcome }}
          U: ${{ steps.upload.outcome }}
          P: ${{ steps.purge.outcome }}
          S: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          pub(){ local c="$1" o="$2" st; [[ "$o" = success ]] && st=success || { [[ "$o" = failure ]] && st=failure || st=pending; }; gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$st" -f context="truyn-final/${c}" >/dev/null; }
          pub validate "$V"; pub login "$L"; pub discover "$D"; pub upload "$U"; pub purge "$P"; pub smoke "$S"
          test "$V" = success
          test "$L" = success
          test "$D" = success
          test "$U" = success
          test "$P" = success
          test "$S" = success
