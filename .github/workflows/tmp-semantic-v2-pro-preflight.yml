name: Temporary Semantic v2 Gemini 3.1 Pro Preflight

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-pro-preflight.yml']

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-pro-${{ github.run_id }}
      GCP_MODEL: gemini-3.1-pro-preview
      GCP_LOCATION: global
      GH_TOKEN: ${{ github.token }}
      PROXY_SOURCE_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
      - name: Load immutable GCP proxy source
        shell: bash
        run: |
          set -euo pipefail
          load_file() {
            path="$1"; ref="$2"
            mkdir -p "$(dirname "$path")"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
          }
          load_file benchmarks/semantic-v2-gcp-proxy.js "$PROXY_SOURCE_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$PROXY_SOURCE_SHA"
      - name: Deploy isolated Vertex proxy under runtime identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-pro-preflight:${GITHUB_SHA}"
          echo "PROXY_IMAGE=$image" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" .
          docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" \
            --project="$GCP_PROJECT_ID_VALUE" \
            --region="$GCP_PROXY_REGION" \
            --image="$image" \
            --service-account="$GCP_RUNTIME_SA_VALUE" \
            --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi \
            --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" \
            --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok == true' >/dev/null; then break; fi
            [[ "$attempt" -lt 30 ]] || exit 6
            sleep 2
          done
          echo "::add-mask::$url"
          echo "VERTEX_PROXY_URL=$url" >> "$GITHUB_ENV"
          echo "VERTEX_PROXY_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Call Gemini 3.1 Pro verifier preflight
        shell: bash
        run: |
          set -euo pipefail
          path="/v1/projects/${GCP_PROJECT_ID_VALUE}/locations/${GCP_LOCATION}/publishers/google/models/${GCP_MODEL}:generateContent"
          cat > request.json <<'JSON'
          {
            "contents":[{"role":"user","parts":[{"text":"Choose the semantically correct record for the query. Query: Which rule applies after formal approval? Records: [{\"id\":\"before\",\"text\":\"This rule applies only before formal approval.\"},{\"id\":\"after\",\"text\":\"This rule applies only after formal approval.\"}]. Return JSON only: {\"id\":\"existing-id\"}."}]}],
            "generationConfig":{
              "responseMimeType":"application/json",
              "responseSchema":{
                "type":"OBJECT",
                "properties":{"id":{"type":"STRING"}},
                "required":["id"]
              }
            }
          }
          JSON
          http_code="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VERTEX_PROXY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @request.json \
            "${VERTEX_PROXY_URL}${path}")"
          jq -n --arg code "$http_code" --slurpfile response response.json '{httpCode:($code|tonumber),response:$response[0]}' > pro-preflight.json
          if [[ "$http_code" != "200" ]]; then
            jq . pro-preflight.json
            exit 3
          fi
          text="$(jq -r '.response.candidates[0].content.parts[]?.text // empty' pro-preflight.json | tr -d '\n')"
          selected="$(jq -r '.id // empty' <<<"$text" 2>/dev/null || true)"
          [[ "$selected" == "after" ]] || { jq . pro-preflight.json; exit 4; }
          jq '{httpCode,modelVersion:.response.modelVersion,usageMetadata:.response.usageMetadata,selected:"after"}' pro-preflight.json
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-pro-preflight-${{ github.run_id }}
          path: pro-preflight.json
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup isolated Vertex proxy
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
          if [[ -n "${PROXY_IMAGE:-}" ]]; then
            gcloud artifacts docker images delete "$PROXY_IMAGE" --project="$GCP_PROJECT_ID_VALUE" --quiet >/dev/null 2>&1 || true
          fi
