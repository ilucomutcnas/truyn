name: Ephemeral Semantic v2 Gemini3Flash24 LOW Alias

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-g3f-low-alias.yml']

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-g3flow-alias-${{ github.run_id }}
      GEMINI3_FLASH_MODEL: gemini-3-flash-preview
      GOOGLE_CLOUD_LOCATION: global
      VERTEX_EMBEDDING_LOCATION: us-central1
      VERTEX_EMBEDDING_MODEL: gemini-embedding-001
      VERTEX_EMBEDDING_DIMENSIONS: '768'
      SEMANTIC_V2_CORPUS_BLOCKS: '600'
      SEMANTIC_V2_RETRIEVAL_CASES: '360'
      SEMANTIC_V2_LIVE_CASES: '6'
      SEMANTIC_V2_OUTPUT: semantic-v2-gemini3flash24-low-alias.json
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load immutable benchmark sources
        shell: bash
        run: |
          set -euo pipefail
          load_file() {
            path="$1"; ref="$2"
            mkdir -p "$(dirname "$path")"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
          }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"

      - name: Patch retrieval benchmark for Gemini 3 Flash LOW compact aliases
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'benchmarks/semantic-retrieval-v2.js';
          let s = fs.readFileSync(path, 'utf8');
          const once = (label, from, to) => {
            if (!s.includes(from)) throw new Error(`missing patch marker: ${label}`);
            s = s.replace(from, to);
          };
          const range = (label, start, end, replacement) => {
            const a = s.indexOf(start), b = s.indexOf(end, a + start.length);
            if (a < 0 || b < 0) throw new Error(`missing patch range: ${label}`);
            s = s.slice(0, a) + replacement + s.slice(b);
          };

          once('import',
            "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';",
            "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';\nimport { createProviderSemanticReranker } from '../core/context/provider-semantic-reranker.js';");
          range('env', 'const required = {', 'for (const [name, value] of Object.entries(required))',
            `const required = { GCP_PROJECT_ID:gcpProjectId, VERTEX_API_ENDPOINT:proxyEndpoint, GCP_ACCESS_TOKEN:proxyToken };\n`);
          once('router', '  const semanticRouter = createSemanticContextRouterV2({ embedder });',
            `  const rerankerProvider = createVertexGeminiProvider({
              projectId:gcpProjectId, location:geminiLocation, model:process.env.GEMINI3_FLASH_MODEL,
              endpoint:proxyEndpoint, accessTokenProvider:async () => proxyToken,
              capabilities:['reasoning.general'], requestTimeoutMs:120000
            });
            const semanticReranker = createProviderSemanticReranker({
              provider:rerankerProvider,
              name:'gemini-3-flash-low-semantic-reranker-top24-alias',
              providerOptions:{
                thinkingLevel:'LOW', temperature:0, maxOutputTokens:512,
                responseMimeType:'application/json',
                responseSchema:{ type:'OBJECT', properties:{ id:{type:'STRING'} }, required:['id'] }
              },
              shortlistSize:1, repairAttempts:1
            });
            const semanticRouter = createSemanticContextRouterV2({ embedder, reranker:semanticReranker, candidateK:24 });`);
          once('diagnostics', '        lexicalV1Correct:lexicalSelectedId === item.id',
            `        lexicalV1Correct:lexicalSelectedId === item.id,
            denseCandidateRecall:(retrieved.retrieval?.denseCandidates || []).some((candidate) => candidate.id === item.id),
            denseRank:(retrieved.retrieval?.denseCandidates || []).find((candidate) => candidate.id === item.id)?.rank || null,
            rerankerUsage:retrieved.retrieval?.rerankerMetadata?.usage || { input:0, output:0, total:0 }`);
          once('aggregate',
            "  const lexicalV1Accuracy = percent(retrievalResults.filter((item) => item.lexicalV1Correct).length, retrievalResults.length);",
            `  const lexicalV1Accuracy = percent(retrievalResults.filter((item) => item.lexicalV1Correct).length, retrievalResults.length);
            const denseCandidateRecallPercent = percent(retrievalResults.filter((item) => item.denseCandidateRecall).length, retrievalResults.length);
            const rerankerStats = semanticReranker.stats();
            const rerankerRates = { input:0.50, output:3.00 };
            const routingCostUsd = ((rerankerStats.inputTokens * rerankerRates.input) + (rerankerStats.outputTokens * rerankerRates.output)) / 1_000_000;`);
          once('retrieval report',
            '      lexicalV1BaselineAccuracyPercent:lexicalV1Accuracy,\n      algorithm:CONTEXT_RETRIEVAL_ALGORITHM_V2',
            '      lexicalV1BaselineAccuracyPercent:lexicalV1Accuracy,\n      denseCandidateRecallPercent,\n      algorithm:CONTEXT_RETRIEVAL_ALGORITHM_V2');
          once('stats', '    embedding:embedder.stats(),\n    methodology:{',
            `    embedding:embedder.stats(),
            semanticRouterStats:semanticRouter.stats(), semanticRerankerStats:rerankerStats,
            semanticRerankerRatesUsdPerMillionTokens:rerankerRates,
            semanticRoutingCostUsd:round(routingCostUsd, 9),
            semanticRoutingCostUsdPerQuery:round(routingCostUsd / retrievalResults.length, 9),
            methodology:{`);
          once('methodology', "      topK:1,\n      blockIdsInRequesterQueries:false,",
            "      topK:1,\n      denseCandidateK:24,\n      semanticRerankerModel:'gemini-3-flash-preview',\n      semanticRerankerThinkingLevel:'LOW',\n      semanticRerankerMaxOutputTokens:512,\n      providerCandidateAliases:true,\n      queryProjection:false,\n      blockIdsInRequesterQueries:false,");
          once('exit', '  const relay = createRelay({ localDevelopmentMode:true, exposeDiagnostics:true, maxNodes:128, maxOffers:256 });',
            `  const semanticGate = { thresholds:gate, checks:{ retrievalOnlyPassed }, passed:retrievalOnlyPassed };
            await writeFile(outputPath, JSON.stringify({ ...reportBase, status:retrievalOnlyPassed ? 'retrieval_only_pass' : 'failed_retrieval', semanticGate, retrievalResults }, null, 2));
            console.log(JSON.stringify({ ...reportBase, status:retrievalOnlyPassed ? 'retrieval_only_pass' : 'failed_retrieval', semanticGate }, null, 2));
            return;
            const relay = createRelay({ localDevelopmentMode:true, exposeDiagnostics:true, maxNodes:128, maxOffers:256 });`);
          fs.writeFileSync(path, s);
          NODE
          node --check benchmarks/semantic-retrieval-v2.js

      - name: Validate code before cloud spend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -name '*.test.js' ! -name 'public-repository.test.js' -print | sort)
          node --test "${tests[@]}"
          git diff --check -- core adapters node tests

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Prepare isolated Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-g3flow-alias:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" .
          docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=4 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok == true' >/dev/null; then break; fi
            [[ "$attempt" -lt 30 ]] || exit 1
            sleep 2
          done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"
          echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"

      - name: Preflight embedding and Gemini 3 Flash LOW
        shell: bash
        run: |
          set -euo pipefail
          embed_path="/v1/projects/${GCP_PROJECT_ID}/locations/${VERTEX_EMBEDDING_LOCATION}/publishers/google/models/${VERTEX_EMBEDDING_MODEL}:predict"
          embed_body='{"instances":[{"task_type":"RETRIEVAL_QUERY","content":"gemini3flash low alias preflight"}],"parameters":{"autoTruncate":true,"outputDimensionality":768}}'
          curl -fsS -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$embed_body" "${VERTEX_API_ENDPOINT}${embed_path}" | jq -e '.predictions[0].embeddings.values | length > 0' >/dev/null
          model_path="/v1/projects/${GCP_PROJECT_ID}/locations/global/publishers/google/models/${GEMINI3_FLASH_MODEL}:generateContent"
          body='{"contents":[{"role":"user","parts":[{"text":"Return JSON only: {\"id\":\"c1\"}."}]}],"generationConfig":{"temperature":0,"thinkingConfig":{"thinkingLevel":"LOW"},"responseMimeType":"application/json","responseSchema":{"type":"OBJECT","properties":{"id":{"type":"STRING"}},"required":["id"]},"maxOutputTokens":512}}'
          curl -fsS -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$body" "${VERTEX_API_ENDPOINT}${model_path}" | jq -e '.candidates | length > 0' >/dev/null

      - name: Run 360-case Gemini 3 Flash LOW alias retrieval
        run: node benchmarks/semantic-retrieval-v2.js

      - name: Print summary
        if: ${{ always() && hashFiles('semantic-v2-gemini3flash24-low-alias.json') != '' }}
        run: jq '{status,corpus,retrieval,semanticRerankerStats,semanticRoutingCostUsd,semanticRoutingCostUsdPerQuery,semanticRouterStats,embedding,methodology,semanticGate}' semantic-v2-gemini3flash24-low-alias.json

      - name: Upload evidence
        if: ${{ always() && hashFiles('semantic-v2-gemini3flash24-low-alias.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-gemini3flash24-low-alias-${{ github.run_id }}
          path: semantic-v2-gemini3flash24-low-alias.json
          if-no-files-found: error
          retention-days: 30

      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
