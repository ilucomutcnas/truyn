name: Ephemeral Cohere Rerank Warmed Hard Pairs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-cohere-rerank-warm.yml']

permissions:
  contents: read
  id-token: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AZURE_RG: truyn
      COHERE_MODEL: Cohere-rerank-v4.0-fast
      COHERE_DEPLOYMENT: Cohere-rerank-v4.0-fast
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Load immutable Semantic v2 corpus source
        shell: bash
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/benchmarks/semantic-retrieval-v2.js?ref=${SEMANTIC_V2_SOURCE_SHA}" | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/semantic-retrieval-v2.js
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Create minimal temporary Cohere deployment and warm it
        shell: bash
        run: |
          set -euo pipefail
          found=""
          while IFS= read -r account; do
            deps="$(az cognitiveservices account deployment list -g "$AZURE_RG" -n "$account" -o json 2>/dev/null || echo '[]')"
            if jq -e '[.[].name] | any(. == "truyn-grok" or . == "truyn-deepseek" or . == "truyn-llama" or . == "truyn-mistral" or . == "truyn-kimi")' <<<"$deps" >/dev/null; then found="$account"; break; fi
          done < <(az cognitiveservices account list -g "$AZURE_RG" --query '[].name' -o tsv)
          [[ -n "$found" ]] || exit 2
          echo "::add-mask::$found"; echo "FOUNDRY_ACCOUNT=$found" >> "$GITHUB_ENV"
          if ! az cognitiveservices account deployment show -g "$AZURE_RG" -n "$found" --deployment-name "$COHERE_DEPLOYMENT" >/dev/null 2>&1; then
            az cognitiveservices account deployment create -g "$AZURE_RG" -n "$found" --deployment-name "$COHERE_DEPLOYMENT" --model-name "$COHERE_MODEL" --model-version 1 --model-format Cohere --sku-name GlobalStandard --sku-capacity 1 >/dev/null
            touch /tmp/truyn-created-cohere-rerank
          fi
          endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$found" --query properties.endpoint -o tsv)"; key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$found" --query key1 -o tsv)"
          host="$(python -c 'import os,urllib.parse; print(urllib.parse.urlparse(os.environ["ENDPOINT"]).hostname.split(".")[0])' ENDPOINT="$endpoint" 2>/dev/null || true)"
          if [[ -z "$host" ]]; then host="$(echo "$endpoint" | sed -E 's#https?://([^./]+).*#\1#')"; fi
          rank_url="https://${host}.services.ai.azure.com/providers/cohere/v2/rerank"
          echo "::add-mask::$key"; echo "::add-mask::$rank_url"
          echo "COHERE_RANK_URL=$rank_url" >> "$GITHUB_ENV"; echo "FOUNDRY_KEY=$key" >> "$GITHUB_ENV"
          sleep 45
      - name: Test three actual prior wrong-vs-target pairs with Retry-After
        shell: bash
        run: |
          cat > /tmp/cohere-warm.cjs <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const src=fs.readFileSync('/tmp/semantic-retrieval-v2.js','utf8'),a=src.indexOf('const domains = ['),b=src.indexOf('const fullContext =');
          if(a<0||b<0)throw new Error('corpus markers');
          const ctx={};vm.createContext(ctx);vm.runInContext('const corpusSize=600,retrievalCaseCount=360;'+src.slice(a,b)+';globalThis.__data={records,retrievalCases};',ctx);
          const {records,retrievalCases}=ctx.__data;
          const specs=[{caseIndex:5,wrongId:'semantic-record-305'},{caseIndex:241,wrongId:'semantic-record-437'},{caseIndex:269,wrongId:'semantic-record-553'}];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function rank(query,documents){let last;for(let attempt=1;attempt<=5;attempt++){const started=Date.now();const r=await fetch(process.env.COHERE_RANK_URL,{method:'POST',headers:{'content-type':'application/json','api-key':process.env.FOUNDRY_KEY},body:JSON.stringify({model:process.env.COHERE_DEPLOYMENT,query,documents,top_n:documents.length})});const text=await r.text();if(r.ok)return {body:JSON.parse(text),httpStatus:r.status,latencyMs:Date.now()-started,attempts:attempt};last={status:r.status,body:text.slice(0,300)};if(r.status!==429)break;const retryHeader=Number(r.headers.get('retry-after')||0);await sleep((retryHeader>0?retryHeader:Math.min(15,attempt*4))*1000);}throw new Error('Cohere rerank failed: '+JSON.stringify(last));}
          (async()=>{const rows=[];for(let i=0;i<specs.length;i++){const spec=specs[i],item=retrievalCases.find(x=>x.caseIndex===spec.caseIndex),expected=records.find(r=>r.id===item.id),wrong=records.find(r=>r.id===spec.wrongId);const out=await rank(item.question,[wrong.text,expected.text]);const top=out.body.results?.[0];rows.push({caseIndex:item.caseIndex,expectedId:expected.id,previousWrongId:wrong.id,selectedIndex:top?.index,selectedExpected:top?.index===1,relevanceScore:top?.relevance_score??top?.relevanceScore??null,httpStatus:out.httpStatus,latencyMs:out.latencyMs,attempts:out.attempts});if(i<specs.length-1)await sleep(4000);}const report={benchmark:'TRUYN Semantic v2 Cohere-rerank-v4.0-fast warmed hard-pair diagnostic',generatedAt:new Date().toISOString(),sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,model:process.env.COHERE_MODEL,deployment:process.env.COHERE_DEPLOYMENT,cases:rows,passed:rows.every(r=>r.selectedExpected)};fs.writeFileSync('cohere-rerank-warm.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(!report.passed)process.exitCode=2;})().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          node /tmp/cohere-warm.cjs
      - name: Upload diagnostic evidence
        if: ${{ always() && hashFiles('cohere-rerank-warm.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-cohere-rerank-warm-${{ github.run_id }}
          path: cohere-rerank-warm.json
          retention-days: 30
      - name: Delete temporary Cohere deployment if created here
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f /tmp/truyn-created-cohere-rerank && -n "${FOUNDRY_ACCOUNT:-}" ]]; then az cognitiveservices account deployment delete -g "$AZURE_RG" -n "$FOUNDRY_ACCOUNT" --deployment-name "$COHERE_DEPLOYMENT" >/dev/null 2>&1 || true; fi
