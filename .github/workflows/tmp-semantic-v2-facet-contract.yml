name: Ephemeral Semantic v2 Facet Contract Diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-facet-contract.yml']

permissions:
  contents: read
  id-token: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-facet-contract-${{ github.run_id }}
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Load immutable proxy sources
        shell: bash
        run: |
          set -euo pipefail
          load_file(){ mkdir -p "$(dirname "$1")"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1?ref=$2" | jq -r '.content' | tr -d '\n' | base64 -d > "$1"; }
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with: { project_id: '${{ env.GCP_PROJECT_ID_VALUE }}' }
      - name: Prepare runtime proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"; registry="${GCP_PROXY_REGION}-docker.pkg.dev"; image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-facet-contract:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet; docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null; docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"; for a in $(seq 1 30); do curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok==true' >/dev/null && break; [[ "$a" -lt 30 ]] || exit 1; sleep 2; done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"; echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"; echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"
      - name: Extract strict operational facets from four hard queries
        shell: bash
        run: |
          cat > semantic-v2-facet-contract.mjs <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { createVertexGeminiProvider } from './adapters/providers/vertex-gemini.js';
          const provider=createVertexGeminiProvider({projectId:process.env.GCP_PROJECT_ID,location:'global',model:'gemini-2.5-flash',endpoint:process.env.VERTEX_API_ENDPOINT,accessTokenProvider:async()=>process.env.GCP_ACCESS_TOKEN,capabilities:['reasoning.general'],requestTimeoutMs:120000});
          const queries=[
            {caseIndex:5,query:'The situation is specifically when utilization has crossed the protective limit and saturation controls are engaged. Which active rule token governs ship route control while operators must confirm permission validity?'},
            {caseIndex:112,query:'Which governing rule token applies to ship route control when the team must confirm the origin trail of data when utilization is still under the protective limit?'},
            {caseIndex:241,query:'Ekip aksayan sistemi kurtarmak gerektiğinde ve ana tesis çevrimdışı olduğu için uzak süreklilik merkezinde, sera gazı kayıt yönetimi için hangi yetkili kural belirteci uygulanır?'},
            {caseIndex:269,query:'The situation is specifically during an outward-facing launch once users can already see it. Which active rule token governs store stock control while operators must preserve audit proof?'}
          ];
          const task=[
            'Decompose the retrieval question into exactly three semantic facets and translate each facet to concise English.',
            'DOMAIN is the real-world subject, system, process, or resource the passage is about.',
            'OPERATIONAL_ACTION is the action that an operator, team, service, or system must actually perform inside the described scenario.',
            'Never use the meta retrieval act such as find, identify, choose, return, which rule, rule token, governing token, or applies as OPERATIONAL_ACTION.',
            'If the query says while operators must X, team must X, when X is required, or equivalent wording, X is OPERATIONAL_ACTION.',
            'CONDITION is the state, threshold, time, location, approval, visibility, primary/recovery mode, exception, or other scope in which that operational action applies.',
            'Preserve negation and directional distinctions exactly. Do not answer the question and do not infer an unstated operation.'
          ].join(' ');
          const rows=[];
          for(const item of queries){const ex=await provider.execute({capability:'reasoning.general',input:{task,context:item.query},policy:{providerOptions:{thinkingBudget:0,temperature:0,maxOutputTokens:180,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{domain:{type:'STRING'},operationalAction:{type:'STRING'},condition:{type:'STRING'}},required:['domain','operationalAction','condition']}}}});rows.push({caseIndex:item.caseIndex,query:item.query,facets:JSON.parse(ex.output),usage:ex.metadata?.usage||{}});}
          const report={benchmark:'TRUYN Semantic v2 strict operational facet contract diagnostic',generatedAt:new Date().toISOString(),rows};
          await writeFile('semantic-v2-facet-contract.json',JSON.stringify(report,null,2)); console.log(JSON.stringify(report,null,2));
          NODE
          node semantic-v2-facet-contract.mjs
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with: { name: 'truyn-semantic-v2-facet-contract-${{ github.run_id }}', path: semantic-v2-facet-contract.json, retention-days: 30 }
      - name: Cleanup proxy
        if: always()
        shell: bash
        run: gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
