name: Temporary Class D 100 Accepted Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-class-d100-accepted.yml']
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  class-d-100:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TESTED_COMMIT: 2cd3668a1fde5a6d536b0fa33be4773ee4b58ff9
      WORKDIR: /tmp/truyn-d100-tested
      TRUYN_CLASS_D_LOCATION: eastus2
      TRUYN_CLASS_D_VM_SIZE: Standard_D2as_v5
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}

      - name: Publish start marker
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -Eeuo pipefail
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" -d "$(jq -nc --arg title 'TRUYN CLASS D-100 ACCEPTED RUN STARTED' --arg body "run_id=${GITHUB_RUN_ID} tested_commit=${TESTED_COMMIT}" '{title:$title,body:$body}')" >/dev/null

      - name: Immutable security and acceptance preflight
        run: |
          set -Eeuo pipefail
          rm -rf "$WORKDIR"
          git worktree add --detach "$WORKDIR" "$TESTED_COMMIT"
          cd "$WORKDIR"
          bash scripts/assert-security-clean-tested-commit.sh "$TESTED_COMMIT"
          npm install --ignore-scripts --no-audit --no-fund
          TRUYN_LOCAL_DEVELOPMENT=1 npm test
          bash -n scripts/class-d-100-final-acceptance.sh
          bash -n benchmarks/scale/class-d-azure-100-provision.sh
          bash -n benchmarks/scale/class-d-azure-100-campaign.sh
          node --check benchmarks/scale/evaluate-class-d-evidence.js

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - name: Execute accepted Class D 100-node proof
        id: proof
        continue-on-error: true
        run: |
          set -o pipefail
          cd "$WORKDIR"
          GITHUB_SHA="$TESTED_COMMIT" bash scripts/class-d-100-final-acceptance.sh 2>&1 | tee /tmp/class-d-100.log

      - name: Canonical post-cleanup evaluation
        if: always()
        id: evaluate
        env:
          PROOF_OUTCOME: '${{ steps.proof.outcome }}'
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/class-d-100-evidence
          cp /tmp/class-d-100.log /tmp/class-d-100-evidence/class-d-100.log 2>/dev/null || true
          EVIDENCE="$GITHUB_WORKSPACE/class-d-100-evidence.json"
          if [[ -f "$EVIDENCE" ]]; then cp "$EVIDENCE" /tmp/class-d-100-evidence/class-d-100-evidence.json; fi
          gate=FAIL
          evaluator_exit=99
          if [[ -f "$EVIDENCE" ]]; then
            set +e
            node "$WORKDIR/benchmarks/scale/evaluate-class-d-evidence.js" "$EVIDENCE" > /tmp/class-d-100-evidence/canonical-evaluation.json
            evaluator_exit=$?
            set -e
          else
            printf '%s\n' '{"ok":false,"error":"class_d_evidence_missing"}' > /tmp/class-d-100-evidence/canonical-evaluation.json
          fi
          cleanup=false
          tested_match=false
          run_match=false
          if [[ -f "$EVIDENCE" ]]; then
            cleanup="$(jq -r '.cleanup.confirmed // false' "$EVIDENCE")"
            [[ "$(jq -r '.testedCommit // ""' "$EVIDENCE")" == "$TESTED_COMMIT" ]] && tested_match=true
            [[ "$(jq -r '.workflowRunId // ""' "$EVIDENCE")" == "$GITHUB_RUN_ID" ]] && run_match=true
          fi
          if [[ "$PROOF_OUTCOME" == success && "$evaluator_exit" -eq 0 && "$cleanup" == true && "$tested_match" == true && "$run_match" == true ]]; then gate=PASS; fi
          jq -nc \
            --arg gate "$gate" \
            --arg proofOutcome "$PROOF_OUTCOME" \
            --arg testedCommit "$TESTED_COMMIT" \
            --arg runId "$GITHUB_RUN_ID" \
            --argjson evaluatorExit "$evaluator_exit" \
            --argjson cleanup "$cleanup" \
            --argjson testedCommitMatch "$tested_match" \
            --argjson workflowRunMatch "$run_match" \
            --slurpfile evaluation /tmp/class-d-100-evidence/canonical-evaluation.json \
            '{gate:$gate,proofOutcome:$proofOutcome,testedCommit:$testedCommit,runId:$runId,evaluatorExit:$evaluatorExit,cleanup:$cleanup,testedCommitMatch:$testedCommitMatch,workflowRunMatch:$workflowRunMatch,canonicalEvaluation:($evaluation[0] // null)}' > /tmp/class-d-100-evidence/summary.json
          cat /tmp/class-d-100-evidence/summary.json

      - name: Upload accepted-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'class-d-100-accepted-${{ github.run_id }}'
          path: /tmp/class-d-100-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Publish completion marker
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -Eeuo pipefail
          gate="$(jq -r '.gate // "FAIL"' /tmp/class-d-100-evidence/summary.json 2>/dev/null || echo FAIL)"
          cleanup="$(jq -r '.cleanup // false' /tmp/class-d-100-evidence/summary.json 2>/dev/null || echo false)"
          failed="$(jq -c '.canonicalEvaluation.failed // []' /tmp/class-d-100-evidence/summary.json 2>/dev/null || echo '[]')"
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" -d "$(jq -nc --arg title "TRUYN CLASS D-100 ACCEPTED ${gate}" --arg body "run_id=${GITHUB_RUN_ID} tested_commit=${TESTED_COMMIT} cleanup=${cleanup} failed_checks=${failed}" '{title:$title,body:$body}')" >/dev/null
          test "$gate" = PASS
