name: TRUYN Image Providers Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-image-providers.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: truyn-image-provider-smoke
  cancel-in-progress: false

jobs:
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AZURE_RG: truyn
      AZURE_IMAGE_LOCATION: eastus2
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-image-smoke-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: mkdir -p smoke-artifacts/image

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision minimal Azure image deployment if available
        shell: bash
        run: |
          set -uo pipefail
          suffix="$(printf '%s' '${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}' | sha256sum | cut -c1-10)"
          account="truynimg${suffix}"
          deployment="truyn-gpt-image-mini"
          echo "AZURE_IMAGE_ACCOUNT=$account" >> "$GITHUB_ENV"
          echo "AZURE_IMAGE_DEPLOYMENT=$deployment" >> "$GITHUB_ENV"

          if ! az cognitiveservices account show -g "$AZURE_RG" -n "$account" >/dev/null 2>&1; then
            if ! az cognitiveservices account create -g "$AZURE_RG" -n "$account" -l "$AZURE_IMAGE_LOCATION" --kind OpenAI --sku S0 --custom-domain "$account" --yes >/tmp/image-account.out 2>/tmp/image-account.err; then
              jq -n '{ok:false,modality:"image",provider:"azure-openai-image",status:"blocked_access",stage:"account"}' > smoke-artifacts/image/azure-image.json
              exit 0
            fi
          fi
          endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$account" --query properties.endpoint -o tsv)"
          key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$account" --query key1 -o tsv)"
          echo "AZURE_IMAGE_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          echo "::add-mask::$key"
          echo "AZURE_IMAGE_API_KEY=$key" >> "$GITHUB_ENV"

          az cognitiveservices account list-models -g "$AZURE_RG" -n "$account" -o json > /tmp/image-models.json
          entry="$(jq -c '[.[] | select(((.name // .model.name // "") | ascii_downcase) == "gpt-image-1-mini")][0] // empty' /tmp/image-models.json)"
          if [[ -z "$entry" ]]; then
            jq -n '{ok:false,modality:"image",provider:"azure-openai-image",status:"blocked_access",stage:"catalog",requested:"gpt-image-1-mini"}' > smoke-artifacts/image/azure-image.json
            exit 0
          fi
          model="$(jq -r '.name // .model.name' <<<"$entry")"
          version="$(jq -r '.version // .model.version // empty' <<<"$entry")"
          format="$(jq -r '.format // .model.format // "OpenAI"' <<<"$entry")"
          sku="$(jq -r '[.skus[]?.name | select(.=="GlobalStandard" or .=="Standard")][0] // "GlobalStandard"' <<<"$entry")"
          if ! az cognitiveservices account deployment show -g "$AZURE_RG" -n "$account" --deployment-name "$deployment" >/dev/null 2>&1; then
            args=(cognitiveservices account deployment create -g "$AZURE_RG" -n "$account" --deployment-name "$deployment" --model-name "$model" --model-format "$format" --sku-name "$sku" --sku-capacity 1)
            [[ -n "$version" ]] && args+=(--model-version "$version")
            if ! az "${args[@]}" >/tmp/image-deploy.out 2>/tmp/image-deploy.err; then
              jq -n --arg requested "$model" '{ok:false,modality:"image",provider:"azure-openai-image",status:"blocked_access",stage:"deployment",requested:$requested}' > smoke-artifacts/image/azure-image.json
              exit 0
            fi
          fi
          echo 'AZURE_IMAGE_READY=true' >> "$GITHUB_ENV"

      - name: Smoke Azure image only
        if: env.AZURE_IMAGE_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_PROVIDER=azure-openai-image SMOKE_OUTPUT_DIR=smoke-artifacts/image AZURE_IMAGE_ENDPOINT="$AZURE_IMAGE_ENDPOINT" AZURE_IMAGE_DEPLOYMENT="$AZURE_IMAGE_DEPLOYMENT" AZURE_IMAGE_API_KEY="$AZURE_IMAGE_API_KEY" node scripts/smoke/image-provider.js | tee smoke-artifacts/image/azure-image.json

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Prepare ephemeral runtime-identity Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          proxy_token="$(openssl rand -hex 32)"
          echo "::add-mask::$proxy_token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/image-smoke:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.gemini-proxy -t "$image" .
          docker push "$image"
          gcloud run deploy "$GCP_PROXY_SERVICE" \
            --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" \
            --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" \
            --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi \
            --set-env-vars="BENCHMARK_PROXY_TOKEN=${proxy_token}" \
            --no-invoker-iam-check --quiet
          proxy_url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${proxy_token}" "${proxy_url}/health" | jq -e '.ok == true' >/dev/null; then break; fi
            [[ "$attempt" -lt 30 ]] || exit 1
            sleep 2
          done
          echo "VERTEX_SMOKE_ENDPOINT=$proxy_url" >> "$GITHUB_ENV"
          echo "::add-mask::$proxy_token"
          echo "VERTEX_SMOKE_TOKEN=$proxy_token" >> "$GITHUB_ENV"

      - name: Smoke Google image only
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_PROVIDER=vertex-image SMOKE_OUTPUT_DIR=smoke-artifacts/image GCP_PROJECT_ID="$GCP_PROJECT_ID_VALUE" GCP_IMAGE_REGION=global VERTEX_IMAGE_MODEL=gemini-2.5-flash-image VERTEX_API_ENDPOINT="$VERTEX_SMOKE_ENDPOINT" GCP_ACCESS_TOKEN="$VERTEX_SMOKE_TOKEN" node scripts/smoke/image-provider.js | tee smoke-artifacts/image/google-image.json

      - name: Upload image-only smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truyn-image-provider-smoke-${{ github.run_id }}
          path: smoke-artifacts/image
          if-no-files-found: error
          retention-days: 30

      - name: Delete ephemeral Vertex proxy
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
