name: Class D Azure 100 Real Nodes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/class-d-azure-100.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  class-d-100:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      TRUYN_AZURE_RESOURCE_GROUP: truyn
      TRUYN_CLASS_D_LOCATION: eastus2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Same-commit safety preflight
        env:
          TRUYN_LOCAL_DEVELOPMENT: '1'
        run: node --test tests/testnet-operator.test.js tests/class-d-scale.test.js tests/trust-receipt-v2.test.js tests/trust-lifecycle.test.js
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Run 100 real-node adversarial gate
        shell: bash
        run: |
          source benchmarks/scale/class-d-azure-100-provision.sh
          source benchmarks/scale/class-d-azure-100-campaign.sh
      - name: Upload Class D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-d-azure-100-${{ github.run_id }}
          path: class-d-100-evidence.json
          if-no-files-found: warn
