name: Temporary D-100 fixed immutable preflight

on:
  push:
    paths:
      - '.github/workflows/tmp-d100-preflight-final.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TESTED_COMMIT: 874941860803fd74d40f836669458958cd95ea06
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed immutable preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch origin "$TESTED_COMMIT"
          rm -rf /tmp/truyn-d100-tested
          git worktree add --detach /tmp/truyn-d100-tested "$TESTED_COMMIT"
          cd /tmp/truyn-d100-tested
          rc=0
          {
            bash scripts/assert-security-clean-tested-commit.sh HEAD
            npm install --ignore-scripts --no-audit --no-fund
            TRUYN_LOCAL_DEVELOPMENT=1 npm test
            git diff --check
            bash -n scripts/class-d-100-final-acceptance.sh
            bash -n benchmarks/scale/class-d-azure-100-provision.sh
            bash -n benchmarks/scale/class-d-azure-100-campaign.sh
            node --check benchmarks/scale/evaluate-class-d-evidence.js
          } >/tmp/preflight.log 2>&1 || rc=$?
          {
            echo "Pinned immutable source: \`$TESTED_COMMIT\`"
            if [[ $rc -eq 0 ]]; then
              echo "Result: **PASS**"
              echo "Security allowlist + full CI tests + diff + D-100 shell/evaluator syntax all PASS."
            else
              echo "Result: **FAIL** (exit $rc)"
              echo '```text'
              grep -n '^not ok ' /tmp/preflight.log || true
              tail -n 120 /tmp/preflight.log || true
              echo '```'
            fi
          } >/tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TRUYN D100 FIXED PREFLIGHT ${GITHUB_RUN_ID}" --body-file /tmp/body.md
          exit "$rc"
