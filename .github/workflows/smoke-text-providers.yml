name: TRUYN Text Providers Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-text-providers.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: truyn-text-provider-smoke
  cancel-in-progress: false

jobs:
  text-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AZURE_RG: truyn
      AZURE_LOCATION: eastus2
      AZURE_GPT_ACCOUNT: truyn-openai-1334540181
      AZURE_GPT_DEPLOYMENT: truyn-gpt-4-1-mini
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-text-smoke-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: mkdir -p smoke-artifacts/text

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Foundry resource and text deployments
        shell: bash
        run: |
          set -uo pipefail
          suffix="$(printf '%s' '${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}' | sha256sum | cut -c1-12)"
          account="truynai${suffix}"
          echo "AZURE_FOUNDRY_ACCOUNT=$account" >> "$GITHUB_ENV"

          if ! az cognitiveservices account show -g "$AZURE_RG" -n "$account" >/dev/null 2>&1; then
            az cognitiveservices account create -g "$AZURE_RG" -n "$account" -l "$AZURE_LOCATION" --kind AIServices --sku S0 --custom-domain "$account" --yes >/dev/null
          fi
          endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$account" --query properties.endpoint -o tsv)"
          key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$account" --query key1 -o tsv)"
          echo "AZURE_FOUNDRY_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          echo "::add-mask::$key"
          echo "AZURE_FOUNDRY_API_KEY=$key" >> "$GITHUB_ENV"

          az cognitiveservices account list-models -g "$AZURE_RG" -n "$account" -o json > /tmp/models.json
          printf '[]' > smoke-artifacts/text/azure-deployments.json

          deploy_one() {
            alias="$1"; requested="$2"; vendor="$3"; family="$4"
            entry="$(jq -c --arg m "$requested" '[.[] | select(((.name // .model.name // "") | ascii_downcase) == ($m | ascii_downcase))][0] // empty' /tmp/models.json)"
            status="blocked_access"
            actual="$requested"
            error_class="catalog"
            if [[ -n "$entry" ]]; then
              actual="$(jq -r '.name // .model.name' <<<"$entry")"
              format="$(jq -r '.format // .model.format // "OpenAI"' <<<"$entry")"
              version="$(jq -r '.version // .model.version // empty' <<<"$entry")"
              sku="$(jq -r '[.skus[]?.name | select(.=="GlobalStandard" or .=="Standard" or .=="GlobalProvisionedManaged")][0] // "GlobalStandard"' <<<"$entry")"
              if az cognitiveservices account deployment show -g "$AZURE_RG" -n "$account" --deployment-name "$alias" >/dev/null 2>&1; then
                status="existing"
                error_class=""
              else
                args=(cognitiveservices account deployment create -g "$AZURE_RG" -n "$account" --deployment-name "$alias" --model-name "$actual" --model-format "$format" --sku-name "$sku" --sku-capacity 1)
                [[ -n "$version" ]] && args+=(--model-version "$version")
                if az "${args[@]}" >/tmp/deploy.out 2>/tmp/deploy.err; then
                  status="deployed"
                  error_class=""
                else
                  error_class="deployment"
                fi
              fi
            fi
            tmp="$(mktemp)"
            jq --arg alias "$alias" --arg requested "$requested" --arg actual "$actual" --arg vendor "$vendor" --arg family "$family" --arg status "$status" --arg errorClass "$error_class" '. + [{alias:$alias,requested:$requested,actual:$actual,vendor:$vendor,family:$family,status:$status,errorClass:($errorClass|select(length>0))}]' smoke-artifacts/text/azure-deployments.json > "$tmp" && mv "$tmp" smoke-artifacts/text/azure-deployments.json
          }

          deploy_one truyn-grok 'grok-3-mini' xai grok
          deploy_one truyn-deepseek 'DeepSeek-V3.2' deepseek deepseek
          deploy_one truyn-llama 'Llama-3.3-70B-Instruct' meta llama
          deploy_one truyn-mistral 'Mistral-Large-3' mistral mistral
          deploy_one truyn-kimi 'Kimi-K2.5' moonshot kimi
          cat smoke-artifacts/text/azure-deployments.json

      - name: Smoke Azure GPT
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$AZURE_GPT_ACCOUNT" --query properties.endpoint -o tsv)"
          key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$AZURE_GPT_ACCOUNT" --query key1 -o tsv)"
          echo "::add-mask::$key"
          SMOKE_PROVIDER=azure-openai AZURE_OPENAI_ENDPOINT="$endpoint" AZURE_OPENAI_DEPLOYMENT="$AZURE_GPT_DEPLOYMENT" AZURE_OPENAI_API_KEY="$key" node scripts/smoke/text-provider.js | tee smoke-artifacts/text/gpt.json

      - name: Smoke Azure Foundry text families independently
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          while read -r row; do
            alias="$(jq -r .alias <<<"$row")"; vendor="$(jq -r .vendor <<<"$row")"; family="$(jq -r .family <<<"$row")"; state="$(jq -r .status <<<"$row")"
            if [[ "$state" == "blocked_access" ]]; then
              jq -n --arg provider "$family" '{ok:false,modality:"text",provider:$provider,status:"blocked_access"}' > "smoke-artifacts/text/${family}.json"
              continue
            fi
            if SMOKE_PROVIDER=azure-foundry AZURE_FOUNDRY_ENDPOINT="$AZURE_FOUNDRY_ENDPOINT" AZURE_FOUNDRY_DEPLOYMENT="$alias" AZURE_FOUNDRY_API_KEY="$AZURE_FOUNDRY_API_KEY" TRUYN_MODEL_VENDOR="$vendor" TRUYN_MODEL_FAMILY="$family" node scripts/smoke/text-provider.js > "smoke-artifacts/text/${family}.json"; then
              cat "smoke-artifacts/text/${family}.json"
            else
              jq -n --arg provider "$family" '{ok:false,modality:"text",provider:$provider,status:"smoke_failed"}' > "smoke-artifacts/text/${family}.json"
              failures=$((failures+1))
            fi
          done < <(jq -c '.[]' smoke-artifacts/text/azure-deployments.json)
          exit "$failures"

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Prepare ephemeral runtime-identity Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          proxy_token="$(openssl rand -hex 32)"
          echo "::add-mask::$proxy_token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/text-smoke:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.gemini-proxy -t "$image" .
          docker push "$image"
          gcloud run deploy "$GCP_PROXY_SERVICE" \
            --project="$GCP_PROJECT_ID_VALUE" \
            --region="$GCP_PROXY_REGION" \
            --image="$image" \
            --service-account="$GCP_RUNTIME_SA_VALUE" \
            --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi \
            --set-env-vars="BENCHMARK_PROXY_TOKEN=${proxy_token}" \
            --no-invoker-iam-check --quiet
          proxy_url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${proxy_token}" "${proxy_url}/health" | jq -e '.ok == true' >/dev/null; then break; fi
            [[ "$attempt" -lt 30 ]] || exit 1
            sleep 2
          done
          echo "VERTEX_SMOKE_ENDPOINT=$proxy_url" >> "$GITHUB_ENV"
          echo "::add-mask::$proxy_token"
          echo "VERTEX_SMOKE_TOKEN=$proxy_token" >> "$GITHUB_ENV"

      - name: Smoke Vertex Gemini
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_PROVIDER=vertex-gemini GCP_PROJECT_ID="$GCP_PROJECT_ID_VALUE" GCP_REGION=global GEMINI_MODEL=gemini-2.5-flash VERTEX_API_ENDPOINT="$VERTEX_SMOKE_ENDPOINT" GCP_ACCESS_TOKEN="$VERTEX_SMOKE_TOKEN" node scripts/smoke/text-provider.js | tee smoke-artifacts/text/gemini.json

      - name: Upload text-only smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truyn-text-provider-smoke-${{ github.run_id }}
          path: smoke-artifacts/text
          if-no-files-found: error
          retention-days: 30

      - name: Delete ephemeral Vertex proxy
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
