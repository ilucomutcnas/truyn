name: Temporary Network Provider Registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-network-provider-register.yml'

permissions:
  contents: read
  id-token: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Register compute/network providers
        shell: bash
        run: |
          set -euo pipefail
          for ns in Microsoft.Network Microsoft.Compute Microsoft.Storage; do
            az provider register --namespace "$ns" --wait --only-show-errors
            state="$(az provider show --namespace "$ns" --query registrationState -o tsv)"
            [[ "$state" == Registered ]] || { echo "TRUYN_PROVIDER_REGISTRATION=FAIL namespace=$ns state=$state"; exit 1; }
          done
          echo 'TRUYN_PROVIDER_REGISTRATION=PASS network=true compute=true storage=true'
