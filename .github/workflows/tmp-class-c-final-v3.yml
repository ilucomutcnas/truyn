name: Temporary Class C Final V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-c-final-v3.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  class-c-final:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TESTED_SHA: a3105505ae78a6bf8ccd78f00c05e16319ead398
      AZURE_LOCATION: eastus2
      AZURE_VM_SIZE: Standard_B1ms
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_REGION_VALUE: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      PEER_TTL_MS: '30000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          body="run_id=${GITHUB_RUN_ID} trigger_sha=${GITHUB_SHA} tested_sha=${TESTED_SHA} phase=class-c status=waiting-for-main-security-green"
          response="$(curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" -d "$(jq -nc --arg title 'TRUYN CLASS C FINAL V3 2026-08-18' --arg body "$body" '{title:$title,body:$body}')")"
          echo "CLASS_C_ISSUE=$(printf '%s' "$response" | jq -r .number)" >> "$GITHUB_ENV"

      - name: Require restored main security-green
        run: |
          set -Eeuo pipefail
          expected=$'.github/workflows/.gitkeep\n.github/workflows/ci.yml'
          for n in $(seq 1 60); do
            git fetch -q origin main
            actual="$(git ls-tree -r --name-only origin/main -- .github/workflows | sort)"
            if [[ "$actual" == "$expected" ]]; then
              echo "TRUYN_MAIN_SECURITY_GREEN=PASS sha=$(git rev-parse origin/main)"
              exit 0
            fi
            sleep 2
          done
          echo 'TRUYN_MAIN_SECURITY_GREEN=FAIL' >&2
          exit 1

      - name: Materialize immutable tested commit
        run: |
          set -Eeuo pipefail
          git cat-file -e "${TESTED_SHA}^{commit}"
          rm -rf /tmp/truyn-tested
          git worktree add --detach /tmp/truyn-tested "$TESTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tested-commit regression and security preflight
        run: |
          set -Eeuo pipefail
          cd /tmp/truyn-tested
          npm install --ignore-scripts --no-audit --no-fund
          TRUYN_LOCAL_DEVELOPMENT=1 npm test
          bash scripts/assert-security-clean-tested-commit.sh "$TESTED_SHA"
          git diff --check

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL_VALUE }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute heterogeneous WAN reachability gate
        id: proof
        continue-on-error: true
        run: |
          set -o pipefail
          cd /tmp/truyn-tested
          bash scripts/class-c-final-acceptance.sh 2>&1 | tee /tmp/class-c-final.log

      - name: Build sanitized evidence
        id: evidence
        if: always()
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -Eeuo pipefail
          touch /tmp/class-c-final.log
          final_json="$(sed -n 's/^TRUYN_CLASS_C=//p' /tmp/class-c-final.log | tail -1 || true)"
          cleanup=false
          grep -q 'TRUYN_CLASS_C_CLEANUP=PASS' /tmp/class-c-final.log && cleanup=true || true
          gate=FAIL
          if [[ "$PROOF_OUTCOME" == success ]] && [[ "$cleanup" == true ]] && printf '%s' "$final_json" | jq -e '.gate=="PASS" and .cloudProviders>=2 and .cloudRegions>=2 and .crossCloudDirectQuic==true and .relayCalls==0 and .packetPathPartition==true and .packetDropCount>0 and .realAzureNatGateway==true and .natSourceObserved==true and .privateNatNodePublicIp==false and .doubleNatCgnatLikeOutbound==true and .relayFallback==true and .relayFallbackAuthenticated==true and .relayOutageFailClosed==true and .relayRecovery==true' >/dev/null 2>&1; then
            gate=PASS
          fi
          val(){ printf '%s' "$final_json" | jq -r "$1 // \"not-recorded\"" 2>/dev/null || printf not-recorded; }
          failure_stage="$(sed -n 's/^TRUYN_CLASS_C=FAIL stage=\([^ ]*\).*/\1/p' /tmp/class-c-final.log | tail -1 | tr -cd 'A-Za-z0-9_.:-' | cut -c1-96)"
          direct_error="$(sed -n 's/^TRUYN_CLASS_C_DIRECT_ERROR=//p' /tmp/class-c-final.log | tail -1 | tr -cd 'A-Za-z0-9_.:-' | cut -c1-128)"
          report=/tmp/NETWORK_CLASS_C_HETEROGENEOUS_WAN_2026-08-18.md
          {
            echo '# TRUYN Class C Heterogeneous WAN / Reachability Gate — 2026-08-18'
            echo
            echo "**Result:** **${gate}**"
            echo
            echo '## Evidence identity'
            echo
            echo "- GitHub Actions run: https://github.com/inn-media/truyn/actions/runs/${GITHUB_RUN_ID}"
            echo "- tested security-clean commit: ${TESTED_SHA}"
            echo "- proof execution outcome: ${PROOF_OUTCOME}"
            echo "- ephemeral cloud cleanup PASS marker: ${cleanup}"
            echo "- sanitized failure stage: ${failure_stage:-none}"
            echo "- sanitized direct-path diagnostic: ${direct_error:-none}"
            echo
            echo '## Real measured gates'
            echo
            echo '| Gate | Result |'
            echo '|---|---:|'
            echo "| independent real node runtimes (base topology) | $(val '.realNodeRuntimes') |"
            echo "| cloud providers | $(val '.cloudProviders') |"
            echo "| cloud regions / failure domains | $(val '.cloudRegions') |"
            echo "| cross-cloud direct QUIC | $(val '.crossCloudDirectQuic') |"
            echo "| relay calls on direct cross-cloud proof | $(val '.relayCalls') |"
            echo "| real packet-path UDP partition | $(val '.packetPathPartition') |"
            echo "| kernel-observed dropped packets | $(val '.packetDropCount') |"
            echo "| packet heal latency, ms | $(val '.packetHealMs') |"
            echo "| real Azure NAT Gateway | $(val '.realAzureNatGateway') |"
            echo "| NAT source observed | $(val '.natSourceObserved') |"
            echo "| NAT-hidden node has public IP | $(val '.privateNatNodePublicIp') |"
            echo "| two-layer kernel NAT / CGNAT-like outbound path | $(val '.doubleNatCgnatLikeOutbound') |"
            echo "| authenticated signed-envelope relay fallback | $(val '.relayFallbackAuthenticated') |"
            echo "| relay fallback latency, ms | $(val '.relayFallbackMs') |"
            echo "| relay outage fails closed | $(val '.relayOutageFailClosed') |"
            echo "| relay recovered | $(val '.relayRecovery') |"
            echo "| guest-side relay recovery, ms | $(val '.relayRecoveryMs') |"
            echo "| carrier-field CGNAT validated | $(val '.carrierCgnatFieldValidated') |"
            echo
            echo '## Acceptance boundary'
            echo
            echo 'A PASS closes the bounded Class C heterogeneous WAN/reachability engineering gate: multi-provider WAN, direct QUIC, real packet-path loss/heal, real cloud NAT, a two-layer kernel NAT/CGNAT-like path, signed relay fallback, relay outage and recovery are exercised with cleanup.'
            echo
            echo 'The double-NAT path is deliberately described as CGNAT-like; this report does not claim a live mobile/ISP carrier CGNAT field test.'
            echo
            echo 'A FAIL is retained as evidence and does not promote maturity.'
            echo
            echo '## Security'
            echo
            echo 'The temporary privileged workflow was removed from main before cloud authentication and infrastructure execution. Credentials, cloud account identifiers, live resource names, node identities and IP addresses are omitted. Benchmark evidence follows redact-not-delete policy.'
          } > "$report"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-c-final-${{ github.run_id }}
          path: /tmp/NETWORK_CLASS_C_HETEROGENEOUS_WAN_2026-08-18.md
          if-no-files-found: error

      - name: Publish final status marker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ steps.evidence.outputs.gate }}
        run: |
          set -Eeuo pipefail
          body="run_id=${GITHUB_RUN_ID} tested_sha=${TESTED_SHA} gate=${GATE:-FAIL} artifact=class-c-final-${GITHUB_RUN_ID}"
          curl -fsSL -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${CLASS_C_ISSUE}" -d "$(jq -nc --arg body "$body" '{body:$body,state:"closed"}')" >/dev/null

      - name: Enforce acceptance
        if: always()
        run: test '${{ steps.evidence.outputs.gate }}' = PASS
