name: Temporary D-100 corrected preflight verification

on:
  push:
    paths:
      - '.github/workflows/tmp-d100-preflight-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TESTED_COMMIT: db0b86c49b29d4e7babea2da3460426d81770553
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify corrected immutable preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch origin "$TESTED_COMMIT"
          rm -rf /tmp/truyn-d100-tested
          git worktree add --detach /tmp/truyn-d100-tested "$TESTED_COMMIT"
          cd /tmp/truyn-d100-tested

          first_stage=""; first_code=0; first_log=""
          run_stage() {
            local name="$1"; shift
            local logfile="/tmp/d100-v2-${name}.log"
            set +e
            "$@" >"$logfile" 2>&1
            local rc=$?
            set -e
            echo "$name=$rc"
            if [[ $rc -ne 0 && -z "$first_stage" ]]; then
              first_stage="$name"; first_code=$rc; first_log="$logfile"
            fi
          }

          run_stage security bash scripts/assert-security-clean-tested-commit.sh HEAD
          run_stage npm-install npm install --ignore-scripts --no-audit --no-fund
          run_stage npm-test env TRUYN_LOCAL_DEVELOPMENT=1 npm test
          run_stage diff-check git diff --check
          run_stage wrapper-syntax bash -n scripts/class-d-100-final-acceptance.sh
          run_stage provision-syntax bash -n benchmarks/scale/class-d-azure-100-provision.sh
          run_stage campaign-syntax bash -n benchmarks/scale/class-d-azure-100-campaign.sh
          run_stage evaluator-syntax node --check benchmarks/scale/evaluate-class-d-evidence.js

          {
            echo "Pinned immutable source: \`$TESTED_COMMIT\`"
            echo
            if [[ -z "$first_stage" ]]; then
              echo "Result: **PASS**"
              echo "Corrected security preflight: **PASS** via \`scripts/assert-security-clean-tested-commit.sh\`."
              echo "CI install/tests/diff and D-100 shell/evaluator syntax: **PASS**."
            else
              echo "Result: **FAIL**"
              echo "First failing stage: **$first_stage**"
              echo "Exit code: **$first_code**"
              echo '```text'
              grep -E -i 'not ok|AssertionError|ERR_ASSERTION|FAIL|error|actual|expected' "$first_log" | tail -n 80 || true
              echo '--- tail ---'
              tail -n 100 "$first_log" || true
              echo '```'
            fi
          } >/tmp/d100-preflight-v2.md

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "TRUYN D100 PREFLIGHT V2 ${GITHUB_RUN_ID}" \
            --body-file /tmp/d100-preflight-v2.md

          [[ -z "$first_stage" ]]
