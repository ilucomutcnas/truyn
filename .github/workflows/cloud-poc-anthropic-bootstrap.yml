name: Cloud PoC Anthropic Automatic Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-poc-anthropic-bootstrap.yml'
      - 'adapters/providers/anthropic.js'
      - 'adapters/providers/index.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify protected bootstrap inputs exist
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || { echo 'ANTHROPIC_API_KEY=missing'; exit 1; }
          [[ -n "${ANTHROPIC_MODEL:-}" ]] || { echo 'ANTHROPIC_MODEL=missing'; exit 1; }
          echo 'ANTHROPIC_BOOTSTRAP_INPUTS=present'

      - name: Execute one minimal Claude provider call
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createAnthropicProvider } from './adapters/providers/anthropic.js';

          const provider = createAnthropicProvider({ capabilities: ['bootstrap-smoke'] });
          const result = await provider.execute({
            capability: 'bootstrap-smoke',
            input: 'Return exactly TRUYN_CLAUDE_OK and nothing else.',
            policy: { purpose: 'owner-bootstrap-smoke' }
          });

          const output = String(result.output || '').trim();
          if (output !== 'TRUYN_CLAUDE_OK') {
            throw new Error(`Unexpected Claude output: ${output.slice(0, 200)}`);
          }

          const usage = result.metadata?.usage || {};
          console.log(JSON.stringify({
            status: 'success',
            provider: result.metadata?.provider,
            model: result.metadata?.model,
            providerRequestIdPresent: Boolean(result.metadata?.providerRequestId),
            providerLatencyMs: result.metadata?.providerLatencyMs,
            inputTokens: usage.input_tokens ?? null,
            outputTokens: usage.output_tokens ?? null,
            marker: output
          }, null, 2));
          NODE

      - name: Confirm no public relay exposure
        shell: bash
        run: |
          set -euo pipefail
          echo 'CLAUDE_PUBLIC_RELAY_EXPOSURE=false'
          echo 'CLAUDE_BOOTSTRAP_SMOKE=success'
