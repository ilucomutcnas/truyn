name: tmp-observe-main-ci

on:
  push:
    branches: ['ci/d100-v16-preflight-e9ff238b']
    paths:
      - '.github/workflows/tmp-observe-main-ci.yml'

permissions:
  contents: read
  actions: read
  issues: write

env:
  TARGET_SHA: e15e46093a050753b5f00dea5989216b8c29c4c7

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Observe exact main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"
          found=''
          for attempt in $(seq 1 30); do
            found="$(gh api "repos/${repo}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20" --jq '.workflow_runs[] | select(.name == "CI") | [.id,.status,(.conclusion // ""),.head_branch,.head_sha] | @tsv' | head -n1 || true)"
            if [[ -n "$found" ]]; then break; fi
            sleep 5
          done
          test -n "$found"
          IFS=$'\t' read -r run_id status conclusion branch head_sha <<<"$found"
          test "$head_sha" = "$TARGET_SHA"
          for attempt in $(seq 1 60); do
            status="$(gh api "repos/${repo}/actions/runs/${run_id}" --jq '.status')"
            conclusion="$(gh api "repos/${repo}/actions/runs/${run_id}" --jq '.conclusion // ""')"
            [[ "$status" == completed ]] && break
            sleep 5
          done
          jobs="$(gh api "repos/${repo}/actions/runs/${run_id}/jobs?per_page=100" --jq '[.jobs[] | {id,name,status,conclusion}]')"
          body="target_sha=${TARGET_SHA} ci_run=${run_id} status=${status} conclusion=${conclusion} branch=${branch} jobs=${jobs}"
          if [[ "$status" == completed && "$conclusion" == success ]]; then
            title='TRUYN MAIN EXACT SHA CI SECURITY GREEN'
          else
            title='TRUYN MAIN EXACT SHA CI NOT GREEN'
          fi
          gh api "repos/${repo}/issues" -f "title=${title}" -f "body=${body}" >/dev/null
          test "$status" = completed
          test "$conclusion" = success
