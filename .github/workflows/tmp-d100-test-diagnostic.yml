name: Temporary D-100 test regression diagnostic

on:
  push:
    paths:
      - '.github/workflows/tmp-d100-test-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TESTED_COMMIT: 2839cb2f1b915f3b9f357b22941db1e1a3aa3635
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate exact failing test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch origin "$TESTED_COMMIT"
          rm -rf /tmp/truyn-d100-tested
          git worktree add --detach /tmp/truyn-d100-tested "$TESTED_COMMIT"
          cd /tmp/truyn-d100-tested
          bash scripts/assert-security-clean-tested-commit.sh HEAD
          npm install --ignore-scripts --no-audit --no-fund >/tmp/npm-install.log 2>&1
          set +e
          TRUYN_LOCAL_DEVELOPMENT=1 npm test >/tmp/npm-test.log 2>&1
          rc=$?
          set -e
          {
            echo "Pinned immutable source: \`$TESTED_COMMIT\`"
            echo "npm test exit: **$rc**"
            echo
            echo '```text'
            grep -n '^not ok ' /tmp/npm-test.log || true
            echo '--- failing blocks ---'
            awk '
              /^not ok / {capture=28}
              capture>0 {print; capture--}
            ' /tmp/npm-test.log || true
            echo '--- summary ---'
            grep -E '^# (tests|pass|fail|duration_ms)' /tmp/npm-test.log | tail -n 10 || true
            echo '```'
          } >/tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TRUYN D100 TEST REGRESSION ${GITHUB_RUN_ID}" --body-file /tmp/body.md
          exit "$rc"
