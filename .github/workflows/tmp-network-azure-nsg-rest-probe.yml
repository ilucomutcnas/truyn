name: Temporary Azure NSG REST Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-network-azure-nsg-rest-probe.yml']
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}
      - name: Create and delete NSG through ARM REST
        shell: bash
        run: |
          set -Eeuo pipefail
          RG="$(az group list --query "[?contains(name, 'truyn')].name | [0]" -o tsv)"
          [[ -n "$RG" ]] || { echo '::error title=TRUYN NSG REST Probe::resource_group_not_found'; exit 10; }
          NSG="truyn-rest-nsg-${GITHUB_RUN_ID}"
          API="$(az provider show --namespace Microsoft.Network --query "resourceTypes[?resourceType=='networkSecurityGroups'].apiVersions[0]" -o tsv --only-show-errors)"
          [[ -n "$API" ]] || { echo '::error title=TRUYN NSG REST Probe::networkSecurityGroups API version not found'; exit 11; }
          URI="https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID_VALUE}/resourceGroups/${RG}/providers/Microsoft.Network/networkSecurityGroups/${NSG}?api-version=${API}"
          cleanup(){
            set +e
            az rest --method delete --uri "$URI" --only-show-errors >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cat > /tmp/nsg.json <<'JSON'
          {
            "location": "eastus2",
            "properties": {
              "securityRules": [
                {
                  "name": "allow-truyn-quic",
                  "properties": {
                    "protocol": "Udp",
                    "sourcePortRange": "*",
                    "destinationPortRange": "4433",
                    "sourceAddressPrefix": "*",
                    "destinationAddressPrefix": "*",
                    "access": "Allow",
                    "priority": 100,
                    "direction": "Inbound"
                  }
                }
              ]
            }
          }
          JSON
          az rest --method put --uri "$URI" --headers 'Content-Type=application/json' --body @/tmp/nsg.json --only-show-errors >/dev/null
          state=''; rule=''
          for attempt in $(seq 1 30); do
            az rest --method get --uri "$URI" --only-show-errors >/tmp/nsg-state.json
            state="$(jq -r '.properties.provisioningState // empty' /tmp/nsg-state.json)"
            rule="$(jq -r '.properties.securityRules[]? | select(.name=="allow-truyn-quic") | .properties.destinationPortRange' /tmp/nsg-state.json)"
            [[ "$state" == Succeeded ]] && break
            [[ "$state" == Failed ]] && { echo "::error title=TRUYN NSG REST Probe::provisioningState=$state"; exit 12; }
            sleep 2
          done
          [[ "$state" == Succeeded && "$rule" == 4433 ]] || { echo "::error title=TRUYN NSG REST Probe::provisioningState=$state destinationPort=$rule"; exit 13; }
          echo "::notice title=TRUYN Azure NSG REST PASS::apiVersion=$API provisioningState=$state udpPort=$rule"
          echo "TRUYN_AZURE_NSG_REST=PASS apiVersion=$API provisioningState=$state udpPort=$rule"
