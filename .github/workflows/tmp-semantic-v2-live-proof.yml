name: Temporary Semantic v2 Seven-Actor Live Proof

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-live-proof.yml']

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AZURE_RG: truyn
      AZURE_GPT_ACCOUNT: truyn-openai-1334540181
      AZURE_GPT_DEPLOYMENT: truyn-gpt-4-1-mini
      FOUNDRY_BENCH_CAPACITY: '100'
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-live-${{ github.run_id }}
      GEMINI_MODEL: gemini-2.5-flash
      PRO_VERIFIER_MODEL: gemini-3.1-pro-preview
      GOOGLE_CLOUD_LOCATION: global
      VERTEX_EMBEDDING_LOCATION: us-central1
      VERTEX_EMBEDDING_MODEL: gemini-embedding-001
      VERTEX_EMBEDDING_DIMENSIONS: '768'
      SEMANTIC_V2_CORPUS_BLOCKS: '600'
      SEMANTIC_V2_RETRIEVAL_CASES: '360'
      SEMANTIC_V2_LIVE_CASES: '6'
      SEMANTIC_V2_PACING_MS: '30000'
      SEMANTIC_V2_RATE_LIMIT_RETRIES: '8'
      SEMANTIC_V2_OUTPUT: semantic-retrieval-v2-live.json
      SEMANTIC_V2_RETRIEVAL_PROOF: semantic-v2-retrieval-proof.json
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      RETRIEVAL_PROOF_RUN_ID: '31914581660'
      RETRIEVAL_PROOF_ARTIFACT_ID: '9254825899'
      RETRIEVAL_PROOF_ZIP_SHA256: 9dc3316ef15925f208c8687921d9c1d0c65482118eabbb237e611f0a52fe2d5b
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load immutable benchmark sources into runner only
        shell: bash
        run: |
          set -euo pipefail
          load_file() {
            path="$1"; ref="$2"
            mkdir -p "$(dirname "$path")"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
          }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"
          test -s benchmarks/semantic-retrieval-v2.js
          test -s benchmarks/semantic-v2-gcp-proxy.js

      - name: Verify immutable 360-case retrieval proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RETRIEVAL_PROOF_ARTIFACT_ID}/zip" \
            -o retrieval-proof.zip
          printf '%s  %s\n' "$RETRIEVAL_PROOF_ZIP_SHA256" retrieval-proof.zip | sha256sum -c -
          unzip -p retrieval-proof.zip semantic-retrieval-v2-pro.json > "$SEMANTIC_V2_RETRIEVAL_PROOF"
          jq -e '
            .status == "retrieval_only_pass"
            and .retrieval.cases == 360
            and .retrieval.correct == 360
            and .retrieval.accuracyPercent == 100
            and .retrieval.denseCandidateRecallPercent == 100
            and .retrieval.provenancePercent == 100
            and .retrieval.noBlockIdPercent == 100
            and ([.retrieval.byCategory[].accuracyPercent] | all(. == 100))
            and ([.retrieval.byQueryLanguage[].accuracyPercent] | all(. == 100))
            and .methodology.verifierModel == "gemini-3.1-pro-preview"
            and .semanticGate.passed == true
          ' "$SEMANTIC_V2_RETRIEVAL_PROOF" >/dev/null

      - name: Patch benchmark for verified retrieval proof plus live Pro routing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'benchmarks/semantic-retrieval-v2.js';
          let source = fs.readFileSync(path, 'utf8');
          function replaceOnce(label, from, to) {
            if (!source.includes(from)) throw new Error(`patch marker not found: ${label}`);
            source = source.replace(from, to);
          }
          function replaceRange(label, start, end, replacement) {
            const a = source.indexOf(start);
            const b = source.indexOf(end, a + start.length);
            if (a < 0 || b < 0) throw new Error(`patch range not found: ${label}`);
            source = source.slice(0, a) + replacement + source.slice(b);
          }

          replaceOnce('fs import', "import { writeFile } from 'node:fs/promises';", "import { readFile, writeFile } from 'node:fs/promises';");
          replaceOnce('reranker import', "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';", "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';\nimport { createProviderSemanticReranker } from '../core/context/provider-semantic-reranker.js';");
          replaceOnce('proof path env', "const geminiLocation = process.env.GOOGLE_CLOUD_LOCATION || 'global';", "const geminiLocation = process.env.GOOGLE_CLOUD_LOCATION || 'global';\nconst retrievalProofPath = process.env.SEMANTIC_V2_RETRIEVAL_PROOF;\nconst retrievalProofArtifactId = process.env.RETRIEVAL_PROOF_ARTIFACT_ID;\nconst retrievalProofRunId = process.env.RETRIEVAL_PROOF_RUN_ID;\nconst retrievalProofZipSha256 = process.env.RETRIEVAL_PROOF_ZIP_SHA256;");
          replaceOnce('proof required', '  GCP_ACCESS_TOKEN: proxyToken', '  GCP_ACCESS_TOKEN: proxyToken,\n  SEMANTIC_V2_RETRIEVAL_PROOF: retrievalProofPath');
          replaceOnce('dense gate', '  retrievalAccuracyPercentMin: 99,', '  retrievalAccuracyPercentMin: 99,\n  denseCandidateRecallPercentMin: 99,');
          replaceOnce('verifier reference rates', "const comparableRates = {\n  gpt: { input: 0.44, output: 1.76 },\n  gemini: { input: 0.30, output: 2.50 }\n};", "const comparableRates = {\n  gpt: { input: 0.44, output: 1.76 },\n  gemini: { input: 0.30, output: 2.50 }\n};\nconst semanticVerifierRates = { input:2.00, output:12.00 };");
          replaceOnce(
            'semantic router construction',
            '  const semanticRouter = createSemanticContextRouterV2({ embedder });',
            `  const proProviderBase = createVertexGeminiProvider({
              projectId:gcpProjectId,
              location:geminiLocation,
              model:process.env.PRO_VERIFIER_MODEL,
              endpoint:proxyEndpoint,
              accessTokenProvider:async () => proxyToken,
              capabilities:['reasoning.general'],
              requestTimeoutMs:180000
            });
            const proProvider = {
              name:proProviderBase.name,
              async execute(request) {
                let lastError;
                for (let attempt = 0; attempt <= 3; attempt += 1) {
                  try { return await proProviderBase.execute(request); }
                  catch (error) {
                    lastError = error;
                    const transient = /Vertex AI HTTP (408|429|5\\d\\d)|network request failed|timed out|upstream request timeout/i.test(error?.message || '');
                    if (!transient || attempt === 3) throw error;
                    await sleep(1000 * (2 ** attempt));
                  }
                }
                throw lastError;
              }
            };
            const semanticReranker = createProviderSemanticReranker({
              provider:proProvider,
              name:'gemini-3.1-pro-semantic-verifier',
              providerOptions:{
                responseMimeType:'application/json',
                responseSchema:{ type:'OBJECT', properties:{ id:{ type:'STRING' } }, required:['id'] }
              },
              shortlistSize:1,
              repairAttempts:1
            });
            const semanticRouter = createSemanticContextRouterV2({ embedder, reranker:semanticReranker, candidateK:64 });`
          );
          replaceRange(
            'reuse immutable retrieval proof',
            '  // Force a single document-index build before concurrent query evaluation.',
            '  const byCategory = metricsBy(retrievalResults, \'category\');',
            `  const retrievalProof = JSON.parse(await readFile(retrievalProofPath, 'utf8'));
            const retrievalResults = retrievalProof.retrievalResults;
            if (!Array.isArray(retrievalResults) || retrievalResults.length !== retrievalCaseCount) throw new Error('retrieval proof case count mismatch');
            const retrievalAccuracy = retrievalProof.retrieval.accuracyPercent;
            const provenancePercent = retrievalProof.retrieval.provenancePercent;
            const noBlockIdPercent = retrievalProof.retrieval.noBlockIdPercent;
            const lexicalV1Accuracy = retrievalProof.retrieval.lexicalV1BaselineAccuracyPercent;
            const denseCandidateRecallPercent = retrievalProof.retrieval.denseCandidateRecallPercent;
            `
          );
          replaceOnce('retrieval-only dense check', '  const retrievalOnlyPassed = retrievalAccuracy >= gate.retrievalAccuracyPercentMin\n    && provenancePercent >= gate.provenancePassPercentMin', '  const retrievalOnlyPassed = retrievalAccuracy >= gate.retrievalAccuracyPercentMin\n    && denseCandidateRecallPercent >= gate.denseCandidateRecallPercentMin\n    && provenancePercent >= gate.provenancePassPercentMin');
          replaceOnce('retrieval report proof fields', '      accuracyPercent:retrievalAccuracy,\n      provenancePercent,', '      accuracyPercent:retrievalAccuracy,\n      denseCandidateRecallPercent,\n      provenancePercent,\n      proofRunId:retrievalProofRunId,\n      proofArtifactId:retrievalProofArtifactId,\n      proofZipSha256:retrievalProofZipSha256,');
          replaceOnce('methodology live verifier', "      topK:1,\n      blockIdsInRequesterQueries:false,", "      topK:1,\n      denseCandidateK:64,\n      verifierModel:'gemini-3.1-pro-preview',\n      verifierMode:'single structured top-1 over dense64; cached once per unique question/root CID',\n      retrievalProofReuse:'360-case immutable proof is SHA-256 verified; live cases are independently rerun through the same router',\n      blockIdsInRequesterQueries:false,");
          replaceOnce('live verifier baseline', '    const liveResults = [];', `    const rerankerStatsBeforeLive = semanticRouter.stats().rerankerStats || { requests:0, inputTokens:0, outputTokens:0, totalTokens:0, requestBodyBytes:0, providerLatencyMs:0 };
            const liveResults = [];`);
          replaceOnce('live verifier delta', '    const allTruynActorMetrics = liveResults.flatMap((run) => Object.entries(run.truyn.actorMetrics).map(([alias,metric]) => ({ alias, ...metric })));', `    const rerankerStatsAfterLive = semanticRouter.stats().rerankerStats || rerankerStatsBeforeLive;
            const liveVerifier = {
              requests:(rerankerStatsAfterLive.requests || 0) - (rerankerStatsBeforeLive.requests || 0),
              inputTokens:(rerankerStatsAfterLive.inputTokens || 0) - (rerankerStatsBeforeLive.inputTokens || 0),
              outputTokens:(rerankerStatsAfterLive.outputTokens || 0) - (rerankerStatsBeforeLive.outputTokens || 0),
              totalTokens:(rerankerStatsAfterLive.totalTokens || 0) - (rerankerStatsBeforeLive.totalTokens || 0),
              requestBodyBytes:(rerankerStatsAfterLive.requestBodyBytes || 0) - (rerankerStatsBeforeLive.requestBodyBytes || 0),
              providerLatencyMs:(rerankerStatsAfterLive.providerLatencyMs || 0) - (rerankerStatsBeforeLive.providerLatencyMs || 0)
            };
            liveVerifier.costUsd = ((liveVerifier.inputTokens * semanticVerifierRates.input) + (liveVerifier.outputTokens * semanticVerifierRates.output)) / 1_000_000;
            const allTruynActorMetrics = liveResults.flatMap((run) => Object.entries(run.truyn.actorMetrics).map(([alias,metric]) => ({ alias, ...metric })));`);
          replaceOnce('honest live accounting', '    const directInputTokens = sum(liveResults, (run) => run.direct.inputTokens);\n    const truynInputTokens = sum(liveResults, (run) => run.truyn.inputTokens);\n    const directCost = sum(liveResults, (run) => run.direct.comparablePairCostUsd);\n    const truynCost = sum(liveResults, (run) => run.truyn.comparablePairCostUsd);', `    const directInputTokens = sum(liveResults, (run) => run.direct.inputTokens);
            const truynActorInputTokens = sum(liveResults, (run) => run.truyn.inputTokens);
            const truynInputTokens = truynActorInputTokens + liveVerifier.inputTokens;
            const directCost = sum(liveResults, (run) => run.direct.comparablePairCostUsd);
            const truynActorCost = sum(liveResults, (run) => run.truyn.comparablePairCostUsd);
            const truynCost = truynActorCost + liveVerifier.costUsd;
            const directProviderRequestBodyBytes = sum(liveResults, (run) => run.direct.providerRequestBodyBytes);
            const truynActorProviderRequestBodyBytes = sum(liveResults, (run) => run.truyn.providerRequestBodyBytes);
            const truynProviderRequestBodyBytes = truynActorProviderRequestBodyBytes + liveVerifier.requestBodyBytes;`);
          replaceOnce('dense final check', '      retrievalAccuracy:retrievalAccuracy >= gate.retrievalAccuracyPercentMin,\n      perLanguageAccuracy:', '      retrievalAccuracy:retrievalAccuracy >= gate.retrievalAccuracyPercentMin,\n      denseCandidateRecall:denseCandidateRecallPercent >= gate.denseCandidateRecallPercentMin,\n      perLanguageAccuracy:');
          replaceOnce('live token reporting', '        directInputTokens,\n        truynInputTokens,\n        inputTokenReductionPercent,', `        directInputTokens,
            truynActorInputTokens,
            liveVerifierInputTokens:liveVerifier.inputTokens,
            liveVerifierOutputTokens:liveVerifier.outputTokens,
            liveVerifierTotalTokens:liveVerifier.totalTokens,
            liveVerifierRequests:liveVerifier.requests,
            truynInputTokens,
            inputTokenReductionPercent,`);
          replaceOnce('live cost reporting', '        directComparablePairCostUsd:round(directCost, 9),\n        truynComparablePairCostUsd:round(truynCost, 9),', `        directComparablePairCostUsd:round(directCost, 9),
            truynActorComparablePairCostUsd:round(truynActorCost, 9),
            liveVerifierCostUsd:round(liveVerifier.costUsd, 9),
            truynComparablePairCostUsd:round(truynCost, 9),`);
          replaceOnce('provider body reporting', '        directProviderRequestBodyBytes:sum(liveResults, (run) => run.direct.providerRequestBodyBytes),\n        truynProviderRequestBodyBytes:sum(liveResults, (run) => run.truyn.providerRequestBodyBytes),\n        providerRequestBodyReductionPercent:reductionPercent(\n          sum(liveResults, (run) => run.direct.providerRequestBodyBytes),\n          sum(liveResults, (run) => run.truyn.providerRequestBodyBytes)\n        ),', `        directProviderRequestBodyBytes,
            truynActorProviderRequestBodyBytes,
            liveVerifierProviderRequestBodyBytes:liveVerifier.requestBodyBytes,
            truynProviderRequestBodyBytes,
            providerRequestBodyReductionPercent:reductionPercent(directProviderRequestBodyBytes, truynProviderRequestBodyBytes),`);
          replaceOnce('cost methodology verifier', '        usdPerMillionTokens:comparableRates', '        usdPerMillionTokens:comparableRates,\n        semanticVerifierUsdPerMillionTokens:semanticVerifierRates,\n        semanticVerifierOutputIncludesReasoningTokens:true');
          fs.writeFileSync(path, source);
          NODE
          node --check benchmarks/semantic-retrieval-v2.js

      - name: Validate code before cloud spend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -name '*.test.js' ! -name 'public-repository.test.js' -print | sort)
          node --test "${tests[@]}"
          git diff --check -- core adapters node tests

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Azure actors and temporary benchmark throughput
        shell: bash
        run: |
          set -euo pipefail
          gpt_endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$AZURE_GPT_ACCOUNT" --query properties.endpoint -o tsv)"
          gpt_key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$AZURE_GPT_ACCOUNT" --query key1 -o tsv)"
          [[ -n "$gpt_endpoint" && -n "$gpt_key" ]]
          echo "::add-mask::$gpt_key"
          echo "AZURE_OPENAI_ENDPOINT=$gpt_endpoint" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_API_KEY=$gpt_key" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_DEPLOYMENT=$AZURE_GPT_DEPLOYMENT" >> "$GITHUB_ENV"
          suffix="$(printf '%s' '${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}' | sha256sum | cut -c1-12)"
          account="truynai${suffix}"
          echo "FOUNDRY_ACCOUNT=$account" >> "$GITHUB_ENV"
          endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$account" --query properties.endpoint -o tsv)"
          key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$account" --query key1 -o tsv)"
          [[ -n "$endpoint" && -n "$key" ]]
          echo "::add-mask::$key"
          echo "AZURE_FOUNDRY_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_API_KEY=$key" >> "$GITHUB_ENV"
          resize() {
            dep="$1"; cap="$2"
            data="$(az cognitiveservices account deployment show -g "$AZURE_RG" -n "$account" --deployment-name "$dep" -o json)"
            model="$(jq -r '.properties.model.name' <<<"$data")"
            format="$(jq -r '.properties.model.format' <<<"$data")"
            version="$(jq -r '.properties.model.version // empty' <<<"$data")"
            sku="$(jq -r '.sku.name' <<<"$data")"
            args=(cognitiveservices account deployment create -g "$AZURE_RG" -n "$account" --deployment-name "$dep" --model-name "$model" --model-format "$format" --sku-name "$sku" --sku-capacity "$cap")
            [[ -n "$version" ]] && args+=(--model-version "$version")
            az "${args[@]}" >/dev/null
          }
          for dep in truyn-grok truyn-deepseek truyn-llama truyn-mistral truyn-kimi; do resize "$dep" "$FOUNDRY_BENCH_CAPACITY"; done
          echo "AZURE_FOUNDRY_GROK=truyn-grok" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_DEEPSEEK=truyn-deepseek" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_LLAMA=truyn-llama" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_MISTRAL=truyn-mistral" >> "$GITHUB_ENV"
          echo "AZURE_FOUNDRY_KIMI=truyn-kimi" >> "$GITHUB_ENV"

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Prepare isolated Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-live:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" .
          docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=4 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok == true' >/dev/null; then break; fi
            [[ "$attempt" -lt 30 ]] || exit 1
            sleep 2
          done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"
          echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"

      - name: Preflight embedding and Pro verifier
        shell: bash
        run: |
          set -euo pipefail
          embed_path="/v1/projects/${GCP_PROJECT_ID}/locations/${VERTEX_EMBEDDING_LOCATION}/publishers/google/models/${VERTEX_EMBEDDING_MODEL}:predict"
          embed_body='{"instances":[{"task_type":"RETRIEVAL_QUERY","content":"semantic v2 live preflight"}],"parameters":{"autoTruncate":true,"outputDimensionality":768}}'
          curl -fsS -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$embed_body" "${VERTEX_API_ENDPOINT}${embed_path}" | jq -e '.predictions[0].embeddings.values | length > 0' >/dev/null
          pro_path="/v1/projects/${GCP_PROJECT_ID}/locations/global/publishers/google/models/${PRO_VERIFIER_MODEL}:generateContent"
          pro_body='{"contents":[{"role":"user","parts":[{"text":"Return JSON {\"id\":\"ok\"}."}]}],"generationConfig":{"responseMimeType":"application/json","responseSchema":{"type":"OBJECT","properties":{"id":{"type":"STRING"}},"required":["id"]}}}'
          curl -fsS -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$pro_body" "${VERTEX_API_ENDPOINT}${pro_path}" | jq -e '.candidates | length > 0' >/dev/null

      - name: Run full multilingual seven-actor Semantic Retrieval Gate v2
        run: node benchmarks/semantic-retrieval-v2.js

      - name: Print gate summary
        if: ${{ always() && hashFiles('semantic-retrieval-v2-live.json') != '' }}
        run: jq '{benchmark,status,corpus,retrieval,actors,live,semanticRouterStats,embedding,semanticGate,comparableCostMethodology,methodology}' semantic-retrieval-v2-live.json

      - name: Upload live evidence
        if: ${{ always() && hashFiles('semantic-retrieval-v2-live.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-retrieval-v2-live-${{ github.run_id }}
          path: semantic-retrieval-v2-live.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce full v2 gate
        if: ${{ hashFiles('semantic-retrieval-v2-live.json') != '' }}
        run: jq -e '.semanticGate.passed == true' semantic-retrieval-v2-live.json >/dev/null

      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true

      - name: Restore Foundry smoke capacity
        if: always()
        shell: bash
        run: |
          set +e
          account="${FOUNDRY_ACCOUNT:-}"
          [[ -n "$account" ]] || exit 0
          resize_back() {
            dep="$1"
            data="$(az cognitiveservices account deployment show -g "$AZURE_RG" -n "$account" --deployment-name "$dep" -o json 2>/dev/null)" || return 0
            model="$(jq -r '.properties.model.name' <<<"$data")"
            format="$(jq -r '.properties.model.format' <<<"$data")"
            version="$(jq -r '.properties.model.version // empty' <<<"$data")"
            sku="$(jq -r '.sku.name' <<<"$data")"
            args=(cognitiveservices account deployment create -g "$AZURE_RG" -n "$account" --deployment-name "$dep" --model-name "$model" --model-format "$format" --sku-name "$sku" --sku-capacity 1)
            [[ -n "$version" ]] && args+=(--model-version "$version")
            az "${args[@]}" >/dev/null 2>&1 || true
          }
          for dep in truyn-grok truyn-deepseek truyn-llama truyn-mistral truyn-kimi; do resize_back "$dep"; done
