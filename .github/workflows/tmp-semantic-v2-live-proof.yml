name: Temporary Semantic v2 Query Projection Retrieval

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-live-proof.yml']

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-project-${{ github.run_id }}
      GEMINI_MODEL: gemini-2.5-flash
      GOOGLE_CLOUD_LOCATION: global
      VERTEX_EMBEDDING_LOCATION: us-central1
      VERTEX_EMBEDDING_MODEL: gemini-embedding-001
      VERTEX_EMBEDDING_DIMENSIONS: '768'
      SEMANTIC_V2_CORPUS_BLOCKS: '600'
      SEMANTIC_V2_RETRIEVAL_CASES: '360'
      SEMANTIC_V2_LIVE_CASES: '6'
      SEMANTIC_V2_OUTPUT: semantic-v2-projector.json
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load immutable benchmark source into runner only
        shell: bash
        run: |
          set -euo pipefail
          load_file() {
            path="$1"; ref="$2"
            mkdir -p "$(dirname "$path")"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
          }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"

      - name: Patch retrieval benchmark for Flash query projection and fusion diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'benchmarks/semantic-retrieval-v2.js';
          let source = fs.readFileSync(path, 'utf8');
          function replaceOnce(label, from, to) {
            if (!source.includes(from)) throw new Error(`patch marker not found: ${label}`);
            source = source.replace(from, to);
          }
          function replaceRange(label, start, end, replacement) {
            const a = source.indexOf(start);
            const b = source.indexOf(end, a + start.length);
            if (a < 0 || b < 0) throw new Error(`patch range not found: ${label}`);
            source = source.slice(0, a) + replacement + source.slice(b);
          }

          replaceOnce(
            'projector import',
            "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';",
            "import { createVertexEmbeddingClient } from '../adapters/providers/vertex-embedding.js';\nimport { createProviderSemanticProjector } from '../core/context/provider-semantic-projector.js';"
          );
          replaceRange(
            'gcp-only required env',
            'const required = {',
            'for (const [name, value] of Object.entries(required))',
            `const required = {
              GCP_PROJECT_ID: gcpProjectId,
              VERTEX_API_ENDPOINT: proxyEndpoint,
              GCP_ACCESS_TOKEN: proxyToken
            };
            `
          );
          replaceOnce(
            'router construction',
            '  const semanticRouter = createSemanticContextRouterV2({ embedder });',
            `  const projectorProvider = createVertexGeminiProvider({
              projectId:gcpProjectId,
              location:geminiLocation,
              model:geminiModel,
              endpoint:proxyEndpoint,
              accessTokenProvider:async () => proxyToken,
              capabilities:['reasoning.general'],
              requestTimeoutMs:90000
            });
            const queryProjector = createProviderSemanticProjector({
              provider:projectorProvider,
              name:'gemini-2.5-flash-multilingual-query-projector',
              providerOptions:{
                thinkingBudget:0,
                temperature:0,
                responseMimeType:'application/json',
                responseSchema:{
                  type:'OBJECT',
                  properties:{
                    variants:{
                      type:'OBJECT',
                      properties:{ en:{type:'STRING'}, zh:{type:'STRING'}, tr:{type:'STRING'} },
                      required:['en','zh','tr']
                    }
                  },
                  required:['variants']
                }
              },
              repairAttempts:1
            });
            const semanticRouter = createSemanticContextRouterV2({
              embedder,
              queryProjector,
              candidateK:64,
              fusionStrategy:'mean',
              diagnosticFusion:true
            });`
          );
          replaceOnce(
            'fusion diagnostics per result',
            '        lexicalV1Correct:lexicalSelectedId === item.id',
            `        lexicalV1Correct:lexicalSelectedId === item.id,
            fusionTopIds:Object.fromEntries(Object.entries(retrieved.retrieval?.fusionDiagnostics?.topByStrategy || {}).map(([strategy,list]) => [strategy,list?.[0]?.id || null])),
            fusionCorrect:Object.fromEntries(Object.entries(retrieved.retrieval?.fusionDiagnostics?.topByStrategy || {}).map(([strategy,list]) => [strategy,list?.[0]?.id === item.id]))`
          );
          replaceOnce(
            'fusion aggregates',
            "  const lexicalV1Accuracy = percent(retrievalResults.filter((item) => item.lexicalV1Correct).length, retrievalResults.length);",
            `  const lexicalV1Accuracy = percent(retrievalResults.filter((item) => item.lexicalV1Correct).length, retrievalResults.length);
            const fusionStrategies = Object.keys(retrievalResults[0]?.fusionCorrect || {});
            const fusionByStrategy = Object.fromEntries(fusionStrategies.map((strategy) => {
              const rows = retrievalResults.map((item) => ({ ...item, correct:Boolean(item.fusionCorrect?.[strategy]) }));
              const byCategory = metricsBy(rows, 'category');
              const byQueryLanguageRaw = metricsBy(rows, 'queryLanguage');
              return [strategy, {
                cases:rows.length,
                correct:rows.filter((item) => item.correct).length,
                accuracyPercent:percent(rows.filter((item) => item.correct).length, rows.length),
                byCategory,
                byQueryLanguage:Object.fromEntries(Object.entries(byQueryLanguageRaw).map(([key,value]) => [queryLabels[key] || key,value])),
                hardGatePassed:Object.values(byCategory).every((metric) => metric.accuracyPercent >= gate.perCategoryAccuracyPercentMin)
                  && Object.values(byQueryLanguageRaw).every((metric) => metric.accuracyPercent >= gate.perLanguageAccuracyPercentMin)
                  && percent(rows.filter((item) => item.correct).length, rows.length) >= gate.retrievalAccuracyPercentMin
              }];
            }));`
          );
          replaceOnce(
            'report projection stats',
            '    embedding:embedder.stats(),\n    methodology:{',
            `    embedding:embedder.stats(),
            semanticRouterStats:semanticRouter.stats(),
            queryProjectorStats:queryProjector.stats(),
            fusionByStrategy,
            methodology:{`
          );
          replaceOnce(
            'projection methodology',
            "      topK:1,\n      blockIdsInRequesterQueries:false,",
            "      topK:1,\n      queryProjectionModel:'gemini-2.5-flash',\n      queryProjectionLanguages:['en','zh','tr'],\n      queryProjectorSeesCorpus:false,\n      queryProjectorSeesCandidateIds:false,\n      primaryFusionStrategy:'mean',\n      diagnosticFusionStrategies:'all router-supported strategies computed from identical projected vectors without extra provider calls',\n      blockIdsInRequesterQueries:false,"
          );
          replaceOnce(
            'retrieval-only pass exit',
            '  const relay = createRelay({ localDevelopmentMode:true, exposeDiagnostics:true, maxNodes:128, maxOffers:256 });',
            `  const semanticGate = {
              thresholds:gate,
              checks:{ retrievalOnlyPassed },
              passed:retrievalOnlyPassed
            };
            await writeFile(outputPath, JSON.stringify({ ...reportBase, status:'retrieval_only_pass', semanticGate, retrievalResults }, null, 2));
            console.log(JSON.stringify({ ...reportBase, status:'retrieval_only_pass', semanticGate }, null, 2));
            return;

            const relay = createRelay({ localDevelopmentMode:true, exposeDiagnostics:true, maxNodes:128, maxOffers:256 });`
          );

          fs.writeFileSync(path, source);
          NODE
          node --check benchmarks/semantic-retrieval-v2.js

      - name: Validate code before cloud spend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -name '*.test.js' ! -name 'public-repository.test.js' -print | sort)
          node --test "${tests[@]}"
          git diff --check -- core adapters node tests

      - name: Authenticate GCP deployer using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Prepare isolated Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-project:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" .
          docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=4 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok == true' >/dev/null; then break; fi
            [[ "$attempt" -lt 30 ]] || exit 1
            sleep 2
          done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"
          echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"

      - name: Preflight embedding and Flash projection
        shell: bash
        run: |
          set -euo pipefail
          embed_path="/v1/projects/${GCP_PROJECT_ID}/locations/${VERTEX_EMBEDDING_LOCATION}/publishers/google/models/${VERTEX_EMBEDDING_MODEL}:predict"
          embed_body='{"instances":[{"task_type":"RETRIEVAL_QUERY","content":"projection retrieval preflight"}],"parameters":{"autoTruncate":true,"outputDimensionality":768}}'
          curl -fsS -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$embed_body" "${VERTEX_API_ENDPOINT}${embed_path}" | jq -e '.predictions[0].embeddings.values | length > 0' >/dev/null
          flash_path="/v1/projects/${GCP_PROJECT_ID}/locations/global/publishers/google/models/${GEMINI_MODEL}:generateContent"
          flash_body='{"contents":[{"role":"user","parts":[{"text":"Return JSON only: {\"variants\":{\"en\":\"approval\",\"zh\":\"批准\",\"tr\":\"onay\"}}"}]}],"generationConfig":{"temperature":0,"thinkingConfig":{"thinkingBudget":0},"responseMimeType":"application/json"}}'
          curl -fsS -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$flash_body" "${VERTEX_API_ENDPOINT}${flash_path}" | jq -e '.candidates | length > 0' >/dev/null

      - name: Run 360-case query-projection retrieval experiment
        run: node benchmarks/semantic-retrieval-v2.js

      - name: Print projection and fusion summary
        if: ${{ always() && hashFiles('semantic-v2-projector.json') != '' }}
        run: jq '{status,corpus,retrieval,queryProjectorStats,semanticRouterStats,fusionByStrategy,embedding,methodology,semanticGate}' semantic-v2-projector.json

      - name: Upload projection evidence
        if: ${{ always() && hashFiles('semantic-v2-projector.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-projector-${{ github.run_id }}
          path: semantic-v2-projector.json
          if-no-files-found: error
          retention-days: 30

      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
