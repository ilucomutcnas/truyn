name: GCP Secret Manager Bootstrap Once

on:
  push:
    paths:
      - .github/workflows/gcp-secretmanager-bootstrap-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_IDENTITY_SECRET: truyn-gemini-identity-b64
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Grant deployer Secret Manager administration
        shell: bash
        run: |
          set -euo pipefail
          gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID" \
            --member="serviceAccount:${GCP_DEPLOYER_SA}" \
            --role='roles/secretmanager.admin' \
            --condition=None \
            --quiet >/dev/null
          echo 'GCP_DEPLOYER_SECRET_MANAGER_ADMIN=granted'
      - name: Create durable identity and runtime access
        shell: bash
        run: |
          set -euo pipefail
          gcloud services enable secretmanager.googleapis.com --project="$GCP_PROJECT_ID" --quiet
          if ! gcloud secrets describe "$GCP_IDENTITY_SECRET" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            identity_b64="$(node --input-type=module -e "import { createIdentity } from './core/identity/index.js'; process.stdout.write(Buffer.from(JSON.stringify(createIdentity())).toString('base64'));")"
            echo "::add-mask::$identity_b64"
            printf '%s' "$identity_b64" | gcloud secrets create "$GCP_IDENTITY_SECRET" \
              --project="$GCP_PROJECT_ID" \
              --replication-policy=automatic \
              --data-file=- >/dev/null
            echo 'GCP_PROVIDER_IDENTITY_SECRET=created'
          else
            echo 'GCP_PROVIDER_IDENTITY_SECRET=existing'
          fi
          gcloud secrets add-iam-policy-binding "$GCP_IDENTITY_SECRET" \
            --project="$GCP_PROJECT_ID" \
            --member="serviceAccount:${GCP_RUNTIME_SA}" \
            --role='roles/secretmanager.secretAccessor' \
            --quiet >/dev/null
          version="$(gcloud secrets versions list "$GCP_IDENTITY_SECRET" --project="$GCP_PROJECT_ID" --filter='state:ENABLED' --sort-by='~createTime' --limit=1 --format='value(name.basename())')"
          [[ "$version" =~ ^[0-9]+$ ]] || { echo 'GCP_PROVIDER_IDENTITY_VERSION=invalid'; exit 1; }
          echo "GCP_PROVIDER_IDENTITY_SECRET_VERSION=$version"
