name: Ephemeral Cohere Rerank Inventory

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-cohere-rerank-inventory.yml']

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect existing Foundry account catalog without inference
        shell: bash
        run: |
          set -euo pipefail
          RG=truyn
          found=""
          while IFS= read -r account; do
            deps="$(az cognitiveservices account deployment list -g "$RG" -n "$account" -o json 2>/dev/null || echo '[]')"
            if jq -e '[.[].name] | any(. == "truyn-grok" or . == "truyn-deepseek" or . == "truyn-llama" or . == "truyn-mistral" or . == "truyn-kimi")' <<<"$deps" >/dev/null; then
              found="$account"
              break
            fi
          done < <(az cognitiveservices account list -g "$RG" --query '[].name' -o tsv)
          [[ -n "$found" ]] || { echo 'Foundry account with TRUYN text deployments not found'; exit 2; }
          echo "::add-mask::$found"
          models="$(az cognitiveservices account list-models -g "$RG" -n "$found" -o json)"
          jq '[.[] | select((.name // "") | test("Cohere-rerank-v4\\.0-(fast|pro)"; "i")) | {name, version, format, modelLifecycleStatus, skus}]' <<<"$models" > cohere-rerank-inventory.json
          jq -e 'length > 0' cohere-rerank-inventory.json >/dev/null
          jq '{available:length, models:[.[]|{name,version,format,skuNames:[.skus[]?.name]}]}' cohere-rerank-inventory.json
      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-cohere-rerank-inventory-${{ github.run_id }}
          path: cohere-rerank-inventory.json
          if-no-files-found: warn
          retention-days: 30
