name: Ephemeral Semantic v2 Dense Uncertainty Analysis

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-dense-uncertainty.yml']

permissions:
  contents: read
  id-token: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-margin-${{ github.run_id }}
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      ADAPTIVE_ARTIFACT_ID: '9263556614'
      ADAPTIVE_ZIP_SHA256: 6a87f45c256823734496660e6f9ecaaa43b2a192003dbc51afb4b5d3700d63fe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Load immutable sources and previous raw result
        shell: bash
        run: |
          set -euo pipefail
          load_file(){ mkdir -p "$(dirname "$1")"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1?ref=$2" | jq -r '.content' | tr -d '\n' | base64 -d > "$1"; }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ADAPTIVE_ARTIFACT_ID}/zip" -o /tmp/adaptive.zip
          printf '%s  %s\n' "$ADAPTIVE_ZIP_SHA256" /tmp/adaptive.zip | sha256sum -c -
          unzip -p /tmp/adaptive.zip semantic-v2-adaptive-full.json > /tmp/adaptive.json
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with: { project_id: '${{ env.GCP_PROJECT_ID_VALUE }}' }
      - name: Prepare isolated Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"; image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-margin:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null && docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for a in $(seq 1 30); do curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok==true' >/dev/null && break; [[ "$a" -lt 30 ]] || exit 1; sleep 2; done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"; echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"; echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"
      - name: Compute deterministic dense uncertainty signals
        shell: bash
        run: |
          cat > semantic-v2-dense-uncertainty.mjs <<'NODE'
          import fs from 'node:fs';import vm from 'node:vm';import {createVertexEmbeddingClient} from './adapters/providers/vertex-embedding.js';
          const src=fs.readFileSync('benchmarks/semantic-retrieval-v2.js','utf8'),a=src.indexOf('const domains = ['),b=src.indexOf('const fullContext =');const box={};vm.createContext(box);vm.runInContext('const corpusSize=600,retrievalCaseCount=360;'+src.slice(a,b)+';globalThis.__d={blocks,retrievalCases};',box);const {blocks,retrievalCases}=box.__d,prev=JSON.parse(fs.readFileSync('/tmp/adaptive.json','utf8'));
          const emb=createVertexEmbeddingClient({projectId:process.env.GCP_PROJECT_ID,location:'us-central1',model:'gemini-embedding-001',endpoint:process.env.VERTEX_API_ENDPOINT,accessTokenProvider:async()=>process.env.GCP_ACCESS_TOKEN,batchSize:1,outputDimensionality:768,maxRetries:10});const norm=v=>Math.sqrt(v.reduce((s,x)=>s+x*x,0)),cos=(x,y)=>{let d=0;for(let i=0;i<x.length;i++)d+=x[i]*y[i];const z=norm(x)*norm(y);return z?d/z:0};async function ml(items,n,fn){const out=new Array(items.length);let next=0;async function w(){for(;;){const i=next++;if(i>=items.length)return;out[i]=await fn(items[i],i)}}await Promise.all(Array.from({length:Math.min(n,items.length)},w));return out}
          const dv=await ml(blocks,8,async x=>(await emb.embedMany([x.text],{taskType:'RETRIEVAL_DOCUMENT'}))[0]),qv=await ml(retrievalCases,8,async x=>(await emb.embedMany([x.question],{taskType:'RETRIEVAL_QUERY'}))[0]);const rows=retrievalCases.map((item,qi)=>{const ranked=blocks.map((x,i)=>({id:x.id,score:cos(qv[qi],dv[i])})).sort((x,y)=>y.score-x.score||x.id.localeCompare(y.id)).slice(0,24),old=prev.rows.find(r=>r.caseIndex===item.caseIndex),selectedRank=old.selectedId?ranked.findIndex(x=>x.id===old.selectedId)+1:null,liteRank=old.liteSelectedId?ranked.findIndex(x=>x.id===old.liteSelectedId)+1:null,minimalRank=old.minimalSelectedId?ranked.findIndex(x=>x.id===old.minimalSelectedId)+1:null;return{caseIndex:item.caseIndex,correct:old.correct,category:item.category,queryLanguage:item.queryLanguage,expectedRank:ranked.findIndex(x=>x.id===item.id)+1||null,top1Id:ranked[0].id,top1Score:ranked[0].score,top2Id:ranked[1].id,top2Score:ranked[1].score,top1Top2Margin:ranked[0].score-ranked[1].score,selectedId:old.selectedId,selectedRank,liteSelectedId:old.liteSelectedId,liteRank,minimalSelectedId:old.minimalSelectedId,minimalRank,cheapAgreement:old.liteSelectedId===old.minimalSelectedId,mode:old.mode};});
          const quantiles=xs=>{const a=[...xs].sort((x,y)=>x-y),q=p=>a[Math.floor((a.length-1)*p)];return{min:q(0),p01:q(.01),p05:q(.05),p10:q(.1),p25:q(.25),p50:q(.5),p75:q(.75),p90:q(.9),p95:q(.95),p99:q(.99),max:q(1)}};const correct=rows.filter(r=>r.correct),wrong=rows.filter(r=>!r.correct);const thresholds=[.0005,.001,.002,.003,.005,.0075,.01,.015,.02,.03,.05].map(t=>({threshold:t,fallback:rows.filter(r=>r.top1Top2Margin<=t).length,wrongCaptured:wrong.filter(r=>r.top1Top2Margin<=t).map(r=>r.caseIndex),correctSent:correct.filter(r=>r.top1Top2Margin<=t).length}));const report={benchmark:'TRUYN Semantic v2 deterministic dense uncertainty analysis',generatedAt:new Date().toISOString(),sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,priorRunId:31946647176,embedding:emb.stats(),marginQuantilesAll:quantiles(rows.map(r=>r.top1Top2Margin)),marginQuantilesWrong:quantiles(wrong.map(r=>r.top1Top2Margin)),thresholds,wrong,rows};fs.writeFileSync('semantic-v2-dense-uncertainty.json',JSON.stringify(report,null,2));console.log(JSON.stringify({marginQuantilesAll:report.marginQuantilesAll,marginQuantilesWrong:report.marginQuantilesWrong,thresholds,wrong},null,2));
          NODE
          node semantic-v2-dense-uncertainty.mjs
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-dense-uncertainty-${{ github.run_id }}
          path: semantic-v2-dense-uncertainty.json
          retention-days: 30
      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
