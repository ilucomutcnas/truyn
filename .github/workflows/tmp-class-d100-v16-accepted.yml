name: tmp-class-d100-v16-accepted

on:
  push:
    branches: ['fix/d100-v16-azure-429-churn']
    paths:
      - '.github/workflows/tmp-class-d100-v16-accepted.yml'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TESTED_COMMIT: b70190d685c55a7258c649e1bb5f11acbdcafbfd

jobs:
  immutable-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b70190d685c55a7258c649e1bb5f11acbdcafbfd
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Full CI and immutable V16 prepare-only preflight
        env:
          TRUYN_LOCAL_DEVELOPMENT: '1'
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          extras="$(find .github/workflows -maxdepth 1 -type f ! -name ci.yml ! -name .gitkeep -printf '%f\n' | sort)"
          test -z "$extras"
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          git diff --check
          bash -n scripts/class-d-100-final-acceptance.sh
          bash -n scripts/class-d-100-v13-acceptance.sh
          bash -n scripts/class-d-100-v16-acceptance.sh
          bash -n benchmarks/scale/class-d-azure-100-provision.sh
          bash -n benchmarks/scale/class-d-azure-100-campaign.sh
          TRUYN_CLASS_D100_PREPARE_ONLY=1 bash scripts/class-d-100-v16-acceptance.sh | tee class-d-100-v16-preflight.txt
          node --check benchmarks/scale/evaluate-class-d-evidence.js
          node --check benchmarks/scale/verify-class-d-terminal.js
          node --test tests/class-d-v16-harness.test.js tests/class-d-v13-harness.test.js tests/class-d-run-command-regression.test.js tests/class-d-canonical-pin-regression.test.js
          grep -q 'baselineRoutingSuccess: 0.99' benchmarks/scale/class-d.js
          grep -q 'healedRoutingSuccess: 0.99' benchmarks/scale/class-d.js
          grep -q 'recoveryP95Ms: 120_000' benchmarks/scale/class-d.js
          grep -q 'convergenceP95Ms: 120_000' benchmarks/scale/class-d.js
          grep -q 'acknowledgedWriteLossMax: 0' benchmarks/scale/class-d.js
          grep -q 'invalidSignedStateAcceptedMax: 0' benchmarks/scale/class-d.js
          grep -q 'staleRevokedReceiptAcceptedMax: 0' benchmarks/scale/class-d.js
          printf 'tested_commit=%s\nstatus=PASS\nsafety_contract=unchanged\n' "$TESTED_COMMIT" >>class-d-100-v16-preflight.txt
          echo "TRUYN_CLASS_D_100_V16_IMMUTABLE_PREFLIGHT=PASS testedCommit=${TESTED_COMMIT}"

      - name: Upload immutable preflight
        uses: actions/upload-artifact@v4
        with:
          name: truyn-class-d100-v16-preflight-${{ github.run_id }}
          retention-days: 90
          path: class-d-100-v16-preflight.txt

      - name: Preflight PASS marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues -f title='TRUYN CLASS D-100 V16 IMMUTABLE PREFLIGHT PASS' -f body="run=${GITHUB_RUN_ID} workflow_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT}" >/dev/null

  accepted-d100-v16:
    needs: immutable-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b70190d685c55a7258c649e1bb5f11acbdcafbfd
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Accepted run start marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues -f title='TRUYN CLASS D-100 V16 ACCEPTED RUN STARTED' -f body="run=${GITHUB_RUN_ID} workflow_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT}" >/dev/null

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute real 4-host 100-node campaign
        id: campaign
        continue-on-error: true
        env:
          TRUYN_TESTED_COMMIT: b70190d685c55a7258c649e1bb5f11acbdcafbfd
          TRUYN_AZURE_RESOURCE_GROUP: truyn
        run: |
          set -o pipefail
          bash scripts/class-d-100-v16-acceptance.sh 2>&1 | tee class-d-100-run.log

      - name: Canonical post-cleanup evaluation and strict terminal verification
        id: terminal
        if: always()
        run: |
          set +e
          if [[ -f class-d-100-evidence.json ]]; then
            node benchmarks/scale/evaluate-class-d-evidence.js class-d-100-evidence.json >class-d-100-evaluation.json 2>class-d-100-evaluation.stderr
            evaluator_rc=$?
            node benchmarks/scale/verify-class-d-terminal.js class-d-100-evidence.json >class-d-100-terminal.json 2>class-d-100-terminal.stderr
            terminal_rc=$?
          else
            evaluator_rc=99
            terminal_rc=99
            printf '%s\n' '{"ok":false,"error":"class_d_evidence_missing"}' >class-d-100-evaluation.json
            printf '%s\n' '{"ok":false,"error":"class_d_terminal_evidence_missing"}' >class-d-100-terminal.json
          fi
          campaign_outcome='${{ steps.campaign.outcome }}'
          printf 'campaign_outcome=%s\n' "$campaign_outcome" >class-d-100-v16-summary.txt
          printf 'evaluator_rc=%s\n' "$evaluator_rc" >>class-d-100-v16-summary.txt
          printf 'terminal_rc=%s\n' "$terminal_rc" >>class-d-100-v16-summary.txt
          printf 'tested_commit=%s\n' "$TESTED_COMMIT" >>class-d-100-v16-summary.txt
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" >>class-d-100-v16-summary.txt
          echo "evaluator_rc=$evaluator_rc" >>"$GITHUB_OUTPUT"
          echo "terminal_rc=$terminal_rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-class-d100-v16-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            class-d-100-run.log
            class-d-100-evidence.json
            class-d-100-evaluation.json
            class-d-100-evaluation.stderr
            class-d-100-terminal.json
            class-d-100-terminal.stderr
            class-d-100-v16-summary.txt

      - name: Terminal marker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL_RC: ${{ steps.terminal.outputs.terminal_rc }}
          EVALUATOR_RC: ${{ steps.terminal.outputs.evaluator_rc }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        run: |
          if [[ "$CAMPAIGN_OUTCOME" == success && "$TERMINAL_RC" == 0 && "$EVALUATOR_RC" == 0 ]]; then result=PASS; else result=FAIL; fi
          body="run=${GITHUB_RUN_ID} tested_sha=${TESTED_COMMIT} result=${result} campaign_outcome=${CAMPAIGN_OUTCOME:-missing} evaluator_rc=${EVALUATOR_RC:-missing} terminal_rc=${TERMINAL_RC:-missing}"
          gh api repos/${GITHUB_REPOSITORY}/issues -f title="TRUYN CLASS D-100 V16 ACCEPTED ${result}" -f body="$body" >/dev/null

      - name: Strict accepted gate
        if: always()
        env:
          TERMINAL_RC: ${{ steps.terminal.outputs.terminal_rc }}
          EVALUATOR_RC: ${{ steps.terminal.outputs.evaluator_rc }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        run: |
          test "$CAMPAIGN_OUTCOME" = success
          test "$EVALUATOR_RC" = 0
          test "$TERMINAL_RC" = 0
          node benchmarks/scale/verify-class-d-terminal.js class-d-100-evidence.json
