name: Cloud PoC Domain Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-poc-domain-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      AZURE_RG: truyn
      AFD_PROFILE: truyn-frontdoor
      AFD_ENDPOINT: truyn-edge-1334540181
      AFD_ROUTE: relay-route
      TRUYN_HOST: relay.truyn.org
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Diagnose Azure and public edge
        shell: bash
        run: |
          set -u
          az extension add --name cdn --upgrade --yes >/dev/null 2>&1 || true

          echo '=== DNS / HTTPS ==='
          hosts=(
            relay.truyn.org
            api.truyn.org
            discovery.truyn.org
            gateway.truyn.org
            mcp.truyn.org
            trust.truyn.org
            status.truyn.org
          )
          for host in "${hosts[@]}"; do
            echo "--- ${host} ---"
            dig +short CNAME "$host" || true
            dig +short A "$host" || true
            curl -sS --connect-timeout 5 --max-time 10 -o /tmp/body -w 'HTTP=%{http_code}\n' "https://${host}/health" || true
            head -c 300 /tmp/body 2>/dev/null || true
            echo
          done

          echo '=== CUSTOM DOMAINS ==='
          domains=(
            relay-truyn-org
            api-truyn-org
            discovery-truyn-org
            gateway-truyn-org
            mcp-truyn-org
            trust-truyn-org
            status-truyn-org
          )
          for domain in "${domains[@]}"; do
            echo "--- ${domain} ---"
            az afd custom-domain show \
              -g "$AZURE_RG" \
              --profile-name "$AFD_PROFILE" \
              --custom-domain-name "$domain" \
              --query '{hostName:hostName,domainValidationState:domainValidationState,provisioningState:provisioningState,deploymentStatus:deploymentStatus,tlsSettings:tlsSettings}' \
              -o json || true
          done

          echo '=== ROUTE ==='
          az afd route show \
            -g "$AZURE_RG" \
            --profile-name "$AFD_PROFILE" \
            --endpoint-name "$AFD_ENDPOINT" \
            --route-name "$AFD_ROUTE" \
            --query '{provisioningState:provisioningState,deploymentStatus:deploymentStatus,enabledState:enabledState,customDomains:customDomains,linkToDefaultDomain:linkToDefaultDomain}' \
            -o json || true
