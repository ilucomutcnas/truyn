name: Cloud PoC Domain Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-poc-domain-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AZURE_RG: truyn
      AFD_PROFILE: truyn-frontdoor
      AFD_ENDPOINT: truyn-edge-1334540181
      AFD_ROUTE: relay-route
      AFD_CUSTOM_DOMAIN: relay-truyn-org
      TRUYN_HOST: relay.truyn.org
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Diagnose Azure and public edge
        shell: bash
        run: |
          set -u
          az extension add --name cdn --upgrade --yes >/dev/null 2>&1 || true
          echo '=== DNS ==='
          dig +short CNAME "$TRUYN_HOST" || true
          dig +short A "$TRUYN_HOST" || true
          echo '=== CUSTOM DOMAIN ==='
          az afd custom-domain show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --custom-domain-name "$AFD_CUSTOM_DOMAIN" \
            --query '{hostName:hostName,domainValidationState:domainValidationState,provisioningState:provisioningState,deploymentStatus:deploymentStatus,tlsSettings:tlsSettings}' -o json || true
          echo '=== ROUTE ==='
          az afd route show -g "$AZURE_RG" --profile-name "$AFD_PROFILE" --endpoint-name "$AFD_ENDPOINT" --route-name "$AFD_ROUTE" \
            --query '{provisioningState:provisioningState,deploymentStatus:deploymentStatus,enabledState:enabledState,customDomains:customDomains,linkToDefaultDomain:linkToDefaultDomain}' -o json || true
          echo '=== HTTPS ==='
          curl -sSvk --connect-timeout 10 --max-time 20 "https://${TRUYN_HOST}/health" -o /tmp/body 2>&1 | tail -n 80 || true
          echo '=== BODY ==='
          cat /tmp/body 2>/dev/null || true
