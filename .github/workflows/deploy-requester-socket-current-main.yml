name: Deploy requester socket hot path

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-requester-socket-current-main.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Azure runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-poc-azure-runtime.yml --repo inn-media/truyn --ref main
      - name: Dispatch GCP runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-poc-gcp-runtime.yml --repo inn-media/truyn --ref main
