name: Ephemeral Semantic v2 Final Full 360

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-semantic-v2-final-full.yml']

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SA_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_PROXY_REGION: us-east4
      GCP_AR_REPO: truyn-poc
      GCP_PROXY_SERVICE: truyn-semanticv2-final-${{ github.run_id }}
      SEMANTIC_V2_SOURCE_SHA: 6f2ddf743e83ad1704a831a7058a93ad668c6a69
      SEMANTIC_V2_PROXY_SHA: c1ea39a3f5a0408035fea7f00604ff14310eda10
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Load immutable sources
        shell: bash
        run: |
          set -euo pipefail
          load_file(){ mkdir -p "$(dirname "$1")"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1?ref=$2" | jq -r '.content' | tr -d '\n' | base64 -d > "$1"; }
          load_file benchmarks/semantic-retrieval-v2.js "$SEMANTIC_V2_SOURCE_SHA"
          load_file benchmarks/semantic-v2-gcp-proxy.js "$SEMANTIC_V2_PROXY_SHA"
          load_file benchmarks/Dockerfile.semantic-v2-gcp-proxy "$SEMANTIC_V2_PROXY_SHA"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with: { project_id: '${{ env.GCP_PROJECT_ID_VALUE }}' }
      - name: Prepare isolated runtime-identity Vertex proxy
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"
          registry="${GCP_PROXY_REGION}-docker.pkg.dev"; image="${registry}/${GCP_PROJECT_ID_VALUE}/${GCP_AR_REPO}/semanticv2-final:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker build -f benchmarks/Dockerfile.semantic-v2-gcp-proxy -t "$image" . >/dev/null && docker push "$image" >/dev/null
          gcloud run deploy "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --image="$image" --service-account="$GCP_RUNTIME_SA_VALUE" --port=8080 --min=0 --max=1 --cpu=1 --memory=512Mi --set-env-vars="BENCHMARK_PROXY_TOKEN=${token}" --no-invoker-iam-check --quiet >/dev/null
          url="$(gcloud run services describe "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --format='value(status.url)')"
          for a in $(seq 1 30); do curl -fsS -H "Authorization: Bearer ${token}" "${url}/health" | jq -e '.ok==true' >/dev/null && break; [[ "$a" -lt 30 ]] || exit 1; sleep 2; done
          echo "VERTEX_API_ENDPOINT=$url" >> "$GITHUB_ENV"; echo "GCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"; echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_VALUE" >> "$GITHUB_ENV"
      - name: Run final 360-case confidence-gated retrieval proof
        shell: bash
        run: |
          cat > semantic-v2-final-full.mjs <<'NODE'
          import fs from 'node:fs';import vm from 'node:vm';
          import {createVertexGeminiProvider} from './adapters/providers/vertex-gemini.js';import {createVertexEmbeddingClient} from './adapters/providers/vertex-embedding.js';
          const src=fs.readFileSync('benchmarks/semantic-retrieval-v2.js','utf8'),a=src.indexOf('const domains = ['),b=src.indexOf('const fullContext =');if(a<0||b<0)throw new Error('immutable corpus markers');const box={};vm.createContext(box);vm.runInContext('const corpusSize=600,retrievalCaseCount=360;'+src.slice(a,b)+';globalThis.__d={blocks,retrievalCases};',box);const {blocks,retrievalCases}=box.__d;
          const projectId=process.env.GCP_PROJECT_ID,endpoint=process.env.VERTEX_API_ENDPOINT,token=async()=>process.env.GCP_ACCESS_TOKEN;
          const lite=createVertexGeminiProvider({projectId,location:'global',model:'gemini-3.1-flash-lite',endpoint,accessTokenProvider:token,capabilities:['reasoning.general'],requestTimeoutMs:180000});
          const flash=createVertexGeminiProvider({projectId,location:'global',model:'gemini-3-flash-preview',endpoint,accessTokenProvider:token,capabilities:['reasoning.general'],requestTimeoutMs:180000});
          const pro=createVertexGeminiProvider({projectId,location:'global',model:'gemini-3.1-pro-preview',endpoint,accessTokenProvider:token,capabilities:['reasoning.general'],requestTimeoutMs:180000});
          const emb=createVertexEmbeddingClient({projectId,location:'us-central1',model:'gemini-embedding-001',endpoint,accessTokenProvider:token,batchSize:1,outputDimensionality:768,maxRetries:10});
          const norm=v=>Math.sqrt(v.reduce((s,x)=>s+x*x,0)),cos=(x,y)=>{let d=0;for(let i=0;i<x.length;i++)d+=x[i]*y[i];const z=norm(x)*norm(y);return z?d/z:0};async function ml(items,n,fn){const out=new Array(items.length);let next=0;async function w(){for(;;){const i=next++;if(i>=items.length)return;out[i]=await fn(items[i],i)}}await Promise.all(Array.from({length:Math.min(n,items.length)},w));return out}
          const empty=()=>({requests:0,repairs:0,input:0,visibleOutput:0,thoughts:0,total:0,requestBytes:0,latencyMs:0}),usage={lite:empty(),flash:empty(),pro:empty()};function take(e){const u=e.metadata?.usage||{};return{input:u.promptTokenCount||0,visibleOutput:u.candidatesTokenCount||0,thoughts:u.thoughtsTokenCount||0,total:u.totalTokenCount||0,requestBytes:e.metadata?.providerRequestBodyBytes||0,latencyMs:e.metadata?.providerLatencyMs||0}}function add(k,u){usage[k].requests++;for(const f of ['input','visibleOutput','thoughts','total','requestBytes','latencyMs'])usage[k][f]+=u[f]||0}
          const instruction='Choose the passage matching the complete operational meaning of the query. Every material constraint matters: real-world domain, controlled action, and condition/state. A near-duplicate that conflicts on one material constraint is wrong. Ignore ANSWER_CODE as a retrieval signal.';function parse(t){try{return JSON.parse(String(t).trim())}catch{return null}}
          async function cheap(provider,key,question,payload,thinkingLevel){for(let attempt=1;attempt<=2;attempt++){const e=await provider.execute({capability:'reasoning.general',input:{task:instruction+` Return JSON only: {"id":"..."} using exactly one supplied local label.${attempt>1?' Previous output was invalid; obey the contract exactly.':''}`,context:JSON.stringify({query:question,candidates:payload})},policy:{providerOptions:{thinkingLevel,temperature:0,maxOutputTokens:attempt===1?512:1024,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{id:{type:'STRING'}},required:['id']}}}});add(key,take(e));const p=parse(e.output),allowed=new Set(payload.map(x=>x.id));if(allowed.has(p?.id))return p.id;usage[key].repairs++}return null}
          async function pro64(question,payload){for(let attempt=1;attempt<=2;attempt++){const e=await pro.execute({capability:'reasoning.general',input:{task:instruction+` Choose exactly one passage. Return JSON only: {"id":"..."} using one supplied local label.${attempt>1?' Previous output was invalid; obey the contract exactly.':''}`,context:JSON.stringify({query:question,candidates:payload})},policy:{providerOptions:{temperature:0,maxOutputTokens:attempt===1?1024:1536,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{id:{type:'STRING'}},required:['id']}}}});add('pro',take(e));const p=parse(e.output),allowed=new Set(payload.map(x=>x.id));if(allowed.has(p?.id))return p.id;usage.pro.repairs++}return null}
          process.stderr.write('embedding blocks/queries\n');const dv=await ml(blocks,8,async x=>(await emb.embedMany([x.text],{taskType:'RETRIEVAL_DOCUMENT'}))[0]),qv=await ml(retrievalCases,8,async x=>(await emb.embedMany([x.question],{taskType:'RETRIEVAL_QUERY'}))[0]);let done=0;
          const rows=await ml(retrievalCases,4,async(item,qi)=>{const dense64=blocks.map((x,i)=>({id:x.id,text:x.text,score:cos(qv[qi],dv[i])})).sort((x,y)=>y.score-x.score||x.id.localeCompare(y.id)).slice(0,64),dense24=dense64.slice(0,24),p24=dense24.map((c,i)=>({id:`c${i.toString(36)}`,text:c.text})),m24=new Map(p24.map((p,i)=>[p.id,dense24[i].id]));const serialized=JSON.stringify({query:item.question,candidates:p24}),noBlockId=!/semantic-record-\d+/i.test(serialized)&&!serialized.includes(item.id)&&!serialized.includes('"ids"');const [a,b]=await Promise.all([cheap(lite,'lite',item.question,p24,'MINIMAL'),cheap(flash,'flash',item.question,p24,'MINIMAL')]);const aId=a?m24.get(a):null,bId=b?m24.get(b):null,agreement=!!aId&&aId===bId,consensusRank=agreement?dense64.findIndex(x=>x.id===aId)+1:null;let mode='cheap_confident',selectedId=agreement?aId:null,proId=null;if(!agreement||consensusRank>=13||!selectedId){mode='pro64_fallback';const p64=dense64.map((c,i)=>({id:`r${i.toString(36)}`,text:c.text})),m64=new Map(p64.map((p,i)=>[p.id,dense64[i].id]));const pa=await pro64(item.question,p64);proId=pa?m64.get(pa):null;selectedId=proId}const candidateRecall64=dense64.some(x=>x.id===item.id),selectedBlock=blocks.find(x=>x.id===selectedId);done++;if(done%20===0)process.stderr.write(`processed ${done}/360\n`);return{caseIndex:item.caseIndex,id:item.id,code:item.code,blockLanguage:item.blockLanguage,queryLanguage:item.queryLanguage,category:item.category,question:item.question,dense64Recall:candidateRecall64,denseRank:candidateRecall64?dense64.findIndex(x=>x.id===item.id)+1:null,liteSelectedId:aId,flashSelectedId:bId,cheapAgreement:agreement,consensusDenseRank:consensusRank,mode,proSelectedId:proId,selectedId,correct:selectedId===item.id,provenancePass:!!selectedBlock&&selectedBlock.id===selectedId,noBlockId,minimalContext:true};});
          const metric=field=>Object.fromEntries([...new Set(rows.map(r=>r[field]))].sort().map(v=>{const rs=rows.filter(r=>r[field]===v),c=rs.filter(r=>r.correct).length;return[v,{correct:c,total:rs.length,accuracyPercent:Number((100*c/rs.length).toFixed(3))}]}));const correct=rows.filter(r=>r.correct).length,prov=rows.filter(r=>r.provenancePass).length,nob=rows.filter(r=>r.noBlockId).length,minc=rows.filter(r=>r.minimalContext).length,rec=rows.filter(r=>r.dense64Recall).length,fallback=rows.filter(r=>r.mode==='pro64_fallback').length,byLang=metric('queryLanguage'),byCat=metric('category');
          const rates={lite:{input:.25,output:1.5},flash:{input:.5,output:3},pro:{input:2,output:12}},costs={};let routing=0;for(const k of Object.keys(rates)){const u=usage[k],c=u.input/1e6*rates[k].input+(u.visibleOutput+u.thoughts)/1e6*rates[k].output;costs[k]=Number(c.toFixed(9));routing+=c}const gate={accuracyPercent:Number((100*correct/360).toFixed(3)),denseRecallPercent:Number((100*rec/360).toFixed(3)),perLanguage:byLang,perCategory:byCat,provenancePercent:Number((100*prov/360).toFixed(3)),noBlockIdPercent:Number((100*nob/360).toFixed(3)),minimalContextPercent:Number((100*minc/360).toFixed(3)),fallbackCount:fallback,fallbackPercent:Number((100*fallback/360).toFixed(3)),passed:correct/360>=.99&&Object.values(byLang).every(x=>x.accuracyPercent>=99)&&Object.values(byCat).every(x=>x.accuracyPercent>=99)&&prov===360&&nob===360&&minc===360&&rec===360};const report={benchmark:'TRUYN Semantic Retrieval Gate v2 final confidence-gated full 360 proof',generatedAt:new Date().toISOString(),sourceSha:process.env.SEMANTIC_V2_SOURCE_SHA,methodology:{denseCandidateK:64,cheapCandidateK:24,cheapJudges:['gemini-3.1-flash-lite MINIMAL','gemini-3-flash-preview MINIMAL'],confidenceRule:'accept only identical cheap top1 with dense rank <= 12; otherwise route to Gemini 3.1 Pro HIGH over dense64',privacy:'judges receive question plus request-local aliases and passage text; no TRUYN block IDs'},embedding:emb.stats(),usage,ratesUsdPerMillionTokens:rates,costsUsd:costs,semanticRoutingCostUsd:Number(routing.toFixed(9)),semanticRoutingCostUsdPerQuery:Number((routing/360).toFixed(9)),semanticGate:gate,rows};fs.writeFileSync('semantic-v2-final-full.json',JSON.stringify(report,null,2));console.log(JSON.stringify({semanticGate:gate,usage,costsUsd:costs,semanticRoutingCostUsd:report.semanticRoutingCostUsd,semanticRoutingCostUsdPerQuery:report.semanticRoutingCostUsdPerQuery},null,2));if(!gate.passed)process.exitCode=2;
          NODE
          node semantic-v2-final-full.mjs
      - name: Upload full raw evidence
        if: ${{ always() && hashFiles('semantic-v2-final-full.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: truyn-semantic-v2-final-full-${{ github.run_id }}
          path: semantic-v2-final-full.json
          retention-days: 30
      - name: Delete isolated Vertex proxy
        if: always()
        shell: bash
        run: gcloud run services delete "$GCP_PROXY_SERVICE" --project="$GCP_PROJECT_ID_VALUE" --region="$GCP_PROXY_REGION" --quiet >/dev/null 2>&1 || true
