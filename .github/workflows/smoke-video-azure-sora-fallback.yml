name: TRUYN Azure Sora Video Smoke Fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-video-azure-sora-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  azure-video-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_RG: truyn
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: mkdir -p smoke-artifacts/video-azure

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find deployable Sora generation
        shell: bash
        run: |
          set -uo pipefail
          suffix="$(printf '%s' "$AZURE_SUBSCRIPTION_ID_VALUE" | sha256sum | cut -c1-8)"
          attempts='[]'
          ready=false
          for region in eastus2 swedencentral; do
            tag="${region//[^a-z0-9]/}"
            account="truynvid${tag:0:4}${suffix}"
            if ! az cognitiveservices account show -g "$AZURE_RG" -n "$account" >/dev/null 2>&1; then
              continue
            fi
            endpoint="$(az cognitiveservices account show -g "$AZURE_RG" -n "$account" --query properties.endpoint -o tsv)"
            key="$(az cognitiveservices account keys list -g "$AZURE_RG" -n "$account" --query key1 -o tsv)"
            az cognitiveservices account list-models -g "$AZURE_RG" -n "$account" -o json > "/tmp/sora-${region}.json"
            for requested in sora-2 sora; do
              entry="$(jq -c --arg m "$requested" '[.[] | select(((.name // .model.name // "") | ascii_downcase) == ($m|ascii_downcase))][0] // empty' "/tmp/sora-${region}.json")"
              [[ -n "$entry" ]] || continue
              model="$(jq -r '.name // .model.name' <<<"$entry")"
              version="$(jq -r '.version // .model.version // empty' <<<"$entry")"
              format="$(jq -r '.format // .model.format // "OpenAI"' <<<"$entry")"
              sku="$(jq -r '[.skus[]?.name | select(.=="GlobalStandard" or .=="Standard")][0] // "GlobalStandard"' <<<"$entry")"
              alias="truyn-${requested//[^a-zA-Z0-9]/-}"
              state=blocked_access
              if az cognitiveservices account deployment show -g "$AZURE_RG" -n "$account" --deployment-name "$alias" >/dev/null 2>&1; then
                state=ready
              else
                args=(cognitiveservices account deployment create -g "$AZURE_RG" -n "$account" --deployment-name "$alias" --model-name "$model" --model-format "$format" --sku-name "$sku" --sku-capacity 1)
                [[ -n "$version" ]] && args+=(--model-version "$version")
                if az "${args[@]}" >/tmp/sora-deploy.out 2>/tmp/sora-deploy.err; then state=ready; fi
              fi
              tmp="$(mktemp)"
              jq --arg region "$region" --arg model "$model" --arg state "$state" '. + [{region:$region,model:$model,status:$state}]' <<<"$attempts" > "$tmp"
              attempts="$(cat "$tmp")"; rm -f "$tmp"
              if [[ "$state" == ready ]]; then
                echo "::add-mask::$key"
                echo "AZURE_VIDEO_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
                echo "AZURE_VIDEO_API_KEY=$key" >> "$GITHUB_ENV"
                echo "AZURE_VIDEO_DEPLOYMENT=$alias" >> "$GITHUB_ENV"
                echo "AZURE_VIDEO_MODEL=$model" >> "$GITHUB_ENV"
                echo 'AZURE_VIDEO_READY=true' >> "$GITHUB_ENV"
                ready=true
                break 2
              fi
            done
          done
          if [[ "$ready" != true ]]; then
            jq -n --argjson attempts "$attempts" '{ok:false,modality:"video",provider:"azure-openai-video",status:"blocked_access",stage:"deployment_or_entitlement",attempts:$attempts}' > smoke-artifacts/video-azure/azure-video.json
          fi

      - name: Smoke Azure video at minimum parameters
        if: env.AZURE_VIDEO_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_PROVIDER=azure-openai-video SMOKE_OUTPUT_DIR=smoke-artifacts/video-azure AZURE_VIDEO_ENDPOINT="$AZURE_VIDEO_ENDPOINT" AZURE_VIDEO_DEPLOYMENT="$AZURE_VIDEO_DEPLOYMENT" AZURE_VIDEO_API_KEY="$AZURE_VIDEO_API_KEY" node scripts/smoke/video-provider.js | tee smoke-artifacts/video-azure/azure-video.json

      - name: Upload Azure video-only evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truyn-azure-video-smoke-${{ github.run_id }}
          path: smoke-artifacts/video-azure
          if-no-files-found: error
          retention-days: 30
