name: Temporary Class C Heterogeneous WAN Closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-network-class-c-closure.yml'

permissions:
  contents: write
  id-token: write

jobs:
  class-c:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      AZURE_LOCATION: eastus2
      AZURE_VM_SIZE: Standard_B1ms
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL_VALUE: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL || secrets.GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      GCP_REGION_VALUE: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      PEER_TTL_MS: '30000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL_VALUE }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute real Class C packet-path gate
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/inn-media/truyn/network/class-c-verify-close/scripts/class-c-cross-cloud-proof.sh -o /tmp/class-c-proof.sh
          chmod 700 /tmp/class-c-proof.sh
          bash /tmp/class-c-proof.sh 2>&1 | tee /tmp/class-c.log

      - name: Preserve sanitized evidence and self-clean
        if: always()
        shell: bash
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -Eeuo pipefail
          report='docs/benchmarks/NETWORK_CLASS_C_HETEROGENEOUS_WAN_2026-08-18.md'
          final_json=''
          if [[ -f /tmp/class-c.log ]]; then
            final_json="$(sed -n 's/^TRUYN_CLASS_C=//p' /tmp/class-c.log | tail -1 || true)"
          fi
          gate='FAIL'
          if [[ "$PROOF_OUTCOME" == success ]] && printf '%s' "$final_json" | jq -e '.gate == "PASS"' >/dev/null 2>&1; then gate='PASS'; fi
          tested="$(printf '%s' "$final_json" | jq -r '.testedCommit // "not-recorded"' 2>/dev/null || printf 'not-recorded')"
          hosts="$(printf '%s' "$final_json" | jq -r '.realNodeRuntimes // 0' 2>/dev/null || printf 0)"
          providers="$(printf '%s' "$final_json" | jq -r '.cloudProviders // 0' 2>/dev/null || printf 0)"
          regions="$(printf '%s' "$final_json" | jq -r '.cloudRegions // 0' 2>/dev/null || printf 0)"
          cross="$(printf '%s' "$final_json" | jq -r '.crossCloudDirectQuic // false' 2>/dev/null || printf false)"
          direction="$(printf '%s' "$final_json" | jq -r '.crossCloudDirection // "not-recorded"' 2>/dev/null || printf not-recorded)"
          partition="$(printf '%s' "$final_json" | jq -r '.packetPathPartition // false' 2>/dev/null || printf false)"
          drop="$(printf '%s' "$final_json" | jq -r '.packetDropCount // 0' 2>/dev/null || printf 0)"
          heal="$(printf '%s' "$final_json" | jq -r '.packetHealMs // 0' 2>/dev/null || printf 0)"
          nat="$(printf '%s' "$final_json" | jq -r '.realAzureNatGateway // false' 2>/dev/null || printf false)"
          natpkts="$(printf '%s' "$final_json" | jq -r '.natPacketCount // 0' 2>/dev/null || printf 0)"
          dbl="$(printf '%s' "$final_json" | jq -r '.doubleNatCgnatLikeOutbound // false' 2>/dev/null || printf false)"
          carrier="$(printf '%s' "$final_json" | jq -r '.carrierCgnatFieldValidated // false' 2>/dev/null || printf false)"
          relay="$(printf '%s' "$final_json" | jq -r '.relayCalls // 0' 2>/dev/null || printf 0)"
          cleanup='unknown'
          if [[ -f /tmp/class-c.log ]] && grep -q 'TRUYN_CLASS_C_CLEANUP=PASS' /tmp/class-c.log; then cleanup='PASS'; fi
          cat >"$report" <<EOF
          # TRUYN Class C Heterogeneous WAN / Reachability Gate — 2026-08-18

          **Result:** **${gate}**

          This report preserves the final bounded Class C packet-path run. It distinguishes real WAN/NAT packet behavior from logical fault injection and does not claim carrier-field CGNAT validation.

          ## Evidence identity

          - GitHub Actions run: ${GITHUB_RUN_ID}
          - workflow commit: ${GITHUB_SHA}
          - tested TRUYN commit reported by harness: ${tested}
          - proof outcome: ${PROOF_OUTCOME}
          - ephemeral cleanup: ${cleanup}

          ## Measured topology / gates

          | Gate | Result |
          |---|---:|
          | independent real node runtimes | ${hosts} |
          | cloud providers | ${providers} |
          | cloud regions / failure domains represented | ${regions} |
          | cross-cloud direct QUIC | ${cross} |
          | cross-cloud direction | ${direction} |
          | relay calls on direct proof | ${relay} |
          | real packet-path UDP partition | ${partition} |
          | kernel-observed dropped packets | ${drop} |
          | heal latency, ms | ${heal} |
          | real Azure NAT Gateway | ${nat} |
          | NAT-observed packets | ${natpkts} |
          | two-layer real kernel NAT / CGNAT-like outbound path | ${dbl} |
          | carrier-field CGNAT validated | ${carrier} |

          ## Acceptance interpretation

          A PASS closes the bounded **Class C heterogeneous WAN/reachability engineering gate** when cross-cloud direct QUIC, real packet-path drop/heal, real cloud NAT and a two-layer real kernel NAT path all pass and ephemeral resources are cleaned up. The two-layer path is deliberately described as **CGNAT-like**: this benchmark does **not** claim validation on a live mobile/ISP carrier CGNAT network.

          A FAIL is preserved as evidence and does not promote roadmap maturity.

          ## Security / evidence handling

          Operational cloud identifiers, public/private addresses, credentials and live resource names are intentionally excluded. Security cleanup follows the repository redact-not-delete evidence policy.
          EOF

          git rm -f .github/workflows/tmp-network-class-c-closure.yml
          git add "$report"
          git config user.name 'truyn-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "evidence: preserve Class C heterogeneous WAN ${gate}" 
          git pull --rebase origin main
          git push origin HEAD:main

          [[ "$gate" == PASS ]]
