name: Temporary Canonical Relay Verification

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-cloudflare-network-origin-proof.yml']

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKENS }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      PUBLIC_RELAY_URL: https://relay.truyn.org
    steps:
      - name: Authenticate Azure with main-only OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - name: Restore canonical proxied CNAME and clear experimental ingress rules
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS=$'\t' read -r name rg fqdn; do
            [[ -n "$fqdn" ]] || continue
            role="$(az containerapp show -g "$rg" -n "$name" --query 'properties.template.containers[0].env[?name==`TRUYN_ROLE`].value | [0]' -o tsv)"
            if [[ "$role" != 'relay' && "$name" != *relay* ]]; then continue; fi
            found=1
            for v in "$name" "$rg" "$fqdn"; do echo "::add-mask::$v"; done

            rules="$(az containerapp ingress access-restriction list -g "$rg" -n "$name" -o json)"
            mapfile -t experimental < <(jq -r '.[] | .name // empty | select(startswith("cloudflare-") or . == "truyn-bootstrap-all")' <<<"$rules")
            for rule in "${experimental[@]}"; do
              az containerapp ingress access-restriction remove -g "$rg" -n "$name" --rule-name "$rule" -o none || true
            done

            base="https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records"
            dns="$(curl -sS -G -H "Authorization: Bearer ${CF_TOKEN}" --data-urlencode 'name=relay.truyn.org' "$base")"
            jq -e '.success == true and (.result | length) == 1' <<<"$dns" >/dev/null || { echo 'CANONICAL_RELAY=FAIL dns_lookup'; exit 22; }
            id="$(jq -r '.result[0].id' <<<"$dns")"
            echo "::add-mask::$id"
            body="$(jq -nc --arg target "$fqdn" '{type:"CNAME",name:"relay.truyn.org",content:$target,ttl:1,proxied:true}')"
            changed="$(curl -sS -X PUT -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "$body" "${base}/${id}")"
            jq -e '.success == true and .result.type == "CNAME" and .result.proxied == true' <<<"$changed" >/dev/null || { echo 'CANONICAL_RELAY=FAIL dns_restore'; exit 23; }
            break
          done < <(az containerapp list --query "[?properties.configuration.ingress.external==\`true\`].[name,resourceGroup,properties.configuration.ingress.fqdn]" -o tsv)
          [[ "$found" == 1 ]] || { echo 'CANONICAL_RELAY=FAIL relay_not_found'; exit 20; }
          echo 'CANONICAL_RELAY_CONFIG=PASS proxied_cname=true experimental_ingress=false'

      - name: Verify healthy Cloudflare data path
        shell: bash
        run: |
          set -euo pipefail
          ok=0; last='000'
          for attempt in $(seq 1 45); do
            last="$(curl -sS --max-time 10 -D /tmp/edge.headers -o /tmp/edge.body -w '%{http_code}' "${PUBLIC_RELAY_URL}/health" || true)"
            if [[ "$last" == '200' ]] && grep -qi '^cf-ray:' /tmp/edge.headers; then ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == 1 ]] || { echo "CANONICAL_RELAY=FAIL public_health=${last}"; exit 30; }
          echo 'CANONICAL_RELAY=PASS public_health=200 cloudflare_path=true cf_ray=true'
