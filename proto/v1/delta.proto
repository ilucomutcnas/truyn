syntax = "proto3";
package truyn.v1;

import "proto/v1/common.proto";

message Delta {
  bytes delta_id = 1;
  bytes base_state_id = 2;
  bytes result_state_id = 3;
  string encoding = 4;
  bytes patch = 5;
  bytes patch_digest = 6;
  bytes source_node_id = 7;
  uint64 created_at_unix_ms = 8;
  Signature signature = 9;
}
