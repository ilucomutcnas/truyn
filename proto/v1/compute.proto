syntax = "proto3";
package truyn.v1;

import "proto/v1/common.proto";

message ComputeRequest {
  bytes compute_id = 1;
  bytes requester_node_id = 2;
  string capability = 3;
  bytes input_inline = 4;
  repeated Reference input_refs = 5;
  RequestPolicy policy = 6;
  string sandbox_profile = 7;
  uint64 max_runtime_ms = 8;
  Signature signature = 9;
}
